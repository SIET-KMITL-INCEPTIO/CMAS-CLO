name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch instead of burning minutes on
# commits nobody is waiting for.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# No token scopes by default; each job asks for exactly what it needs.
permissions: {}

jobs:
  verify:
    name: Format, lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    env:
      # `prisma generate` and the server typecheck resolve env() in
      # schema.prisma, so these must be present. They are never connected to —
      # no job in this workflow touches a real database.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/postgres

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Validate Prisma schema
        run: npm run db:validate

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      # The API design (docs/excel/api/api-endpoints.json) against the schema, the
      # capability table, the test plan and the routes in app/server. Its runtime
      # twin, app/server/src/api-contract.test.ts, ran in the step above.
      - name: API design matches the system
        run: python3 scripts/check-api-design.py

      - name: Build
        run: npm run build

  isolation:
    name: Migration replay + course-scope isolation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    # The `verify` job runs the isolation suite too, but with no reachable
    # database it SKIPS every case — and a skipped isolation test proves
    # nothing. This job is the one that actually enforces SRS NFR-07.
    #
    # Single-tenant since 2026-08-04: the boundary is the COURSE, not the
    # institution. The seed creates two courses with different instructors so
    # "instructor of course A must get 404 on course B" has real data to run
    # against.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cmas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cmas_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/cmas_test
      # Turns on course-scope.isolation.test.ts (S-8). Off everywhere else so
      # nobody's tests write to or depend on a shared database.
      CMAS_DB_TESTS: "1"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      # Replays 0001_init and the HAND-WRITTEN 0002_constraints_and_triggers
      # from empty. This is what proves the hand-written migration survives the
      # command developers run most often — and it is the only thing that
      # catches someone running `prisma db push` and silently dropping the
      # CHECK/trigger layer.
      - name: Apply migrations
        run: npm run db:migrate:deploy

      - name: Seed
        run: npm run db:seed

      # Idempotency: the seed's own docstring promises re-running is safe.
      - name: Seed again — must be idempotent
        run: npm run db:seed

      - name: Course-scope isolation tests
        run: npm run test -w app/server

  workflow-lint:
    name: Workflow security lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    # zizmor audits the workflows themselves: unpinned actions, excessive
    # token scopes, template injection, dangerous triggers. Findings fail the
    # job here instead of going to the Security tab (that comes with P3).
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          advanced-security: false
