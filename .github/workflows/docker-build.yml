name: Docker build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # Reads as "Docker build (server)" etc. on the PR.
    name: Docker build (${{ matrix.image }})
    runs-on: ubuntu-latest

    # Every Dockerfile in the repo: the prod pair that docker-compose.prod.yml
    # and the deploy targets use, and the dev pair behind docker-compose.yml.
    # A broken one fails its own check instead of hiding behind another's.
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: server
            file: app/server/Dockerfile.prod
          - image: client
            file: app/client/Dockerfile.prod
          - image: server-dev
            file: app/server/Dockerfile.dev
          - image: client-dev
            file: app/client/Dockerfile.dev

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build only; nothing is pushed. Each image keeps its own cache scope so
      # the four builds don't evict each other's layers.
      - name: Build ${{ matrix.file }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: false
          tags: cmas-${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
