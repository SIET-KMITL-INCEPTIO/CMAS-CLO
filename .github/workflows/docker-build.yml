name: Docker build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build:
    # Reads as "Docker build (server)" etc. on the PR.
    name: Docker build (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    # Every Dockerfile in the repo: the prod pair that docker-compose.prod.yml
    # and the deploy targets use, and the dev pair behind docker-compose.yml.
    # A broken one fails its own check instead of hiding behind another's.
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: server
            file: app/server/Dockerfile.prod
          - image: client
            file: app/client/Dockerfile.prod
          - image: server-dev
            file: app/server/Dockerfile.dev
          - image: client-dev
            file: app/client/Dockerfile.dev

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # Build only; nothing is pushed. Each image keeps its own cache scope so
      # the four builds don't evict each other's layers.
      - name: Build ${{ matrix.file }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ${{ matrix.file }}
          push: false
          tags: cmas-${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
