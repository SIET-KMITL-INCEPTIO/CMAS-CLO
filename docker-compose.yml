services:
  server:
    build:
      context: .
      dockerfile: app/server/Dockerfile.dev
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: development
      VITE_API_URL: "http://localhost:3001"
    env_file:
      - ./app/server/.env
    volumes:
      - ./app/server:/app/app/server
      - ./database:/app/database
      - /app/app/server/node_modules
      - /app/node_modules

  client:
    build:
      context: .
      dockerfile: app/client/Dockerfile.dev
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: "http://localhost:3001"
    env_file:
      - ./app/client/.env
    volumes:
      - ./app/client:/app/app/client
      - /app/app/client/node_modules
      - /app/node_modules
    depends_on:
      - server
