    <script>
      /* ============================== DATA ============================== */
      const COURSE = {
        code: "CS101",
        name: "Computer Science I",
        term: "1/2568",
        teacher: "ผศ.ดร. ธนกร วิทยารักษ์",
        passGrade: 50,
      };

      const BLOOMS = [
        "จำ",
        "เข้าใจ",
        "ประยุกต์ใช้",
        "วิเคราะห์",
        "ประเมินค่า",
        "สร้างสรรค์",
      ];
      const TASK_TYPES = [
        "แบบทดสอบ",
        "การบ้าน",
        "ปฏิบัติการ",
        "สอบ",
        "โครงงาน",
        "นำเสนอ",
      ];
      const PROGRAMS = [
        "วิศวกรรมคอมพิวเตอร์",
        "วิทยาการคอมพิวเตอร์",
        "เทคโนโลยีสารสนเทศ",
      ];
      const STATUSES = ["ปกติ", "ลงทะเบียนสาย", "ถอนรายวิชา"];

      let CLOS = [
        {
          id: "CLO1",
          bloom: "เข้าใจ",
          threshold: 60,
          target: 70,
          plo: "PLO1",
          title: "อธิบายองค์ประกอบพื้นฐานของการเขียนโปรแกรมและชนิดข้อมูล",
        },
        {
          id: "CLO2",
          bloom: "ประยุกต์ใช้",
          threshold: 60,
          target: 70,
          plo: "PLO2",
          title: "เขียนโปรแกรมแก้ปัญหาด้วยโครงสร้างควบคุมและฟังก์ชัน",
        },
        {
          id: "CLO3",
          bloom: "วิเคราะห์",
          threshold: 65,
          target: 70,
          plo: "PLO2",
          title: "วิเคราะห์และแก้จุดบกพร่องของโปรแกรมอย่างเป็นระบบ",
        },
        {
          id: "CLO4",
          bloom: "ประเมินค่า",
          threshold: 60,
          target: 65,
          plo: "PLO4",
          title: "ทำงานเป็นทีมและนำเสนอโครงงานซอฟต์แวร์ได้",
        },
      ];
      let TASKS = [
        {
          id: "t1",
          clo: "CLO1",
          type: "แบบทดสอบ",
          name: "Quiz 1 · ตัวแปรและชนิดข้อมูล",
          max: 10,
          weight: 5,
          due: "2025-07-05",
          graded: true,
        },
        {
          id: "t2",
          clo: "CLO1",
          type: "การบ้าน",
          name: "HW1 · Input/Output",
          max: 20,
          weight: 5,
          due: "2025-07-12",
          graded: true,
        },
        {
          id: "t3",
          clo: "CLO2",
          type: "ปฏิบัติการ",
          name: "Lab 3 · Loop & Condition",
          max: 30,
          weight: 10,
          due: "2025-07-26",
          graded: true,
        },
        {
          id: "t4",
          clo: "CLO2",
          type: "สอบ",
          name: "สอบกลางภาค",
          max: 100,
          weight: 20,
          due: "2025-08-16",
          graded: true,
        },
        {
          id: "t5",
          clo: "CLO3",
          type: "ปฏิบัติการ",
          name: "Lab 5 · Debugging Workshop",
          max: 30,
          weight: 10,
          due: "2025-09-06",
          graded: true,
        },
        {
          id: "t6",
          clo: "CLO3",
          type: "การบ้าน",
          name: "HW4 · Code Review Report",
          max: 20,
          weight: 10,
          due: "2025-09-20",
          graded: true,
        },
        {
          id: "t7",
          clo: "CLO4",
          type: "โครงงาน",
          name: "Mini Project · ส่งงาน",
          max: 100,
          weight: 25,
          due: "2025-10-11",
          graded: true,
        },
        {
          id: "t8",
          clo: "CLO4",
          type: "นำเสนอ",
          name: "นำเสนอโครงงาน",
          max: 50,
          weight: 15,
          due: "2025-10-25",
          graded: false,
        },
      ];

      const FIRST = [
        "ณัฐพงษ์",
        "ศิริพร",
        "กิตติศักดิ์",
        "พิมพ์ชนก",
        "ธนวัฒน์",
        "อรวรรณ",
        "ปุณยวีร์",
        "สมชาย",
        "จิราภรณ์",
        "ภาณุพงศ์",
        "วรินทร",
        "ชนกานต์",
        "ธีรภัทร",
        "สุพัตรา",
        "อนุชา",
        "เมธาวี",
        "กฤษณะ",
        "นภัสสร",
      ];
      const LAST = [
        "ทองใบ",
        "วงศ์สุวรรณ",
        "ศรีสมบัติ",
        "พูลสวัสดิ์",
        "แก้วมณี",
        "บุญมาก",
        "อินทรีย์",
        "ชัยวัฒน์",
        "เจริญสุข",
        "ธนบดี",
        "ปิยะวงศ์",
        "สินธุ์ทอง",
      ];
      let _s = 20250711;
      const rnd = () => (_s = (_s * 16807) % 2147483647) / 2147483647;

      let STUDENTS = Array.from({ length: 18 }, (_, i) => ({
        id: "65" + String(41001 + i),
        name: FIRST[i % FIRST.length] + " " + LAST[i % LAST.length],
        program: PROGRAMS[i % 3],
        status: i === 16 ? "ถอนรายวิชา" : i === 17 ? "ลงทะเบียนสาย" : "ปกติ",
        note: "",
        ability: 0,
      }));
      STUDENTS.forEach((s, i) => {
        s.ability =
          i < 3
            ? 0.38 + rnd() * 0.12
            : i < 6
              ? 0.58 + rnd() * 0.08
              : 0.68 + rnd() * 0.3;
      });

      const scores = {};
      STUDENTS.forEach((s) => {
        scores[s.id] = {};
        TASKS.forEach((t) => {
          if (!t.graded || s.status === "ถอนรายวิชา") {
            scores[s.id][t.id] = null;
            return;
          }
          const pen = t.clo === "CLO3" ? 0.17 : 0;
          let r = s.ability - pen + (rnd() - 0.5) * 0.16;
          if (rnd() < 0.05) r = 0;
          scores[s.id][t.id] = Math.max(
            0,
            Math.min(t.max, Math.round(r * t.max)),
          );
        });
      });

      let BOUNDS = [
        ["A", 80],
        ["B+", 75],
        ["B", 70],
        ["C+", 65],
        ["C", 60],
        ["D+", 55],
        ["D", 50],
        ["F", 0],
      ];
      const interventions = []; // {sid, kind, at}

      /* ============================== LOGIC ============================== */
      const active = () => STUDENTS.filter((s) => s.status !== "ถอนรายวิชา");
      const tasksOf = (clo) => TASKS.filter((t) => t.clo === clo);
      const pct = (n, d) => (d ? (n / d) * 100 : 0);
      const totalWeight = () => TASKS.reduce((a, t) => a + Number(t.weight), 0);

      function cloScore(sid, clo) {
        let num = 0,
          den = 0,
          done = 0,
          total = 0;
        tasksOf(clo).forEach((t) => {
          total += t.weight;
          const v = scores[sid]?.[t.id];
          if (v === null || v === undefined) return;
          num += (v / t.max) * t.weight;
          den += t.weight;
          done += t.weight;
        });
        return {
          value: den ? (num / den) * 100 : null,
          coverage: pct(done, total),
        };
      }
      function overall(sid) {
        let num = 0,
          den = 0;
        TASKS.forEach((t) => {
          const v = scores[sid]?.[t.id];
          if (v === null || v === undefined) return;
          num += (v / t.max) * t.weight;
          den += t.weight;
        });
        return den ? (num / den) * 100 : null;
      }
      const letter = (v) =>
        v === null
          ? "—"
          : ([...BOUNDS].sort((a, b) => b[1] - a[1]).find((b) => v >= b[1]) || [
              "F",
            ])[0];

      function profile(sid) {
        const per = CLOS.map((c) => {
          const { value, coverage } = cloScore(sid, c.id);
          return {
            clo: c,
            value,
            coverage,
            pass: value !== null && value >= c.threshold,
          };
        });
        const graded = per.filter((p) => p.value !== null),
          failed = graded.filter((p) => !p.pass),
          ov = overall(sid);
        let risk = "ปลอดภัย";
        if (failed.length >= 2 || (ov !== null && ov < 50)) risk = "เสี่ยงสูง";
        else if (failed.length === 1 || (ov !== null && ov < 60))
          risk = "เฝ้าระวัง";
        return {
          per,
          failed,
          risk,
          overall: ov,
          passCount: graded.length - failed.length,
          gradedCount: graded.length,
        };
      }
      function cloSummary(c) {
        const list = active()
          .map((s) => cloScore(s.id, c.id).value)
          .filter((v) => v !== null);
        const passed = list.filter((v) => v >= c.threshold).length,
          rate = pct(passed, list.length);
        const tw = tasksOf(c.id).reduce((a, t) => a + t.weight, 0);
        return {
          n: list.length,
          passed,
          rate,
          achieved: list.length > 0 && rate >= c.target,
          mean: list.length ? list.reduce((a, b) => a + b, 0) / list.length : 0,
          coverage: pct(
            tasksOf(c.id)
              .filter((t) => t.graded)
              .reduce((a, t) => a + t.weight, 0),
            tw,
          ),
        };
      }
      function stats() {
        const vals = active()
            .map((s) => overall(s.id))
            .filter((v) => v !== null),
          sorted = [...vals].sort((a, b) => a - b);
        const mean = vals.reduce((a, b) => a + b, 0) / (vals.length || 1);
        return {
          mean,
          n: vals.length,
          sd: Math.sqrt(
            vals.reduce((a, b) => a + (b - mean) ** 2, 0) / (vals.length || 1),
          ),
          median: sorted.length
            ? sorted.length % 2
              ? sorted[(sorted.length - 1) / 2]
              : (sorted[sorted.length / 2 - 1] + sorted[sorted.length / 2]) / 2
            : 0,
          passRate: pct(
            vals.filter((v) => v >= COURSE.passGrade).length,
            vals.length,
          ),
        };
      }

      /* ============================== UI HELPERS ============================== */
      const $ = (s) => document.querySelector(s);
      const esc = (s) =>
        String(s ?? "").replace(
          /[&<>"]/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c],
        );
      const fmt = (v) =>
        v === null || v === undefined ? "—" : Number(v).toFixed(1);
      const riskTone = (r) =>
        r === "เสี่ยงสูง"
          ? "bg-rose-100 text-rose-600"
          : r === "เฝ้าระวัง"
            ? "bg-amber-100 text-amber-700"
            : "bg-emerald-50 text-emerald-700";
      const barTone = (v, th) =>
        v === null
          ? "bg-gray-200"
          : v >= th
            ? "bg-olive-500"
            : v >= th - 10
              ? "bg-amber-400"
              : "bg-rose-500";
      const bar = (v, th, h = "h-2") =>
        `<div class="w-full ${h} rounded-full bg-gray-100 overflow-hidden"><div class="grow-bar ${h} rounded-full ${barTone(v, th)}" style="width:${v === null ? 0 : Math.min(100, v)}%"></div></div>`;
      const kpi = (l, v, s, t) =>
        `<div class="rounded-2xl p-4 ${t}"><p class="text-xs opacity-70">${l}</p><p class="text-3xl font-semibold num mt-0.5">${v}</p><p class="text-[11px] opacity-60 mt-0.5">${s || ""}</p></div>`;
      let dirty = false;
      function toast(m) {
        const t = $("#toast");
        t.textContent = m;
        t.classList.remove("hidden");
        clearTimeout(t._x);
        t._x = setTimeout(() => t.classList.add("hidden"), 2000);
      }
      function setDirty(v) {
        dirty = v;
        $("#dirtyPill").classList.toggle("hidden", !v);
      }

      /* ============================== FORM ENGINE ============================== */
      /* openForm({title, subtitle, fields[], submitLabel, validate(v)->errors, onSubmit(v), danger}) */
      let F = null;
      function openForm(cfg) {
        F = cfg;
        F.values = {};
        F.errors = {};
        cfg.fields.forEach(
          (f) =>
            (F.values[f.name] = f.value ?? (f.type === "toggle" ? false : "")),
        );
        renderForm();
        $("#modal").classList.remove("hidden");
        setTimeout(() => $("#modalBody").querySelector(".fld")?.focus(), 40);
      }
      function closeForm() {
        $("#modal").classList.add("hidden");
        F = null;
      }
      function setVal(n, v) {
        F.values[n] = v;
        if (F.errors[n]) {
          delete F.errors[n];
          renderForm();
        }
        if (F.live) renderForm();
      }

      function field(f) {
        const err = F.errors[f.name],
          v = F.values[f.name];
        const label = `<label class="block text-[13px] font-medium mb-1.5">${f.label}${f.required ? '<span class="text-rose-500"> *</span>' : ""}</label>`;
        let input;
        if (f.type === "select")
          input = `<select class="fld ${err ? "err" : ""}" onchange="setVal('${f.name}',this.value)">
      ${f.options.map((o) => `<option value="${esc(o)}" ${String(v) === String(o) ? "selected" : ""}>${esc(o)}</option>`).join("")}</select>`;
        else if (f.type === "textarea")
          input = `<textarea rows="2" class="fld ${err ? "err" : ""}" oninput="F.values['${f.name}']=this.value">${esc(v)}</textarea>`;
        else if (f.type === "toggle")
          input = `<button type="button" onclick="setVal('${f.name}',${!v})"
        class="flex items-center gap-2.5 px-3 py-2 rounded-xl border ${v ? "border-olive-500 bg-olive-50" : "border-[#e6e0ee] bg-white"} w-full text-left text-sm">
        <span class="w-9 h-5 rounded-full ${v ? "bg-olive-600" : "bg-gray-300"} relative shrink-0">
          <span class="absolute top-0.5 ${v ? "left-4.5" : "left-0.5"} w-4 h-4 rounded-full bg-white transition-all" style="left:${v ? "18px" : "2px"}"></span></span>
        <span>${v ? f.onText || "เปิด" : f.offText || "ปิด"}</span></button>`;
        else
          input = `<input type="${f.type || "text"}" value="${esc(v)}" ${f.min !== undefined ? `min="${f.min}"` : ""} ${f.max !== undefined ? `max="${f.max}"` : ""}
      placeholder="${esc(f.placeholder || "")}" class="fld ${f.type === "number" ? "num" : ""} ${err ? "err" : ""}"
      oninput="setVal('${f.name}',this.value)">`;
        return `<div class="${f.col === "half" ? "col-span-1" : "col-span-2"}">
    ${label}${input}

      function renderForm() {
        $("#modalBody").innerHTML = `
    <div class="px-6 pt-5 pb-4 border-b border-[#f2eef7] flex items-start justify-between gap-4">
      <div><h3 class="font-semibold text-lg">${F.title}</h3>

      <button onclick="closeForm()" class="text-gray-400 text-2xl leading-none px-1">×</button>
    </div>
    ${F.banner ? `<div class="mx-6 mt-4 rounded-xl bg-amber-50 border border-amber-100 p-3 text-[13px] text-amber-800">${F.banner}</div>` : ""}

    </div>`;
      }
      function submitForm() {
        const errs = F.validate ? F.validate(F.values) || {} : {};
        if (Object.keys(errs).length) {
          F.errors = errs;
          renderForm();
          return;
        }
        const fn = F.onSubmit,
          v = F.values;
        closeForm();
        fn(v);
        render();
      }
      function confirmBox({ title, body, confirmLabel = "ยืนยัน", onConfirm }) {
        F = { title, fields: [], errors: {}, values: {} };
        $("#modal").classList.remove("hidden");
        $("#modalBody").innerHTML = `
    <div class="px-6 pt-5"><h3 class="font-semibold text-lg">${title}</h3>
    <p class="text-sm text-gray-600 mt-2 leading-relaxed">${body}</p></div>
    <div class="px-6 py-4 mt-3 border-t border-[#f2eef7] flex justify-end gap-2">
      <button onclick="closeForm()" class="btn border border-[#ece7f2]">ยกเลิก</button>
      <button id="cfmBtn" class="btn bg-rose-600 text-white">${confirmLabel}</button></div>`;
        $("#cfmBtn").onclick = () => {
          closeForm();
          onConfirm();
          render();
        };
      }
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          closeForm();
          closeDrawer();
        }
        if (
          e.key === "Enter" &&
          F &&
          F.fields?.length &&
          !e.target.matches("textarea")
        )
          submitForm();

            <span class="num text-[10px] px-1.5 py-0.5 rounded bg-gray-100 text-gray-500">${t.clo}</span>
            <span class="flex-1 truncate text-[13px]">${esc(t.name)}</span>
            <span class="num text-xs ${r === null ? "text-gray-300" : r < 50 ? "text-rose-600" : "text-gray-600"}">${v === null || v === undefined ? "ยังไม่ตรวจ" : `${v}/${t.max}`}</span>
          </div>`;
        }).join("")}</div>
      </div>
      ${
        acts.length
          ? `<div><h4 class="text-sm font-semibold mb-2">ประวัติการช่วยเหลือ</h4>
        ${acts
          .map(
            (
              a,
            ) => `<div class="rounded-xl border border-[#f2eef7] p-3 mb-2 text-[13px]">
          <p class="font-medium">${a.kind} <span class="text-gray-400 num text-xs">· ${a.date} · ${a.clo}</span></p>
          ${a.note ? `<p class="text-gray-500 text-xs mt-1">${esc(a.note)}</p>` : ""}</div>`,
          )
          .join("")}</div>`
          : ""
      }
      ${
        s.note
          ? `<div class="rounded-xl bg-[#faf8fd] p-4"><h4 class="text-sm font-semibold mb-1">บันทึกภายใน</h4>
        <p class="text-xs text-gray-600">${esc(s.note)}</p></div>`
          : ""
      }
      <button onclick="deleteStudent('${sid}')" class="w-full btn text-rose-600 border border-rose-100 text-sm">ลบออกจากรายวิชา</button>
    </div>`;
        $("#drawer").classList.remove("hidden");
      }
      const closeDrawer = () => $("#drawer").classList.add("hidden");

      /* ============================== SCORE GRID ============================== */
      function editScore(el) {
        const t = TASKS.find((x) => x.id === el.dataset.tid);
        let v =
          el.value === ""
            ? null
            : Math.max(0, Math.min(t.max, Number(el.value)));
        if (v !== null && Number(el.value) > t.max) {
          el.value = t.max;
          toast("คะแนนเต็มของชิ้นงานนี้คือ " + t.max);
        }
        scores[el.dataset.sid][el.dataset.tid] = v;
        if (v !== null && !t.graded) t.graded = true;
        setDirty(true);
        const row = el.closest("tr"),
          p = profile(el.dataset.sid),
          tds = row.querySelectorAll("td");
        tds[tds.length - 2].textContent = fmt(p.overall);
        tds[tds.length - 1].innerHTML =
          `<span class="num text-xs px-2 py-1 rounded-full ${riskTone(p.risk)}">${p.passCount}/${p.gradedCount}</span>`;
      }
      function gridKey(e, el) {
        const r = +el.dataset.r,
          c = +el.dataset.c;
        const go = (dr, dc) => {
          const n = document.querySelector(
            `input[data-r="${r + dr}"][data-c="${c + dc}"]`,
          );
          if (n) {
            n.focus();
            n.select();
            e.preventDefault();
          }
        };
        if (e.key === "Enter" || e.key === "ArrowDown") go(1, 0);
        else if (e.key === "ArrowUp") go(-1, 0);
        else if (
          e.key === "ArrowRight" &&
          el.selectionStart === el.value.length
        )
          go(0, 1);
        else if (e.key === "ArrowLeft" && el.selectionStart === 0) go(0, -1);
      }
      function toggleGraded(id) {
        const t = TASKS.find((x) => x.id === id);
        t.graded = !t.graded;
        toast(
          `"${t.name}" → ${t.graded ? "ตรวจแล้ว (นับผลใน CLO)" : "ยังไม่ตรวจ (ไม่นับผล)"}`,
        );
        render();
      }
      function saveScores() {
        setDirty(false);
        render();
        toast("บันทึกคะแนนแล้ว · คำนวณ CLO ใหม่ทุกหน้า");
      }

      /* ============================== ROUTER ============================== */
      let tab = "flow";
      const VIEWS = {
        flow: viewFlow,
        roster: viewRoster,
        clos: viewClos,
        tasks: viewTasks,
        gradebook: viewGradebook,
        insights: viewInsights,
      };
      function render() {
        $("#app").innerHTML = VIEWS[tab]();
        $("#hTitle").textContent = `${COURSE.code} — ${COURSE.name}`;
        $("#hSub").textContent =
          `ภาคเรียน ${COURSE.term}${COURSE.teacher ? " · " + COURSE.teacher : ""}`;
        $("#headCount").textContent = "👥 " + active().length;
        document.querySelectorAll(".tabbtn").forEach((b) => {
          const on = b.dataset.tab === tab;
          b.classList.toggle("border-olive-700", on);
          b.classList.toggle("font-semibold", on);
          b.classList.toggle("text-olive-900", on);
          b.classList.toggle("text-gray-500", !on);
        });
        if (tab === "roster") {
          $("#q").oninput = (e) => {
            rf.q = e.target.value;
            render();
            const i = $("#q");
            i.focus();
            i.setSelectionRange(i.value.length, i.value.length);
          };
          $("#riskSel").onchange = (e) => {
            rf.risk = e.target.value;
            render();
          };
          $("#stSel").onchange = (e) => {
            rf.status = e.target.value;
            render();
          };
        }
      }
      document.querySelectorAll(".tabbtn").forEach(
        (b) =>
          (b.onclick = () => {
            tab = b.dataset.tab;
            render();
            window.scrollTo({ top: 0 });
          }),
      );
      render();
    </script>
  </body>
</html>
