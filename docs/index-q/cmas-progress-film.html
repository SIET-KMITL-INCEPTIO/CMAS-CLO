/* CMAS — 30 s progress film, built from `git log` (2026-07-24 → 2026-11-12). Same engine as CMAS_film_30s.html. Through-line object: the red dot. Every frame = pure function of t. */
const W=1920,H=1080,CX=960,CY=540,DUR=30,B=0.5,T=b=>(b-1)*B;
const C={ink:'#1E233C',ink2:'#4A5070',dim:'#878CB4',faint:'#9AA0BE',edge:'#E4E5F0',edge2:'#EDEEF6',tint:'#EEEFF8',wash:'#F4F5FA',card:'#FFFFFF',
  haze:'#465078',rail:'#3C456A',railSel:'#535B7C',aside:'#F7F7FB',sel:'#465078',selBg:'#E9EBF5',badge:'#4F5782',
  ok:'#4F7C68',okBg:'#E7EFEA',okBar:'#6E9C87',warn:'#7D6430',warnBg:'#F4EEE1',bad:'#A2504F',badBg:'#F4E8E8',badBar:'#B96F6E',
  cellHi:'#C6C6D0',grp:'#F1F2F9',th:'#F6F7FC',red:'#A2504F'};
/* ── time helpers ── */
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),lerp=(a,b,p)=>a+(b-a)*p;
const spr=(u,w=14)=>u<=0?0:1-(1+w*u)*Math.exp(-w*u);
const sprS=(u,w=16,z=.8)=>{if(u<=0)return 0;const wd=w*Math.sqrt(1-z*z);return 1-Math.exp(-z*w*u)*(Math.cos(wd*u)+z/Math.sqrt(1-z*z)*Math.sin(wd*u));}; // ≈1.5% overshoot
const K10=1-Math.pow(2,-10);
const eo=(u,d)=>u<=0?0:u>=d?1:(1-Math.pow(2,-10*u/d))/K10;
const eio=(u,d)=>{if(u<=0)return 0;if(u>=d)return 1;const x=u/d;return x<.5?(Math.pow(2,20*x-10)-Math.pow(2,-10))/2/K10:1-(Math.pow(2,-20*x+10)-Math.pow(2,-10))/2/K10;};
const ss=(u,d)=>{const x=clamp(u/d);return x*x*(3-2*x);};
const R=(x,y,w,h,r=0)=>({x,y,w,h,r});const lerpR=(a,b,p)=>R(lerp(a.x,b.x,p),lerp(a.y,b.y,p),lerp(a.w,b.w,p),lerp(a.h,b.h,p),lerp(a.r,b.r,p));
const ctr=r=>[r.x+r.w/2,r.y+r.h/2];
const mix=(a,b,p)=>{const h=s=>[1,3,5].map(i=>parseInt(s.substr(i,2),16));const A=h(a),Bb=h(b);return 'rgb('+A.map((v,i)=>Math.round(lerp(v,Bb[i],clamp(p)))).join(',')+')';};
/* ── drawing helpers ── */
const FAM='Inter, "Plex Thai", sans-serif';
function font(c,px,w=400){c.font=`${Math.round(Math.min(600,w))} ${px}px ${FAM}`;}
function tw(c,s,px,w=400,ls=0){font(c,px,w);c.letterSpacing=ls+'px';const v=c.measureText(s).width;c.letterSpacing='0px';return v;}
function txt(c,s,x,y,px,w,col,align='left',ls=0){font(c,px,w);c.letterSpacing=ls+'px';c.textAlign=align;c.textBaseline='alphabetic';c.fillStyle=col;c.fillText(s,x,y);c.letterSpacing='0px';}
function rr(c,r){c.beginPath();c.roundRect(r.x,r.y,Math.max(0,r.w),Math.max(0,r.h),Math.max(0,Math.min(r.r||0,Math.abs(r.w)/2,Math.abs(r.h)/2)));}

// text rising out of its own mask line; q sinks it back

// rich line: segments [text,col] laid out left→right (keyword in accent)
function riseRich(c,segs,x,y,px,w,p,q=0,align='left'){if(p<=0||q>=1)return;let tot=segs.reduce((a,[s])=>a+tw(c,s,px,w),0);let x0=align==='center'?x-tot/2:x;

/* ═════ LOGO ═════ */
const LG={y:560,lt:'<',gt:'>',word:'CMAS',px:150,wpx:118};
function logoGeom(c){const lw=tw(c,'<',LG.px,300),gw=tw(c,'>',LG.px,300),sw=58,ww=tw(c,'CMAS',LG.wpx,500,2),gap=60;const tot=lw+sw+gw+gap+ww;const x0=CX-tot/2;
  return {x0,lw,gw,sw,ww,gap,slash:{x:x0+lw+sw/2,y:LG.y-LG.px*.33},wx:x0+lw+sw+gw+gap};}
function slashShape(c,cx,cy,len,th,ang,col){c.save();c.translate(cx,cy);c.rotate(ang);fill(c,R(-th/2,-len/2,th,len,th/2),col);c.restore();}
// k: 0 = logo hidden into slash, 1 = full logo
function drawLogo(c,k,slashState){const g=logoGeom(c);
  if(k>0){c.save();const [sx,sy]=[g.slash.x,g.slash.y];
    // "<" and ">" unfold out from behind the slash, "CMAS" slides out of a mask
    c.beginPath();c.rect(-5000,-5000,sx-14+5000,10000);c.clip();txt(c,'<',g.x0+(1-k)*(g.lw+30),LG.y,LG.px,300,C.ink);c.restore();

  if(slashState)slashShape(c,...slashState);
  return g;}
const SLASH_FULL=g=>[g.slash.x,g.slash.y,LG.px*.92,14,.36,C.red];

/* ═════ HOOK (b1–8) ═════ */
const H1='150 commits',H2a='ใน ',H2b='111 วัน',HPX=112,HB1=470,HB2=630;
function hookDot(t,c){const g=logoGeom(c);const full=SLASH_FULL(g);
  // slash (len,th,ang) → dot (26,26,0)
  const p=sprS(t-.75,13);let st=[g.slash.x,g.slash.y,lerp(full[2],26,p),lerp(14,26,p),lerp(.36,0,p),C.red];
  const w2=tw(c,H2a+H2b,HPX,600);const end=[CX+w2/2+34,HB2-13];
  if(t>=0.9){const q=sprS(t-0.9,9);st[0]=lerp(g.slash.x,end[0],q);st[1]=lerp(g.slash.y,end[1],q);}
  const w1=tw(c,H1,HPX,600),left=CX-Math.max(w1,w2)/2-40;
  if(t>=3.0){const q=eio(t-3.0,.32);st[0]=lerp(end[0],left,q);st[1]=lerp(end[1],(HB1+HB2)/2-40,q);}
  if(t>=3.32){const q=sprS(t-3.32,11);st[0]=lerp(left,CX,q);st[1]=lerp((HB1+HB2)/2-40,CY,q);}
  return st;}
function hook(c,t){
  if(t<1.0){const k=1-eio(t-.5,.42);drawLogo(c,k,null);}
  const d=hookDot(t,c);
  const wipe=t>=3.0?(t<3.32?d[0]-16:-1e9):1e9; // text left behind the sweeping dot is wiped
  c.save();c.beginPath();c.rect(-5000,0,wipe+5000,H);c.clip();
  rise(c,H1,CX,HB1,HPX,600,C.ink,sprS(t-1.0,14),0,'center');
  riseRich(c,[[H2a,C.ink],[H2b,C.red]],CX,HB2,HPX,600,sprS(t-1.5,14),0,'center');
  {const w2=tw(c,H2a+H2b,HPX,600),x0=CX-w2/2+tw(c,H2a,HPX,600),kw=tw(c,H2b,HPX,600);const u=eo(t-2.5,.38);if(u>0)fill(c,R(x0,HB2+22,kw*u,7,3.5),C.red);}
  c.restore();
  // pulse on beat 6
  const pul=t>=2.5&&t<3.0?1+.35*Math.sin(Math.PI*clamp((t-2.5)/.4)):1;
  slashShape(c,d[0],d[1],d[2]*pul,d[3]*pul,d[4],C.red);
}

/* ═════ dispatcher ═════ */
function scene(c,t){

    if(t>=20)m4(c,t,t<20.45?pushIn(t,20):0);

/* ───── real-time player: audio is the master clock ───── */
(function(){const go=document.getElementById('go'),hud=document.getElementById('hud');
  const fit=()=>{const k=Math.min(innerWidth/W,innerHeight/H);cv.style.transform=`translate(-50%,-50%) scale(${k})`;};addEventListener('resize',fit);fit();
  let audio=null,playing=false,t0=0,tP=0,raf=0,ema=8,hudTO=0;const LV=[3,2,1];let lv=0;
  const clock=()=>audio&&!audio.paused?audio.currentTime:(playing?(performance.now()-t0)/1000:tP);
  const say=m=>{hud.textContent=m;hud.classList.add('on');clearTimeout(hudTO);hudTO=setTimeout(()=>hud.classList.remove('on'),900);};
  function loop(){if(!playing)return;let t=clock();if(!audio)t%=DUR;const a=performance.now();window.SAMPLES=LV[lv];window.SHUTTER=1/70;window.seek(t);
    ema=ema*.9+(performance.now()-a)*.1;if(ema>14&&lv<LV.length-1){lv++;ema=8;}raf=requestAnimationFrame(loop);}
  function play(){if(playing)return;playing=true;t0=performance.now()-tP*1000;if(audio){audio.currentTime=tP;audio.play().catch(()=>{});}raf=requestAnimationFrame(loop);}
  function pause(){if(!playing)return;tP=clock();playing=false;cancelAnimationFrame(raf);if(audio)audio.pause();window.seek(tP);}
  function scrub(d){const t=(((clock()+d)%DUR)+DUR)%DUR;tP=t;if(audio)audio.currentTime=t;t0=performance.now()-t*1000;if(!playing)window.seek(t);say(t.toFixed(2)+' s');}
  go.addEventListener('click',async()=>{go.disabled=true;go.querySelector('b').textContent='กำลังเตรียมเสียง…';
    try{const b64=await window.makeAudio();const bin=atob(b64),u8=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);
      audio=new Audio(URL.createObjectURL(new Blob([u8],{type:'audio/wav'})));audio.loop=true;}catch(e){audio=null;}
    go.hidden=true;tP=0;play();});
  cv.addEventListener('click',()=>playing?pause():play());
  addEventListener('keydown',e=>{if(!go.hidden)return;
    if(e.code==='Space'){e.preventDefault();playing?pause():play();say(playing?'play':'pause');}
    else if(e.code==='ArrowRight')scrub(e.shiftKey?2:.5);else if(e.code==='ArrowLeft')scrub(e.shiftKey?-2:-.5);
    else if(e.code==='Home')scrub(-clock());else if((e.key==='m'||e.key==='M')&&audio){audio.muted=!audio.muted;say(audio.muted?'muted':'sound on');}});
  document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});})();
