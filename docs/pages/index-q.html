<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CMAS — UI Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=IBM+Plex+Sans+Thai:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<!-- SheetJS: real .xlsx read/write. Already a dependency of client/ - the
     prototype loads the CDN build so the single file stays single. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        peri:'#C8CDEB', cool:'#878CB4', haze:'#465078', mid:'#1E233C', char:'#0A0F19',
        field:'#E9EAF4', card:'#FFFFFF', wash:'#F4F5FA', tint:'#EEEFF8',
        edge:'#E4E5F0', edge2:'#EDEEF6',
        ink:'#1E233C', ink2:'#4A5070', dim:'#878CB4', faint:'#9AA0BE',
        fgray:'#B8BED7', csub:'#AFAECC', mount:'#85758F', ev1:'#524E68', ev2:'#44405A',
        ok:'#4F7C68', okBg:'#E7EFEA', okBd:'#BCD3C6',
        warn:'#96793D', warnBg:'#F4EEE1', warnBd:'#DFCFA6',
        bad:'#A2504F', badBg:'#F4E8E8', badBd:'#DCBABA',
        info:'#4A5A86', infoBg:'#E9ECF6'
      },
      borderRadius: { xs:'6px', sm:'10px', DEFAULT:'14px', lg:'18px', xl:'24px', '2xl':'28px' }
    }
  }
}
</script>
<style>
/* ══════════════════════════════════════════════════════════════════
   CMAS · UI Mockup — Nocturnal Atelier v3.2 (light field)
   "Two fonts. No weight above 600. Size leads. Depth breathes."

   Data     mirrors database/schema.prisma v4 across FOUR courses chosen to
            exercise the edge cases the schema and SRS actually name.
   Rules    CR-01…CR-11 from docs/markdown/dev/requirements/srs.md are implemented, not
            paraphrased — every figure on screen is derived, never typed.
   ══════════════════════════════════════════════════════════════════ */
:root{
  --listw:296px;            /* list pane, user-resizable and persisted */
  --row-py:10px;            /* driven by the density toggle */
  --ink:#1E233C; --ink2:#4A5070; --dim:#878CB4; --faint:#9AA0BE;
  --edge:#E4E5F0; --edge2:#EDEEF6; --tint:#EEEFF8;
  /* Surface tokens. These mirror the Tailwind `card`/`wash` colours so CSS
     written outside a utility class does not have to hard-code the hex. */
  --card:#FFFFFF; --wash:#F4F5FA;
  /* K1 — ตัวบ่งชี้ชุดเดียวทั้งแอป: "อยู่หน้านี้" (sel) กับ "โฟกัสคีย์บอร์ด" (focus)
     เคยมี 6 แบบ ต่างสี ต่างความหนา ต่างวิธีวาด — ตอนนี้แก้ที่เดียว */
  --sel:#465078; --sel-bg:#E9EBF5; --focus:#465078;
  /* ตัวหนังสือที่ต้องอ่าน แต่ไม่ใช่เนื้อหาหลัก (คำแนะนำ ชื่อแท็บ รายการในแถบซ้าย)
     --dim (#878CB4) บนขาวได้แค่ 3.26:1 จึงใช้กับป้ายรองได้ แต่ไม่ใช่กับคำแนะนำ — ค่านี้ 6.06:1 */
  --ink-soft:#5B6180;
  --shadow-soft: 0 1px 2px rgba(30,35,60,.03), 0 6px 20px -10px rgba(30,35,60,.10);
  --shadow-card: 0 1px 2px rgba(30,35,60,.04), 0 14px 44px -14px rgba(30,35,60,.13);
  --shadow-pop:  0 2px 6px rgba(30,35,60,.06), 0 24px 60px -18px rgba(30,35,60,.28);
}
*{ -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; }
html,body{
  color:var(--ink);
  font-family:'Inter','IBM Plex Sans Thai',-apple-system,BlinkMacSystemFont,sans-serif;
  font-weight:400;
  background:
    radial-gradient(1100px 620px at 10% -12%, #FFFFFF 0%, rgba(255,255,255,0) 62%),
    radial-gradient(900px 700px at 100% 8%, #F2F1F8 0%, rgba(242,241,248,0) 58%),
    linear-gradient(158deg, #F3F3F9 0%, #E9EAF4 46%, #E3E5F0 100%);
  background-attachment:fixed; min-height:100vh;
}
h1,h2,h3{ font-weight:400; letter-spacing:-0.015em; }
b,strong{ font-weight:500; }

.tnum{ font-variant-numeric:tabular-nums; font-feature-settings:'tnum' 1; }
.text-soft{ color:var(--ink-soft); }
.over{ font-size:12px; font-weight:500; letter-spacing:.14em; text-transform:uppercase; color:var(--dim); }

.card{ background:#fff; border-radius:12px; box-shadow:var(--shadow-soft); }
.hair{ border-bottom:1px solid var(--edge2); }
.hair-t{ border-top:1px solid var(--edge2); }

.nav{ display:flex; align-items:center; gap:11px; padding:7px 11px; margin:1px 0;
      border-radius:9px; color:var(--ink-soft); cursor:pointer; transition:background .15s,color .15s; }
.nav:hover{ background:#F5F6FB; color:var(--ink); }
.nav[aria-current="page"]{ background:var(--tint); color:var(--ink); }
.nav .ic{ width:17px; height:17px; flex:none; opacity:.72; }
.nav[aria-current="page"] .ic{ opacity:1; }
.nav .tail{ font-size:12.5px; color:var(--faint); font-variant-numeric:tabular-nums; }

.meter{ position:relative; height:7px; background:#E7E8F2; border-radius:99px; }
.meter > i{ position:absolute; left:0; top:0; bottom:0; display:block; border-radius:99px; }
.meter > b{ position:absolute; top:-4px; bottom:-4px; width:1.5px; background:var(--ink); border-radius:2px; }

.scroll-x{ overflow-x:auto; scrollbar-width:thin; scrollbar-color:#D5D7E6 transparent; }
.scroll-x::-webkit-scrollbar{ height:9px; }
.scroll-x::-webkit-scrollbar-thumb{ background:#D5D7E6; border-radius:99px; }
.scroll-y{ overflow-y:auto; scrollbar-width:thin; scrollbar-color:#D9DAE8 transparent; }
.scroll-y::-webkit-scrollbar{ width:6px; }
.scroll-y::-webkit-scrollbar-thumb{ background:#D9DAE8; border-radius:99px; }

/* K1 — เลิกบังคับ border-radius ตอนโฟกัส: outline เดินตามรูปทรงของ element อยู่แล้ว
   การบังคับ 6px ทำให้ปุ่มมุม 10px และป้ายวงกลมเปลี่ยนรูปทรงทุกครั้งที่โฟกัส */
:focus-visible{ outline:2px solid var(--focus); outline-offset:2px; }
[hidden]{ display:none !important; }
button{ font:inherit; text-align:inherit; }

/* Data tables. NOTE: the class is `dt`, never `grid` — Tailwind's `.grid`
   utility sets display:grid and silently stops a table being a table. */
table.dt{ border-collapse:separate; border-spacing:0; width:100%; }
table.dt th, table.dt td{ border-bottom:1px solid var(--edge2); padding:var(--row-py) 12px; text-align:left; }
table.dt thead th{ font-size:12px; font-weight:500; letter-spacing:.11em; text-transform:uppercase; padding-top:8px; padding-bottom:8px;
  color:var(--dim); background:#F6F7FC; white-space:nowrap; border-bottom-color:var(--edge);
  position:sticky; top:0; z-index:5; }
table.dt tbody tr:last-child td{ border-bottom:0; }
/* N4 — หัวตารางสองชั้น: แถวบน = ชื่อกลุ่มคร่อมกิจกรรม · แถวล่างต้อง sticky ใต้แถวบน ไม่ใช่ทับกัน */
table.dt thead tr.ghead th{ text-align:center; color:var(--ink2); border-left:1px solid var(--edge); }
table.dt thead tr.ghead th.who{ text-align:left; border-left:0; }
table.dt thead tr.ghead + tr th{ top:33px; }
table.dt th.gstart, table.dt td.gstart{ border-left:1px solid var(--edge); }
table.dt tbody tr:hover{ background:#FAFAFD; }
table.dt td.num, table.dt th.num{ text-align:right; font-variant-numeric:tabular-nums; }
th.sortable{ cursor:pointer; user-select:none; }
th.sortable:hover{ color:var(--ink); }
th .caret{ opacity:.45; margin-left:5px; font-size:12px; }
tr.rowlink{ cursor:pointer; }
/* Identity column: never wraps, so a row stays one row at any density. */
td.who, th.who{ min-width:198px; }
td.who .code{ font-variant-numeric:tabular-nums; font-size:12.5px; color:var(--dim); white-space:nowrap; }
td.who .nm{ font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:230px; }
td.scorecell{ white-space:nowrap; }
html[data-density="compact"] td.who .code{ display:inline; margin-right:7px; }
html[data-density="compact"] td.who .nm{ display:inline; }

/* Inputs */
.inp{ width:100%; background:#fff; border:1px solid var(--edge); border-radius:10px;
      padding:9px 12px; font-size:15px; color:var(--ink); transition:border-color .15s,box-shadow .15s; }
.inp:focus{ outline:none; border-color:#A8AECD; }
.inp:focus-visible{ outline:2px solid var(--focus); outline-offset:1px; border-color:var(--focus); }
.inp::placeholder{ color:var(--faint); }
.cellinp{ width:52px; background:#fff; border:1px solid var(--edge2); border-radius:6px;
          padding:2px 5px; text-align:right; font-variant-numeric:tabular-nums; font-size:14px; color:inherit; }
/* An empty cell is the one the user has to find. A dashed outline plus a faint
   dash says "type here"; fully transparent said nothing at all. */
.cellinp.empty{ border-style:dashed; border-color:#C9CDE2; background:#FCFCFE; }
.cellinp::placeholder{ color:#B4B9D2; }
.cellinp:hover{ border-color:#A8AECD; background:#fff; }
.cellinp:focus{ outline:none; border-color:#A8AECD; background:#fff; }
.cellinp:focus-visible{ outline:2px solid var(--focus); outline-offset:1px; border-color:var(--focus); }

/* Segmented tabs */
/* Overlays */
.scrim{ position:fixed; inset:0; background:rgba(30,35,60,.34); backdrop-filter:blur(3px);
        z-index:60; opacity:0; transition:opacity .18s; }
.scrim.on{ opacity:1; }
.sheetbox{ position:fixed; z-index:61; background:#fff; box-shadow:var(--shadow-pop); }
.modalbox{ left:50%; top:50%; transform:translate(-50%,-46%); width:min(620px,calc(100vw - 40px));
           max-height:86vh; border-radius:22px; opacity:0; transition:opacity .18s, transform .18s; }
.modalbox.on{ opacity:1; transform:translate(-50%,-50%); }
.drawerbox{ right:0; top:0; bottom:0; width:min(560px,100vw); border-radius:24px 0 0 24px;
            transform:translateX(20px); opacity:0; transition:opacity .2s, transform .2s; }
.drawerbox.on{ opacity:1; transform:translateX(0); }

/* Toasts */
#toasts{ position:fixed; right:20px; bottom:20px; z-index:80; display:flex; flex-direction:column; gap:10px; }
.toast{ background:#1E233C; color:#EDEEF6; padding:12px 16px; border-radius:13px; font-size:14px;
        box-shadow:var(--shadow-pop); display:flex; align-items:center; gap:10px; max-width:380px;
        opacity:0; transform:translateY(8px); transition:opacity .18s, transform .18s; }
.toast.on{ opacity:1; transform:translateY(0); }

kbd{ font-family:'Inter',sans-serif; font-size:12px; padding:2px 6px; border-radius:5px;
     background:#EAEBF4; color:var(--ink-soft); border:1px solid var(--edge); }

.step{ display:flex; gap:12px; align-items:flex-start; }
.step .dot{ width:22px; height:22px; border-radius:99px; flex:none; display:grid; place-items:center;
            font-size:12.5px; background:#EAEBF4; color:var(--ink-soft); }
.step.done .dot{ background:#E7EFEA; color:#4F7C68; }
.step.now  .dot{ background:#1E233C; color:#fff; }

/* ══ Teams-shaped frame ═══════════════════════════════════════════════
   Four regions, exactly as Microsoft Teams arranges them:
     command bar  — full width, product name left, search centred, account right
     app rail     — 84px icon strip, the system-level areas
     list pane    — the "Teams › Channels" tree; here: รายวิชา › หัวข้อ
     content      — header, sub-tabs, body
   Haze Purple #465078 is the main-palette tone nearest Teams' own chrome, so
   the rail reads as Teams without importing a colour from outside the system. */
.app{
  display:grid; height:100vh; overflow:hidden;
  grid-template-columns:84px var(--listw) minmax(0,1fr);
  grid-template-rows:48px minmax(0,1fr);
}
.cmdbar{
  grid-column:1/-1; grid-row:1; display:flex; align-items:center; gap:14px;
  background:#465078; color:#EDEEF6; padding-right:14px;
}
.cmdbar .brand{ width:84px; display:grid; place-items:center; font-size:16px; color:#fff; }
.cmdsearch{
  flex:1; max-width:620px; margin:0 auto; display:flex; align-items:center; gap:9px;
  background:rgba(255,255,255,.16); border-radius:7px; padding:6px 11px;
  font-size:14px; color:#DCDEF0; cursor:text; transition:background .15s;
}
.cmdsearch:hover{ background:rgba(255,255,255,.24); }
.cmdright{ display:flex; align-items:center; gap:10px; }

.apprail{
  grid-row:2; background:#3C456A; display:flex; flex-direction:column;
  align-items:stretch; padding:6px 0; overflow-y:auto;
}
.arl{
  position:relative; display:grid; justify-items:center; gap:3px; padding:9px 4px 8px;
  color:#C3C7E0; font-size:12px; line-height:1.2; text-align:center; transition:color .14s,background .14s;
}
.arl:hover{ color:#fff; background:rgba(255,255,255,.07); }
.arl[aria-current="page"]{ color:#fff; background:rgba(255,255,255,.12); }
.arl[aria-current="page"]::before{
  content:''; position:absolute; left:0; top:8px; bottom:8px; width:3px;
  background:#C8CDEB; border-radius:0 3px 3px 0;
}
.arl svg{ width:20px; height:20px; }

.listpane{
  grid-row:2; background:#F7F7FB; border-right:1px solid var(--edge);
  display:flex; flex-direction:column; min-width:0;
}
.lphead{ display:flex; align-items:center; gap:8px; padding:12px 8px 8px 14px; }
.lptitle{ font-size:16px; color:var(--ink); flex:1; min-width:0; }
/* Create-course button. Was a bare "+" whose only explanation was a title
   tooltip — invisible on touch and easy to miss on a pale rail. Written label,
   dark fill, same height as a list row's hit target. */
.lpadd{ display:inline-flex; align-items:center; gap:6px; flex:none; height:30px; padding:0 11px;
        border-radius:8px; background:#1E233C; color:#fff; font-size:14px; white-space:nowrap; }
.lpadd:hover{ background:#2C3354; }
/* Area gate, separate from [hidden]: applyPermissions() sets hidden=false on
   anything the user may do, which put this button on the Users and Coverage
   screens for every admin. A class it never touches cannot be overridden. */
.is-off{ display:none !important; }
.lpempty-add{ margin-top:14px; }
.lpsearch{ margin:0 10px 8px; }
.lplist{ flex:1; overflow-y:auto; padding:0 6px 12px; }
/* ── Teams-style course cards ──────────────────────────────────────
   Teams shows teams as a grid of cards with the avatar doing the recognising,
   and a row of small actions along the bottom edge. The table is still the
   better answer when you are comparing เกณฑ์เกรด or ความพร้อม across courses,
   so both views exist and the choice is the reader's (Principle 2). */
.cgrid{ display:grid; gap:12px; grid-template-columns:repeat(auto-fill, minmax(min(100%, 268px), 1fr)); }
.ccard{ background:#fff; border:1px solid var(--edge); border-radius:12px; overflow:hidden;
  display:flex; flex-direction:column; transition:border-color .14s, box-shadow .14s; }
.ccard:hover{ border-color:var(--cool); box-shadow:var(--shadow-soft); }
.ccard[data-open="1"]{ border-color:var(--sel); box-shadow:inset 0 0 0 1px var(--sel); }
.ccard-main{ display:flex; align-items:flex-start; gap:11px; padding:14px 14px 10px; text-align:left; flex:1; }
.ccard-main:hover .ccard-name{ text-decoration:underline; text-underline-offset:2px; }
.ccard-name{ font-size:15px; color:var(--ink); line-height:1.3; display:block; }
.ccard-meta{ font-size:12.5px; color:var(--dim); font-variant-numeric:tabular-nums; display:block; margin-top:3px; }
.ccard-facts{ padding:0 14px 10px; display:flex; flex-wrap:wrap; gap:5px; }
.ccard-foot{ display:flex; align-items:center; gap:2px; padding:6px 8px;
  border-top:1px solid var(--edge2); background:#FAFAFD; }
.cact{ display:inline-grid; place-items:center; width:30px; height:30px; border-radius:7px;
  color:var(--dim); transition:background .14s,color .14s; }
.cact:hover{ background:#EDEEF6; color:var(--ink); }
.cact.is-danger:hover{ background:#F4E8E8; color:#A2504F; }
.cact svg{ width:16px; height:16px; }
.cgrouptitle{ display:flex; align-items:baseline; gap:10px; margin:18px 0 9px; }
.cgrouptitle:first-child{ margin-top:0; }

/* A course behaves like a Team: a header row that expands into its sections. */
.team{ margin-bottom:2px; }
.teamrow{ width:100%; display:flex; align-items:center; gap:9px; padding:7px 8px;
          border-radius:6px; text-align:left; transition:background .14s; }
.teamrow:hover{ background:#EDEEF6; }
/* K1 — วิชาที่เลือกไม่ซ้อนพื้นกับหน้าลูก ตัวหนังสือเข้มพอ · ถ้าพับอยู่ (มองไม่เห็นหน้าลูก)
   ตัวแถวรับตัวบ่งชี้ตำแหน่งแทน มิฉะนั้นจะไม่มีอะไรบอกว่าอยู่วิชาไหน */
.teamrow[aria-current="true"] .tname{ font-weight:500; }
.team:not(:has(.chan)) > .teamrow[aria-current="true"]{ background:var(--sel-bg); box-shadow:inset 3px 0 0 var(--sel); }
.tavatar{ width:36px; height:36px; border-radius:7px; flex:none; display:grid; place-items:center;
          font-size:12px; color:#fff; font-variant-numeric:tabular-nums;
          background:linear-gradient(135deg,#5B6392,#3C456A); }
.tname{ font-size:14px; color:var(--ink); line-height:1.25; }
.tmeta{ font-size:12.5px; color:var(--dim); }
.tdot{ width:8px; height:8px; border-radius:99px; flex:none; }
.caret{ width:14px; text-align:center; color:var(--faint); font-size:12px; flex:none; }

.chan{ display:flex; align-items:center; gap:8px; padding:5px 8px 5px 14px;
       margin-left:24px; border-radius:6px; font-size:14px; color:var(--ink-soft);
       text-align:left; transition:background .14s,color .14s; position:relative; }
.chan:hover{ background:#EDEEF6; color:var(--ink); }
/* K1 — แถบซ้ายเคยเป็น ::before ที่ left:0 ซึ่งลอยแยกจากมุมโค้งของพื้น · inset box-shadow
   ถูกตัดด้วย border-radius เดียวกับพื้น แถบจึงติดขอบพอดีเสมอ */
.chan[aria-current="page"]{ background:var(--sel-bg); color:var(--ink); font-weight:500;
                            box-shadow:inset 3px 0 0 var(--sel); }
.changroup{ padding:10px 8px 3px 14px; margin-left:28px; font-size:12px; letter-spacing:.04em; color:var(--faint); }
.chnum{ display:inline-grid; place-items:center; width:16px; height:16px; border-radius:99px; font-size:12px;
  background:#EDEEF6; color:var(--dim); font-variant-numeric:tabular-nums; flex:none; }
.chan[aria-current="page"] .chnum{ background:var(--ink); color:#fff; }
.chan .n{ margin-left:auto; font-size:12px; color:var(--faint); font-variant-numeric:tabular-nums; }

/* หัวกลุ่มในตารางจัดการรายวิชา — เป็นแถวของตาราง ไม่ใช่ตารางซ้อนตาราง
   ตารางเดียวแปลว่าคอลัมน์ทุกกลุ่มตรงกันเสมอ และ sticky thead ยังทำงาน */
table.dt tbody tr.cgrouphead td{ background:#F1F2F9; padding-top:8px; padding-bottom:8px;
  border-bottom-color:var(--edge); position:sticky; top:33px; z-index:4; }
table.dt tbody tr.cgrouphead:hover td{ background:#F1F2F9; }

/* ปุ่มตัวเลือกแบบชิป — ใช้ทั้งการจัดกลุ่มรายวิชาและการจัดกลุ่มกิจกรรม */
.chipbtn{ padding:3px 10px; border-radius:99px; border:1px solid var(--edge);
  background:#fff; color:var(--ink-soft); font-size:13px; line-height:1.5; transition:all .14s; }
.chipbtn:hover{ border-color:var(--cool); color:var(--ink); }
.chipbtn[aria-current="true"]{ background:var(--sel-bg); border-color:var(--sel); color:var(--ink); font-weight:500; }

/* Teams' content pane is a flat, near-white surface — the tinted field was a
   document look, not an application one. */
.content{ grid-row:2; min-width:0; display:flex; flex-direction:column; overflow:hidden;
          background:#FAFAFC; }
.chead{
  display:flex; flex-direction:column; align-items:flex-start; gap:10px;
  padding:14px 18px 12px; border-bottom:1px solid var(--edge); background:#fff;
}
/* แถบเครื่องมือของหน้าอยู่ใต้ชื่อหน้า ชิดซ้าย — ตำแหน่งเดียวกับที่สายตาอ่านชื่อหน้าอยู่แล้ว
   ปุ่มหลักขึ้นก่อนเสมอ ปุ่ม ? ไปท้ายสุด */
.ctools{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; width:100%; }
.ctools:empty{ display:none; }
.ctools .btn-primary{ order:-1; }
.ctools .helpbtn{ order:99; }
.ctitle{ font-size:22px; font-weight:300; color:var(--ink); line-height:1.25; }
.csub{ font-size:13px; color:var(--dim); }
.subtabs{ display:flex; gap:2px; padding:0 18px; background:#fff; border-bottom:1px solid var(--edge); }
.stab{ padding:8px 13px 11px; font-size:14px; color:var(--ink-soft); white-space:nowrap; }
.stab:hover{ color:var(--ink); }
.stab[aria-current="page"]{ color:var(--ink); box-shadow:inset 0 -2px 0 var(--sel); }
.cbody{ flex:1; overflow-y:auto; padding:16px 18px 32px; }

/* ── application chrome ───────────────────────────────────────────────
   A desktop tool spends its pixels on data. The title bar is one row high,
   the toolbar lives in it, and prose is one click away behind the ? button. */
.helpbtn{
  width:19px; height:19px; border-radius:99px; flex:none;
  display:inline-grid; place-items:center; font-size:12.5px; line-height:1;
  background:var(--tint); color:var(--cool,#878CB4); border:1px solid var(--edge);
  transition:background .15s,color .15s;
}
.helpbtn:hover{ background:#1E233C; color:#fff; border-color:#1E233C; }

.btn{
  padding:6px 13px; font-size:14px; border-radius:9px; white-space:nowrap;
  background:#fff; color:var(--ink2); border:1px solid var(--edge); transition:.14s;
}
.btn:hover{ color:var(--ink); border-color:#CFD3E4; }
.btn-primary{ background:#1E233C; color:#fff; border-color:#1E233C; }
.btn-primary:hover{ background:#465078; border-color:#465078; color:#fff; }
.btn-quiet{ background:transparent; border-color:transparent; padding:4px 9px; font-size:14px; }
.btn-quiet:hover{ background:var(--tint); border-color:transparent; }
.btn-danger{ color:#A2504F; }
.btn-danger:hover{ color:#8C4241; border-color:#DCBABA; }
.btn-solid-danger{ background:#A2504F; color:#fff; border-color:#A2504F; }
.btn-solid-danger:hover{ background:#8C4241; border-color:#8C4241; color:#fff; }
/* J3 — ปุ่มลบที่ยังพิมพ์ยืนยันไม่ตรงต้องดูออกว่ากดไม่ได้ ไม่ใช่แดงเข้มเหมือนพร้อมลบ */
.btn:disabled, .btn:disabled:hover{ background:#EAEBF4; border-color:#EAEBF4; color:#9AA0BE; cursor:not-allowed; }

/* Layout control. This replaced three icon-only segments that could only be
   told apart by a hover tooltip — and a tooltip is unreadable on a touch
   screen, which is exactly where the compact default is chosen for the user.
   A labelled button that opens a labelled panel needs no tooltip at all. */
.lybtn{ display:inline-flex; align-items:center; gap:6px; padding:6px 11px; font-size:14px;
        color:var(--ink2); background:#fff; border:1px solid var(--edge); border-radius:9px;
        white-space:nowrap; }
.lybtn:hover{ color:var(--ink); border-color:#C8CDEB; }
.lybtn[aria-expanded="true"]{ color:var(--ink); border-color:#C8CDEB; background:var(--wash); }
.lypop{ position:absolute; z-index:70; width:268px; padding:6px; background:var(--card);
        border:1px solid var(--edge); border-radius:12px; box-shadow:var(--shadow-pop);
        opacity:0; transform:translateY(-4px); transition:opacity .14s, transform .14s; }
.lypop.on{ opacity:1; transform:translateY(0); }
.lyitem{ width:100%; display:flex; align-items:flex-start; gap:9px; padding:7px 10px;
         border-radius:8px; text-align:left; }
.lyitem:hover{ background:var(--wash); }
.lytick{ font-size:12px; line-height:19px; color:var(--faint); }
.lyitem[aria-pressed="true"] .lytick{ color:var(--ink); }

/* Long prose in a table sits on one line and ends in … so every row is the
   same height and a column of descriptions scans like a list, not a wall.
   Nothing hides behind a hover tooltip: a tooltip cannot be opened by touch,
   read slowly, or copied. The full text is one click on the cell — or the
   whole table at once from เลย์เอาต์.

   max-width:0 on the cell is what makes text-overflow work under
   table-layout:auto — the cell then takes the width the other columns leave
   over instead of growing to fit its longest line. */
/* max-width:0 alone lets the cell shrink to whatever the fixed columns leave,
   which on a phone was about six characters — "เพิ่มบัญ…" says nothing at all.
   The floor keeps a clipped cell wide enough to be worth reading; past that the
   table scrolls sideways, which .scroll-x already handles, instead of the text
   being ground down to a stub. */
html[data-longtext="clip"] td.wrapcell{ max-width:0; min-width:15ch; }
html[data-longtext="clip"] .clip{ display:block; overflow:hidden;
                                  text-overflow:ellipsis; white-space:nowrap; }
html[data-longtext="clip"] .clip.more{ cursor:pointer; }
html[data-longtext="clip"] .clip.more:hover{ text-decoration:underline dotted;
                                             text-underline-offset:3px; }
html[data-longtext="clip"] .clip.open{ white-space:normal; overflow:visible; text-overflow:clip; }

/* One status line rather than four billboards. */
.statbar{ display:flex; flex-wrap:wrap; background:#fff; border-radius:12px; box-shadow:var(--shadow-soft); }
.statcell{ flex:1 1 165px; min-width:145px; padding:11px 16px; border-right:1px solid var(--edge2); }
.statcell:last-child{ border-right:0; }

/* กราฟคู่ตารางในการ์ดเดียว (หน้าภาพรวม). เส้นคั่นย้ายตามทิศที่สองส่วนเรียงกัน
   จริง ๆ — คั่นข้างเมื่ออยู่คนละคอลัมน์ คั่นบน-ล่างเมื่อซ้อนกัน
   J1 — คอลัมน์เรดาร์ 440px ให้ป้ายสี่ทิศมีที่ และแยกคู่ที่ 1400px ขึ้นไป ต่ำกว่านั้น
   ตาราง 5 คอลัมน์จะเหลือไม่ถึง 560px จึงซ้อนกันดีกว่าบีบทั้งคู่ */
/* K3 — หัวกราฟ: ชื่อที่เป็นคำถามซึ่งกราฟตอบ + บรรทัดย่อยสั้นหนึ่งบรรทัด ป้าย `over`
   10.5px ตัวห่าง ๆ บอกแค่หมวด ไม่บอกว่ากราฟอ่านอย่างไร */
.chart-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px;
             padding:14px 16px 11px; border-bottom:1px solid var(--edge2); }
.chart-title{ font-size:16px; line-height:1.35; color:var(--ink); display:flex; align-items:center; gap:7px; flex-wrap:wrap; }
.chart-sub{ font-size:13px; line-height:1.5; color:var(--ink-soft); margin-top:2px; }
.chart-right{ flex:none; font-size:13px; color:var(--dim); padding-top:2px; }
.chart-head.hero{ padding:18px 20px 14px; }
.chart-head.hero .chart-title{ font-size:19px; }

.split2{ display:grid; grid-template-columns:1fr; }
.split2 > :first-child{ border-bottom:1px solid var(--edge2); display:flex; flex-direction:column; justify-content:center; }
@media (min-width: 1400px){
  .split2{ grid-template-columns:520px minmax(0,1fr); }
  .split2 > :first-child{ border-bottom:0; border-right:1px solid var(--edge2); }
}
@media (max-width: 639px){ .radar-min{ min-width:440px; } }

/* Help popover — anchored under the ? button. */
/* K2 — คำอธิบายที่เคยวางค้างในหน้า ย้ายมาอยู่หลังปุ่ม ⓘ ปุ่มเดียวแบบนี้ทั้งแอป
   กล่องมีกล่องเดียว วางด้วย JS เพื่อไม่ให้ล้นขอบจอ (CSS ::after ทำไม่ได้) */
.tipbtn{ display:inline-grid; place-items:center; width:16px; height:16px; border-radius:99px; flex:none;
         font-size:12px; line-height:1; font-style:normal; font-weight:500; vertical-align:middle;
         color:#6B7194; background:#EAEBF4; cursor:help; transition:background .14s,color .14s; }
.tipbtn:hover, .tipbtn[aria-expanded="true"]{ background:var(--sel); color:#fff; }
#tipbox{ position:fixed; z-index:90; max-width:320px; padding:9px 12px; border-radius:10px;
         background:#1E233C; color:#F1F2F8; font-size:14px; line-height:1.6; white-space:pre-line;
         box-shadow:0 10px 30px -10px rgba(30,35,60,.45); pointer-events:none; }
#tipbox[hidden]{ display:none; }
@media print{ .tipbtn, #tipbox{ display:none !important; } }

#pop{ position:absolute; z-index:70; max-width:420px; background:#fff; border-radius:13px;
      box-shadow:var(--shadow-pop); padding:15px 17px; font-size:14px; line-height:1.72;
      color:var(--ink2); opacity:0; transform:translateY(-4px); transition:opacity .14s,transform .14s; }
#pop.on{ opacity:1; transform:translateY(0); }
#pop .over{ margin-bottom:6px; }

/* Principle 7 — draggable divider between rail and stage. */
.rsz{ width:5px; flex:none; cursor:col-resize; background:transparent; position:relative; }
.rsz::after{ content:''; position:absolute; left:2px; top:14px; bottom:14px; width:1px;
             background:transparent; transition:background .15s; }
.rsz:hover::after, .rsz.drag::after{ background:#C8CDEB; }
body.resizing{ cursor:col-resize; user-select:none; }
.rsz{ position:absolute; right:-3px; top:0; bottom:0; z-index:20; }
.listpane{ position:relative; }

html[data-density="compact"]     { --row-py:5px;  }
html[data-density="normal"]      { --row-py:10px; }
html[data-density="comfortable"] { --row-py:15px; }
html[data-density="compact"] table.dt td{ font-size:14px; }

/* The workflow spine, doubling as the course navigation bar. */
.stepbar{ background:#fff; border-bottom:1px solid var(--edge); }
.stepper{ display:flex; overflow-x:auto; scrollbar-width:none; }
.stepper::-webkit-scrollbar{ height:0; }
.stp{ flex:1 1 132px; min-width:126px; display:flex; align-items:center; gap:8px;
      padding:7px 11px; text-align:left; position:relative; transition:background .14s; }
.stp:hover{ background:#F5F6FB; }
.stp + .stp::before{ content:''; position:absolute; left:0; top:50%; transform:translateY(-50%);
                     width:1px; height:22px; background:var(--edge2); }
.stp .num{ width:24px; height:24px; border-radius:99px; display:grid; place-items:center;
           font-size:12px; flex:none; font-variant-numeric:tabular-nums; }
.stp .lb{ font-size:13px; line-height:1.25; min-width:0; }
/* where you are */
.stp[aria-current="page"]{ box-shadow:inset 0 -2px 0 var(--sel); }
/* what to do next — a ring, so it can coexist with the position marker */
.stp[data-now="1"] .num{ box-shadow:0 0 0 2px #fff, 0 0 0 3.5px currentColor; }
/* K4 — แถบบอกว่าหน้านี้คือขั้นที่เท่าไร และปุ่มเดินหน้า/ถอยหลังท้ายหน้า */
.stepctx{ display:flex; align-items:center; gap:12px; padding:12px 16px; margin-bottom:16px;
          background:#fff; border-radius:12px; box-shadow:var(--shadow-soft); flex-wrap:wrap; }
.stepctx .badge{ flex:none; height:28px; padding:0 11px; border-radius:99px; display:inline-grid; place-items:center;
                 background:var(--sel); color:#fff; font-size:13px; font-variant-numeric:tabular-nums; white-space:nowrap; }
.stepfoot{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:24px;
           padding-top:16px; border-top:1px solid var(--edge); flex-wrap:wrap; }
.stepfoot .btn{ max-width:100%; }

.nextbar{ display:flex; align-items:center; gap:10px; padding:6px 12px 6px 14px;
          border-top:1px solid var(--edge2); flex-wrap:nowrap; overflow:hidden; }

/* ══ Responsive ═══════════════════════════════════════════════════════
   Breakpoints are named after what changes, not after devices: 1024 is where
   the list pane stops fitting beside the content, 640 is where a vertical
   app rail costs more than it returns. */
.paneToggle, .paneScrim{ display:none; }

@media (max-width: 1023px){
  .app{ grid-template-columns: 84px minmax(0,1fr); }
  .listpane{
    position:fixed; top:48px; bottom:0; left:84px; width:min(320px, calc(100vw - 84px));
    z-index:45; transform:translateX(calc(-100% - 84px)); transition:transform .22s ease;
    box-shadow:var(--shadow-pop);
  }
  body[data-pane="open"] .listpane{ transform:translateX(0); }
  .paneScrim{ display:block; position:fixed; inset:48px 0 0; background:rgba(30,35,60,.30);
              z-index:44; opacity:0; pointer-events:none; transition:opacity .2s; }
  body[data-pane="open"] .paneScrim{ opacity:1; pointer-events:auto; }
  .paneToggle{ display:inline-grid; }
  .rsz{ display:none; }
}

@media (max-width: 767px){
  /* A table squeezed to one word per line is unreadable; a table you scroll
     sideways is merely narrow. Give every data table a floor and let the card
     scroll — the sticky identity column keeps the row identifiable. */
  .cbody .card{ overflow-x:auto !important; }
  table.dt{ min-width:560px; }
  /* Two columns on the overview restate what the row already says: the meter
     duplicates the percentage beside it, and the derived weight has its own
     page. Dropping them gives the description room to be a sentence. */
  .mob-hide{ display:none; }
  .chead{ padding:9px 12px 8px; }
  .ctitle{ font-size:18px; }
  .cbody{ padding:12px 12px 26px; }
  .subtabs{ padding:0 12px; overflow-x:auto; scrollbar-width:none; }
  .subtabs::-webkit-scrollbar{ height:0; }
  .statcell{ flex:1 1 132px; min-width:118px; padding:9px 12px; }
  .modalbox{ width:calc(100vw - 20px); }
  /* one column: a two-up form field at 360px is two unusable fields */
  #modal .grid.grid-cols-4 > *{ grid-column: span 4 / span 4; }
  #modal .grid-cols-3 > *, #modal .grid-cols-2 > *{ grid-column: auto; }
  #modal .grid-cols-3, #modal .grid-cols-2{ grid-template-columns: 1fr; }
}

@media (max-width: 639px){
  /* The app rail becomes a bottom bar. Reachability, and it is the pattern
     every Teams user already has in their thumb. */
  .app{ grid-template-columns: minmax(0,1fr); grid-template-rows: 48px minmax(0,1fr) 56px; }
  .apprail{
    grid-row:3; grid-column:1; flex-direction:row; justify-content:space-around;
    padding:0; border-top:1px solid rgba(255,255,255,.10);
  }
  .arl{ flex:1; padding:7px 2px 6px; font-size:12px; }
  .arl[aria-current="page"]::before{ left:22%; right:22%; top:0; bottom:auto; width:auto; height:3px;
    border-radius:0 0 3px 3px; }
  .arl svg{ width:19px; height:19px; }
  .apprail .mt-auto{ margin-top:0; flex:1; display:flex; }
  .apprail .mt-auto .arl{ width:100%; }

  .listpane{ left:0; top:48px; bottom:56px; width:100vw; transform:translateX(-100%); }
  .paneScrim{ inset:48px 0 56px; }
  .content{ grid-row:2; grid-column:1; }

  .cmdbar{ gap:8px; padding-right:8px; }
  .cmdbar .brand{ width:44px; font-size:14px; }
  .cmdsearch{ padding:5px 9px; font-size:13px; }
  .cmdsearch span:last-child{ display:none; }

  .stp{ flex:0 0 118px; min-width:118px; }
  .nextbar{ flex-wrap:wrap; gap:6px; padding:7px 12px; }
  .nextbar .ml-auto{ margin-left:0; width:100%; }
  .nextbar .btn{ width:100%; }

  /* Touch targets. 40px is the floor; the density toggle is the only control
     small enough to need forcing. */
  .btn{ min-height:36px; }
  .nav, .chan, .teamrow{ min-height:40px; }

  /* Bottom sheet instead of a centred dialog. */
  .modalbox{
    left:0; right:0; bottom:0; top:auto; width:100vw; transform:translateY(14px);
    border-radius:18px 18px 0 0; max-height:92vh;
  }
  .modalbox.on{ transform:translateY(0); }
  .drawerbox{ width:100vw; border-radius:18px 18px 0 0; top:auto; height:88vh;
              transform:translateY(14px); }
  .drawerbox.on{ transform:translateY(0); }
  #toasts{ left:12px; right:12px; bottom:64px; }
  .toast{ max-width:none; }
}

/* Account menu — anchored under the avatar, not a full overlay: it is a
   shortcut list, and dimming the page for it would overstate it. */
.acctmenu{
  position:fixed; top:44px; right:10px; z-index:60; width:262px; padding:6px;
  background:var(--card); border:1px solid var(--edge); border-radius:12px;
  box-shadow:var(--shadow-pop); opacity:0; transform:translateY(-4px);
  transition:opacity .14s, transform .14s;
}
.acctmenu.on{ opacity:1; transform:translateY(0); }
.acctitem{ width:100%; display:flex; align-items:center; gap:9px; padding:8px 10px;
           border-radius:8px; font-size:14px; color:var(--ink); text-align:left; }
.acctitem:hover{ background:var(--wash); }
@media (max-width: 639px){ .acctmenu{ top:auto; bottom:64px; left:10px; right:10px; width:auto; } }

/* ── Auth · เข้าสู่ระบบ / ลงทะเบียน (D6/D7) ─────────────────────── */
.authscreen{ position:fixed; inset:0; z-index:70; overflow:auto; padding:32px 16px;
  display:grid; place-items:center;
  background:radial-gradient(1100px 560px at 15% -10%, #C8CDEB 0%, transparent 62%),
             linear-gradient(180deg, #EEEFF8, #F4F5FA); }
.authscreen[hidden]{ display:none; }
.authcard{ width:100%; max-width:420px; background:#fff; border-radius:18px; box-shadow:var(--shadow-card);
  padding:28px 24px; display:flex; flex-direction:column; gap:14px; }
.gbtn{ display:flex; align-items:center; justify-content:center; gap:10px; width:100%; height:44px;
  border:1px solid var(--edge); border-radius:10px; background:#fff; color:var(--ink); font-size:15px; font-weight:500; }
.gbtn:hover{ background:var(--wash); }
.authlink{ color:#465078; text-decoration:underline; text-underline-offset:2px; }
.authdemo{ font-size:13px; color:var(--ink2); background:var(--wash); border-radius:10px; padding:10px 12px; line-height:1.6; }
.authpick{ display:flex; align-items:center; gap:12px; width:100%; text-align:left; padding:10px 12px;
  border-radius:10px; border:1px solid var(--edge2); background:#fff; }
.authpick:hover{ background:var(--wash); }
body[data-auth="out"] #toasts{ z-index:90; }

@media print{ .no-print{ display:none } body{ background:#fff } }
@media (prefers-reduced-motion: reduce){ *{ transition:none !important; animation:none !important } }
</style>
</head>
<body>

<div class="app">

  <!-- ── Command bar ──────────────────────────────────────────────── -->
  <header class="cmdbar no-print">
    <span class="brand">&lt;/&gt;</span>
    <button class="paneToggle w-8 h-8 rounded-md place-items-center text-white/85 hover:bg-white/15"
            data-act="pane-toggle" aria-label="เปิด/ปิดรายการ" title="รายการ">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
           stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <span class="text-[15px] text-white/95 hidden sm:inline">CMAS</span>
    <button class="cmdsearch" id="paletteBtn">
      <span>ค้นหารายวิชา นักศึกษา หรือหน้าจอ</span>
      <span class="ml-auto opacity-70"><kbd style="background:rgba(255,255,255,.18);border-color:transparent;color:#EDEEF6">Ctrl</kbd><kbd style="background:rgba(255,255,255,.18);border-color:transparent;color:#EDEEF6">K</kbd></span>
    </button>
    <div class="cmdright">
      <button data-act="shortcuts" class="w-7 h-7 rounded-md grid place-items-center text-[14px]
              text-white/80 hover:bg-white/15" title="แป้นพิมพ์ลัด (?)">?</button>
      <button id="acctBtn" data-act="acct" class="flex items-center gap-2 rounded-md pl-2 pr-1 py-1 hover:bg-white/12"
              aria-haspopup="menu" aria-expanded="false">
        <span class="text-right hidden md:block">
          <span class="block text-[14px] text-white leading-tight" id="hd-user"></span>
          <span class="block text-[12px] text-white/70 leading-tight" id="hd-role"></span>
        </span>
        <span class="w-7 h-7 rounded-full grid place-items-center text-[12.5px] text-white shrink-0"
              style="background:linear-gradient(135deg,#8A90C0,#3C456A)" id="hd-initials"></span>
      </button>
    </div>
  </header>
  <div id="acctMenu" class="acctmenu no-print" role="menu" hidden></div>

  <!-- ── App rail ─────────────────────────────────────────────────── -->
  <nav class="apprail no-print" id="apprail" aria-label="พื้นที่ใช้งาน"></nav>

  <div class="paneScrim no-print" data-act="pane-close" aria-hidden="true"></div>

  <!-- ── List pane (Teams › Channels) ─────────────────────────────── -->
  <aside class="listpane no-print" aria-label="รายการ">
    <div class="lphead">
      <span class="lptitle" id="lpTitle"></span>
      <button class="lpadd" data-act="add-course" id="lpAdd">
        <svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor"
             stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M10 4v12M4 10h12"/></svg>
        <span>สร้างรายวิชา</span></button>
    </div>
    <div class="lpsearch"><input class="inp !py-1.5 text-[14px]" data-filter="listpane"
           placeholder="กรองรายการ" aria-label="กรองรายการ"></div>
    <div class="lplist" id="lpList"></div>
    <div id="rsz" class="rsz" role="separator" aria-orientation="vertical" aria-label="ปรับความกว้าง"></div>
  </aside>

  <!-- ── Content ──────────────────────────────────────────────────── -->
  <main class="content" id="content">
    <div class="chead no-print">
      <div class="min-w-0">
        <div class="ctitle" id="ctTitle"></div>
        <div class="csub" id="ctSub"></div>
      </div>
      <div class="ctools" id="ctTools"></div>
    </div>
    <div id="ctSteps"></div>
    <nav class="subtabs no-print" id="ctTabs" aria-label="มุมมองย่อย"></nav>
    <div class="cbody" id="stage"></div>
  </main>

/* ══════════════════════════════════════════════════════════════════
   2 · DERIVATION — CR-01…CR-11 from docs/markdown/dev/requirements/srs.md.
   Everything on screen comes from here. Nothing is typed in twice.
   ══════════════════════════════════════════════════════════════════ */
const byId  = function(arr, id){ return arr.find(function(x){ return x.id === id; }); };
const where = function(arr, k, v){ return arr.filter(function(x){ return x[k] === v; }); };

/* CR-07 — full float precision all the way through; round only to display. */
const n2 = function(v){ return (v === null || v === undefined || isNaN(v)) ? '—' : v.toFixed(2); };
const n0 = function(v){ return (v === null || v === undefined || isNaN(v)) ? '—' : Math.round(v).toString(); };
/* K2 — ปุ่ม ⓘ ที่พกคำอธิบายไว้ใน data-tip · เป็น <span role=button> ไม่ใช่ <button>
   เพราะต้องวางซ้อนในปุ่มอื่นได้ (หัวแถบพับ/กาง) ซึ่ง <button> ซ้อน <button> ไม่ถูกต้อง
   tabindex=0 ทำให้ Tab มาถึง · ข้อความยังอ่านได้ด้วย screen reader ผ่าน aria-label */
let TIP_SEQ = 0;
const tip = function(text){
  const plain = String(text).replace(/<[^>]*>/g, '');
  return '<span class="tipbtn no-print" role="button" tabindex="0" data-tip="' + esc(plain) +
    '" aria-label="คำอธิบาย" aria-expanded="false" aria-describedby="tipbox" id="tip' + (++TIP_SEQ) + '">i</span>';
};

const esc = function(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){
  return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]; }); };

/* N1 (2569-09-23) — น้ำหนักตามกลุ่ม (Course.weightMode = 'GROUP')
   ผู้สอนกรอกน้ำหนักต่อกลุ่มประเภทกิจกรรม (Course.groupWeight เช่น ปฏิบัติการ 25%) ครั้งเดียว
   แล้วระบบแบ่งให้กิจกรรมในกลุ่มตามสัดส่วนคะแนนเต็ม — ปฏิบัติการ 10 ครั้งจึงกรอกตัวเลขเดียว ไม่ใช่ 10 ตัว
   น้ำหนัก CLO ไม่ถูกแตะเลย: ผู้สอนกำหนดเองตั้งแต่แรก (รวม 100%) แล้วระบบตรวจกับค่าที่คำนวณจากกิจกรรม (E2)
   ค่าที่ได้ถูกเขียนกลับลง Activity.weight สูตรคะแนนทุกตัวจึงอ่านที่เดิมโดยไม่ต้องรู้ว่าเป็นโหมดไหน
   N5 (2569-09-23, กลับคำ) — เคยบังคับแบ่งเป็นหน่วยละ 5 เพื่อให้ตัวเลขดูสะอาดตอนสาธิตให้อาจารย์ดู
   แต่ของจริงน้ำหนักและคะแนนเป็นทศนิยมได้ (13.33% หรือ 30.33% เป็นค่าที่อาจารย์กรอกได้จริง ไม่ใช่ค่าผิดปกติ)
   บังคับปัดเป็นเลขคูณ 5 จึงเป็นกติกาที่ผิด — กลับไปแบ่งละเอียดถึงทศนิยม 2 ตำแหน่งด้วย largest remainder
   เหมือนเดิม ตัวเลขคูณ 5 ในข้อมูลตัวอย่าง c5 (25/15/60) เป็นแค่ตัวเลือกของผู้ทำ mockup ไม่ใช่กติกาของระบบ */
const splitCents = function(raw, total){
  const cents = Math.round(total * 100);
  const sum = raw.reduce(function(t, v){ return t + v; }, 0);
  if (!(sum > 0) || !(cents > 0)) return raw.map(function(){ return 0; });
  const exact = raw.map(function(v){ return v / sum * cents; });
  const out = exact.map(Math.floor);
  let left = cents - out.reduce(function(t, v){ return t + v; }, 0);
  exact.map(function(v, i){ return { i:i, r:v - out[i] }; })
    .sort(function(a, b){ return b.r - a.r; })
    .forEach(function(x){ if (left > 0) { out[x.i]++; left--; } });
  return out.map(function(c){ return c / 100; });
};
/* กลุ่มประเภทของกิจกรรม เรียงตามกิจกรรมแรกที่พบ ภายในกลุ่มเรียงตาม order เดิม
   ใช้ทั้งการแบ่งน้ำหนัก หัวตารางสองชั้น และแถวหัวกลุ่ม — ลำดับเดียวกันทุกตาราง */
const actTypeGroups = function(acts){
  const out = [], seen = {};
  acts.forEach(function(a){
    const k = a.type || '';
    if (!seen[k]) { seen[k] = { type:k, label:ACT_TYPE_TH[k] || 'ไม่ระบุประเภท', items:[] }; out.push(seen[k]); }
    seen[k].items.push(a);
  });
  return out;
};
function syncGroupWeights(course){
  if (!course || course.weightMode !== 'GROUP') return;
  const gw = course.groupWeight || {};
  const acts = where(db.activity, 'courseId', course.id).sort(function(a, b){ return a.order - b.order; });
  actTypeGroups(acts).forEach(function(g){
    splitCents(g.items.map(function(a){ return a.maxScore || 0; }), gw[g.type] || 0)
      .forEach(function(w, i){ g.items[i].weight = w; });
  });
}

const CACHE = {};
const invalidate = function(){ Object.keys(CACHE).forEach(function(k){ delete CACHE[k]; }); };

function derive(courseId){
  if (CACHE[courseId]) return CACHE[courseId];

  const course = byId(db.course, courseId);
  syncGroupWeights(course);
  const clos   = where(db.clo, 'courseId', courseId).sort(function(a,b){ return a.number - b.number; });
  const acts   = where(db.activity, 'courseId', courseId).sort(function(a,b){ return a.order - b.order; });
  const roster = where(db.student, 'courseId', courseId);
  const bands  = where(db.gradeBand, 'courseId', courseId).sort(function(a,b){ return b.minValue - a.minValue; });
  const staff  = where(db.courseInstructor, 'courseId', courseId);
  const logs   = where(db.scoreUploadLog, 'courseId', courseId);

  /* T11 — ลำดับชั้น CLO → จุดประสงค์ → กิจกรรม · กิจกรรมผูกกับจุดประสงค์ และ CLO ได้มาจากจุดประสงค์นั้น */
  const cloIds = clos.map(function(c){ return c.id; });
  const cloNo  = {}; clos.forEach(function(c){ cloNo[c.id] = c.number; });
  const objs = db.behavioralObjective.filter(function(o){ return cloIds.indexOf(o.cloId) >= 0; })
    .sort(function(a, b){ return (cloNo[a.cloId] - cloNo[b.cloId]) || (a.number - b.number); });
  const objById = {}; objs.forEach(function(o){ objById[o.id] = o; });
  const objsOf = function(cloId){ return objs.filter(function(o){ return o.cloId === cloId; }); };
  const objLabel = function(o){ return cloNo[o.cloId] + '.' + o.number; };

  const actIds = acts.map(function(a){ return a.id; });
  const crit   = db.assessmentCriteria.filter(function(c){
    return actIds.indexOf(c.activityId) >= 0 && !!objById[c.objectiveId]; });
  const critOfObj = function(aid, oid){
    return crit.find(function(c){ return c.activityId === aid && c.objectiveId === oid; }); };
  /* มุมมองระดับ CLO ของการผูก — % ของกิจกรรมที่วัด CLO นี้ = ผลรวมของจุดประสงค์ใต้ CLO นั้น (คำนวณ ไม่เก็บ) */
  const critOf = function(aid, cloId){
    const rs = crit.filter(function(c){ return c.activityId === aid && objById[c.objectiveId].cloId === cloId; });
    return rs.length ? { weight: rs.reduce(function(t, c){ return t + c.weight; }, 0) } : null; };

  const scoreIdx = {};
  db.score.forEach(function(sc){ scoreIdx[sc.studentId + '|' + sc.activityId] = sc; });
  const scoreOf = function(sid, aid){
    const r = scoreIdx[sid + '|' + aid]; return r ? r.score : null; };   // null = no row

  /* CR-01 invariants */
  const actWeightSum = Math.round(acts.reduce(function(t,a){ return t + a.weight; }, 0) * 100) / 100;
  const rowSum = function(aid){
    const t = crit.filter(function(c){ return c.activityId === aid; })
                  .reduce(function(t,c){ return t + c.weight; }, 0);
    return Math.round(t * 100) / 100; };
  const badRows = acts.filter(function(a){ return rowSum(a.id) !== 100; });
  const unlinkedActs = acts.filter(function(a){ return rowSum(a.id) === 0; });
  const unmeasured = clos.filter(function(c){
    return !crit.some(function(x){ return objById[x.objectiveId].cloId === c.id; }); });
  const unmeasuredObjs = objs.filter(function(o){
    return !crit.some(function(x){ return x.objectiveId === o.id; }); });

  /* T6 — น้ำหนักจุดประสงค์รวม 100 ต่อ CLO */
  const objWeightSum = function(cloId){
    return objsOf(cloId).reduce(function(t, o){ return t + (o.weight || 0); }, 0); };
  const noObjClos  = clos.filter(function(c){ return objsOf(c.id).length === 0; });
  const badObjClos = clos.filter(function(c){
    return objsOf(c.id).length > 0 && Math.abs(objWeightSum(c.id) - 100) > 0.01; });

  /* T1 / E2 — CLO.weight กรอกเอง · cloWeight คือค่าที่คำนวณจากกิจกรรม ใช้ตรวจความสอดคล้องเท่านั้น */
  const cloWeightSum = clos.reduce(function(t, c){ return t + (c.weight || 0); }, 0);
  const cloWeight = function(cloId){
    return acts.reduce(function(t, a){
      const c = critOf(a.id, cloId);
      return t + (c ? a.weight * c.weight / 100 : 0); }, 0); };
  const weightGap = clos.filter(function(c){ return Math.abs((c.weight || 0) - cloWeight(c.id)) >= 0.5; });

  /* CR-03 ย้ายลงระดับจุดประสงค์ — ถ่วงด้วย Activity.weight × % ที่กิจกรรมวัดจุดประสงค์นี้
     ตัวหารนับเฉพาะกิจกรรมที่มีแถวคะแนน · ไม่มีเลยได้ null ไม่ใช่ 0 (CR-03.1) */
  const objScore = function(sid, oid){
    let num = 0, den = 0, missing = 0, linked = 0;
    acts.forEach(function(a){
      const c = critOfObj(a.id, oid);
      if (!c) return;
      linked++;
      const w = a.weight * c.weight;
      const sc = scoreOf(sid, a.id);
      if (sc === null) { missing++; return; }
      num += (sc / a.maxScore) * w;
      den += w;
    });
    return { pct: den === 0 ? null : (num / den) * 100,
             missing: missing, linked: linked, complete: linked > 0 && missing === 0 };
  };

  /* E1 — คะแนน CLO = Σ (น้ำหนักจุดประสงค์ × คะแนนจุดประสงค์) ÷ น้ำหนักของจุดประสงค์ที่มีคะแนนแล้ว */
  const cloScore = function(sid, cloId){
    const os = objsOf(cloId);
    let num = 0, den = 0;
    const obj = {};
    os.forEach(function(o){
      const v = objScore(sid, o.id);
      obj[o.id] = v;
      if (v.pct === null) return;
      num += v.pct * (o.weight || 0);
      den += (o.weight || 0);
    });
    const linkedActs = acts.filter(function(a){ return !!critOf(a.id, cloId); });
    const missing = linkedActs.filter(function(a){ return scoreOf(sid, a.id) === null; }).length;
    return { pct: den === 0 ? null : num / den, obj: obj,
             missing: missing, linked: linkedActs.length,
             complete: os.length > 0 && os.every(function(o){ return obj[o.id].complete; }) };
  };
  /* M5 · คะแนนดิบราย CLO (2569-09-21)
     % ของ CLO ถูกทำให้เป็นสัดส่วนแล้วสองชั้น (ต่อจุดประสงค์ แล้วต่อ CLO) จึงตอบคำถาม
     “ผ่านไหม” ได้ดี แต่ตอบ “ได้กี่คะแนนจากเต็มเท่าไร” ไม่ได้เลย — ซึ่งเป็นตัวเลขที่
     ผู้สอนใช้คุยกับนักศึกษาและกรรมการหลักสูตรจริง

     นิยามตรงไปตรงมา: กิจกรรมหนึ่งวัด CLO นี้อยู่ p% ของตัวมันเอง คะแนนดิบที่เข้า CLO
     นี้จึงเท่ากับ (คะแนนที่ได้ × p ÷ 100) และคะแนนเต็มคือ (คะแนนเต็มกิจกรรม × p ÷ 100)
     ผลรวมของทุกกิจกรรมที่วัด CLO นั้นคือคะแนนดิบของ CLO

     maxScored นับเฉพาะกิจกรรมที่มีคะแนนแล้ว · maxAll นับทุกกิจกรรมที่ผูกไว้
     สองตัวนี้ต่างกันเมื่อคะแนนยังไม่ครบ และการเอาไปปนกันคือการรายงานว่าคนที่ยังไม่สอบ
     ได้ศูนย์ ซึ่งเป็นคนละเรื่องกับสอบแล้วได้ศูนย์ (FR-62) */
  const cloRawMax = function(cloId){
    return acts.reduce(function(t, a){
      const c = critOf(a.id, cloId);
      return t + (c ? a.maxScore * c.weight / 100 : 0); }, 0); };
  const cloRaw = function(sid, cloId){
    let earned = 0, maxScored = 0, maxAll = 0, missing = 0, linked = 0;
    acts.forEach(function(a){
      const c = critOf(a.id, cloId);
      if (!c) return;
      linked++;
      const share = c.weight / 100;
      maxAll += a.maxScore * share;
      const sc = scoreOf(sid, a.id);
      if (sc === null) { missing++; return; }
      earned    += sc * share;
      maxScored += a.maxScore * share;
    });
    return { earned:earned, maxScored:maxScored, maxAll:maxAll,
             missing:missing, linked:linked, complete: linked > 0 && missing === 0 };
  };

  const passMark = course.cloPassMark;

  /* CR-05 — course total, normalised over the weight actually assessed so an
     incomplete student is not mistaken for a failing one. */
  const total = function(sid){
    let earned = 0, covered = 0, missing = 0;
    acts.forEach(function(a){
      const sc = scoreOf(sid, a.id);
      if (sc === null) { missing++; return; }
      earned  += (sc / a.maxScore) * a.weight;
      covered += a.weight;
    });
    return { earned: earned, covered: covered, missing: missing,
             pct: covered === 0 ? null : (earned / covered) * 100,
             complete: acts.length > 0 && missing === 0 };
  };

  const rows = roster.map(function(s){
    const t = total(s.id);
    const per = {}; clos.forEach(function(c){ per[c.id] = cloScore(s.id, c.id); });
    const raw = {}; clos.forEach(function(c){ raw[c.id] = cloRaw(s.id, c.id); });
    const scored  = clos.filter(function(c){ return per[c.id].pct !== null; });
    const passed  = scored.filter(function(c){ return per[c.id].pct >= passMark; });
    const failing = scored.filter(function(c){ return per[c.id].pct <  passMark; });
    return {
      student:s, total:t, clo:per, cloRaw:raw,
      passedClos: passed.length, scoredClos: scored.length,
      atRisk: failing.length > 0,                    // CR-05
      failingClos: failing,
      passCourse: t.complete ? t.pct >= course.passCriteria : null,
      alsoEnrolled: db.student.filter(function(x){
        return x.studentCode === s.studentCode && x.courseId !== courseId; })
    };
  });

  /* CR-04 — attainment, with CR-03.1's mandatory third state carried through:
     ผ่าน + at-risk + ยังประเมินไม่ครบ must always equal the roster size. */
  const target = function(c){ return c.classTarget === null ? course.classTarget : c.classTarget; };
  const attain = clos.map(function(c){
    const scored = rows.filter(function(r){ return r.clo[c.id].pct !== null; });
    const pass   = scored.filter(function(r){ return r.clo[c.id].pct >= passMark; });
    const risk   = scored.length - pass.length;
    const pend   = rows.length - scored.length;
    const share  = scored.length ? (pass.length / scored.length) * 100 : null;
    const tg     = target(c);
    return { clo:c, n:scored.length, pass:pass.length, risk:risk, pending:pend,
             share:share, target:tg, met: share !== null && share >= tg,
             avg: scored.length ? scored.reduce(function(t,r){ return t + r.clo[c.id].pct; },0) / scored.length : null,
             weight: c.weight || 0, derivedWeight: cloWeight(c.id),
             objectives: objsOf(c.id),
             measuredBy: acts.filter(function(a){ return !!critOf(a.id, c.id); }),
             checksum: pass.length + risk + pend === rows.length };
  });

  /* CR-09 / CR-10 — grading. The three axes stay apart: group statistics may
     touch this block and nothing above it (CR-08). */
  const complete = rows.filter(function(r){ return r.total.complete; });
  const gradeFor = function(v){
    const b = bands.find(function(x){ return v >= x.minValue; });
    return b ? b.grade : (bands.length ? bands[bands.length-1].grade : '—'); };

  let stats = null, reject = null;
  if (course.gradeMethod === 'NORM_REFERENCED') {
    if (course.gradeScale === 'PASS_FAIL') reject = 'รายวิชาแบบ ผ่าน/ไม่ผ่าน ตัดเกรดอิงกลุ่มไม่ได้';
    else if (complete.length < 2)          reject = 'มีนักศึกษาที่คะแนนครบเพียง ' + complete.length + ' คน — คำนวณ SD ไม่ได้ (n < 2)';
    else {
      const xs = complete.map(function(r){ return r.total.pct; });
      const mean = xs.reduce(function(a,b){ return a+b; },0) / xs.length;
      const sd = Math.sqrt(xs.reduce(function(a,x){ return a + (x-mean)*(x-mean); },0) / xs.length);
      if (sd === 0) reject = 'ส่วนเบี่ยงเบนมาตรฐานเป็น 0 — ทุกคนคะแนนเท่ากัน ให้ใช้อิงเกณฑ์แทน';
      else stats = { n:xs.length, mean:mean, sd:sd, small: xs.length < 15 };
    }
  }
  const tScore = function(pct){ return stats ? 50 + 10 * (pct - stats.mean) / stats.sd : null; };

  const grades = rows.map(function(r){
    if (!r.total.complete) return { row:r, value:null, grade:null, t:null };
    if (course.gradeScale === 'PASS_FAIL')
      return { row:r, value:r.total.pct, t:null, grade: r.total.pct >= course.passCriteria ? 'S' : 'U' };
    if (course.gradeMethod === 'NORM_REFERENCED') {
      if (!stats) return { row:r, value:r.total.pct, t:null, grade:null };
      const t = tScore(r.total.pct);
      return { row:r, value:r.total.pct, t:t, grade: gradeFor(t) };
    }
    return { row:r, value:r.total.pct, t:null, grade: gradeFor(r.total.pct) };
  });
  grades.forEach(function(g){
    const o = db.override[g.row.student.id];
    if (o && g.grade) { g.derived = g.grade; g.grade = o.to; g.overrideReason = o.why; }
  });

  /* Readiness — user-flow §5.1, ลำดับตาม T11: CLO → จุดประสงค์ → กิจกรรม → เชื่อมโยง → นักศึกษาและคะแนน
     สี่สถานะ · มีแค่ ✕ ที่ล็อกผลการประเมิน */
  const scoredCells = roster.length * acts.length;
  const filledCells = roster.reduce(function(t,s){
    return t + acts.filter(function(a){ return scoreOf(s.id, a.id) !== null; }).length; }, 0);
  const r2 = function(v){ return String(Math.round(v * 100) / 100); };
  const cloSumOk = Math.abs(cloWeightSum - 100) < 0.01;

  const readiness = [
    { key:'staff', label:'ผู้สอน', route:'courses', act:'course-edit',
      state: staff.length === 0 ? 'block' : 'ok',
      detail: staff.length === 0 ? 'ยังไม่มีผู้สอน — มอบหมายอย่างน้อย 1 คน'
            : 'ผู้สอน ' + staff.length + ' คน' },

    { key:'clo', label:'CLO และน้ำหนัก', route:'clos',
      state: clos.length === 0 ? 'block' : (cloSumOk ? 'ok' : 'warn'),
      detail: clos.length === 0 ? 'ยังไม่มี CLO — ระบบคำนวณผลไม่ได้'
            : clos.length + ' ข้อ · น้ำหนักรวม ' + r2(cloWeightSum) + '%' + (cloSumOk ? '' : ' (ควรเท่ากับ 100%)') },

    { key:'obj', label:'จุดประสงค์', route:'objectives',
      state: objs.length === 0 ? 'block' : badObjClos.length ? 'block' : noObjClos.length ? 'warn' : 'ok',
      detail: clos.length === 0 ? 'รอ CLO ก่อน'
            : objs.length === 0 ? 'ยังไม่มีจุดประสงค์ — แตก CLO แต่ละข้อเป็นจุดประสงค์ที่วัดได้'
            : badObjClos.length ? 'น้ำหนักจุดประสงค์ยังไม่ครบ 100% — ' + badObjClos.map(function(c){
                return 'CLO ' + c.number + ' รวม ' + r2(objWeightSum(c.id)) + '%'; }).join(' · ')
            : noObjClos.length ? 'CLO ' + noObjClos.map(function(c){ return c.number; }).join(', ') +
                ' ยังไม่มีจุดประสงค์ — ข้ออื่นคำนวณได้ตามปกติ'
            : objs.length + ' ข้อ · น้ำหนักครบ 100% ทุก CLO' },

    { key:'act', label:'กิจกรรมและวิธีประเมิน', route:'activities', view:'list',
      state: acts.length === 0 ? 'block' : (actWeightSum === 100 ? 'ok' : 'warn'),
      detail: acts.length === 0 ? 'ยังไม่มีกิจกรรม'
            : acts.length + ' กิจกรรม · น้ำหนักรวม ' + actWeightSum + '%' +
              (actWeightSum === 100 ? '' : ' (ต้องเท่ากับ 100%)') },

    { key:'crit', label:'เชื่อมกิจกรรมกับ CLO', route:'activities', view:'matrix',
      state: (acts.length === 0 || objs.length === 0) ? 'block'
           : (badRows.length || unmeasuredObjs.length) ? 'block'
           : weightGap.length ? 'warn' : 'ok',
      detail: acts.length === 0 ? 'รอสร้างกิจกรรมก่อน'
            : objs.length === 0 ? 'รอกำหนดจุดประสงค์ก่อน'
            : unlinkedActs.length ? unlinkedActs.map(function(a){ return a.name; }).join(' · ') +
                ' ยังไม่ได้ผูก CLO — ทุกกิจกรรมต้องวัดอย่างน้อย 1 ข้อ'
            : badRows.length ? 'สัดส่วนยังไม่ครบ 100% — ' +
                badRows.map(function(a){ return a.name + ' รวมได้ ' + rowSum(a.id) + '%'; }).join(' · ')
            : unmeasuredObjs.length ? 'จุดประสงค์ ' + unmeasuredObjs.map(objLabel).join(', ') + ' ยังไม่มีกิจกรรมวัด'
            : weightGap.length ? 'น้ำหนัก CLO ที่กรอกไม่ตรงกับที่คำนวณจากกิจกรรม — ' +
                weightGap.map(function(c){ return 'CLO ' + c.number + ' กรอก ' + r2(c.weight || 0) +
                  '% · คำนวณได้ ' + r2(cloWeight(c.id)) + '%'; }).join(' · ')
            : 'ทุกกิจกรรมผูก CLO ครบ และน้ำหนัก CLO ตรงกัน' },

    /* T5 — รายชื่อกับคะแนนอยู่หน้าเดียวกัน จึงเป็นขั้นเดียว */
    { key:'roster', label:'นักศึกษาและคะแนน', route:'roster',
      state: roster.length === 0 || acts.length === 0 ? 'block' : (filledCells === scoredCells ? 'ok' : 'doing'),
      detail: roster.length === 0 ? 'ยังไม่มีรายชื่อ — เพิ่มทีละคนหรือนำเข้าจาก Excel'
            : acts.length === 0 ? roster.length + ' คน · รอสร้างกิจกรรมก่อนกรอกคะแนน'
            : roster.length + ' คน · กรอกคะแนนแล้ว ' + filledCells + ' / ' + scoredCells + ' ช่อง' }
  ];
  const blockers = readiness.filter(function(r){ return r.state === 'block'; });

  const out = {
    course:course, clos:clos, acts:acts, roster:roster, bands:bands, staff:staff, logs:logs,
    crit:crit, critOf:critOf, scoreOf:scoreOf, rowSum:rowSum, badRows:badRows, unmeasured:unmeasured,
    actWeightSum:actWeightSum, cloWeight:cloWeight, cloScore:cloScore, total:total,
    objs:objs, objsOf:objsOf, objLabel:objLabel, objScore:objScore, critOfObj:critOfObj,
    cloRaw:cloRaw, cloRawMax:cloRawMax,
    objWeightSum:objWeightSum, badObjClos:badObjClos, noObjClos:noObjClos, unmeasuredObjs:unmeasuredObjs,
    unlinkedActs:unlinkedActs, cloWeightSum:cloWeightSum, weightGap:weightGap, passMark:passMark,
    rows:rows, attain:attain, target:target, complete:complete,
    grades:grades, bandsFor:gradeFor, stats:stats, reject:reject, tScore:tScore,
    readiness:readiness, blockers:blockers, locked:blockers.length > 0,
    warns: readiness.filter(function(r){ return r.state === 'warn'; }),
    noScores: filledCells === 0,
    filledCells:filledCells, scoredCells:scoredCells
  };
  CACHE[courseId] = out;
  return out;
}

};

/* Principle 6 — layout state outlives the session. localStorage throws in a
   data: URL host, so every access is guarded and the app runs without it. */
const LS_KEY = 'cmas:layout';
function loadLayout(){
  /* A phone shows about a third of the rows a desktop does, so the default
     density is chosen from the viewport. A stored choice always wins. */
  if (window.matchMedia('(max-width: 767px)').matches) S.density = 'compact';
  if (!S.meId) S.meId = defaultMe().id;
  try {
    const raw = localStorage.getItem(LS_KEY); if (!raw) return;
    const v = JSON.parse(raw);
    if (DENSITY.indexOf(v.density) >= 0) S.density = v.density;
    if (LONGTEXT.indexOf(v.longtext) >= 0) S.longtext = v.longtext;
    if (v.listw >= 220 && v.listw <= 460) S.listw = v.listw;
    if (v.course && db.course.some(function(c){ return c.id === v.course; })) S.course = v.course;
    if (v.route) S.route = v.route;
    if (v.role === 'ADMIN' || v.role === 'INSTRUCTOR') S.role = v.role;
    if (v.meId && db.user.some(function(u){ return u.id === v.meId; })) S.meId = v.meId;
  } catch (e) {}
}
function saveLayout(){
  try {
    localStorage.setItem(LS_KEY, JSON.stringify(
      { density:S.density, longtext:S.longtext, listw:S.listw, course:S.course, route:S.route,
        role:S.role, meId:S.meId }));
  } catch (e) {}
}

  document.documentElement.dataset.density = S.density;

const DENSITY_SUB = { compact:'แถวถี่ เห็นข้อมูลได้มากที่สุดในหน้าจอเดียว',
