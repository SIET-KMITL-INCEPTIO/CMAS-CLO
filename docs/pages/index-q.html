class AuthScreen {
  constructor(accounts, session){
    this.accounts = accounts; this.session = session;
    this.view = 'login'; this.err = ''; this.email = '';
    this.pendingId = null; this.resendAt = 0; this.gEmail = ''; this.timer = null;
  }
  static value(id){ const el = document.getElementById(id); return el ? el.value.trim() : ''; }
  static raw(id){ return (document.getElementById(id) || {}).value || ''; }

  show(view){ this.view = view; this.err = ''; this.paint(); }
  errHtml(){
    return this.err ? '<div class="text-[14px] px-3 py-2 rounded-lg" style="background:#F4E8E8;color:#A2504F" role="alert">' +
      esc(this.err) + '</div>' : '';
  }
  /* Errors update in place so a mistake does not wipe what was already typed. */
  fail(msg){
    this.err = msg;
    const slot = document.getElementById('au-err');
    if (slot) slot.innerHTML = this.errHtml(); else this.paint();
  }
  paint(){
    const host = document.getElementById('auth');
    if (!host) return;
    const sid = this.session.get();
    const su = sid ? byId(db.user, sid) : null;
    const out = !su || su.isActive === false;
    document.body.dataset.auth = out ? 'out' : 'in';
    host.hidden = !out;
    if (!out) { host.innerHTML = ''; return; }
    host.innerHTML = '<div class="authcard">' + this.html() + '</div>';
    clearTimeout(this.timer);
    const self = this;
    if (this.view === 'sent' && Date.now() < this.resendAt)
      this.timer = setTimeout(function(){ if (self.view === 'sent') self.paint(); }, this.resendAt - Date.now() + 50);
  }

  html(){
    const emails = this.accounts.emails;
    const head = function(t, sub){
      return '<div><div class="text-[13px] text-dim tracking-wide mb-3">&lt;/&gt; CMAS</div>' +
        '<h1 class="text-[24px] font-light leading-tight">' + t + '</h1>' +
        (sub ? '<p class="text-[14px] text-dim mt-1.5 leading-relaxed">' + sub + '</p>' : '') + '</div>';
    };
    const field = function(id, label, type, val, attrs){
      return '<div><label class="text-[14px] text-ink2 block mb-1.5" for="' + id + '">' + label + '</label>' +
        '<input class="inp" id="' + id + '" type="' + type + '" value="' + esc(val || '') + '"' + (attrs || '') + '></div>';
    };
    const primary = function(label, act){
      return '<button class="btn btn-primary w-full justify-center !py-2.5" data-act="' + act + '" data-auth-submit>' + label + '</button>';
    };
    const link = function(label, view){
      return '<button class="authlink" data-act="auth-go" data-view="' + view + '">' + label + '</button>';
    };
    const err = '<div id="au-err">' + this.errHtml() + '</div>';
    const google = '<button class="gbtn" data-act="auth-google">' + GLOGO + '<span>ดำเนินการต่อด้วย Google</span></button>';
    const or = '<div class="flex items-center gap-3 text-[13px] text-faint"><span class="flex-1 h-px bg-edge"></span>' +
      'หรือใช้อีเมลของคณะ<span class="flex-1 h-px bg-edge"></span></div>';

    if (this.view === 'register') return head('ลงทะเบียนผู้สอน',
        'ใช้อีเมลของคณะ (@' + emails.domain + ') · บัญชีใหม่มีบทบาทผู้สอน สร้างรายวิชาเองได้ หรือรอผู้ดูแลระบบมอบหมาย') +
      google + or + err +
      field('au-name', 'ชื่อ-สกุล', 'text', '', ' autocomplete="name"') +
      field('au-email', 'อีเมล', 'email', this.email, ' autocomplete="email" placeholder="' + emails.placeholder() + '"') +
      '<div>' + field('au-pw', 'รหัสผ่าน', 'password', '', ' autocomplete="new-password"') +
        '<div id="au-meter">' + this.accounts.passwords.meterHtml('', this.email) + '</div></div>' +
      field('au-pw2', 'ยืนยันรหัสผ่าน', 'password', '', ' autocomplete="new-password"') +
      primary('ลงทะเบียน', 'auth-register') +
      '<div class="text-center text-[14px] text-dim">มีบัญชีแล้ว? ' + link('เข้าสู่ระบบ', 'login') + '</div>';

    if (this.view === 'sent') {
      const wait = Math.max(0, Math.ceil((this.resendAt - Date.now()) / 1000));
      return head('ตรวจสอบอีเมลของคุณ',
          'ถ้า <b>' + esc(this.email) + '</b> ลงทะเบียนได้ ระบบส่งลิงก์ยืนยันไปแล้ว · ลิงก์ใช้ได้ครั้งเดียวและหมดอายุใน 24 ชั่วโมง') +
        err +
        '<button class="btn w-full justify-center" data-act="auth-resend"' + (wait ? ' disabled' : '') + '>' +
          (wait ? 'ส่งลิงก์อีกครั้งได้ในอีก ' + wait + ' วินาที' : 'ส่งลิงก์อีกครั้ง') + '</button>' +
        (this.pendingId ? '<div class="authdemo"><div class="over mb-1">ต้นแบบ · จำลองกล่องจดหมาย</div>' +
          'จาก CMAS — “ยืนยันอีเมลเพื่อเริ่มใช้งาน” <button class="authlink" data-act="auth-verify">เปิดลิงก์ยืนยัน</button></div>' : '') +
        '<div class="text-center text-[14px] text-dim">' + link('กลับไปหน้าเข้าสู่ระบบ', 'login') + '</div>';
    }

    if (this.view === 'verified') return head('ยืนยันอีเมลแล้ว',
        'บัญชี <b>' + esc(this.email) + '</b> พร้อมใช้งาน — เข้าสู่ระบบด้วยรหัสผ่านที่ตั้งไว้') +
      '<button class="btn btn-primary w-full justify-center !py-2.5" data-act="auth-go" data-view="login" data-auth-submit>ไปหน้าเข้าสู่ระบบ</button>';

    if (this.view === 'google') {
      const picks = db.user.slice(0, 4).map(function(u){ return [u.email, u.name]; })
        .concat([['somchai.home@gmail.com', 'บัญชีส่วนตัว (ตัวอย่างนอกโดเมน)']]);
      return '<div class="flex items-center gap-2 text-[14px] text-ink2">' + GLOGO + 'ลงชื่อเข้าใช้ด้วย Google</div>' +
        '<div><h1 class="text-[24px] font-light leading-tight">เลือกบัญชี</h1>' +
          '<p class="text-[14px] text-dim mt-1.5">เพื่อไปยัง CMAS · ใช้ได้เฉพาะบัญชีของคณะ (@' + emails.domain + ')</p></div>' +
        err +
        '<div class="space-y-2">' + picks.map(function(p){
          const initial = p[1].replace(/^[^\s]*\s/, '').slice(0, 1) || p[1].slice(0, 1);
          return '<button class="authpick" data-act="auth-pick" data-email="' + esc(p[0]) + '">' +
            '<span class="w-8 h-8 rounded-full grid place-items-center text-[13px] text-white shrink-0" ' +
              'style="background:linear-gradient(135deg,#8A90C0,#3C456A)">' + esc(initial) + '</span>' +
            '<span class="min-w-0"><span class="block text-[14px] truncate">' + esc(p[1]) + '</span>' +
            '<span class="block text-[13px] text-dim truncate">' + esc(p[0]) + '</span></span></button>';
        }).join('') + '</div>' +
        '<div class="flex gap-2"><input class="inp" id="au-gmail" type="email" placeholder="ใช้บัญชีอื่น" autocomplete="email" aria-label="อีเมลบัญชี Google อื่น">' +
          '<button class="btn shrink-0" data-act="auth-google-other" data-auth-submit>ต่อไป</button></div>' +
        '<div class="authdemo">ต้นแบบ — หน้านี้แทนหน้าต่างของ Google · ระบบจริงเปิด Google Sign-In แล้วตรวจ ID token ที่เซิร์ฟเวอร์</div>' +
        '<div class="text-center text-[14px] text-dim">' + link('ยกเลิก', 'login') + '</div>';
    }

    if (this.view === 'google-new') return head('สร้างบัญชีผู้สอนจาก Google',
        'ยังไม่มีบัญชี CMAS สำหรับอีเมลนี้ · Google ยืนยันอีเมลให้แล้ว จึงไม่ต้องตั้งรหัสผ่านและไม่ต้องรอลิงก์ยืนยัน') +
      err +
      '<div class="authdemo flex items-center gap-2 flex-wrap">' + GLOGO + '<span class="tnum">' + esc(this.gEmail) + '</span>' +
        chip('ยืนยันแล้ว','ok') + '</div>' +
      field('au-name', 'ชื่อ-สกุล', 'text', '', ' autocomplete="name"') +
      primary('สร้างบัญชีและเข้าสู่ระบบ', 'auth-google-create') +
      '<div class="text-center text-[14px] text-dim">' + link('ยกเลิก', 'login') + '</div>';

    return head('เข้าสู่ระบบ', 'ระบบประเมินผลลัพธ์การเรียนรู้ระดับรายวิชา') +
      google + or + err +
      field('au-email', 'อีเมล', 'email', this.email, ' autocomplete="username" placeholder="' + emails.placeholder() + '"') +
      '<div><div class="flex items-baseline justify-between mb-1.5">' +
          '<label class="text-[14px] text-ink2" for="au-pw">รหัสผ่าน</label>' +
          '<button class="authlink text-[13px]" data-act="auth-forgot">ลืมรหัสผ่าน?</button></div>' +
        '<input class="inp" id="au-pw" type="password" autocomplete="current-password"></div>' +
      primary('เข้าสู่ระบบ', 'auth-login') +
      '<div class="text-center text-[14px] text-dim">ยังไม่มีบัญชี? ' + link('ลงทะเบียน', 'register') + '</div>' +
      '<div class="authdemo"><div class="over mb-1">ต้นแบบ · บัญชีตัวอย่าง</div>' +
        'somchai@' + emails.domain + ' (ผู้สอน) · admin@' + emails.domain + ' (ผู้ดูแลระบบ)<br>' +
        'รหัสผ่านตัวอย่าง <span class="tnum">' + this.accounts.demoPw + '</span></div>';
  }

  /* ── ตัวจัดการปุ่ม ── */
  submitLogin(){
    this.email = AuthScreen.value('au-email').toLowerCase();
    const r = this.accounts.login(this.email, AuthScreen.raw('au-pw'));
    if (r.error) return this.fail(r.error);
    if (r.unverified) {
      this.pendingId = r.user.id; this.view = 'sent';
      this.err = 'ยืนยันอีเมลก่อนเข้าสู่ระบบ — เปิดลิงก์ในอีเมล หรือขอลิงก์ใหม่';
      return this.paint();
    }
    this.enter(r.user, 'LOGIN');
  }
  submitRegister(){
    this.email = AuthScreen.value('au-email').toLowerCase();
    const r = this.accounts.register(AuthScreen.value('au-name'), this.email,
                                     AuthScreen.raw('au-pw'), AuthScreen.raw('au-pw2'));
    if (r.error) return this.fail(r.error);
    this.pendingId = r.pendingId;
    this.view = 'sent'; this.err = ''; this.resendAt = Date.now() + 60000;
    this.paint();
  }
  submitVerify(){
    const r = this.accounts.verify(this.pendingId);
    if (r.error) { this.view = 'login'; this.err = r.error; return this.paint(); }
    this.email = r.user.email; this.view = 'verified'; this.err = '';
    this.paint();
  }
  resend(){
    if (Date.now() < this.resendAt) return false;
    this.resendAt = Date.now() + 60000; this.paint();
    return true;
  }
  continueWithGoogle(email){
    const r = this.accounts.google(email);
    if (r.error) return this.fail(r.error);
    if (r.isNew) { this.gEmail = r.email; return this.show('google-new'); }
    this.enter(r.user, 'LOGIN_GOOGLE');
  }
  createFromGoogle(){
    const r = this.accounts.createFromGoogle(this.gEmail, AuthScreen.value('au-name'));
    if (r.error) return this.fail(r.error);
    this.enter(r.user, 'LOGIN_GOOGLE');
  }
  updateMeter(){
    const m = document.getElementById('au-meter');
    if (m) m.innerHTML = this.accounts.passwords.meterHtml(AuthScreen.raw('au-pw'), AuthScreen.value('au-email'));
  }

  /* ── เข้า/ออก — จุดเดียวที่หน้าจอ auth แตะ state ของแอป (S) ── */
  enter(u, how){
    this.accounts.log(u.id, how, how === 'LOGIN_GOOGLE' ? 'เข้าสู่ระบบด้วย Google' : 'เข้าสู่ระบบด้วยอีเมลและรหัสผ่าน');
    S.role = u.role === 'ADMIN' ? 'ADMIN' : 'INSTRUCTOR'; S.meId = u.id; S.filter = {};
    this.session.set(u.id);
    this.view = 'login'; this.err = ''; this.email = ''; this.accounts.fails = [];
    clampMe(); clampCourse(); saveLayout(); invalidate();
    this.paint();
    /* The screen left behind by the previous account may be admin-only. */
    const here = byId(ROUTES, S.route);
    if (here && here.admin && S.role !== 'ADMIN') go('courses');
    else if (!S.course && isCourseRoute(S.route)) go('courses');
    else render();
    toast('เข้าสู่ระบบแล้ว · ' + u.name);
  }
  leave(){
    const u = me();
    if (u) this.accounts.log(u.id, 'LOGOUT', 'ออกจากระบบ');
    acctMenu(false); closeOverlays();
    this.session.set(null);
    this.view = 'login'; this.err = ''; this.email = '';
    this.paint();
  }
}

document.addEventListener('click', function(e){
  const nav = e.target.closest && e.target.closest('a.nav, a.tab');
  if (nav) { e.preventDefault(); go(nav.getAttribute('href').slice(1)); return; }
  /* Deep links follow their href; the hashchange handler does the navigating.
     Returning here keeps the row's pick-course from firing underneath. */
  if (e.target.closest && e.target.closest('a.deeplink')) { closeOverlays(); return; }

  const th = e.target.closest && e.target.closest('th.sortable');
  if (th) {
    const key = th.dataset.sort, col = th.dataset.col;
    const cur = S.sort[key];
    S.sort[key] = { col:col, dir: (cur && cur.col === col && cur.dir === 'asc') ? 'desc' : 'asc',
                    get: SORTERS[key][col] };
    render(); return;
  }

  if (!(e.target.closest && e.target.closest('#pop, [data-act="help"]'))) hideHelp();
  if (!(e.target.closest && e.target.closest('#acctMenu, #acctBtn'))) acctMenu(false);
  if (!(e.target.closest && e.target.closest('#lyPop, #lyBtn'))) layoutPop(false);

  /* Unfolding a cut-off cell is not an action — it reveals what is already on
     screen. It runs before the data-act lookup but yields to any control
     inside the cell, so a button in a description column still works. */
  const clipped = e.target.closest && e.target.closest('.clip.more');
  if (clipped && !e.target.closest('[data-act]')) { clipped.classList.toggle('open'); return; }

  /* A click that starts in an input, select or textarea belongs to that
     control, never to a row or card wrapped around it. Without this, editing a
     score inside a rowlink navigates away mid-keystroke. */
  const field = e.target.closest && e.target.closest('input, select, textarea, label');
  if (field && !field.dataset.act) return;

  const el = e.target.closest && e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;

  /* SEC-1 · ประตูเดียว ทุก action ที่เปลี่ยนข้อมูลผ่านตรงนี้ก่อน handler เสมอ
     SEC-3 · ตรวจกับรายวิชาที่ action ระบุ ไม่ใช่รายวิชาที่กำลังแสดง */
  const CAP = capOf(act, el);
  if (CAP && !can(CAP, el.dataset.course)) { deny(CAP, el.dataset.course); return; }

  if (act === 'acct')           { acctMenu(); return; }
  /* ── auth (D6/D7) ── */
  if (act === 'auth-go')            { AUTH.show(el.dataset.view); return; }
  if (act === 'auth-google')        { AUTH.show('google'); return; }
  if (act === 'auth-pick')          { AUTH.continueWithGoogle(el.dataset.email); return; }
  if (act === 'auth-google-other')  { AUTH.continueWithGoogle(AuthScreen.value('au-gmail')); return; }
  if (act === 'auth-google-create') { AUTH.createFromGoogle(); return; }
  if (act === 'auth-login')         { AUTH.submitLogin(); return; }
  if (act === 'auth-register')      { AUTH.submitRegister(); return; }
  if (act === 'auth-verify')        { AUTH.submitVerify(); return; }
  if (act === 'auth-forgot') {
    toast('ถ้าอีเมลนี้มีบัญชี ระบบจะส่งลิงก์ตั้งรหัสผ่านใหม่ไปให้'); return; }   /* same words for every address */
  if (act === 'auth-resend') {
    if (!AUTH.resend()) return;
    toast('ถ้าอีเมลนี้ลงทะเบียนไว้และยังไม่ยืนยัน ระบบส่งลิงก์ใหม่แล้ว · ลิงก์ก่อนหน้าใช้ไม่ได้อีก'); return;
  }
  if (act === 'auth-logout')        { AUTH.leave(); return; }

  if (act === 'be') {
    const u = byId(db.user, el.dataset.id);
    if (!u) return;
    acctMenu(false);
    S.meId = u.id; S.filter = {};
    SESSION.set(u.id);   /* the prototype switcher stands in for signing in as that account */
    clampCourse(); saveLayout(); invalidate();
    if (!S.course && isCourseRoute(S.route)) go('courses'); else render();
    toast('เข้าใช้งานเป็น ' + u.name +
      (S.role === 'ADMIN' ? '' : ' · เห็น ' + myCourses().length + ' รายวิชา'));
    return;
  }
  if (act === 'profile')        { acctMenu(false); modalProfile(); return; }
  if (act === 'profile-save')   { saveProfile(); return; }
  if (act === 'pw-change')      { acctMenu(false); modalPwChange(); return; }
  if (act === 'pw-change-save') { savePwChange(); return; }
  if (act === 'role') { acctMenu(false); S.role = el.dataset.val;
    /* The account has to match the role before the scope is computed from it,
       and only then can the open course be checked against that scope. */
    clampMe(); SESSION.set(S.meId);
    const moved = clampCourse();
    if (S.role === 'INSTRUCTOR' && ['users','coverage'].indexOf(S.route) >= 0) go('courses');
    else if (moved && !S.course) go('courses');
    else render();
    toast('มุมมอง: ' + (S.role === 'ADMIN' ? 'ผู้ดูแลระบบ' : 'ผู้สอน') +
      (moved && S.course ? ' · เปิด ' + byId(db.course, S.course).code + ' ให้แล้ว' : ''));
    return; }
  if (act === 'pane-toggle') {
    document.body.dataset.pane = document.body.dataset.pane === 'open' ? '' : 'open'; return;
  }
  if (act === 'pane-close') { document.body.dataset.pane = ''; return; }
  if (act === 'area') {
    S.area = el.dataset.val;
    if (S.area === 'users') go('users');
    else if (S.area === 'coverage') go('coverage');
    else go(isCourseRoute(S.route) ? S.route : 'overview');
    return;
  }
  if (act === 'toggle-team') {
    const id = el.dataset.id;
    if (S.course === id) S.expanded[id] = !S.expanded[id];
    else { S.expanded[id] = true; setCourse(id); return; }
    render(); return;
  }
  if (act === 'open-section') {
    if (el.dataset.course !== S.course) { S.course = el.dataset.course; S.filter = {}; S.sort = {}; invalidate(); }
    S.expanded[el.dataset.course] = true;
    go(el.dataset.route); return;
  }
  if (act === 'subnav') { S.sub[el.dataset.route] = el.dataset.val; render(); return; }
  if (act === 'step') {
    if (el.dataset.view) S.sub[el.dataset.route] = el.dataset.view;
    go(el.dataset.route); return;
  }
  if (act === 'help')         { showHelp(el); return; }
  if (act === 'shortcuts')    { modalShortcuts(); return; }
  if (act === 'layout')       { layoutPop(); return; }
  if (act === 'density')      { S.density  = el.dataset.val; applyLayout(); saveLayout(); render(); return; }
  if (act === 'longtext')     { S.longtext = el.dataset.val; applyLayout(); saveLayout(); render(); return; }
  if (act === 'close')        { closeOverlays(); return; }

  /* ค่าตั้งต้นของคีย์อาจเป็นพับหรือกางก็ได้ (ขึ้นกับว่ามีสิ่งที่ต้องแก้ไหม) ปุ่มจึง
     พกสถานะที่วาดจริงมาด้วย แล้วเขียนค่าตรงข้ามลงไปตรง ๆ */
  if (act === 'fold')         { S.tab[el.dataset.key] = el.dataset.open !== '1'; render(); return; }
  /* G5 — ความสะดวกที่เคยมากับช่องติ๊ก (1 ช่อง = 100 · 2 = 50/50 · 3 = 33/33/34)
     ยังอยู่ แต่ย้ายมาเป็นปุ่มของแถว ผู้ใช้จึงเลือกเองว่าจะเกลี่ยเมื่อไร */

  if (act === 'weight-mode') {

    if (toGroup && c.weightMode !== 'GROUP') {
      c.groupWeight = {};

  if (act === 'obj-even') {

  /* T8 — จากการ์ด CLO ไปยังกลุ่มจุดประสงค์ของข้อนั้นโดยตรง */

  if (act === 'pw-reset-do') {

    authLog(u.id, 'PW_RESET', 'ผู้ดูแลระบบรีเซ็ตรหัสผ่านและส่งรหัสชั่วคราวทางอีเมล');
    invalidate(); render();
    modalPwReset(u.id, true);
    toast('รีเซ็ตรหัสผ่านแล้ว — บัญชีนี้ต้องตั้งรหัสใหม่เมื่อเข้าสู่ระบบครั้งถัดไป'); return;
  }
  if (act === 'err-report')   { modalErrReport(el.dataset.id); return; }
  if (act === 'errreport')    { modalErrReport(el.dataset.id); return; }
  if (act === 'crud-new')  { OBJ_CLO = el.dataset.clo || (D().clos[0] && D().clos[0].id) || null;
                             openForm(el.dataset.kind, null); return; }

  if (act === 'crud-del')  { confirmDelete(FORM_KIND, FORM_ID); return; }

  if (act === 'move')      { reorder(el.dataset.kind, el.dataset.id, parseInt(el.dataset.dir, 10)); return; }

    /* คัดลอกทุกฟิลด์ แล้วทับเฉพาะสิ่งที่ต้องต่างจากต้นฉบับ — การไล่ชื่อฟิลด์เองทำให้

  if (act === 'course-view')  { S.tab.courseView  = el.dataset.val; render(); return; }
  /* J6 — ทำสำเนารายวิชา: โครงไปด้วย (CLO · จุดประสงค์ · กิจกรรม · การเชื่อม · ขอบเขตเกรด)
     รายชื่อและคะแนนไม่ไป — สำเนาเป็นของภาคเรียนใหม่ ข้อมูลนักศึกษาเป็นของภาคเดิมเสมอ */
  if (act === 'dup-course') { dupCourse(el.dataset.course || S.course); return; }
  if (act === 'grading-settings') { modalGrading(); return; }

  if (act === 'save-grading') {
    if (!can('band.write')) return deny('band.write');
    const pick = function(n){ const x = document.querySelector('input[name="' + n + '"]:checked'); return x ? x.value : null; };
    const scale = pick('g-scale'), method = pick('g-method');
    const pass = parseFloat(document.getElementById('g-pass').value);
    if (isNaN(pass) || pass < 0 || pass > 100) { toast('เกณฑ์ผ่านรายวิชาต้องอยู่ระหว่าง 0–100','bad'); return; }
    /* CR-10 — S/U is decided by passCriteria alone, so a curve cannot apply. */
    if (scale === 'PASS_FAIL' && method === 'NORM_REFERENCED') {
      toast('รายวิชาแบบผ่าน/ไม่ผ่าน ตัดเกรดอิงกลุ่มไม่ได้','bad'); return; }
    const c = byId(db.course, S.course);
    const stuIds = D().roster.map(function(r){ return r.id; });
    const frozen = db.studentGrade.some(function(x){ return stuIds.indexOf(x.studentId) >= 0; });
    if (scale !== c.gradeScale) {
      /* A frozen A–F cannot survive a switch to S/U, or the reverse. */
      if (frozen) { toast('มีเกรดที่ตรึงไว้แล้ว — เปลี่ยนรูปแบบเกรดไม่ได้จนกว่าจะล้างเกรดของรายวิชานี้','bad'); return; }
      db.gradeBand = db.gradeBand.filter(function(b){ return b.courseId !== c.id; });
      (scale === 'PASS_FAIL' ? [['S',pass],['U',0]]
        : [['A',80],['B+',75],['B',70],['C+',65],['C',60],['D+',55],['D',50],['F',0]])
        .forEach(function(b, i){
          db.gradeBand.push({ id:'gb_' + c.id + '_' + Date.now() + '_' + i, courseId:c.id, grade:b[0], minValue:b[1] }); });
    } else if (scale === 'PASS_FAIL') {
      /* CR-06 — the S band IS the pass mark; two numbers for one rule drift. */
      db.gradeBand.forEach(function(b){ if (b.courseId === c.id && b.grade === 'S') b.minValue = pass; });
    }
    c.gradeScale = scale; c.gradeMethod = method; c.passCriteria = pass;
    closeOverlays(); invalidate(); render();
    toast('บันทึกการตั้งค่าการตัดเกรดแล้ว');
    return;
  }
  if (act === 'add-course') { modalCourse('create'); return; }
  if (act === 'staff-pick') {
    const u = byId(db.user, el.dataset.id);
    if (!u || CSTAFF.some(function(x){ return x.userId === u.id; })) return;
    CSTAFF.push({ userId:u.id, role:'INSTRUCTOR' });
    const q = document.getElementById('f-staff-q'); if (q) { q.value = ''; q.focus(); }
    repaintStaff();
    return;
  }
  if (act === 'staff-add') {
    const free = db.user.filter(function(u){
      return u.role === 'INSTRUCTOR' && !CSTAFF.some(function(x){ return x.userId === u.id; }); });
    if (!free.length) { toast('ไม่มีผู้สอนที่ยังไม่ถูกมอบหมายแล้ว','bad'); return; }
    CSTAFF.push({ userId:free[0].id, role:'INSTRUCTOR' });   /* D1 — one role, no choice to make */
    repaintStaff();
    return;
  }
  if (act === 'staff-del') {
    const i = parseInt(el.dataset.i, 10);
    const lock = staffLocked(CSTAFF[i]);
    if (lock) { toast('เอาออกไม่ได้: ' + lock, 'bad'); return; }   // SEC-4
    CSTAFF.splice(i, 1); repaintStaff(); return;
  }

  if (act === 'save-course') {
    const g = function(id){ return document.getElementById(id).value.trim(); };
    const f = function(id){ return parseFloat(g(id)); };
    const code = g('f-code'), name = g('f-cname');
    const sem = parseInt(g('f-sem'), 10), year = parseInt(g('f-year'), 10), sec = g('f-sec') || '01';
    const editing = el.dataset.mode === 'edit';
    const selfId = editing ? (COURSE_EDIT_ID || S.course) : null;
    /* ประตูชั้นที่สอง — ไม่พึ่ง dispatcher อย่างเดียว เหมือน modalCourse() */
    const capS = editing ? 'course.settings' : 'course.create';
    if (!can(capS, selfId || undefined)) return deny(capS, selfId || undefined);

    if (!code)  { toast('กรอกรหัสวิชาก่อน','bad'); return; }
    if (!name)  { toast('กรอกชื่อรายวิชาก่อน','bad'); return; }
    if (!(year > 2400)) { toast('ปีการศึกษาต้องเป็น พ.ศ. เช่น 2568','bad'); return; }

    /* FR-21 — (code, semester, year, section) is the identity of a course. */
    const clash = db.course.some(function(x){
      return x.id !== selfId && x.code === code && x.semester === sem && x.year === year && x.section === sec; });
    if (clash) { toast('รหัสวิชานี้มีอยู่แล้วในภาคเรียนและ Sec นี้','bad'); return; }

    const cr = f('f-cr'), lec = f('f-lec'), pr = f('f-prac'), sf = f('f-self');
    /* FR-27 / DC-15 — 0 credits is legal; only a negative or blank is not. */
    if ([cr,lec,pr,sf].some(function(v){ return isNaN(v) || v < 0; })) {
      toast('หน่วยกิตและชั่วโมงต้องเป็นตัวเลขไม่ติดลบ (0 ใส่ได้)','bad'); return; }
    /* Grading policy moved to modalGrading (feedback F2). This form keeps what
       a course already has, and a new course starts at the defaults — the same
       values the removed selects used to preselect. */
    const was = editing ? byId(db.course, selfId) : null;
    const scale  = was ? was.gradeScale  : 'LETTER';
    const method = was ? was.gradeMethod : 'CRITERION_REFERENCED';
    const pass   = was ? was.passCriteria : 60;

    /* P17 — a non-admin creator must teach the new course. Without them on the
       staff list it would belong to nobody who can manage it. */
    if (!editing && S.role !== 'ADMIN' &&
        !CSTAFF.some(function(x){ return x.userId === me().id; })) {
      toast('ผู้สร้างรายวิชาต้องเป็นผู้สอนของวิชานั้น — ไม่อย่างนั้นจะไม่มีใครดูแลวิชาใหม่','bad'); return; }

    const target = editing ? byId(db.course, selfId)
      : { id:'c_' + Date.now(), nameEn:'' };
    if (!editing) db.course.push(target);
    target.code = code; target.name = name; target.nameEn = g('f-cnameen');
    target.semester = sem; target.year = year; target.section = sec;
    target.credits = cr; target.lectureHours = lec; target.practiceHours = pr; target.selfStudyHours = sf;
    target.gradeScale = scale; target.gradeMethod = method;
    target.passCriteria = pass; target.classTarget = 100;   /* G1 */
    if (target.cloPassMark === undefined) target.cloPassMark = 60;   /* E1 — ค่าเริ่มต้นเกณฑ์ผ่าน CLO */

    db.courseInstructor = db.courseInstructor.filter(function(x){ return x.courseId !== target.id; });
    CSTAFF.forEach(function(x, i){
      db.courseInstructor.push({ id:'ci_' + target.id + '_' + i, courseId:target.id,
        userId:x.userId, role:x.role, assignedAt:'2568-09-09' }); });

    if (!editing) {
      /* A new course still needs a grade ladder to be gradeable at all. */
      (scale === 'PASS_FAIL' ? [['S',pass],['U',0]]
        : [['A',80],['B+',75],['B',70],['C+',65],['C',60],['D+',55],['D',50],['F',0]])
        .forEach(function(b, i){
          db.gradeBand.push({ id:'gb_' + target.id + '_' + i, courseId:target.id, grade:b[0], minValue:b[1] }); });
      S.course = target.id; S.expanded[target.id] = true;
    }
    closeOverlays(); invalidate();
    /* The staff list just changed, so the course may have left your scope. */
    const dropped = clampCourse();
    if (!editing) go('overview');
    else if (dropped) go('courses');
    else render();
    toast(dropped
      ? 'บันทึกแล้ว — คุณไม่ได้เป็นผู้สอนของรายวิชานี้แล้ว จึงถูกนำออกจากรายวิชาของฉัน'
      : (editing ? 'บันทึกการแก้ไขรายวิชาแล้ว' : 'สร้างรายวิชาแล้ว — ขั้นต่อไปคือกำหนด CLO'));
    return;
  }

  /* Course delete goes through the same engine as every other entity, so the
     P6 impact dialog and the cascade have exactly one implementation. */
  if (act === 'del-course') { confirmDelete('course', el.dataset.course || S.course); return; }

}, true);

document.getElementById('scrim').addEventListener('click', closeOverlays);
document.getElementById('paletteBtn').addEventListener('click', modalPalette);

/* Filters are live; score and criteria cells write straight through. */
document.addEventListener('input', function(e){
  /* P2 — แก้ % ทีละช่อง = อัปเดตผลรวมทันที ไม่แบ่งใหม่ */
  if (e.target.dataset && e.target.dataset.ow !== undefined) {
    const box = e.target.closest('[data-weighted]'); if (box) owRepaint(box, false); return; }
  /* J3 — ปุ่มลบรายวิชาเปิดเมื่อข้อความยืนยันตรงทุกตัวอักษรเท่านั้น */
  if (e.target.id === 'del-phrase') {
    const rec = FORM_KIND === 'course' ? byId(db.course, FORM_ID) : null;
    const b = document.querySelector('#modal [data-act="crud-del-confirm"]');
    if (rec && b) b.disabled = e.target.value.trim() !== deletePhrase(rec);
    return;
  }
  if (e.target.id === 'f-staff-q') { paintStaffHits(); return; }
  if (e.target.id === 'au-pw' || e.target.id === 'au-email') {
    AUTH.updateMeter();
  }
  /* M2/M3 — เกณฑ์เป็นตัวเลขที่พึ่งพากัน ตัวเลขจึงต้องเดินตามกันขณะพิมพ์
     ไม่ใช่รอให้ผิดแล้วค่อยฟ้องตอนกดบันทึก */
  if (FORM_KIND === 'activity' && e.target.id && e.target.id.indexOf('ff-') === 0) { actFormSync(e.target.id); return; }
  const f = e.target.dataset && e.target.dataset.filter;
  if (!f) return;
  S.filter[f] = e.target.value;
  const pos = e.target.selectionStart;
  render();
  const again = document.querySelector('[data-filter="' + f + '"]');
  if (again) { again.focus(); try { again.setSelectionRange(pos, pos); } catch (err) {} }
});

/* K2 — tooltip: hover และโฟกัสเปิดชั่วคราว · คลิก/แตะ ตรึงไว้ (มือถือไม่มี hover)
   Esc หรือคลิกที่อื่นปิด · ตำแหน่งคำนวณใหม่ทุกครั้ง และดันกลับเข้าในจอถ้าจะล้น */
let TIP_PINNED = null;
function tipShow(el){
  const box = document.getElementById('tipbox');
  if (!box || !el) return;
  document.querySelectorAll('.tipbtn[aria-expanded="true"]').forEach(function(b){
    if (b !== el) b.setAttribute('aria-expanded', 'false'); });
  box.textContent = el.dataset.tip;
  box.hidden = false;
  el.setAttribute('aria-expanded', 'true');
  const r = el.getBoundingClientRect(), bw = box.offsetWidth, bh = box.offsetHeight, m = 8;
  let left = r.left + r.width / 2 - bw / 2;
  left = Math.max(m, Math.min(left, window.innerWidth - bw - m));
  let top = r.bottom + 8;
  if (top + bh > window.innerHeight - m) top = Math.max(m, r.top - bh - 8);
  box.style.left = left + 'px'; box.style.top = top + 'px';
}
function tipHide(force){
  if (TIP_PINNED && !force) return;
  const box = document.getElementById('tipbox');
  if (box) box.hidden = true;
  document.querySelectorAll('.tipbtn[aria-expanded="true"]').forEach(function(b){ b.setAttribute('aria-expanded', 'false'); });
  if (force) TIP_PINNED = null;
}
document.addEventListener('mouseover', function(e){
  const t = e.target.closest && e.target.closest('.tipbtn');
  if (t && !TIP_PINNED) tipShow(t);
});
document.addEventListener('mouseout', function(e){
  const t = e.target.closest && e.target.closest('.tipbtn');
  if (t && !TIP_PINNED) tipHide(false);
});
document.addEventListener('focusin', function(e){
  if (e.target.classList && e.target.classList.contains('tipbtn') && !TIP_PINNED) tipShow(e.target);
});
document.addEventListener('focusout', function(e){
  if (e.target.classList && e.target.classList.contains('tipbtn') && !TIP_PINNED) tipHide(false);
});
/* capture phase: ต้องหยุดคลิกก่อนตัวจัดการ data-act ของปุ่มแม่ (เช่นหัวแถบพับ) จะได้รับ */
document.addEventListener('click', function(e){
  const t = e.target.closest && e.target.closest('.tipbtn');
  if (t) {
    e.preventDefault(); e.stopPropagation();
    if (TIP_PINNED === t) { tipHide(true); }
    else { TIP_PINNED = t; tipShow(t); }
    return;
  }
  if (TIP_PINNED) tipHide(true);
}, true);
document.addEventListener('keydown', function(e){
  const t = e.target.classList && e.target.classList.contains('tipbtn') ? e.target : null;
  if (t && (e.key === 'Enter' || e.key === ' ')) {
    e.preventDefault(); e.stopPropagation();
    if (TIP_PINNED === t) tipHide(true); else { TIP_PINNED = t; tipShow(t); }
    return;
  }
  if (e.key === 'Escape') tipHide(true);
}, true);
window.addEventListener('scroll', function(){ tipHide(true); }, true);
window.addEventListener('resize', function(){ tipHide(true); });

/* P1 — เลือกผ่าน/ไม่ผ่าน = ปิดตัวเลือกอิงกลุ่ม และย้ายไปอิงเกณฑ์ให้ · กลับเป็น A–F = เปิดคืน */
function gradingSync(){
  const pf = document.querySelector('input[name="g-scale"][value="PASS_FAIL"]');
  const norm = document.querySelector('input[name="g-method"][value="NORM_REFERENCED"]');
  const crit = document.querySelector('input[name="g-method"][value="CRITERION_REFERENCED"]');
  if (!pf || !norm || !crit) return;
  norm.disabled = pf.checked;
  norm.closest('label').classList.toggle('opacity-50', pf.checked);
  if (pf.checked && norm.checked) crit.checked = true;
}

document.addEventListener('change', function(e){
  const t = e.target;
  if (t.name === 'g-scale') { gradingSync(); return; }
  /* P2 — ติ๊ก/เอาออก = แบ่งเท่ากันใหม่ในชุดที่ติ๊ก */
  if (t.type === 'checkbox' && t.closest && t.closest('[data-weighted]')) {
    owRepaint(t.closest('[data-weighted]'), true); return; }
  if (t.dataset && t.dataset.staff) {
    const i = parseInt(t.dataset.i, 10);
    const lock = staffLocked(CSTAFF[i]);                            // SEC-4
    if (lock) { toast('แก้ไม่ได้: ' + lock, 'bad'); repaintStaff(); return; }
    if (t.dataset.staff === 'user') CSTAFF[i].userId = t.value;
    repaintStaff(); return;
  }
  if (t.dataset && t.dataset.score) {
    if (!can('score.edit')) { deny('score.edit'); render(); return; }
    const parts = t.dataset.score.split('|'), a = byId(db.activity, parts[1]);
    const raw = t.value.trim();
    const i = db.score.findIndex(function(s){ return s.studentId === parts[0] && s.activityId === parts[1]; });
    if (raw === '') { if (i >= 0) db.score.splice(i, 1);
      invalidate(); render(); return; }
    const v = parseFloat(raw);
    if (isNaN(v) || v < 0)      { toast('คะแนนต้องเป็นตัวเลขไม่ติดลบ (CHECK score >= 0)','bad'); render(); return; }
    if (v > a.maxScore)         { toast('คะแนนเกินคะแนนเต็ม ' + a.maxScore + ' — ทริกเกอร์ปฏิเสธ','bad'); render(); return; }
    if (i >= 0) db.score[i].score = v;
    else db.score.push({ id:'sc_' + Date.now(), studentId:parts[0], activityId:parts[1], score:v, uploadedAt:'2568-09-07' });
    /* No toast: filling a grid produces one per cell, and the number appearing
       in the cell with the row total moving is already the confirmation. */
    invalidate(); render(); return;
  }
  /* T4 — ช่องในเมทริกซ์ กิจกรรม × CLO · กรอกค่า = ผูก · ล้างช่องหรือ 0 = เลิกผูก */
  if (t.dataset && t.dataset.crit) {
    if (!can('activity.write')) { deny('activity.write'); render(); return; }
    const parts = t.dataset.crit.split('|');
    const raw = t.value.trim();
    const v = raw === '' ? 0 : parseFloat(raw);
    if (isNaN(v) || v < 0 || v > 100) { toast('สัดส่วนต้องอยู่ระหว่าง 0–100','bad'); render(); return; }
    setCloShare(parts[0], parts[1], v);
    invalidate(); render(); return;
  }

  /* N1 — น้ำหนักกลุ่มประเภท (โหมด GROUP) กรอกที่หัวกลุ่มในตารางกิจกรรม */
  if (t.dataset && t.dataset.groupweight) {
    if (!can('activity.write')) { deny('activity.write'); render(); return; }
    const raw = t.value.trim();
    const v = raw === '' ? NaN : parseFloat(raw);
    if (isNaN(v) || v < 0 || v > 100) { toast('น้ำหนักกลุ่มต้องเป็นตัวเลข 0–100','bad'); render(); return; }
    const c = byId(db.course, S.course);
    if (!c) return;
    c.groupWeight = c.groupWeight || {};
    c.groupWeight[t.dataset.groupweight] = v;
    invalidate(); render(); return;
  }

  /* T1 / T6 / T7 — น้ำหนัก CLO · น้ำหนักจุดประสงค์ · เกณฑ์ผ่าน CLO ของรายวิชา แก้ได้ในหน้า (T8) */
  const inl = t.dataset && (t.dataset.cloweight ? ['cloweight', 'clo.write', 'น้ำหนัก CLO']
                          : t.dataset.objweight ? ['objweight', 'clo.write', 'น้ำหนักจุดประสงค์']
                          : t.dataset.passmark  ? ['passmark', 'clo.write', 'เกณฑ์ผ่าน CLO'] : null);
  if (inl) {
    if (!can(inl[1])) { deny(inl[1]); render(); return; }
    const raw = t.value.trim();
    const v = raw === '' ? NaN : parseFloat(raw);
    if (isNaN(v) || v < 0 || v > 100) { toast(inl[2] + 'ต้องเป็นตัวเลข 0–100', 'bad'); render(); return; }
    const id = t.dataset[inl[0]];
    const rec = inl[0] === 'cloweight' ? byId(db.clo, id)
              : inl[0] === 'objweight' ? byId(db.behavioralObjective, id) : byId(db.course, id);
    if (!rec) return;
    if (inl[0] === 'passmark') rec.cloPassMark = v; else rec.weight = v;
    invalidate(); render();
    if (inl[0] === 'passmark') toast('เกณฑ์ผ่าน CLO ของรายวิชาเป็น ' + n0(v) + '% — คำนวณผลใหม่แล้ว');
    return;
  }

  /* O3 — โหมด AUTO: SOLO เดินตาม Bloom และถูกล็อก · MANUAL: ปลดล็อก เก็บค่าที่มีอยู่ไว้เป็นจุดตั้งต้น */
  if (FORM_KIND === 'clo' && (t.id === 'ff-bloomLevel' || t.id === 'ff-levelSource')) {
    const src = document.getElementById('ff-levelSource');
    const bloom = document.getElementById('ff-bloomLevel');
    const solo = document.getElementById('ff-soloLevel');
    if (!src || !bloom || !solo) return;
    const auto = src.value !== 'MANUAL';
    solo.disabled = auto;
    if (auto) solo.value = soloOfBloom(bloom.value) || '';
    return;
  }
});

/* M2/M3 — ตัวเลขสี่ตัวของเกณฑ์เดินตามกันตามลำดับความตั้งใจของผู้กรอก:
     เปลี่ยนประเภท  → คะแนนเต็มและหน่วยกลับไปเป็นค่าตั้งต้นของประเภทนั้น (เฉพาะตอนสร้างใหม่ —
                     การแก้กิจกรรมเดิมต้องไม่ลบคะแนนเต็มที่ตั้งใจตั้งไว้)
     จำนวน/ต่อหน่วย → คะแนนเต็ม = ผลคูณ
     คะแนนเต็ม      → คะแนนผ่านถูกรั้งไม่ให้เกิน และ % ถูกคิดใหม่
   ทั้งสองหน้าตา (ฟอร์มและแถวร่าง) ใช้กฎชุดเดียวกัน ต่างแค่ชื่อ element */
const readNum = function(id){
  const el = document.getElementById(id); if (!el) return null;
  const raw = el.value.trim(); if (raw === '') return null;
  const n = parseFloat(raw); return isNaN(n) ? null : n;
};
const setVal = function(id, v){ const el = document.getElementById(id); if (el) el.value = v; };

function actFormSync(changed){
  const isNew = !FORM_ID;
  if (changed === 'ff-type' && isNew) {
    const t = (document.getElementById('ff-type') || {}).value;
    const mx = ACT_DEFAULT_MAX[t] || 100;
    setVal('ff-assessmentMethod', ACT_DEFAULT_ASSESS[t] || 'EXAM');
    setVal('ff-maxScore', mx);
    setVal('ff-passScore', Math.round(mx * 0.5 * 100) / 100);
  }
  const max = readNum('ff-maxScore');
  let pass = readNum('ff-passScore');
  if (max !== null && pass !== null && pass > max) { pass = max; setVal('ff-passScore', max); }
  const hint = document.getElementById('ff-passhint');
  if (hint) hint.textContent = (max === null || pass === null)
    ? 'เทียบเป็น % ของคะแนนเต็มให้อัตโนมัติ'
    : 'คิดเป็น ' + n2x(pctOfScore(pass, max)) + '% ของคะแนนเต็ม ' + n2x(max);
}

/* T5/T8 — แถวร่างนักศึกษาในตารางคะแนน ส่งเข้า FORMS.student ตัวเดิม (กฎมีที่เดียว) */
function saveStuRow(){
  if (!can('student.write')) { deny('student.write'); return; }
  const g = function(id){ const el = document.getElementById(id); return el ? el.value.trim() : ''; };
  const v = { studentCode:g('ns-code'), name:g('ns-name') };
  const bad = FORMS.student.validate(v, null);
  if (bad) { toast(bad, 'bad'); const el = document.getElementById(v.studentCode ? 'ns-name' : 'ns-code'); if (el) el.focus(); return; }
  FORMS.student.save(v, null);
  invalidate(); render();
  toast('เพิ่ม ' + v.studentCode + ' ' + v.name + ' แล้ว — กรอกคะแนนในแถวได้เลย');
  const again = document.getElementById('ns-code'); if (again) again.focus();
}

const NEW_ACTION = { clos:'crud-new', objectives:'crud-new', activities:'crud-new', roster:'stu-new-row',
                     courses:'add-course', users:'crud-new' };

document.addEventListener('keydown', function(e){
  if (document.body.dataset.auth === 'out') return;   /* shortcuts must not drive the app behind the sign-in screen */
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); modalPalette(); return; }
  if (e.key === 'Escape') {
    if (S.newStu) { S.newStu = false; render(); return; }
    closeOverlays(); hideHelp(); acctMenu(false); layoutPop(false); document.body.dataset.pane = ''; return; }
  /* Enter ในช่องกรอกที่มีการกระทำหลักชัดเจน: แถวร่างนักศึกษา (T5) และช่องยืนยันลบรายวิชา (J3)
     ตรวจก่อนบรรทัดที่ปล่อยทุกปุ่มที่กดในช่องกรอกผ่านไป */
  if (e.key === 'Enter' && e.target.id === 'del-phrase') { e.preventDefault(); crudDelete(); return; }
  if (S.newStu && e.key === 'Enter' && e.target.id && e.target.id.indexOf('ns-') === 0) {
    e.preventDefault(); saveStuRow(); return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || tag === 'select') return;

  if (e.key === '/') {                       // focus this screen's search
    const f = document.querySelector('#stage [data-filter]');
    if (f) { e.preventDefault(); f.focus(); f.select(); }
    return;
  }
  if (e.key === '?') { e.preventDefault(); modalShortcuts(); return; }
  if (e.key.toLowerCase() === 'n') {         // create in the current context
    const a = NEW_ACTION[S.route];
    if (a) { e.preventDefault(); const b = document.querySelector('[data-act="' + a + '"]'); if (b) b.click(); }
    return;
  }
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= ROUTES.length) go(ROUTES[n-1].id);
});

/* Principle 7 — drag the divider; the width is remembered. */
(function(){
  const h = document.getElementById('rsz');
  let dragging = false;
  h.addEventListener('mousedown', function(e){
    dragging = true; h.classList.add('drag'); document.body.classList.add('resizing'); e.preventDefault();
  });
  document.addEventListener('mousemove', function(e){
    if (!dragging) return;
    S.listw = Math.max(220, Math.min(460, e.clientX - 84));
    document.documentElement.style.setProperty('--listw', S.listw + 'px');
  });
  document.addEventListener('mouseup', function(){
    if (!dragging) return;
    dragging = false; h.classList.remove('drag'); document.body.classList.remove('resizing'); saveLayout();
  });
})();
window.addEventListener('scroll', hideHelp, { passive:true });

window.addEventListener('hashchange', function(){
  const h = readHash();
  const moved = courseFromHash(h.course);
  if (h.route && h.route !== S.route) go(h.route);
  else if (moved) render();
});

/* boot */
(function(){
  loadLayout();
  applyLayout();
  /* D6 — a sign-in survives a reload (sessionStorage), not closing the tab. */
  const sid = SESSION.get(), su = sid ? byId(db.user, sid) : null;
  if (su && su.isActive !== false) { S.meId = su.id; S.role = su.role === 'ADMIN' ? 'ADMIN' : 'INSTRUCTOR'; }
  else SESSION.set(null);
  clampMe();              /* pin the signed-in account before anything reads it */
  clampCourse();          /* a persisted S.course may be out of scope now */
  const h = readHash();
  courseFromHash(h.course);
  if (byId(ROUTES, h.route)) S.route = h.route;
  if (!byId(ROUTES, S.route)) S.route = 'overview';
  render();
  AUTH.paint();
})();
</script>
