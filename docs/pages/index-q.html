const docId = function(kind, c){
  return ['CMAS', kind.toUpperCase(), c.code, c.section, c.semester + '-' + c.year, stamp()].join('-');
};

function docHeader(kind, title, c){
  const staff = where(db.courseInstructor, 'courseId', c.id).map(function(ci){
    const u = byId(db.user, ci.userId);
    return u ? u.name : '?';
  }).join(' · ') || '— ยังไม่มีผู้สอน —';
  const meRole = courseRoleOf(c.id);
  const meLbl  = me().name + ' (' + (meRole === 'ADMIN' ? 'ผู้ดูแลระบบ' : (COURSE_ROLE_TH[meRole] || '—')) + ')';
  return {
    rows: [
      [title],
      [ORG.institute + ' · ' + ORG.faculty],
      [],
      ['รายวิชา',       c.code + ' ' + c.name],
      ['Sec',      c.section],
      ['ภาค/ปีการศึกษา', c.semester + '/' + c.year],
      ['ผู้สอน',        staff],
      ['วันที่สร้าง',    thaiDate()],
      ['ผู้สร้างเอกสาร', meLbl],
      ['รหัสเอกสาร',    docId(kind, c)],
      /* EX-7 ถูกยกเลิกพร้อมบทบาทผู้ช่วยสอน (D1) — แถวว่างคงไว้ให้ความสูงหัวเอกสารเท่าเดิม */
      [],
      []
    ].filter(function(r){ return r !== null; }),
    /* จำนวนแถวหัว ใช้คำนวณว่าตารางเริ่มแถวไหน */
    height: 12
  };
}

/* A1, B2, … จากดัชนีศูนย์ */
const cellRef = function(r, c){
  let n = c + 1, name = '';
  while (n > 0) { const m = (n - 1) % 26; name = String.fromCharCode(65 + m) + name; n = ((n - m) / 26) | 0; }
  return name + (r + 1);
};

/* สไตล์ของหัวเอกสาร — เหมือนกันทุกไฟล์ */
function headerStyles(h){
  const st = {};
  st['A1'] = XF.title;
  st['A2'] = XF.label;
  for (let r = 3; r < h.rows.length; r++) {
    if (!h.rows[r] || !h.rows[r].length) continue;
    st[cellRef(r, 0)] = XF.label;
    st[cellRef(r, 1)] = XF.value;
  }
  return st;
}
const parseHead = function(h){ const m = String(h).match(/\[([^\]]+)\]\s*$/); return m ? m[1] : null; };
/* stamp() ใช้ในชื่อไฟล์และรหัสเอกสาร — ต้องเรียงลำดับได้และไม่มีอักขระต้องห้าม */
const stamp = function(){
  const d = new Date(), pad = function(n){ return (n < 10 ? '0' : '') + n; };
  return (d.getFullYear() + 543) + pad(d.getMonth() + 1) + pad(d.getDate()) + '-' +
         pad(d.getHours()) + pad(d.getMinutes());
};
/* thaiDate() ใช้ในเนื้อเอกสารที่คนอ่าน — "25690910-1947" ไม่ใช่วันที่ในสายตาใคร */
const TH_MONTH = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน',
                  'กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const thaiDate = function(){
  const d = new Date(), pad = function(n){ return (n < 10 ? '0' : '') + n; };
  return d.getDate() + ' ' + TH_MONTH[d.getMonth()] + ' ' + (d.getFullYear() + 543) +
         ' เวลา ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ' น.';
};

/* One builder for both the export and the template — they differ only in
   whether the score cells carry the numbers that are already in the store.
   ตอนนี้คืนทั้ง workbook และคำสั่งผ่าตัด XML ที่ต้องทำต่อ

   ผังตาม "แบบฟอร์มบันทึกคะแนน" ของคณะ (Student_Scores + Mapping_Matrix):
     แถว 1–3  โลโก้ A1:B3 · ชื่อฟอร์ม C1 · รายวิชา C2 / หลักสูตร F2 / ปีการศึกษา I2 · คณะ C3
     แถว 4    หัวตาราง — "กิจกรรมที่ n" ตามฟอร์ม ต่อด้วยชื่อและ [รหัสกิจกรรม] ที่ตัวนำเข้าใช้
     แถว 5    คะแนนเต็ม · แถว 6 ขึ้นไป นักศึกษา · คอลัมน์สุดท้าย คะแนนรวม =SUM
   ต่างจากฟอร์มต้นฉบับโดยตั้งใจ: Sec ผู้สอน รหัสเอกสาร อยู่ในชีต "คำแนะนำ" (EX-1)
   เพราะหัวฟอร์มมีที่แค่สามบรรทัด */
function scoreSheet(blank){
  const d = D(), C = d.course, n = d.acts.length;
  const kind = blank ? 'template' : 'scores';
  const tc = 2 + n;                                 /* คอลัมน์คะแนนรวม (0-based) */
  const at = function(pairs){ const r = []; pairs.forEach(function(p){ r[p[0]] = p[1]; }); return r; };

  const top = [
    at([[2, 'แบบฟอร์มบันทึกคะแนน']]),
    at([[2, 'รายวิชา ' + C.code + ' ' + C.name],
        [5, 'หลักสูตร ' + (C.program || '..............................')],
        [8, 'ปีการศึกษา ' + C.semester + '/' + C.year + ' · Sec ' + C.section]]),
    at([[2, ORG.faculty + ' ' + ORG.institute.replace('ลาดกระบัง', '\nลาดกระบัง')]])
  ];
  const head = ['รหัสนักศึกษา','ชื่อ-นามสกุล'].concat(d.acts.map(function(a, i){
    return 'กิจกรรมที่ ' + (i + 1) + '\n' + a.name + ' [' + a.id + ']';
  }), ['คะแนนรวม']);
  const maxRow = ['', 'คะแนนเต็ม'].concat(d.acts.map(function(a){ return a.maxScore; }), ['']);
  const body = d.roster.map(function(st){
    return [st.studentCode, st.name].concat(d.acts.map(function(a){
      if (blank) return '';
      const v = d.scoreOf(st.id, a.id);
      return v === null ? '' : v;
    }), ['']);
  });
  /* ไม่มีหมายเหตุใต้ตาราง — ตัวนำเข้าอ่านทุกแถวที่มีค่าในคอลัมน์แรกเป็นรหัสนักศึกษา
     จึงปฏิเสธบรรทัดอธิบายเป็นข้อผิดพลาดสองรายการทุกครั้ง (เจอตอน round-trip)
     คำอธิบายทั้งหมดอยู่ที่ชีต "คำแนะนำ" ซึ่งมีไว้เพื่อการนี้อยู่แล้ว */
  const hr = top.length, mr = hr + 1, first = hr + 2;
  const ws = XLSX.utils.aoa_to_sheet(top.concat([head, maxRow], body));
  ws['!cols'] = [{wch:14},{wch:30}].concat(d.acts.map(function(){ return {wch:14}; }), [{wch:11}]);
  ws['!rows'] = [{hpt:21.75},{hpt:18},{hpt:36},{hpt:48}];

  /* คะแนนรวมเป็นสูตรเหมือนฟอร์ม — แก้คะแนนใน Excel แล้วยอดรวมขยับตาม
     ยอดรวมไม่ถูกนำเข้า (คอลัมน์ไม่มี [รหัส]) ระบบคำนวณเองจากน้ำหนักเสมอ */
  const sumCell = function(r, vals){
    const v = vals.reduce(function(t, x){ return t + (typeof x === 'number' ? x : 0); }, 0);
    ws[cellRef(r, tc)] = { t:'n', v:v, f: n ? 'SUM(' + cellRef(r, 2) + ':' + cellRef(r, tc - 1) + ')' : '0' };
  };
  sumCell(mr, maxRow.slice(2, tc));
  body.forEach(function(b, r){ sumCell(first + r, b.slice(2, tc)); });

  /* สไตล์รายเซลล์ */
  const styles = {};
  styles['C1'] = XF.tTitle; styles['C2'] = XF.tInfo; styles['F2'] = XF.tInfo;
  styles['I2'] = XF.tInfo;  styles['C3'] = XF.tOrg;
  head.forEach(function(_, c){ styles[cellRef(hr, c)] = XF.tHead; styles[cellRef(mr, c)] = XF.tMax; });
  body.forEach(function(_, r){
    styles[cellRef(first + r, 0)] = XF.tIdent;
    styles[cellRef(first + r, 1)] = XF.tName;
    d.acts.forEach(function(_, c){ styles[cellRef(first + r, 2 + c)] = XF.tScore; });
    styles[cellRef(first + r, tc)] = XF.tTotal;
  });

  /* ชีต 2 · Mapping_Matrix — น้ำหนักกิจกรรม และสัดส่วนที่วัดจุดประสงค์แต่ละข้อ (AssessmentCriteria.weight) */
  const critW = function(aid, oid){
    const x = d.critOfObj(aid, oid);
    return x ? x.weight : 0;
  };
  const mHead = ['กิจกรรมที่','ชื่อกิจกรรม','น้ำหนัก'].concat(d.objs.map(function(o){ return 'จุดประสงค์ ' + d.objLabel(o); }));
  const mBody = d.acts.map(function(a, i){
    return ['กิจกรรมที่ ' + (i + 1), a.name, a.weight].concat(d.objs.map(function(o){ return critW(a.id, o.id); }));
  });
  const wm = XLSX.utils.aoa_to_sheet([mHead].concat(mBody, [['Total', '', ''].concat(d.objs.map(function(){ return ''; }))]));
  const tr = 1 + n;
  wm[cellRef(tr, 1)] = { t:'n', v:n, f:'COUNTA(B2:B' + (1 + n) + ')' };
  wm[cellRef(tr, 2)] = { t:'n', v:d.actWeightSum, f:'SUM(C2:C' + (1 + n) + ')' };
  wm['!cols'] = [{wch:14},{wch:28},{wch:10}].concat(d.objs.map(function(){ return {wch:12}; }));
  const mStyles = {};
  mHead.forEach(function(_, c){
    mStyles[cellRef(0, c)] = XF.tHead;
    mStyles[cellRef(tr, c)] = XF.tSum;
    mBody.forEach(function(_, r){ mStyles[cellRef(1 + r, c)] = c === 1 ? XF.tName : XF.tTotal; });
  });


  /* EX-3 · หนึ่ง dataValidation ต่อหนึ่งกิจกรรม ขอบเขตคือคะแนนเต็มของกิจกรรมนั้น */
  const last = first + Math.max(0, body.length - 1);
  const validations = body.length ? d.acts.map(function(a, c){
    return { sqref: cellRef(first, 2 + c) + ':' + cellRef(last, 2 + c), max: a.maxScore, name: a.name };
  }) : [];

  const guide = [
    ['วิธีกรอกไฟล์นี้'], [],
    ['รายวิชา', C.code + ' ' + C.name + ' Sec ' + C.section],
    ['ภาคการศึกษา', C.semester + '/' + C.year],
    ['สร้างเมื่อ', thaiDate()],
    ['รหัสเอกสาร', docId(blank ? 'template' : 'scores', C)], [],
    ['Sec', C.section],
    ['ผู้สอน', where(db.courseInstructor, 'courseId', C.id).map(function(ci){

function validateRoster(wb, fileName){
  const d = D();
  const sh = wb.Sheets['รายชื่อ'] || wb.Sheets[wb.SheetNames[0]];
  if (!sh) throw new Error('ไฟล์ไม่มีชีตข้อมูล');
  const base = XLSX.utils.decode_range(sh['!ref']).s.r;
  const all = XLSX.utils.sheet_to_json(sh, { header:1, blankrows:true, defval:'' });
  const hi = all.findIndex(function(r){
    return String((r && r[0]) === undefined ? '' : r[0]).trim() === 'รหัสนักศึกษา'; });
  const aoa = hi >= 0 ? all.slice(hi) : all;
  const rowOffset = base + (hi >= 0 ? hi : 0);
  if (aoa.length < 2) throw new Error('ไฟล์ว่าง — ไม่มีแถวข้อมูล');

  const existing = {};
  d.roster.forEach(function(st){ existing[String(st.studentCode).trim()] = st; });

  const ok = [], rejects = [], seen = {};
  aoa.slice(1).forEach(function(r, ri){
    const row  = ri + 2 + rowOffset;
    const code = String((r && r[0]) === undefined ? '' : r[0]).trim();
    const name = String((r && r[1]) === undefined ? '' : r[1]).trim();
    if (!code && !name) return;
    if (!code) { rejects.push({ row:row, studentCode:'—', field:'รหัสนักศึกษา', value:'(ว่าง)',
      reason:'ไม่มีรหัสนักศึกษา — กรอกรหัสแล้วนำเข้าใหม่' }); return; }
    if (!name) { rejects.push({ row:row, studentCode:code, field:'ชื่อ-นามสกุล', value:'(ว่าง)',
      reason:'ไม่มีชื่อ — กรอกชื่อแล้วนำเข้าใหม่' }); return; }
    if (seen[code]) { rejects.push({ row:row, studentCode:code, field:'รหัสนักศึกษา', value:code,
      reason:'รหัสซ้ำกับแถวที่ ' + seen[code] + ' ในไฟล์เดียวกัน' }); return; }
    if (existing[code]) { rejects.push({ row:row, studentCode:code, field:'รหัสนักศึกษา', value:code,
      reason:'มีรหัสนี้ใน Sec อยู่แล้ว (' + existing[code].name + ') — ข้ามไว้ ไม่ทับของเดิม' }); return; }
    seen[code] = row;
    ok.push({ studentCode:code, name:name });
  });

  return { mode:'roster', fileName:fileName, ok:ok, rejects:rejects,
           students:ok.length, cols:[], courseId:S.course };
}

/* ══════════════════════════════════════════════════════════════════
   6c · ชั้น XML ของ .xlsx — สิ่งที่ไลบรารีเขียนให้ไม่ได้
   ตรวจข้อจำกัดแล้วด้วยการแกะ XML ไม่ได้เดาจากเอกสาร:
     เขียนได้    merge · ความกว้าง · ความสูง · รูปแบบตัวเลข · autoFilter · sheetProtection · properties
     เขียนไม่ได้ pane (ตรึงหัว) · dataValidation · cellXfs (สี ตัวหนา เส้นขอบ locked)
   ══════════════════════════════════════════════════════════════════ */

/* ── zip: อ่านและเขียนแบบไม่บีบอัด ─────────────────────────────────── */
const CRC_TBL = (function(){
  const t = new Uint32Array(256);
  for (let i = 0; i < 256; i++) {
    let c = i;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[i] = c >>> 0;
  }
  return t;
})();
function crc32(u8){
  let c = 0xFFFFFFFF;
  for (let i = 0; i < u8.length; i++) c = CRC_TBL[(c ^ u8[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}

async function zipRead(u8){
  const dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
  let eo = -1;
  for (let i = u8.length - 22; i >= 0; i--) if (dv.getUint32(i, true) === 0x06054b50) { eo = i; break; }
  if (eo < 0) throw new Error('ไฟล์ zip ไม่สมบูรณ์');
  const n = dv.getUint16(eo + 10, true);
  let p = dv.getUint32(eo + 16, true);
  const jobs = [];
  for (let k = 0; k < n; k++) {
    const nlen = dv.getUint16(p + 28, true), elen = dv.getUint16(p + 30, true), clen = dv.getUint16(p + 32, true);
    const meth = dv.getUint16(p + 10, true), csize = dv.getUint32(p + 20, true);
    const lho  = dv.getUint32(p + 42, true);
    const name = new TextDecoder().decode(u8.subarray(p + 46, p + 46 + nlen));
    const lnlen = dv.getUint16(lho + 26, true), lelen = dv.getUint16(lho + 28, true);
    const st = lho + 30 + lnlen + lelen;
    jobs.push({ name:name, meth:meth, raw:u8.subarray(st, st + csize) });
    p += 46 + nlen + elen + clen;
  }
  const out = {};
  for (const j of jobs) {
    if (j.meth === 0) out[j.name] = new TextDecoder().decode(j.raw);
    else {
      const ab = await new Response(new Blob([j.raw]).stream()
        .pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer();
      out[j.name] = new TextDecoder().decode(new Uint8Array(ab));
    }
  }
  return out;
}

function zipWrite(files){
  const enc = new TextEncoder();
  const names = Object.keys(files);
  const locals = [], central = [];
  let off = 0;
  names.forEach(function(name){
    /* ข้อความเข้ารหัส UTF-8 · ไฟล์ไบนารี (รูปโลโก้) ส่งมาเป็น Uint8Array แล้ว */
    const nb = enc.encode(name), v = files[name];
    const db_ = typeof v === 'string' ? enc.encode(v) : v;
    const crc = crc32(db_);
    const lh = new Uint8Array(30 + nb.length);
    const lv = new DataView(lh.buffer);
    lv.setUint32(0, 0x04034b50, true); lv.setUint16(4, 20, true); lv.setUint16(6, 0x0800, true);
    lv.setUint16(8, 0, true);                       /* stored */
    lv.setUint16(10, 0, true); lv.setUint16(12, 0, true);
    lv.setUint32(14, crc, true); lv.setUint32(18, db_.length, true); lv.setUint32(22, db_.length, true);
    lv.setUint16(26, nb.length, true); lv.setUint16(28, 0, true);
    lh.set(nb, 30);
    locals.push(lh, db_);

    const ch = new Uint8Array(46 + nb.length);
    const cv = new DataView(ch.buffer);
    cv.setUint32(0, 0x02014b50, true); cv.setUint16(4, 20, true); cv.setUint16(6, 20, true);
    cv.setUint16(8, 0x0800, true); cv.setUint16(10, 0, true);
    cv.setUint32(16, crc, true); cv.setUint32(20, db_.length, true); cv.setUint32(24, db_.length, true);
    cv.setUint16(28, nb.length, true);
    cv.setUint32(42, off, true);
    ch.set(nb, 46);
    central.push(ch);
    off += lh.length + db_.length;
  });
  const cdSize = central.reduce(function(t, c){ return t + c.length; }, 0);
  const end = new Uint8Array(22);
  const ev = new DataView(end.buffer);
  ev.setUint32(0, 0x06054b50, true);
  ev.setUint16(8, names.length, true); ev.setUint16(10, names.length, true);
  ev.setUint32(12, cdSize, true); ev.setUint32(16, off, true);

  const parts = locals.concat(central, [end]);
  const total = parts.reduce(function(t, x){ return t + x.length; }, 0);
  const out = new Uint8Array(total);
  let q = 0; parts.forEach(function(x){ out.set(x, q); q += x.length; });
  return out;
}

const xmlEsc = function(t){
  return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
};

/* ── ผ่าตัด sheet1.xml ───────────────────────────────────────────────
   opt = { freeze:'C7', styles:{ 'A1':XF.title, … }, validations:[{sqref, max}], protect:true } */
function patchSheet(xml, opt){
  /* ดัชนีสไตล์รายเซลล์ — เขียนทับ s= เดิม หรือเพิ่มเข้าไปถ้ายังไม่มี */
  if (opt.styles) {
    xml = xml.replace(/<c r="([A-Z]+\d+)"([^>]*)>/g, function(m, ref, rest){
      const st = opt.styles[ref];
      if (st === undefined) return m;
      const cleaned = rest.replace(/\s+s="\d+"/, '');
      return '<c r="' + ref + '" s="' + st + '"' + cleaned + '>';
    });
    /* เซลล์ว่างที่ SheetJS ไม่เขียนออกมาเลยจะไม่มีกรอบ — ยอมรับได้
       เพราะ aoa_to_sheet ใส่ '' ให้ทุกช่องในตารางคะแนนอยู่แล้ว */
  }

  /* ตรึงหัวตาราง — sheetView ที่ SheetJS เขียนไว้ไม่มี pane เลย */
  if (opt.freeze) {
    const col = opt.freeze.match(/^[A-Z]+/)[0], row = parseInt(opt.freeze.match(/\d+/)[0], 10);
    let x = 0; for (let i = 0; i < col.length; i++) x = x * 26 + (col.charCodeAt(i) - 64);
    const pane = '<pane xSplit="' + (x - 1) + '" ySplit="' + (row - 1) + '" topLeftCell="' + opt.freeze +
      '" activePane="bottomRight" state="frozen"/>' +
      '<selection pane="bottomRight" activeCell="' + opt.freeze + '" sqref="' + opt.freeze + '"/>';
    xml = xml.replace(/<sheetView([^>]*)\/>/, '<sheetView$1>' + pane + '</sheetView>')
             .replace(/<sheetView([^>]*)>(?!<pane)/, '<sheetView$1>' + pane);
  }

  /* ป้องกันแผ่น — ปลดล็อกเฉพาะช่องคะแนนผ่าน xf ที่ protection locked="0" */
  if (opt.protect && !/<sheetProtection/.test(xml)) {
    const prot = '<sheetProtection sheet="1" objects="1" scenarios="1" ' +
      'selectLockedCells="1" selectUnlockedCells="1" formatCells="0" insertRows="0" deleteRows="0"/>';
    xml = xml.replace(/<sheetData>/, prot.length ? '<sheetData>' : '<sheetData>');
    xml = xml.replace(/<\/sheetData>/, '</sheetData>' + prot);
  }

  /* dataValidation — ต้องอยู่หลัง sheetData และหลัง mergeCells */
  if (opt.validations && opt.validations.length) {
    const dv = '<dataValidations count="' + opt.validations.length + '">' +
      opt.validations.map(function(v){
        return '<dataValidation type="decimal" operator="between" allowBlank="1" showInputMessage="1" ' +
          'showErrorMessage="1" errorStyle="stop" ' +
          'errorTitle="' + xmlEsc('คะแนนไม่ถูกต้อง') + '" ' +
          'error="' + xmlEsc('กรอกได้เฉพาะตัวเลข 0 ถึง ' + v.max + ' · เว้นว่างได้ถ้ายังไม่ประเมิน') + '" ' +
          'promptTitle="' + xmlEsc(v.name || 'คะแนน') + '" ' +
          'prompt="' + xmlEsc('เต็ม ' + v.max + ' คะแนน · เว้นว่าง = ยังไม่ประเมิน') + '" ' +
          'sqref="' + v.sqref + '"><formula1>0</formula1><formula2>' + v.max + '</formula2></dataValidation>';
      }).join('') + '</dataValidations>';
    /* ลำดับ element ใน worksheet ถูกบังคับโดยสคีมา: sheetData → sheetProtection →
       autoFilter → mergeCells → dataValidations · วางผิดที่ Excel จะฟ้องว่าไฟล์เสีย */
    if (/<\/mergeCells>/.test(xml))          xml = xml.replace('</mergeCells>', '</mergeCells>' + dv);
    else if (/<autoFilter[^>]*\/>/.test(xml)) xml = xml.replace(/(<autoFilter[^>]*\/>)/, '$1' + dv);
    else if (/<sheetProtection[^>]*\/>/.test(xml)) xml = xml.replace(/(<sheetProtection[^>]*\/>)/, '$1' + dv);
    else                                      xml = xml.replace('</sheetData>', '</sheetData>' + dv);
  }
  return xml;
}

/* เอาไฟล์ที่ SheetJS สร้างมาเติมสิ่งที่มันเขียนไม่ได้ แล้วคืนไบต์ชุดใหม่ */
async function finishWorkbook(wb, opt){
  const raw = new Uint8Array(XLSX.write(wb, { type:'array', bookType:'xlsx', Props:wb.Props }));
  if (!opt) return raw;
  const files = await zipRead(raw);
  files['xl/styles.xml'] = STYLES_XML;
  files['xl/worksheets/sheet1.xml'] = patchSheet(files['xl/worksheets/sheet1.xml'], opt);
  /* opt.sheets[i] = คำสั่งผ่าตัดของชีตที่ i+2 (styles/freeze แบบเดียวกับชีตแรก) */
  (opt.sheets || []).forEach(function(o, i){
    const p = 'xl/worksheets/sheet' + (i + 2) + '.xml';
    if (o && files[p]) files[p] = patchSheet(files[p], o);
  });
  if (opt.logo) addLogo(files, opt.logo);
  return zipWrite(files);
}

/* โลโก้มุมซ้ายบนของชีตแรก — SheetJS รุ่นฟรีเขียนรูปไม่ได้ จึงเติม drawing เอง:
   media + drawing1.xml + rels สองชั้น + <drawing> ท้าย worksheet + content types */
function addLogo(files, logo){
  const EMU = 9525, cx = 2743200, cy = Math.round(cx * logo.h / logo.w);   /* กว้าง 7.62 ซม. */
  const bin = atob(logo.png), u8 = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  files['xl/media/image1.png'] = u8;
  files['xl/drawings/drawing1.xml'] =
    '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<xdr:wsDr xmlns:xdr="http://schemas.openxmlformats.org/drawingml/2006/spreadsheetDrawing" ' +
      'xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" ' +
      'xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">' +
    '<xdr:oneCellAnchor><xdr:from><xdr:col>0</xdr:col><xdr:colOff>' + (8 * EMU) + '</xdr:colOff>' +
      '<xdr:row>0</xdr:row><xdr:rowOff>' + (10 * EMU) + '</xdr:rowOff></xdr:from>' +
      '<xdr:ext cx="' + cx + '" cy="' + cy + '"/>' +
      '<xdr:pic><xdr:nvPicPr><xdr:cNvPr id="2" name="Logo" descr="SIET | KMITL"/>' +
        '<xdr:cNvPicPr><a:picLocks noChangeAspect="1"/></xdr:cNvPicPr></xdr:nvPicPr>' +
        '<xdr:blipFill><a:blip r:embed="rId1"/><a:stretch><a:fillRect/></a:stretch></xdr:blipFill>' +
        '<xdr:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="' + cx + '" cy="' + cy + '"/></a:xfrm>' +
          '<a:prstGeom prst="rect"><a:avLst/></a:prstGeom></xdr:spPr></xdr:pic>' +
      '<xdr:clientData/></xdr:oneCellAnchor></xdr:wsDr>';
  files['xl/drawings/_rels/drawing1.xml.rels'] =
    '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
    '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" ' +
      'Target="../media/image1.png"/></Relationships>';

  const rel = '<Relationship Id="rIdCmasLogo" ' +
    'Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/drawing" ' +
    'Target="../drawings/drawing1.xml"/>';
  const sr = 'xl/worksheets/_rels/sheet1.xml.rels';
  files[sr] = files[sr]
    ? files[sr].replace('</Relationships>', rel + '</Relationships>')
    : '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' + rel + '</Relationships>';

  /* <drawing> ต้องอยู่หลัง pageMargins/pageSetup/headerFooter และก่อน legacyDrawing/tableParts/extLst */
  let sx = files['xl/worksheets/sheet1.xml'];
  if (!/<worksheet[^>]*xmlns:r=/.test(sx))
    sx = sx.replace(/<worksheet/, '<worksheet xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"');
  const tail = sx.search(/<legacyDrawing|<tableParts|<extLst|<\/worksheet>/);
  files['xl/worksheets/sheet1.xml'] = sx.slice(0, tail) + '<drawing r:id="rIdCmasLogo"/>' + sx.slice(tail);

  let ct = files['[Content_Types].xml'];
  if (!/Extension="png"/.test(ct))
    ct = ct.replace('</Types>', '<Default Extension="png" ContentType="image/png"/></Types>');
  files['[Content_Types].xml'] = ct.replace('</Types>',
    '<Override PartName="/xl/drawings/drawing1.xml" ' +
    'ContentType="application/vnd.openxmlformats-officedocument.drawing+xml"/></Types>');
}

/* ดาวน์โหลดไบต์ที่แก้แล้ว — XLSX.writeFile ใช้ไม่ได้เพราะมันเขียนเองตั้งแต่ต้น */
function saveBytes(u8, name){
  const url = URL.createObjectURL(new Blob([u8],
    { type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
  const a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
}

/* ── import ──────────────────────────────────────────────────────────
   IMPORT holds what the chosen file actually contained. It is written by
   validateWorkbook and read by the wizard; nothing else touches it. */
let IMPORT = null;

function readWorkbook(file){
  return new Promise(function(res, rej){
    const fr = new FileReader();
    fr.onerror = function(){ rej(new Error('อ่านไฟล์ไม่สำเร็จ')); };
    fr.onload  = function(e){
      try { res(XLSX.read(new Uint8Array(e.target.result), { type:'array' })); }
      catch (err) { rej(new Error('ไฟล์นี้ไม่ใช่ .xlsx ที่อ่านได้')); }
    };
    fr.readAsArrayBuffer(file);
  });
}

/* Validation is the reason this exists. Every rejection carries the row number
   as the instructor sees it in Excel, the offending value, and a reason phrased
   as an instruction — an error report you cannot act on is just a smaller
   version of the file. */
function validateWorkbook(wb, fileName){
  const d = D();
  const sh = wb.Sheets['Student_Scores'] || wb.Sheets['คะแนน'] || wb.Sheets[wb.SheetNames[0]];
  if (!sh) throw new Error('ไฟล์ไม่มีชีตข้อมูล');
  /* ฟอร์มของคณะที่กรอกเอง หัวคอลัมน์มีแค่ "กิจกรรมที่ 1" — ชื่อกิจกรรมจริงอยู่ในชีต Mapping_Matrix */
  const alias = {};
  if (wb.Sheets['Mapping_Matrix'])
    XLSX.utils.sheet_to_json(wb.Sheets['Mapping_Matrix'], { header:1, defval:'' }).forEach(function(r){
      if (r && String(r[0]).trim() && String(r[1]).trim()) alias[String(r[0]).trim()] = String(r[1]).trim();
    });
  /* blankrows:true เพื่อให้ดัชนีในอาเรย์ตรงกับเลขแถวในไฟล์ — ถ้าตัดแถวว่างทิ้ง
     เลขแถวที่รายงานจะเลื่อน และรายงานข้อผิดพลาดที่ชี้ผิดแถวคือรายงานที่ใช้ไม่ได้ */
  const base = XLSX.utils.decode_range(sh['!ref']).s.r;
  const all = XLSX.utils.sheet_to_json(sh, { header:1, blankrows:true, defval:'' });
  /* ไฟล์มีหัวเอกสารคั่นอยู่ด้านบน จึงหาแถวหัวตารางจากเนื้อหา ไม่ใช่จากตำแหน่ง —
     และไฟล์รุ่นเก่าที่ไม่มีหัวเอกสารก็ยังนำเข้าได้เพราะหัวตารางอยู่แถวแรกพอดี */
  const hi = all.findIndex(function(r){
    return String((r && r[0]) === undefined ? '' : r[0]).trim() === 'รหัสนักศึกษา'; });
  const aoa = hi >= 0 ? all.slice(hi) : all;
  const rowOffset = base + (hi >= 0 ? hi : 0);       /* เลขแถวตามที่เห็นใน Excel */
  if (aoa.length < 2) throw new Error('ไฟล์ว่าง — ไม่มีแถวข้อมูล');

  const head = aoa[0].map(function(h){ return String(h).trim(); });
  const cols = [];                                   /* column index -> activity */
  head.forEach(function(h, i){
    if (i < 2) return;
    const id = parseHead(h);
    let a = id ? byId(db.activity, id) : null;
    /* หัวแบบฟอร์ม "กิจกรรมที่ n\nชื่อ [id]" — ถ้ารหัสถูกลบ ยังจับจากชื่อบรรทัดสุดท้ายได้ */
    const lines = h.split(/\r?\n/);
    const bare = lines[lines.length - 1].replace(/\s*\[[^\]]*\]\s*$/, '').trim();
    if (!a) a = d.acts.find(function(x){ return bare.indexOf(x.name) === 0; });   /* header renamed, name kept */
    if (!a && alias[lines[0].trim()])
      a = d.acts.find(function(x){ return x.name === alias[lines[0].trim()]; });
    if (a && a.courseId === S.course && !cols.some(function(c){ return c.act.id === a.id; }))
      cols.push({ i:i, act:a });
  });
  if (!cols.length) throw new Error('ไม่พบคอลัมน์คะแนนที่ตรงกับกิจกรรมของรายวิชานี้ — ใช้เทมเพลตของ Sec นี้');

  const byCode = {};
  d.roster.forEach(function(st){ byCode[String(st.studentCode).trim()] = st; });

  const ok = [], rejects = [], seen = {};
  aoa.slice(1).forEach(function(r, ri){
    const row  = ri + 2 + rowOffset;                 /* เลขแถวตามที่ผู้ใช้เห็นใน Excel */
    const code = String((r && r[0]) === undefined ? '' : r[0]).trim();
    if (!code) return;                               /* trailing blank line */
    const st = byCode[code];
    if (!st) {
      rejects.push({ row:row, studentCode:code, field:'รหัสนักศึกษา', value:code,
        reason:'ไม่มีรหัสนี้ใน Sec — เพิ่มรายชื่อก่อน หรือแก้รหัสให้ถูก' });
      return;
    }
    if (seen[code]) {
      rejects.push({ row:row, studentCode:code, field:'รหัสนักศึกษา', value:code,
        reason:'รหัสซ้ำกับแถวที่ ' + seen[code] + ' — เก็บไว้แถวเดียว' });
      return;
    }
    seen[code] = row;
    cols.forEach(function(c){
      const raw = r ? r[c.i] : '';
      if (raw === '' || raw === undefined || raw === null) return;   /* ยังไม่ประเมิน, not zero */
      const v = typeof raw === 'number' ? raw : parseFloat(String(raw).trim());
      const bad = isNaN(v)              ? 'ไม่ใช่ตัวเลข'
                : v < 0                 ? 'คะแนนติดลบ'
                : v > c.act.maxScore    ? 'เกินคะแนนเต็ม ' + c.act.maxScore
                : null;
      if (bad) rejects.push({ row:row, studentCode:code, field:c.act.name,
        value:String(raw), reason:bad + ' — แก้ในไฟล์แล้วนำเข้าใหม่' });
      else ok.push({ studentId:st.id, activityId:c.act.id, score:v });
    });
  });

  return { fileName:fileName, cols:cols, ok:ok, rejects:rejects,
           students:Object.keys(seen).length, courseId:S.course };
}

function commitImport(){
  const im = IMPORT;
  if (!im) return null;
  const logId = 'lx' + Date.now();

  if (im.mode === 'roster') {
    im.ok.forEach(function(x, i){
      db.student.push({ id:'st_' + Date.now() + '_' + i, courseId:im.courseId,
        studentCode:x.studentCode, name:x.name });
    });
    /* kind — the roster import shares this log with score imports; without it
       a roster row reads as a score upload (index-q.sql ScoreUploadLog.kind).
       uploadedBy was hardcoded 'u1', crediting every import to one account. */
    db.scoreUploadLog.unshift({ id:logId, courseId:im.courseId, uploadedBy:me().id,
      fileName:im.fileName, recordsOk:im.ok.length, recordsFail:im.rejects.length,
      kind:'ROSTER', createdAt:'2568-09-07 09:00' });
    im.rejects.forEach(function(r){
      db.uploadReject.push({ logId:logId, row:r.row, studentCode:r.studentCode,
        field:r.field, value:r.value, reason:r.reason });
    });
    IMPORT = null;
    return { ok:im.ok.length, fail:im.rejects.length, mode:'roster' };
  }

  im.ok.forEach(function(x){
    const i = db.score.findIndex(function(y){
      return y.studentId === x.studentId && y.activityId === x.activityId; });
    if (i >= 0) db.score[i].score = x.score;
    else db.score.push({ id:'sc_' + x.studentId + '_' + x.activityId, studentId:x.studentId,
      activityId:x.activityId, score:x.score, uploadedAt:'2568-09-07' });
  });
  db.scoreUploadLog.unshift({ id:logId, courseId:im.courseId, uploadedBy:me().id,
    fileName:im.fileName, recordsOk:im.ok.length, recordsFail:im.rejects.length,
    kind:'SCORE', createdAt:'2568-09-07 09:00' });
  im.rejects.forEach(function(r){
    db.uploadReject.push({ logId:logId, row:r.row, studentCode:r.studentCode,
      field:r.field, value:r.value, reason:r.reason });
  });
  IMPORT = null;
  return { ok:im.ok.length, fail:im.rejects.length };
}

/* Import wizard — the 10-minute flow NFR-09 measures (user-flow §6).
   Step 1 chooses a file, step 2 reports what was in it, step 3 writes. The
   middle step exists so nothing lands in the store before the instructor has
   seen which rows will be refused and why. */
let IMPMODE = 'score';

function modalImport(step){
  const d = D();

  } else if (st === 2 && im) {

    body = '<div class="text-[14px] text-dim mb-4 tnum">' + esc(im.fileName) +
        (roster ? '' : ' · ' + im.cols.length + ' กิจกรรม') + ' · ' + im.students + ' แถวนักศึกษา</div>' +

/* The file input and the drop target are the same code path; a drop is just a
   file chosen a different way. */
function wireDropzone(){
  const inp = document.getElementById('imp-file');
  const dz  = document.getElementById('dropz');
  if (!inp || !dz) return;
  inp.addEventListener('change', function(){ if (inp.files[0]) takeFile(inp.files[0]); });
  ['dragenter','dragover'].forEach(function(ev){
    dz.addEventListener(ev, function(e){ e.preventDefault(); dz.style.borderColor = '#465078';
      dz.style.background = 'var(--tint)'; });
  });
  ['dragleave','drop'].forEach(function(ev){
    dz.addEventListener(ev, function(e){ e.preventDefault(); dz.style.borderColor = 'var(--edge)';
      dz.style.background = ''; });
  });
  dz.addEventListener('drop', function(e){
    const f = e.dataTransfer && e.dataTransfer.files[0];
    if (f) takeFile(f);
  });
}

function takeFile(file){
  if (!XL_OK()) return;
  const err = document.getElementById('imp-err');
  const fail = function(msg){
    if (err) { err.textContent = msg; err.hidden = false; }
    toast(msg, 'bad');
  };
  readWorkbook(file)
    .then(function(wb){
      IMPORT = (IMPMODE === 'roster' ? validateRoster : validateWorkbook)(wb, file.name);
      modalImport(2);
    })
    .catch(function(e){ fail(e.message || 'อ่านไฟล์ไม่สำเร็จ'); });
}

function modalPalette(){

     students of a course you cannot open are not yours to look up either. */
  const scoped = myCourses();
  const ok = {}; scoped.forEach(function(c){ ok[c.id] = true; });
  const items = ROUTES.filter(function(r){ return !r.admin || S.role === 'ADMIN'; })
    .map(function(r){ return { k:'หน้า', label:r.label, route:r.id }; })
    .concat(scoped.map(function(c){
      return { k:'รายวิชา', label:c.code + ' · ' + c.name + ' Sec ' + c.section, course:c.id }; }))

      return { k:'นักศึกษา', label:s.studentCode + ' · ' + s.name, course:s.courseId, student:s.id }; }));
  openModal(modalFrame('ค้นหา',
    '<input class="inp" id="pal-q" placeholder="พิมพ์ชื่อหน้า รหัสวิชา หรือรหัสนักศึกษา…" autocomplete="off">' +
    '<div id="pal-list" class="mt-4 scroll-y" style="max-height:44vh"></div>', ''));

    const qq = (q || '').trim().toLowerCase();
    const hits = items.filter(function(i){ return !qq || i.label.toLowerCase().indexOf(qq) >= 0; }).slice(0, 24);
    list.innerHTML = hits.length === 0
      ? hollow('ไม่พบรายการที่ตรงกับคำค้น')
      : hits.map(function(i){
          return '<button class="w-full text-left px-4 py-2.5 rounded-[10px] hover:bg-wash flex items-center gap-3" ' +
            'data-act="pal-go"' + (i.route ? ' data-route="' + i.route + '"' : '') +
            (i.course ? ' data-course="' + i.course + '"' : '') +
            (i.student ? ' data-student="' + i.student + '"' : '') + '>' +
            '<span class="over w-[70px] shrink-0">' + i.k + '</span>' +
            '<span class="text-[14px] truncate">' + esc(i.label) + '</span></button>';
        }).join('');
  };
  draw('');
  const q = document.getElementById('pal-q');
  q.addEventListener('input', function(){ draw(q.value); });
}

/* ══════════════════════════════════════════════════════════════════
   7 · ROUTER + SHELL PAINTING
   ══════════════════════════════════════════════════════════════════ */
/* §3 — two levels only. System level lives in the sidebar; course level is a
   row of tabs inside the course. UX-01 keeps กิจกรรม and เกณฑ์ on one tab
   because they are edited alternately until the weights reach 100%. */
const ROUTES = [
  { id:'overview',   label:'ภาพรวม',            ic:'gauge',  level:'course', render:viewOverview },
  { id:'clos',       label:'CLO',               ic:'target', level:'course', render:viewClos },
  { id:'objectives', label:'จุดประสงค์',          ic:'check',  level:'course', render:viewObjectives },
  { id:'activities', label:'กิจกรรมและวิธีประเมิน', ic:'link', level:'course', render:viewActivities },
  { id:'roster',     label:'นักศึกษาและคะแนน',   ic:'people', level:'course', render:viewRoster },
  { id:'dashboard',  label:'ผลการประเมิน',       ic:'chart',  level:'course', render:viewDashboard },
  { id:'grading',    label:'การตัดเกรด',         ic:'award',  level:'course', render:viewGrading },
  { id:'courses',    label:'จัดการรายวิชา',       ic:'book',   level:'system', render:viewCourses },
  { id:'users',      label:'จัดการผู้ใช้งาน',     ic:'user',   level:'system', render:viewUsers, admin:true },
  /* ครอบคลุมของแบบจำลองเป็นเครื่องมือตรวจระบบ ไม่ใช่งานของผู้สอน — ย้ายมาระดับผู้ดูแล (2569-09-21) */
  { id:'coverage',   label:'ความครอบคลุมของแบบจำลอง', ic:'check', level:'system', render:viewCoverage, admin:true }
];
const isCourseRoute = function(id){ const r = byId(ROUTES, id); return !!r && r.level === 'course'; };

/* What to do next, derived — never a guess. The first unmet step wins; when
   setup is complete the weekly job (score entry) becomes the one-click action,
   which is what §4.2 asks the home screen to reflect. */
function nextStep(d){
  const b = d.readiness.find(function(r){ return r.state === 'block'; });
  if (b) return { label:b.label, detail:b.detail, route:b.route, cta:'ไปทำขั้นนี้', tone:'bad' };
  if (d.filledCells < d.scoredCells)
    return { label:'กรอกคะแนนที่ยังขาด', route:'roster', tone:'warn',
             detail:'กรอกแล้ว ' + d.filledCells + ' จาก ' + d.scoredCells + ' ช่อง', cta:'กรอกคะแนน' };
  const w = d.readiness.find(function(r){ return r.state === 'warn'; });
  if (w) return { label:w.label, detail:w.detail, route:w.route, cta:'ไปตรวจสอบ', tone:'warn' };
  return { label:'ตั้งค่าครบแล้ว', detail:'อ่านผลการประเมินได้ทันที', route:'dashboard',
           cta:'ดูผลการประเมิน', tone:'ok' };
}

/* The six steps ARE the course navigation. Two signals live on one control:
     · aria-current  — the screen you are looking at
     · data-now      — the first step still unmet, i.e. what to do next
   They are usually the same step and occasionally not, which is exactly the
   moment a user needs to be told the difference. */
/* K4 — ขั้นตอนทีละขั้น · แต่ละขั้นมี "หน้าบ้าน" คงที่หนึ่งหน้า (readiness[].route ของขั้นผูก
   CLO เปลี่ยนไปมาตามสิ่งที่ขาด จึงใช้ไม่ได้สำหรับบอกว่าหน้านี้คือขั้นไหน)
   ขั้นที่ 5 กับ 6 อยู่หน้าเดียวกัน หน้านั้นจึงเป็น "ขั้นที่ 5–6" */
const STEP_HOME = {
  staff:  { act:'course-edit' },
  clo:    { route:'clos' },
  obj:    { route:'objectives' },
  act:    { route:'activities', view:'list' },
  crit:   { route:'activities', view:'matrix' },
  roster: { route:'roster' }
};
const STEP_WHAT = {
  staff:  'เพิ่มอาจารย์ผู้สอนของรายวิชา',
  clo:    'เขียน CLO ของรายวิชา และกำหนดว่าแต่ละข้อมีน้ำหนักในวิชากี่เปอร์เซ็นต์ (รวม 100%)',
  obj:    'แตก CLO แต่ละข้อเป็นจุดประสงค์ที่วัดได้ และกำหนดน้ำหนักในข้อนั้น (รวม 100% ต่อ CLO)',
  act:    'เพิ่มกิจกรรม เลือกประเภทและวิธีประเมิน กำหนดเกณฑ์ผ่าน และให้น้ำหนักรวมได้ 100%',
  crit:   'บอกว่าแต่ละกิจกรรมวัด CLO ข้อไหน กี่เปอร์เซ็นต์ของกิจกรรม',
  roster: 'เพิ่มหรือนำเข้ารายชื่อ แล้วกรอกคะแนนให้ครบทุกกิจกรรมในตารางเดียวกัน'
};
const stepAttrs = function(key){
  const h = STEP_HOME[key];
  return h.act ? 'data-act="' + h.act + '"'
    : 'data-act="step" data-route="' + h.route + '"' + (h.view ? ' data-view="' + h.view + '"' : '');
};
/* ดัชนีของขั้นที่หน้าปัจจุบันเป็นหน้าบ้าน — [] ถ้าไม่ใช่หน้าขั้นตอน (ภาพรวม ผลการประเมิน ตัดเกรด) */
const stepsHere = function(d){
  const out = [];
  d.readiness.forEach(function(r, i){
    const h = STEP_HOME[r.key];
    if (h && h.route === S.route && (!h.view || h.view === subOf(S.route))) out.push(i);
  });
  return out;
};

function stepContext(d){
  const idx = stepsHere(d);
  if (!idx.length) return '';
  const n = d.readiness.length;
  const first = idx[0], last = idx[idx.length - 1];
  const rs = idx.map(function(i){ return d.readiness[i]; });
  return '<div class="stepctx no-print">' +
    '<span class="badge">ขั้นที่ ' + (first + 1) + (last > first ? '–' + (last + 1) : '') + ' จาก ' + n + '</span>' +
    '<div class="min-w-0 flex-1">' +
      '<div class="text-[15px] text-ink">' + rs.map(function(r){ return esc(r.label); }).join(' แล้ว ') + '</div>' +
      '<div class="text-[13px] text-soft">' + rs.map(function(r){ return STEP_WHAT[r.key]; }).join(' · ') + '</div>' +
    '</div>' +
    '<div class="flex items-center gap-2 flex-wrap">' + rs.map(function(r){
      const k = READY[r.state];
      return chip(k.label, k.t) + (r.detail ? tip(r.label + ': ' + r.detail) : '');
    }).join('') + '</div>' +
  '</div>';
}

function stepFooter(d){
  const idx = stepsHere(d);
  if (!idx.length) return '';
  const first = idx[0], last = idx[idx.length - 1], R = d.readiness;
  const prev = first > 0 ? R[first - 1] : null;
  const next = last < R.length - 1 ? R[last + 1] : null;
  const back = prev
    ? '<button class="btn" ' + stepAttrs(prev.key) + '>← ขั้นที่ ' + first + ' · ' + esc(prev.label) + '</button>'
    : '<span></span>';
  const fwd = next
    ? '<button class="btn btn-primary" ' + stepAttrs(next.key) + '>ขั้นที่ ' + (last + 2) + ' · ' + esc(next.label) + ' →</button>'
    : (d.locked ? '<span class="text-[14px] text-dim">ทำขั้นที่ยังไม่เสร็จให้ครบ แล้วจึงดูผลการประเมินได้</span>'
                : btn('ดูผลการประเมิน →', 'primary', 'data-act="goto" data-route="dashboard"'));
  return '<div class="stepfoot no-print">' + back + fwd + '</div>';
}

function stepnav(){
  const d = D();
  const nx = nextStep(d);
  const cur = d.readiness.findIndex(function(r){ return r.state !== 'ok'; });
  let activeIdx = -1;
  d.readiness.forEach(function(r, i){
    if (r.route === S.route && (!r.view || r.view === subOf(S.route))) activeIdx = i;
  });

  const steps = d.readiness.map(function(r, i){
    const k = READY[r.state], c = TONE[k.t];
    const attrs = r.act
      ? 'data-act="' + r.act + '"'
      : 'data-act="step" data-route="' + r.route + '"' + (r.view ? ' data-view="' + r.view + '"' : '');
    return '<button class="stp" ' + attrs +
      (i === activeIdx ? ' aria-current="page"' : '') + (i === cur ? ' data-now="1"' : '') +
      ' title="' + esc(r.label + ' — ' + r.detail) + '">' +
      /* K4 — เลขลำดับไม่ถูกแทนด้วย ✓ อีก: คนที่ทำตามขั้นต้องรู้ว่าตัวเองอยู่ขั้นที่เท่าไร
         สถานะบอกด้วยสีของวงและคำใต้ชื่อขั้น */
      '<span class="num" style="background:' + c.bg + ';color:' + c.tx + '">' + (i + 1) + '</span>' +
      '<span class="lb"><span class="block text-ink">' + r.label + '</span>' +
      '<span class="block text-[12px] truncate" style="color:' +
        (r.state === 'ok' ? 'var(--dim)' : c.tx) + '">' + k.label + '</span></span></button>';
  }).join('');

  const done = nx.tone === 'ok';
  const sameHere = nx.route === S.route;
  return '<div class="stepbar no-print">' +
    '<div class="stepper">' + steps + '</div>' +
    (sameHere ? '' :
    '<div class="nextbar" style="background:' + TONE[nx.tone].bg + '">' +
      '<span class="text-[13px]" style="color:' + TONE[nx.tone].tx + '">' +
        (done ? 'สถานะ' : 'ขั้นต่อไป') + '</span>' +
      '<span class="text-[14px] text-ink">' + esc(nx.label) + '</span>' +
      '<span class="text-[13px] text-dim truncate">' + esc(nx.detail || '') + '</span>' +
      '<span class="ml-auto shrink-0">' +
        btn(nx.cta + ' →', '', 'data-act="goto" data-route="' + nx.route + '"') + '</span>' +
    '</div>') + '</div>';
}

   Teams' own arrangement: an app rail of areas, a list pane that is a tree of

     ไม่มี route = พื้นที่ใช้งาน (กดแล้วกลับไปหน้าล่าสุดของพื้นที่นั้น)
     มี route    = หน้าเดียวเจาะจงภายในพื้นที่ — จัดการรายวิชาอยู่ใต้ รายวิชา เพราะมัน
                   คือ "ทำอะไรกับชุดของรายวิชา" ไม่ใช่รายวิชาหนึ่งที่เปิดอยู่ */
const AREAS = [
  { id:'courses',  label:'รายวิชา',      ic:'book'  },
  { id:'manage',   label:'จัดการรายวิชา', ic:'grid', area:'courses', route:'courses' },

const railNow = function(){

function paintList(){

     คนสอนหลายภาคจะเห็นภาคปัจจุบันอยู่บนสุดเสมอ */
  const ordered = scoped.slice().sort(function(a, b){

  const rows = ordered.filter(function(c){
      return hit(c.code + ' ' + c.name + ' ' + c.section + ' ' + c.year); }).map(function(c){
    const d = derive(c.id);

    const SETUP = ['clos','objectives','activities','roster'];
    const groupOf = function(r){ return SETUP.indexOf(r.id) >= 0 ? 'setup' : (r.id === 'overview' ? 'top' : 'result'); };
    const GROUP_TH = { setup:'ตั้งค่ารายวิชา', result:'ผลลัพธ์' };
    let lastGroup = 'top';
    const chans = !open ? '' : sections.map(function(r){
      const g = groupOf(r);
      const head = g !== lastGroup && GROUP_TH[g]

      lastGroup = g;
      const locked = (r.id === 'dashboard' || r.id === 'grading') && d.locked;

        r.label +
        '<span class="n">' + (locked ? 'ล็อก' : (n !== undefined ? n : '')) + '</span></button>';
    }).join('');
    const term = c.year + '/' + c.semester;
    const termHead = term === lastTerm ? ''
      : '<div class="changroup !mt-3 !ml-0">ภาค ' + c.semester + '/' + c.year + '</div>';
    lastTerm = term;
    return termHead + '<div class="team">' +

        '<span class="tdot" style="background:' + dotCol + '" title="' +
          (d.locked ? 'ยังตั้งค่าไม่ครบ' : (d.warns.length ? 'มีข้อควรตรวจสอบ' : 'พร้อมใช้งาน')) + '"></span>' +
      '</button>' + chans + '</div>';
  }).join('');
  host.innerHTML = rows || '<div class="px-3 py-8 text-center text-[14px] text-dim">ไม่พบรายวิชาที่ตรงกับคำค้น</div>';

/* The signed-in account. Derived rather than stored because the prototype has
   no login — but every screen that needs 'me' must get the same answer, and
   before this it was computed inline in one place and guessed at in others. */
/* The signed-in account. Explicit state, not a lookup from context: deriving
   it from the open course made the identity change as you navigated, which
   quietly cancelled the course scope built on top of it. */
function me(){
  const u = byId(db.user, S.meId);
  if (u && (S.role === 'ADMIN') === (u.role === 'ADMIN')) return u;
  return defaultMe();
}
function defaultMe(){
  const want = S.role === 'ADMIN' ? 'ADMIN' : 'INSTRUCTOR';
  return db.user.find(function(u){ return u.role === want && u.isActive; })
      || db.user.find(function(u){ return u.role === want; })
      || db.user[0];
}
/* Called after the role changes, or after a role/status edit invalidates the
   current choice. */
function clampMe(){
  const before = S.meId;
  S.meId = me().id;
  return S.meId !== before;
}

function paintShell(){
  const me = window.me();
  document.getElementById('hd-user').textContent = me.name;
  document.getElementById('hd-role').textContent = S.role === 'ADMIN' ? 'ผู้ดูแลระบบ' : 'ผู้สอน';
  document.getElementById('hd-initials').textContent =
    me.name.replace(/^[^\s]*\s?/, '').slice(0, 2) || 'CM';
}

/* Committing a cell re-renders the table, which destroys the focused input.
   Remember which cell it was (by its data key, not by node) and put the caret
   back after the new table exists. */
let CELL_FOCUS = null;

function restoreCellFocus(){
  if (!CELL_FOCUS) return;
  const k = CELL_FOCUS; CELL_FOCUS = null;
  const el = document.querySelector('#stage input[data-score="' + k + '"], #stage input[data-crit="' + k + '"]');
  if (el) { el.focus(); el.select(); }
}

const cellKey = function(el){ return el.dataset.score || el.dataset.crit || null; };

/* What this cell holds according to the data, as the string the input would
   show. Authoritative, and needs no event to have fired first. */
function storedCellValue(el){
  const k = cellKey(el); if (!k) return '';
  const parts = k.split('|');
  if (el.dataset.score) {
    const r = db.score.find(function(x){ return x.studentId === parts[0] && x.activityId === parts[1]; });
    return r ? String(r.score) : '';
  }
  const cr = D().critOf(parts[0], parts[1]);
  return cr ? String(Math.round(cr.weight * 100) / 100) : '';
}

/* Spreadsheet keys. Enter and the arrows move down/up a row, Tab moves along
   it — the movement the eye already expects from a grid of numbers. */
function cellNav(e){
  const t = e.target;
  if (!t.dataset || !cellKey(t)) return;
  const attr = t.dataset.score ? 'data-score' : 'data-crit';
  const row = t.closest('tr');
  if (!row) return;
  const inRow = [].slice.call(row.querySelectorAll('input[' + attr + ']'));
  const col = inRow.indexOf(t);
  const rows = [].slice.call(document.querySelectorAll('#stage tbody tr'))
    .filter(function(r){ return r.querySelector('input[' + attr + ']'); });
  const ri = rows.indexOf(row);

  let dest = null;
  if (e.key === 'Enter' || e.key === 'ArrowDown') dest = rows[ri + 1];
  else if (e.key === 'ArrowUp')                   dest = rows[ri - 1];
  else if (e.key === 'Tab')                       dest = null;
  else if (e.key === 'Escape') { t.value = storedCellValue(t); t.blur(); return; }
  else return;

  let next;
  if (e.key === 'Tab') {
    const all = [].slice.call(document.querySelectorAll('#stage input[' + attr + ']'));
    next = all[all.indexOf(t) + (e.shiftKey ? -1 : 1)];
  } else {
    next = dest ? dest.querySelectorAll('input[' + attr + ']')[col] : null;
  }
  if (!next && e.key === 'Tab') return;          // let the browser leave the grid
  e.preventDefault();

  CELL_FOCUS = next ? cellKey(next) : cellKey(t);
  if (t.value !== storedCellValue(t)) t.dispatchEvent(new Event('change', { bubbles:true }));
  else restoreCellFocus();
}
document.addEventListener('focusout', function(e){
  if (!e.target.dataset || !cellKey(e.target)) return;
  const to = e.relatedTarget;
  if (to && to.dataset && cellKey(to)) CELL_FOCUS = cellKey(to);   /* clicked another cell */
});
document.addEventListener('keydown', cellNav, true);

function render(){
  const r = byId(ROUTES, S.route) || ROUTES[0];
  S.area = AREA_OF[r.id] || 'courses';
  const body = r.render();                                   /* fills PAGE */
  /* K4 — หน้าที่เป็นขั้นหนึ่งของการกรอกข้อมูลได้แถบบริบทด้านบนและปุ่มขั้นก่อน/ถัดไปด้านล่าง */
  const dStep = (r.level === 'course' && S.course) ? D() : null;
  document.getElementById('stage').innerHTML =
    body + (dStep ? stepFooter(dStep) : '');
  paintShell(); paintApprail(); paintList(); paintHead();
  /* หลัง paint ทุกอย่างแล้วจึงเก็บสิ่งที่กดไม่ได้ออก — เป็น UX ล้วน ๆ (SEC-1) */
  applyPermissions();
  if (!CELL_FOCUS) document.getElementById('content').scrollTop = 0;
  document.title = 'CMAS · ' + (PAGE.title || r.label);
  restoreCellFocus();
  markClipped();
  /* The panel is outside #stage, so it survives the re-render that a choice
     triggers — but its ● marks would still show the previous choice. */
  const lp = document.getElementById('lyPop');
  if (lp && !lp.hidden) lp.innerHTML = layoutPanelHtml();
  /* Every route or course change ends here, so the URL always names what is on screen. */
  syncHash();
}

/* Writing the hash is refused outright inside a data: URL host (the preview
   pane, some embedded viewers). That refusal is a navigation error, not a
   thrown exception, so try/catch cannot silence it — check the protocol. */
const CAN_HASH = (function(){
  try { return location.protocol !== 'data:' && location.protocol !== 'about:'; }
  catch (e) { return false; }
})();

function go(id){
  let r = byId(ROUTES, id);
  if (!r) return;
  /* A course-level screen with no course selected has nothing to derive from,
     and every entrance can reach one: an instructor with no assignment, the
     last course being deleted, a persisted route from a previous session.
     One guard here beats a null check in each of the six views. */
  if (r.level === 'course' && !S.course) { clampCourse(); if (!S.course) r = byId(ROUTES, 'courses'); }
  if (r.admin && S.role !== 'ADMIN') r = byId(ROUTES, 'courses');
  if (window.matchMedia('(max-width: 1023px)').matches) document.body.dataset.pane = '';
  S.route = r.id;
  saveLayout();
  render();                                            /* render() writes the hash */
}

/* ── Deep links ─────────────────────────────────────────────────────
   A course-level screen carries its course in the hash — #overview/c2,
   #roster/c3 — so a copied URL opens the same screen on the same course
   instead of whichever course the reader last had open. System screens
   (#courses, #users …) stay one segment. */
function hashFor(routeId, cid){
  const r = byId(ROUTES, routeId);
  return '#' + routeId + (r && r.level === 'course' && cid ? '/' + cid : '');
}
function readHash(){
  let h = ''; try { h = decodeURIComponent((location.hash || '').slice(1)); } catch (e) {}
  const p = h.split('/');
  return { route: p[0] || '', course: p[1] || '' };
}
function syncHash(){
  if (!CAN_HASH) return;
  const h = hashFor(S.route, S.course);
  try { if (location.hash !== h) location.hash = h; } catch (e) {}
}
/* Returns true when the hash moved S.course. An unknown or out-of-scope id is
   ignored (with a toast for the latter) — the link degrades to the route alone. */
function courseFromHash(cid){
  if (!cid || cid === S.course || !byId(db.course, cid)) return false;
  if (!inScope(cid)) { toast('รายวิชานี้ไม่ได้อยู่ในความดูแลของคุณ','bad'); return false; }
  S.course = cid; S.filter = {}; S.sort = {}; S.expanded[cid] = true;
  invalidate(); saveLayout();
  return true;
}
function courseUrl(cid, routeId){
  let base = ''; try { base = location.href.split('#')[0]; } catch (e) {}
  return base + hashFor(routeId || 'overview', cid);
}
function copyText(text){
  const fallback = function(){
    const t = document.createElement('textarea');
    t.value = text; t.setAttribute('readonly', ''); t.style.position = 'fixed'; t.style.opacity = '0';
    document.body.appendChild(t); t.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
    t.remove();
    toast(ok ? 'คัดลอกลิงก์แล้ว' : 'คัดลอกไม่ได้ — ' + text, ok ? '' : 'bad');
  };
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(function(){ toast('คัดลอกลิงก์แล้ว'); }, fallback);
  } else fallback();
}
/* ── ขอบเขตของผู้สอน (FR-23) ───────────────────────────────────────
   An ADMIN administers every course; an INSTRUCTOR teaches some of them. The
   difference is not a permission on an action, it is which rows exist as far
   as that person is concerned — so it belongs here, at the source of the list,
   not as a guard bolted onto each screen. */
function myCourses(){
  if (S.role === 'ADMIN') return db.course;
  const mine = {};
  where(db.courseInstructor, 'userId', me().id).forEach(function(ci){ mine[ci.courseId] = true; });
  return db.course.filter(function(c){ return mine[c.id]; });
}
const inScope = function(cid){
  return myCourses().some(function(c){ return c.id === cid; });
};

/* Keeps S.course pointing at something the current role can actually open.
   Called after anything that can change either side of that: the role switch,
   an assignment change, a delete. Returns true if it had to move. */
function clampCourse(){
  const mine = myCourses();
  if (S.course && inScope(S.course)) return false;
  S.course = mine.length ? mine[0].id : null;
  if (S.course) S.expanded[S.course] = true;
  return true;
}

function setCourse(cid){
  const c = byId(db.course, cid);
  if (!c) return;
  if (!inScope(cid)) { toast('รายวิชานี้ไม่ได้อยู่ในความดูแลของคุณ','bad'); return; }
  S.course = cid; S.filter = {}; S.sort = {};
  saveLayout(); render();
  toast('เปลี่ยนไปยัง ' + c.code + ' Sec ' + c.section);
}

/* ══════════════════════════════════════════════════════════════════
   7b · สิทธิ์ตามบทบาทในรายวิชา (PERM · SEC)
   เป้าหมาย: docs/markdown/dev/requirements/course-role-permissions.md
   ยกเลิก ASM-03 — CourseRole เคยเป็นป้ายเฉย ๆ ตอนนี้บังคับใช้จริง
   ══════════════════════════════════════════════════════════════════ */

/* บทบาทของฉันในรายวิชานี้ · null = ไม่ได้สังกัด */
function courseRoleOf(courseId){
  if (S.role === 'ADMIN') return 'ADMIN';
  const ci = db.courseInstructor.find(function(x){
    return x.courseId === courseId && x.userId === me().id; });
  return ci ? ci.role : null;
}

/* §1 · เมทริกซ์สิทธิ์ — หนึ่งบรรทัดคือหนึ่ง capability
   ค่าคือรายชื่อบทบาทที่ทำได้ ไม่มีเงื่อนไขซ่อนอยู่ในโค้ดที่อื่น */
const TEACH = ['INSTRUCTOR'];                      /* D1 · ผู้สอนของรายวิชา — บทบาทเดียว สิทธิ์เท่ากันทุกคน */
const NODEL = TEACH;                               /* การลบไม่ได้แยกสิทธิ์อีกแล้ว คงชื่อไว้ให้ตารางอ่านได้ */
const PERM = {
  /* ── งานประจำในรายวิชา · คะแนน ไฟล์ Excel กิจกรรม ────────────────
     ผู้ดูแลระบบไม่อยู่ในแถวใดเลย — หน้าที่ของผู้ดูแลคือผูกคนเข้ากับรายวิชา
     ไม่ใช่ทำงานในรายวิชาแทนผู้สอน (ดู §1a) */
  'score.edit':      TEACH,                        // P02
  'score.import':    TEACH,                        // P03
  'score.export':    TEACH,                        // P04
  'student.write':   TEACH,                        // P05
  'activity.write':  TEACH,                        // P08  กิจกรรม น้ำหนัก เกณฑ์
  'results.export':  TEACH,                        // P13
  'student.delete':  NODEL,                        // P06
  'activity.delete': NODEL,                        // P08b การลบเป็นสิทธิ์คนละตัวกับการแก้

  /* ── การตัดสินทางวิชาการ · ผู้สอนของรายวิชาทุกคน (D1) ──────────── */
  'clo.write':       TEACH,                        // P07  ผู้สอนหลายคนช่วยกันแก้ CLO ได้ (ข้อเสนอแนะ F4)
  'band.write':      TEACH,                        // P09
  'grading.run':     TEACH,                        // P10
  'grade.override':  TEACH,                        // P11
  'course.settings': TEACH,                        // P12
  'staff.write':     ['ADMIN','INSTRUCTOR'],       // P14  ผู้สอนเพิ่ม/เอาผู้สอนคนอื่นออกจากรายวิชาของตนได้
  'course.create':   ['ADMIN','INSTRUCTOR'],       // P17  ผู้สอนทุกคนเปิดรายวิชาของตนเองได้

  /* ── ระดับระบบ · ผู้ดูแลระบบเท่านั้น ─────────────────────────────
     การลบรายวิชา การแต่งตั้งผู้สอน และบัญชีผู้ใช้ ไม่มีผู้สอนคนใดแตะได้ */
  'course.delete':   ['ADMIN','INSTRUCTOR'],       // P16  ผู้สอนลบวิชาที่ตนสอนได้ · P15 staff.any รวมเข้า staff.write
  'user.manage':     ['ADMIN']                     // P18
};
const CAP_TH = {
  'score.edit':'กรอกและแก้คะแนน', 'score.import':'นำเข้าคะแนน', 'score.export':'ส่งออกคะแนน',
  'student.write':'จัดการรายชื่อนักศึกษา', 'student.delete':'ลบนักศึกษา',
  'clo.write':'จัดการ CLO และวัตถุประสงค์', 'activity.write':'จัดการกิจกรรมและเกณฑ์',
  'activity.delete':'ลบกิจกรรม',
  'band.write':'แก้ขอบเขตเกรด', 'grading.run':'ประมวลผลและตรึงเกรด',
  'grade.override':'ปรับเกรดรายบุคคล', 'course.settings':'ตั้งค่ารายวิชา',
  'results.export':'ส่งออกผลการเรียน', 'staff.write':'จัดการผู้สอนในรายวิชา',
  'course.delete':'ลบรายวิชา',
  'course.create':'สร้างรายวิชา', 'user.manage':'จัดการบัญชีผู้ใช้'
};

/* SEC-3 · ตรวจกับรายวิชาที่ถูกกระทำ ไม่ใช่รายวิชาที่แสดงอยู่ */
function can(cap, courseId){
  const allowed = PERM[cap];
  if (!allowed) return false;                        // SEC-2 · ไม่รู้จัก = ไม่ให้
  if (S.role === 'ADMIN') return allowed.indexOf('ADMIN') >= 0;
  if (cap === 'user.manage')   return false;         // ระดับระบบ ไม่มีบริบทรายวิชา
  if (cap === 'course.create') {
    /* ไม่มีรายวิชาให้ตรวจ เพราะยังไม่มีรายวิชา · ผู้สอนทุกคนที่บัญชียังใช้งานอยู่
       เปิดรายวิชาใหม่ได้ ไม่ต้องสอนวิชาใดมาก่อน (แก้ 2569-09-14)

       เดิมจำกัดไว้ที่ LEAD เพราะกลัวเป็นประตูยกระดับสิทธิ์ แต่ผู้สร้างได้เป็น
       ผู้สอนของ "รายวิชาใหม่ที่ว่างเปล่า" เท่านั้น ไม่ได้สิทธิ์ใดในวิชาของคนอื่น
       จึงไม่ใช่การยกระดับ · ส่วนกติกาเดิมทำให้ผู้สอนใหม่ที่ยังไม่มีวิชาเริ่มงานไม่ได้เลย
       ถ้าผู้ดูแลระบบยังไม่มอบหมาย · วิชาซ้ำกันป้องกันด้วยคีย์ (รหัส, ภาค, ปี, Sec) */
    const u = me();
    return !!u && u.isActive !== false;
  }
  const r = courseRoleOf(courseId === undefined ? S.course : courseId);
  return !!r && allowed.indexOf(r) >= 0;             // ไม่สังกัด = ไม่ได้
}

/* SEC-5 · การถูกปฏิเสธไม่ควรเงียบ — ผู้ใช้ต้องรู้ว่าทำไม และระบบต้องจำไว้ว่าเกิดขึ้น */
let DENY_LAST = {};
function deny(cap, courseId){
  const c = byId(db.course, courseId === undefined ? S.course : courseId);
  const rTh = { INSTRUCTOR:'ผู้สอนของรายวิชานี้' };
  const need = (PERM[cap] || []).filter(function(x){ return x !== 'ADMIN'; })
    .map(function(x){ return rTh[x]; }).join(' หรือ ');
  toast('สิทธิ์ไม่พอ: ' + (CAP_TH[cap] || cap) +
    (need ? ' — ต้องเป็น' + need : ' — เฉพาะผู้ดูแลระบบ'), 'bad');
  /* กันปุ่มรัวเขียนซ้ำ แต่กันแยกตาม capability — ไม่งั้นการปฏิเสธคนละเรื่อง
     ที่เกิดติด ๆ กันจะหายไปจากบันทึก ซึ่งเป็นสิ่งเดียวที่บันทึกมีไว้เพื่อจับ */
  const k = cap + '|' + (c ? c.id : '-');
  if (Date.now() - (DENY_LAST[k] || 0) > 400) {
    DENY_LAST[k] = Date.now();
    authLog(me().id, 'DENY', 'ถูกปฏิเสธ: ' + (CAP_TH[cap] || cap) +
      (c ? ' · ' + c.code + ' Sec ' + c.section : '') +
      ' · บทบาทในรายวิชา: ' + (rTh[courseRoleOf(c ? c.id : S.course)] || 'ผู้ดูแลระบบ/ไม่สังกัด'));
  }
  return false;
}

/* ── action → capability ─────────────────────────────────────────────
   READ_ACTS คือรายการ *ปิด* ของสิ่งที่ไม่เปลี่ยนข้อมูล ทุกอย่างนอกรายการนี้
   ต้องมี capability และถ้าไม่มีในตาราง CAP_OF จะตกลงมาที่ course.settings
   ซึ่งเป็นสิทธิ์สูงสุดที่ไม่ใช่ ADMIN — นั่นคือ SEC-2 ในรูปของโค้ด */
const READ_ACTS = ['acct','area','be','clear-filter','close','copy-link','density','longtext','layout','goto','help',
  'open-section','pal-go','pane-close','pane-toggle','pick-course','profile','profile-save',
  'pw-change','pw-change-save','role','shortcuts','step','student','subnav',
  'toggle-team','user-detail','err-report','errreport','need-bloom','course-group','course-view','act-group-by',
  'import-next','import-prev','import-back','import-pick',
  /* D6/D7 · หน้าเข้าสู่ระบบ — ยังไม่มีบัญชีให้ตรวจสิทธิ์ ออกจากระบบทำได้ทุกคน */
  'auth-go','auth-google','auth-pick','auth-google-other','auth-google-create','auth-login',
  'auth-register','auth-verify','auth-resend','auth-forgot','auth-logout'];

const KIND_CAP = { clo:'clo.write', objective:'clo.write', activity:'activity.write',
                   student:'student.write', band:'band.write', user:'user.manage' };

/* One answer to "what does deleting this kind need", used by the dispatcher
   AND by the second gates inside confirmDelete / crudDelete. Three copies of
   this rule had drifted: course fell through to course.settings (LEAD-only),
   so no ADMIN could delete a course, and activity used activity.write inside
   the dialog while the dispatcher required activity.delete. */
function delCapOf(kind){
  const DEL_CAP = { student:'student.delete', activity:'activity.delete', course:'course.delete' };
  return DEL_CAP[kind] || KIND_CAP[kind] || 'course.settings';
}

function capOf(act, el){
  if (READ_ACTS.indexOf(act) >= 0) return null;
  const kind = el && el.dataset ? el.dataset.kind : null;
  const what = el && el.dataset ? el.dataset.what : null;

  switch (act) {
    case 'crud-new': case 'crud-edit': case 'crud-save':
      return KIND_CAP[kind || FORM_KIND] || 'course.settings';
    case 'crud-delete': case 'crud-del': case 'crud-del-confirm': {
      /* การลบเป็นสิทธิ์คนละตัวกับการแก้ — ตั้งแต่ D1 ผู้สอนทุกคนมีทั้งสองสิทธิ์ แต่ capability ยังแยกไว้
         ทั้งนักศึกษา (P06) และกิจกรรม (P08b) */
      return delCapOf(kind || FORM_KIND);
    }
    case 'move': case 'dup-activity':   return act === 'move' ? 'clo.write' : 'activity.write';
    case 'obj-even':                    return 'clo.write';
    case 'crit-even': return 'activity.write';
    case 'fill-max':  return 'score.edit';
    case 'stu-new-row': case 'stu-row-save': return 'student.write';
    case 'import':                      return what === 'roster' ? 'student.write' : 'score.import';
    case 'import-done':                 return IMPMODE === 'roster' ? 'student.write' : 'score.import';
    case 'template':                    return 'score.export';
    case 'export':                      return what === 'results' ? 'results.export' : 'score.export';
    case 'override': case 'override-save': case 'override-clear': return 'grade.override';
    case 'run-grading':                 return 'grading.run';
    case 'grading-settings': case 'save-grading': return 'band.write';
    case 'course-settings': case 'course-edit': return 'course.settings';
    /* save-course serves BOTH the create and the edit modal. Mapped to
       course.settings alone, the "สร้างรายวิชา" button was hidden from everyone
       except a LEAD of the course already on screen — every ADMIN included,
       since ASM-03b took course.settings away from them. No mode = the stricter
       capability, never the looser one (SEC-2). */
    case 'save-course': return (el && el.dataset && el.dataset.mode === 'create')
                                 ? 'course.create' : 'course.settings';
    case 'del-course': case 'del-course-confirm': return 'course.delete';
    case 'staff-add': case 'staff-del': case 'staff-pick': return 'staff.write';
    case 'add-course': case 'dup-course': return 'course.create';
    case 'weight-mode':                 return 'activity.write';
    case 'toggle-user': case 'pw-reset': case 'pw-reset-do': return 'user.manage';
    default:                            return 'course.settings';   // SEC-2
  }
}

/* ── UI · ซ่อนสิ่งที่กดไม่ได้ ─────────────────────────────────────────
   นี่คือความสะดวก ไม่ใช่การป้องกัน (SEC-1) — ประตูจริงอยู่ใน dispatcher
   ทั้งสองอ่าน can() ตัวเดียวกัน จึงบอกคนละเรื่องกันไม่ได้ */
function applyPermissions(root){
  /* กวาดทั้งหน้า ไม่ใช่รายการ container ที่ต้องจำให้ครบ — ตอนทดสอบพบว่าปุ่ม
     "ตั้งค่ารายวิชา" อยู่ใน #ctTools ไม่ใช่ #stage และรายการแบบนั้นจะขาดเสมอ
     เมื่อมีที่ใหม่เกิดขึ้น · ปุ่มในแถบคำสั่งทั้งหมดเป็น READ_ACTS จึงไม่โดนแตะ */
  const scopes = [root || document.body];
  scopes.forEach(function(sc){
    sc.querySelectorAll('[data-act]').forEach(function(el){
      const cap = capOf(el.dataset.act, el);
      if (!cap) return;
      if (can(cap, el.dataset.course)) { el.hidden = false; return; }
      /* ซ่อน ไม่ใช่ลบ — เจอตอนทดสอบว่าการลบทำให้ paintList() พังเพราะมันถือ
         reference ของ #lpAdd ไว้ · การซ่อนปลอดภัยเพราะ paint ทุกตัวทำงานก่อน
         ฟังก์ชันนี้เสมอ และ [hidden] ใน reset เป็น display:none !important */
      el.hidden = true;
      if ('disabled' in el) el.disabled = true;
    });
  });
}


/* ══════════════════════════════════════════════════════════════════
   8 · INTERACTION
   ══════════════════════════════════════════════════════════════════ */
/* ══════════════════════════════════════════════════════════════════
   AUTH · เข้าสู่ระบบ / ลงทะเบียน (D6, D7 · 2569-09-14)
   A prototype of the FLOW. Nothing in this block is a security boundary —
   the rules that make it safe live on the server (mockup-feedback-plan P8):
     · Google  verify the ID token server-side: aud = our client id,
               iss = accounts.google.com, hd = kmitl.ac.th, email_verified —
               and key the account on the token's `sub`, not on the email.
     · Email   argon2id (FR-02) · verification token = 32 random bytes,
               stored hashed, single use, 24 h expiry · resend rate-limited.
     · Every failure a stranger can trigger reads the same (FR-03), so the
       forms never tell anyone which addresses have accounts.
   ══════════════════════════════════════════════════════════════════ */
/* N3 (2569-09-23) — refactor เป็นคลาส แบ่งตามชั้นเดียวกับ server (code-rule §3)
     EmailPolicy     กฎของอีเมล: รูปแบบ + โดเมนคณะ — ที่เดียวในไฟล์ที่รู้ชื่อโดเมน
     PasswordPolicy  กฎรหัสผ่าน D7 + มิเตอร์ความแข็งแรง
     SessionStore    sessionStorage พร้อมค่าสำรองในหน่วยความจำ (private window / storage ถูกปิด)
     AccountService  งานกับบัญชีใน db: หา สร้าง ยืนยัน จำกัดความถี่ บันทึก AuthEvent
                     ไม่แตะ DOM — คืนผลเป็น object { error } หรือ { user, ... }
     AuthScreen      state ของหน้าจอ + วาด + ตัวจัดการปุ่ม: เรียก service แล้วแปลงผลเป็นหน้าจอ
   EmailPolicy / PasswordPolicy / AccountService คือสิ่งที่จะย้ายไปเป็น auth.validator.ts
   และ auth.service.ts ตอนเขียน server จริง จึงแยกออกจากส่วนที่วาดหน้าจอ */

/* D6 — ลงทะเบียนและเข้าด้วย Google ได้เฉพาะโดเมนคณะ · เทียบแบบตรงตัว:
   subdomain เช่น it.kmitl.ac.th ไม่ผ่าน จนกว่าจะตัดสินใจรับเพิ่มโดยตั้งใจ */
class EmailPolicy {
  constructor(domain){ this.domain = domain; }
  normalize(raw){ return String(raw || '').trim().toLowerCase(); }
  isWellFormed(email){ return /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email); }
  isAllowed(email){ return this.normalize(email).split('@')[1] === this.domain; }
  placeholder(){ return 'name@' + this.domain; }
  /* ข้อความผิดพลาดตัวแรกที่เจอ หรือ null — ใช้ร่วมกันทุกฟอร์มที่รับอีเมล */
  check(email){
    if (!this.isWellFormed(this.normalize(email))) return 'รูปแบบอีเมลไม่ถูกต้อง';
    if (!this.isAllowed(email)) return 'ใช้ได้เฉพาะอีเมลของคณะ (@' + this.domain + ')';
    return null;
  }
}

/* D7 — NIST 800-63B shape: length and a breached/common-password check, no
   forced symbols and no rotation. The server checks the full breached list
   (k-anonymity range query); this short list only makes the rule visible. */
class PasswordPolicy {
  constructor(common){ this.common = common; }
  rules(pw, email){
    const local = (email || '').split('@')[0].toLowerCase();
    const low = (pw || '').toLowerCase();
    return [
      ['ยาวอย่างน้อย 12 ตัวอักษร', (pw || '').length >= 12],
      ['ไม่ใช่รหัสผ่านที่พบบ่อยหรือตัวอักษรซ้ำกันทั้งหมด', !!pw && this.common.indexOf(low) < 0 && !/^(.)\1+$/.test(pw)],
      ['ไม่มีชื่อผู้ใช้จากอีเมลอยู่ในรหัสผ่าน', local.length < 3 || low.indexOf(local) < 0]
    ];
  }
  accepts(pw, email){ return this.rules(pw, email).every(function(r){ return r[1]; }); }
  meterHtml(pw, email){
    const rules = this.rules(pw, email);
    const ok = rules.filter(function(r){ return r[1]; }).length;
    const score = pw ? Math.min(4, ok + ((pw || '').length >= 16 ? 1 : 0)) : 0;
    const lbl = ['—','อ่อนมาก','อ่อน','พอใช้','แข็งแรง'][score];
    const col = ['#E4E5F0','#A2504F','#96793D','#4A5A86','#4F7C68'][score];
    return '<div class="flex gap-1 mt-2" aria-hidden="true">' + [1,2,3,4].map(function(i){
        return '<span class="h-1 flex-1 rounded-full" style="background:' + (i <= score ? col : '#E4E5F0') + '"></span>'; }).join('') + '</div>' +
      '<div class="flex justify-between text-[12.5px] mt-1"><span class="text-dim">ความแข็งแรง</span>' +
        '<span style="color:' + (score ? col : 'var(--dim)') + '">' + lbl + '</span></div>' +
      '<ul class="mt-1.5 space-y-0.5">' + rules.map(function(r){
        return '<li class="text-[13px] ' + (r[1] ? 'text-ok' : 'text-dim') + '">' + (r[1] ? '✓ ' : '○ ') + r[0] + '</li>'; }).join('') +
      '</ul>';
  }
}

class SessionStore {
  constructor(key){ this.key = key; this.mem = null; }
  get(){
    try { const v = sessionStorage.getItem(this.key); return v === null ? this.mem : v; }
    catch (e) { return this.mem; }
  }
  set(v){
    this.mem = v || null;
    try { if (v) sessionStorage.setItem(this.key, v); else sessionStorage.removeItem(this.key); } catch (e) {}
  }
}

/* ทุกเมธอดคืน { error } เมื่อไม่ผ่าน · ข้อความ error คือสิ่งที่ผู้ใช้เห็นตรง ๆ
   กติกา FR-03 (ความล้มเหลวที่คนแปลกหน้ากระตุ้นได้ต้องอ่านเหมือนกันหมด) จึงอยู่ในชั้นนี้ ไม่ใช่ที่หน้าจอ */
class AccountService {
  constructor(emails, passwords, demoPw){
    this.emails = emails; this.passwords = passwords;
    this.demoPw = demoPw;   /* prototype only — seeded accounts carry no real password */
    this.fails = [];
  }
  find(email){
    const e = this.emails.normalize(email);
    return db.user.find(function(x){ return x.email.toLowerCase() === e; }) || null;
  }
  log(uid, action, detail){
    db.authEvent.unshift({ id:'ae' + Date.now() + Math.random().toString(36).slice(2, 6), userId:uid, actorId:uid,
      action:action, detail:detail, at:'2568-09-07 09:00' });
  }
  /* FR-04 — five failures in 15 minutes. Counted per browser here; the server
     counts per IP and per account. */
  throttled(){
    this.fails = this.fails.filter(function(t){ return Date.now() - t < 15 * 60000; });
    return this.fails.length >= 5;
  }
  login(email, pw){
    if (this.throttled()) return { error:'ลองเข้าสู่ระบบบ่อยเกินไป — รอ 15 นาทีแล้วลองใหม่' };
    const u = this.find(email);
    const pwOk = !!u && u.authProvider !== 'GOOGLE' && pw === (u._demoPw || this.demoPw);
    /* FR-03 — unknown address, wrong password and a suspended account read the same. */
    if (!pwOk || u.isActive === false) { this.fails.push(Date.now()); return { error:'อีเมลหรือรหัสผ่านไม่ถูกต้อง' }; }
    /* Only reachable with the right password, so it tells nothing to a stranger. */
    if (u.emailVerified === false) return { user:u, unverified:true };
    return { user:u };
  }
  register(name, email, pw, pw2){
    if (!name) return { error:'กรอกชื่อ-สกุลก่อน' };
    const bad = this.emails.check(email);
    if (bad) return { error:bad };
    if (!this.passwords.accepts(pw, email)) return { error:'รหัสผ่านยังไม่ผ่านเงื่อนไขใต้ช่องรหัสผ่าน' };
    if (pw !== pw2) return { error:'รหัสผ่านสองช่องไม่ตรงกัน' };
    /* ผลลัพธ์หน้าตาเหมือนกันไม่ว่าอีเมลนี้มีบัญชีอยู่แล้วหรือไม่ (pendingId เป็น null เฉย ๆ)
       มิฉะนั้นฟอร์มนี้จะตอบคำถาม "X มีบัญชีไหม" · server จริงส่งอีเมลแจ้งเจ้าของเดิมแทนลิงก์ */
    if (this.find(email)) return { pendingId:null };
    const u = { id:'u_' + Date.now(), email:this.emails.normalize(email), name:name, role:'INSTRUCTOR', isActive:true,
                emailVerified:false, authProvider:'EMAIL',
                _demoPw:pw };   /* prototype only — the server keeps an argon2id hash (FR-02), never this */
    db.user.push(u);
    this.log(u.id, 'REGISTER', 'ลงทะเบียนด้วยอีเมล · รอยืนยันอีเมล');
    return { pendingId:u.id };
  }
  /* Single use: the same link opened twice must not verify twice. */
  verify(uid){
    const u = uid ? byId(db.user, uid) : null;
    if (!u || u.emailVerified !== false) return { error:'ลิงก์นี้ใช้ไปแล้วหรือหมดอายุ — เข้าสู่ระบบเพื่อขอลิงก์ใหม่' };
    u.emailVerified = true;
    this.log(u.id, 'VERIFY', 'ยืนยันอีเมลแล้ว');
    return { user:u };
  }
  /* hd — checked on the verified token server-side, never on what the browser claims */
  google(email){
    const e = this.emails.normalize(email);
    if (!this.emails.isWellFormed(e)) return { error:'รูปแบบอีเมลไม่ถูกต้อง' };
    if (!this.emails.isAllowed(e))
      return { error:'ใช้ได้เฉพาะบัญชี Google ของคณะ (@' + this.emails.domain + ') — บัญชีส่วนตัวเข้าระบบนี้ไม่ได้' };
    const u = this.find(e);
    if (!u) return { isNew:true, email:e };
    /* Google has already proven who this is, so naming the suspension leaks nothing. */
    if (u.isActive === false) return { error:'บัญชีนี้ถูกระงับการใช้งาน — ติดต่อผู้ดูแลระบบ' };
    if (u.emailVerified === false) u.emailVerified = true;   /* Google proved the mailbox */
    return { user:u };
  }
  createFromGoogle(email, name){
    if (!name) return { error:'กรอกชื่อ-สกุลก่อน' };
    if (this.find(email)) return { error:'มีบัญชีสำหรับอีเมลนี้แล้ว — กลับไปเข้าสู่ระบบด้วย Google' };
    const u = { id:'u_' + Date.now(), email:this.emails.normalize(email), name:name, role:'INSTRUCTOR', isActive:true,
                emailVerified:true, authProvider:'GOOGLE' };
    db.user.push(u);
    this.log(u.id, 'REGISTER', 'ลงทะเบียนด้วย Google');
    return { user:u };
  }
}
