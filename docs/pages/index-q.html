const LONGTEXT_SUB = { clip:'ทุกแถวสูงเท่ากัน · คลิกที่ข้อความเพื่อกางดูเต็ม',
                       full:'แถวสูงตามเนื้อหา ข้อความยาวดันแถวให้สูงขึ้น' };

function layoutBtn(){
  return '<button id="lyBtn" class="lybtn" data-act="layout" aria-haspopup="dialog" aria-expanded="false">' +
    '<svg width="15" height="15" viewBox="0 0 20 20" fill="none" stroke="currentColor" ' +
      'stroke-width="1.5" stroke-linecap="round" aria-hidden="true">' +
      '<rect x="3" y="3.5" width="14" height="13" rx="2"/><path d="M3 8h14"/><path d="M3 12h14"/>' +
    '</svg>มุมมองตาราง</button>';
}

/* Rendered fresh every time the panel opens or a choice changes, so the marked
   option is read from S rather than tracked separately and drifting from it. */
function layoutPanelHtml(){
  const group = function(title, keys, cur, act, TH, SUB){
    return '<div class="over px-2.5 pt-1.5 pb-1">' + title + '</div>' +
      keys.map(function(k){
        return '<button class="lyitem" data-act="' + act + '" data-val="' + k + '"' +
          (cur === k ? ' aria-pressed="true"' : '') + '>' +
          '<span class="lytick">' + (cur === k ? '●' : '○') + '</span>' +
          '<span class="min-w-0 flex-1">' +
            '<span class="block text-[14px] text-ink">' + TH[k] + '</span>' +
            '<span class="block text-[13px] text-dim leading-snug mt-0.5">' + SUB[k] + '</span>' +
          '</span></button>';
      }).join('');
  };
  return group('ความหนาแน่นของแถว', DENSITY, S.density, 'density', DENSITY_TH, DENSITY_SUB) +
    '<div class="hair-t mt-1.5 pt-0.5">' +
      group('ข้อความยาวในตาราง', LONGTEXT, S.longtext, 'longtext', LONGTEXT_TH, LONGTEXT_SUB) +
    '</div>';
}

/* Anchored under its own button, the same way the ? popover is — a settings
   panel this small does not deserve a dimmed page behind it. */
function layoutPop(force){
  const pop = document.getElementById('lyPop');
  const btn = document.getElementById('lyBtn');
  const open = force === undefined ? pop.hidden : force;
  if (!open) {
    pop.classList.remove('on');
    setTimeout(function(){ if (!pop.classList.contains('on')) pop.hidden = true; }, 150);
    if (btn) btn.setAttribute('aria-expanded', 'false');
    return;
  }
  pop.innerHTML = layoutPanelHtml();
  pop.hidden = false;
  if (btn) {
    btn.setAttribute('aria-expanded', 'true');
    const r = btn.getBoundingClientRect();
    pop.style.top = (window.scrollY + r.bottom + 8) + 'px';
    pop.style.left = Math.max(12, Math.min(window.scrollX + r.right - 268,
                              window.scrollX + window.innerWidth - 268 - 16)) + 'px';
  }
  requestAnimationFrame(function(){ pop.classList.add('on'); });
}

/* A cell is clickable only when its text is ACTUALLY cut off — marking every
   prose cell would promise more text where there is none. Measured after paint
   because scrollWidth means nothing until the row has been laid out. Rows that
   are themselves links are skipped: there, a click already opens the record,
   which is where the full text lives. */
function markClipped(){
  /* One frame later, not inline after innerHTML. Measured inline, every cell
     reported as overflowing: the table had not been given its final width yet,
     so scrollWidth was the text and clientWidth was nearly nothing. The result
     was four cells offering to unfold text that already fitted. */
  requestAnimationFrame(function(){
    document.querySelectorAll('.clip').forEach(function(el){
      const cut = S.longtext === 'clip' && el.scrollWidth - el.clientWidth > 1 &&
                  !el.closest('tr.rowlink');
      el.classList.toggle('more', cut);
      if (!cut) el.classList.remove('open');
    });
  });
}
/* A column that fitted at one window width stops fitting at another. */
window.addEventListener('resize', markClipped);

/* ไอคอนนำหน้าข้อความปุ่ม — ไอคอนช่วยให้หาเจอ ข้อความบอกว่าทำอะไร จึงใช้คู่กันเสมอ */
const withIcon = function(name, label){
  return '<span class="inline-flex items-center gap-1.5">' + icon(name, 'w-4 h-4 shrink-0') + label + '</span>';
};
const btn = function(label, kind, attr){
  const a = attr || '';
  if (kind === 'primary') return '<button ' + a + ' class="btn btn-primary">' + label + '</button>';
  if (kind === 'quiet')   return '<button ' + a + ' class="btn btn-quiet">' + label + '</button>';
  return '<button ' + a + ' class="btn">' + label + '</button>';
};

const statbar = function(cells){ return '<div class="statbar">' + cells + '</div>'; };
const stat = function(label, value, sub, t){
  const c = t ? TONE[t] : null;
  return '<div class="statcell"><div class="over">' + label + '</div>' +
    '<div class="tnum text-[26px] font-light leading-none mt-1.5"' +
      (c ? ' style="color:' + c.tx + '"' : '') + '>' + value + '</div>' +
    '<div class="text-[13px] text-dim mt-1.5 leading-snug">' + sub + '</div></div>';
};

const chip = function(text, t){
  const c = TONE[t] || TONE.nil;
  return '<span class="inline-flex items-center gap-1.5 px-2.5 py-1 text-[13px] rounded-sm whitespace-nowrap" ' +
    'style="background:' + c.bg + ';color:' + c.tx + '">' + text + '</span>';
};

/* คำตัดสินของ CLO หนึ่งข้อ (CR-04) — ตาราง ภาพรวม และการ์ด CLO ต้องพูดคำเดียวกันเสมอ */
const verdictChip = function(a){
  return a.share === null ? chip('ยังไม่มีคะแนน','nil') : chip(a.met ? 'บรรลุ' : 'ไม่บรรลุ', a.met ? 'ok' : 'bad');
};

const pill = function(text){
  return '<span class="text-[13px] px-2.5 py-1 rounded-xs bg-wash text-ink2 whitespace-nowrap">' + text + '</span>';
};

const meter = function(pct, target, t){
  if (pct === null || pct === undefined) return '<div class="meter"></div>';
  const col = TONE[t || tone(pct, target)].bar;
  return '<div class="meter" role="img" aria-label="' + n2(pct) +
    (target === null || target === undefined ? '%' : '% เทียบเกณฑ์ ' + n0(target) + '%') + '">' +
    '<i style="width:' + Math.max(2, Math.min(100, pct)) + '%;background:' + col + '"></i>' +
    (target === null || target === undefined ? '' :
      '<b style="left:' + Math.max(0, Math.min(100, target)) + '%"></b>') + '</div>';
};

const bloomChip = function(level){
  if (!level) return '<button class="text-[12.5px] px-2 py-1 rounded-xs whitespace-nowrap" ' +
    'style="background:#F4EEE1;color:#96793D" data-act="need-bloom">ยังไม่ระบุระดับ Bloom</button>';
  const rank = ['REMEMBER','UNDERSTAND','APPLY','ANALYZE','EVALUATE','CREATE'].indexOf(level);
  const shade = ['#F1F2F8','#E6E8F4','#D6DAEE','#C8CDEB','#AFAECC','#85758F'][rank];
  const fg = rank >= 4 ? '#FFFFFF' : '#1E233C';
  return '<span class="text-[12px] px-2 py-1 rounded-xs whitespace-nowrap" style="background:' + shade +
    ';color:' + fg + '" title="Bloom · ' + level + '">L' + (rank+1) + ' ' + BLOOM_TH[level] + '</span>';
};

/* D4 — SOLO sits beside Bloom, never instead of it. Same "missing is a prompt,
   not a default" rule as bloomChip. */
const soloChip = function(level){
  if (!level) return '<button class="text-[12.5px] px-2 py-1 rounded-xs whitespace-nowrap" ' +
    'style="background:#F4EEE1;color:#96793D" data-act="need-bloom">ยังไม่ระบุระดับ SOLO</button>';
  const rank = ['SURFACE','DEEP','TRANSFER'].indexOf(level);
  const shade = ['#E6E8F4','#C8CDEB','#85758F'][rank];
  return '<span class="text-[12px] px-2 py-1 rounded-xs whitespace-nowrap" style="background:' + shade +
    ';color:' + (rank === 2 ? '#FFFFFF' : '#1E233C') + '" title="SOLO · ' + SOLO_HINT[level] + '">S' +
    (rank+1) + ' ' + SOLO_TH[level] + '</span>';
};

/* ── charts ───────────────────────────────────────────────────────────
   Inline SVG, no library. Three rules across all of them: the axis starts at
   zero, every series is labelled where it is drawn, and colour repeats the
   same meaning it has everywhere else in the app. */
const CH = { ok:TONE.ok.bar, risk:TONE.bad.bar, pend:'#D7D9E8', line:'#E4E5F0', ink:'#1E233C', dim:'#878CB4' };

const chartHead = function(title, sub, help, right, hero){
  return '<div class="chart-head' + (hero ? ' hero' : '') + '"><div class="min-w-0">' +
    '<h2 class="chart-title">' + title + (help ? tip(help) : '') + '</h2>' +
    (sub ? '<div class="chart-sub">' + sub + '</div>' : '') + '</div>' +
    (right ? '<div class="chart-right">' + right + '</div>' : '') + '</div>';
};

const legend = function(items){
  return '<div class="flex items-center gap-4 flex-wrap text-[13px] text-ink2">' +
    items.map(function(i){
      return '<span class="flex items-center gap-1.5">' +
        '<span style="width:9px;height:9px;border-radius:2px;background:' + i[1] + ';display:inline-block"></span>' +
        i[0] + '</span>'; }).join('') + '</div>';
};

/* One horizontal bar per CLO, split into ผ่าน / ต่ำกว่าเกณฑ์ / ยังไม่ครบ, with
   the class target drawn on top. Horizontal, because the labels are Thai and
   read left to right — a vertical chart forces the eye to rotate. */
function chartAttainment(d){
  const rows = d.attain;
  if (!rows.length) return hollow('ยังไม่มี CLO');
  const n = d.roster.length || 1;
  const rowH = 44, padL = 62, padR = 76, W = 660;
  const H = rows.length * rowH + 26;
  const plotW = W - padL - padR;

  const ticks = [0,25,50,75,100].map(function(v){
    const x = padL + plotW * v / 100;
    return '<line x1="' + x + '" y1="14" x2="' + x + '" y2="' + (H - 14) +
      '" stroke="' + CH.line + '"' + (v ? ' stroke-dasharray="2 4"' : '') + '/>' +
      '<text x="' + x + '" y="' + (H - 2) + '" text-anchor="middle" font-size="10.5" fill="' + CH.dim + '">' + v + '%</text>';
  }).join('');

  const bars = rows.map(function(a, i){
    const y = 18 + i * rowH;
    const w = function(c){ return plotW * c / n; };
    const segs = [[a.pass, CH.ok, 'ผ่าน'], [a.risk, CH.risk, 'ต่ำกว่าเกณฑ์'], [a.pending, CH.pend, 'ยังไม่ครบ']];
    let x = padL, out = '';
    segs.forEach(function(sg){
      if (!sg[0]) return;
      const bw = w(sg[0]);
      out += '<rect x="' + x + '" y="' + y + '" width="' + bw + '" height="18" fill="' + sg[1] + '">' +
        '<title>CLO ' + a.clo.number + ' · ' + sg[2] + ' ' + sg[0] + ' คน</title></rect>' +
        (bw > 22 ? '<text x="' + (x + bw / 2) + '" y="' + (y + 13) + '" text-anchor="middle" font-size="11.5" ' +
          'fill="' + (sg[1] === CH.pend ? CH.dim : '#fff') + '">' + sg[0] + '</text>' : '');
      x += bw;
    });
    const tx = padL + plotW * a.target / 100;
    return out +
      '<rect x="' + padL + '" y="' + y + '" width="' + plotW + '" height="18" fill="none" rx="3" ' +
        'stroke="' + CH.line + '"/>' +
      /* G1 — เป้า 100 คือขอบขวาของกล่องอยู่แล้ว ไม่ต้องขีดทับ */
      (a.target >= 100 ? '' :
        '<line x1="' + tx + '" y1="' + (y - 4) + '" x2="' + tx + '" y2="' + (y + 22) +
        '" stroke="' + CH.ink + '" stroke-width="1.5" stroke-linecap="round"><title>เป้าหมาย ' + n0(a.target) + '%</title></line>') +
      '<text x="' + (padL - 9) + '" y="' + (y + 13) + '" text-anchor="end" font-size="12.5" fill="' + CH.ink + '">CLO ' + a.clo.number + '</text>' +
      '<text x="' + (W - padR + 8) + '" y="' + (y + 13) + '" font-size="12.5" fill="' +
        (a.met ? TONE.ok.tx : TONE.bad.tx) + '">' + (a.share === null ? '—' : n2(a.share) + '%') + '</text>';
  }).join('');

  return '<div class="p-4 pt-3">' +
    legend([['ผ่าน', CH.ok], ['ต่ำกว่าเกณฑ์', CH.risk], ['ยังประเมินไม่ครบ', CH.pend]]) +
    '<div class="scroll-x mt-3"><svg viewBox="0 0 ' + W + ' ' + H + '" class="h-auto" ' +
      'style="min-width:560px;width:100%" role="img" ' +
      'aria-label="สัดส่วนผู้ผ่านแต่ละ CLO">' + ticks + bars + '</svg></div></div>';
}

/* Radar — one axis per CLO: the share of assessed students who passed it.
   L1 — every course gets one, so the reader always finds the same picture in the
   same place. What the chart may not do is invent a number:
   · no CLO      → the rings alone, saying so
   · locked      → axes and CLO labels, no shape, saying why
   · 1–2 CLO     → circular rings; two axes draw a line, one draws a point
   · 3+ CLO      → the full polygon */
function chartRadar(d){
  const rows = d.attain, n = rows.length, locked = d.locked;
  const W = 460, H = 340, cx = 230, cy = 172, R = 112;
  const f1 = function(x){ return x.toFixed(1); };
  const pt = function(i, v){
    const ang = -Math.PI / 2 + i * 2 * Math.PI / Math.max(n, 1);
    return [cx + Math.cos(ang) * R * v / 100, cy + Math.sin(ang) * R * v / 100];
  };
  const poly = function(vals){
    return vals.map(function(v, i){ const p = pt(i, v); return f1(p[0]) + ',' + f1(p[1]); }).join(' ');
  };

  const rings = [25,50,75,100].map(function(v){
    const dash = v === 100 ? '' : ' stroke-dasharray="2 4"';
    return n >= 3
      ? '<polygon points="' + poly(rows.map(function(){ return v; })) + '" fill="none" stroke="' + CH.line + '"' + dash + '/>'
      : '<circle cx="' + cx + '" cy="' + cy + '" r="' + f1(R * v / 100) + '" fill="none" stroke="' + CH.line + '"' + dash + '/>';
  }).join('') +
    (n === 0 ? '' : [50,100].map(function(v){ const p = pt(0, v);
      return '<text x="' + f1(p[0] + 5) + '" y="' + f1(p[1] + 3) + '" font-size="10" fill="' + CH.dim + '">' + v + '%</text>'; }).join(''));

  const spokes = rows.map(function(_, i){ const p = pt(i, 100);
    return '<line x1="' + cx + '" y1="' + cy + '" x2="' + f1(p[0]) + '" y2="' + f1(p[1]) + '" stroke="' + CH.line + '"/>'; }).join('');

  const labels = rows.map(function(a, i){
    const q = pt(i, 124);
    const anchor = Math.abs(q[0] - cx) < 8 ? 'middle' : (q[0] > cx ? 'start' : 'end');
    const val = locked || a.share === null ? '—' : n0(a.share) + '%';
    const col = locked || a.share === null ? CH.dim : (a.met ? TONE.ok.tx : TONE.bad.tx);
    return '<text x="' + f1(q[0]) + '" y="' + f1(q[1] + 4) + '" text-anchor="' + anchor + '" font-size="12.5" fill="' + CH.ink + '">' +
      'CLO ' + a.clo.number + ' <tspan fill="' + col + '">' + val + '</tspan></text>';
  }).join('');

  /* A value only where one exists: a locked course draws no shape at all. */
  const vals = rows.map(function(a){ return a.share === null ? 0 : a.share; });
  const shape = (locked || n === 0) ? ''
    : n >= 3
      ? '<polygon points="' + poly(vals) + '" fill="rgba(70,80,120,.16)" stroke="#465078" stroke-width="1.8" stroke-linejoin="round"/>'
      : n === 2
        ? '<polyline points="' + poly(vals) + '" fill="none" stroke="#465078" stroke-width="1.8"/>'
        : '';
  const marks = (locked || n === 0) ? '' : rows.map(function(a, i){
    const p = pt(i, a.share === null ? 0 : a.share);
    const col = a.share === null ? CH.pend : (a.met ? CH.ok : CH.risk);
    return '<circle cx="' + f1(p[0]) + '" cy="' + f1(p[1]) + '" r="4" fill="' + col + '" stroke="#fff" stroke-width="1.5">' +
      '<title>CLO ' + a.clo.number + ' · ผ่าน ' + a.pass + '/' + a.n + ' คน' +
      (a.share === null ? '' : ' (' + n2(a.share) + '%)') + '</title></circle>';
  }).join('');

  const centre = function(text){
    const w = text.length * 7.2 + 24;
    return '<rect x="' + f1(cx - w / 2) + '" y="' + (cy - 14) + '" width="' + f1(w) + '" height="28" rx="14" fill="#fff" stroke="' + CH.line + '"/>' +
      '<text x="' + cx + '" y="' + (cy + 4) + '" text-anchor="middle" font-size="13" fill="' + CH.dim + '">' + text + '</text>';
  };
  const overlay = n === 0 ? centre('ยังไม่มี CLO') : (locked ? centre('ยังคำนวณไม่ได้') : '');

  const note = n === 0 ? 'เพิ่ม CLO แล้วแกนของแต่ละข้อจะขึ้นที่นี่'
    : locked ? 'แสดงเฉพาะแกนของ CLO — ตั้งค่าขั้นที่ยังไม่เสร็จให้ครบ แล้วสัดส่วนผู้ผ่านจะขึ้นบนกราฟ'
    : n < 3 ? 'มี CLO ' + n + ' ข้อ — ' + (n === 2 ? 'สองแกนจึงเป็นเส้น' : 'แกนเดียวจึงเป็นจุด') +
              ' ไม่ใช่รูปทรง ตัวเลขที่ปลายแกนอ่านได้ตามปกติ'
    : '';

  return '<div class="p-4 pt-3">' +
    (locked || n === 0 ? '' : legend([['สัดส่วนผู้ผ่าน', '#465078'], ['ทุกคนผ่าน', CH.ok], ['ยังมีคนไม่ผ่าน', CH.risk]])) +
    '<div class="scroll-x mt-2"><svg viewBox="0 0 ' + W + ' ' + H + '" class="radar-min h-auto mx-auto block" ' +
      'style="width:100%;max-width:560px" role="img" ' +
      'aria-label="กราฟเรดาร์ สัดส่วนผู้ผ่านของแต่ละ CLO วงนอกสุดคือทุกคนผ่าน' + (note ? ' · ' + note : '') + '">' +
      rings + spokes + shape + marks + labels + overlay + '</svg></div>' +
    (note ? '<div class="text-[13px] mt-2 text-center text-soft">' + note + '</div>' : '') +
  '</div>';
}

/* Course status at a glance. A donut, because there are three parts of one
   whole and the whole (the roster) is the fact worth seeing. */
function chartStatus(d){
  const pass = d.complete.filter(function(r){ return r.passCourse === true; }).length;
  const fail = d.complete.length - pass;
  const pend = d.rows.length - d.complete.length;
  const total = d.rows.length;
  if (!total) return hollow('ยังไม่มีนักศึกษา');

  const R = 54, SW = 18, C = 2 * Math.PI * R;
  let off = 0;
  const arcs = [[pass, CH.ok, 'ผ่านรายวิชา'], [fail, CH.risk, 'ไม่ผ่าน'], [pend, CH.pend, 'รอประเมิน']]
    .map(function(sg){
      if (!sg[0]) return '';
      const len = C * sg[0] / total;
      const el = '<circle r="' + R + '" cx="70" cy="70" fill="none" stroke="' + sg[1] + '" stroke-width="' + SW +
        '" stroke-dasharray="' + len + ' ' + (C - len) + '" stroke-dashoffset="' + (-off) +
        '" transform="rotate(-90 70 70)"><title>' + sg[2] + ' ' + sg[0] + ' คน</title></circle>';
      off += len; return el;
    }).join('');

  return '<div class="p-4 flex items-center gap-5 flex-wrap">' +
    '<svg viewBox="0 0 140 140" style="width:128px;height:128px" role="img" aria-label="สถานะนักศึกษาในรายวิชา">' +
      '<circle r="' + R + '" cx="70" cy="70" fill="none" stroke="#F1F2F8" stroke-width="' + SW + '"/>' + arcs +
      '<text x="70" y="66" text-anchor="middle" font-size="27" fill="' + CH.ink + '">' + total + '</text>' +
      '<text x="70" y="84" text-anchor="middle" font-size="11.5" fill="' + CH.dim + '">คน</text></svg>' +
    '<div class="space-y-2 min-w-[132px]">' +
      [[pass, CH.ok, 'ผ่านรายวิชา'], [fail, CH.risk, 'ไม่ผ่าน'], [pend, CH.pend, 'รอประเมิน']].map(function(sg){
        return '<div class="flex items-center gap-2.5 text-[14px]">' +
          '<span style="width:9px;height:9px;border-radius:2px;background:' + sg[1] + '"></span>' +
          '<span class="text-ink2 flex-1">' + sg[2] + '</span>' +
          '<span class="tnum text-ink">' + sg[0] + '</span>' +
          '<span class="tnum text-dim w-[42px] text-right">' + n0(sg[0] / total * 100) + '%</span></div>';
      }).join('') + '</div></div>';
}


/* G2 · สองคำถามต่อกิจกรรมในภาพเดียว — ชั้นทำคะแนนเฉลี่ยได้เท่าไร และมีกี่ส่วนที่ถึงเกณฑ์
   สองค่านี้ไม่เท่ากัน กิจกรรมที่เฉลี่ยสวยแต่คนผ่านน้อยคือกิจกรรมที่คะแนนกระจุกอยู่กับคนกลุ่มเดียว

   T3 (2569-09-17) — “ผ่านกิจกรรม” มีในสคีมาแล้ว: Activity.passMark (% ของคะแนนเต็ม) ของแต่ละกิจกรรม */
function actStats(d){
  return d.acts.map(function(a){
    const cut = a.passMark;
    const vals = d.roster.map(function(s){
      const sc = d.scoreOf(s.id, a.id);
      return sc === null ? null : (sc / a.maxScore) * 100;
    }).filter(function(v){ return v !== null; });
    const pass = vals.filter(function(v){ return v >= cut; }).length;
    return { a:a, n:vals.length, pass:pass,
             avg: vals.length ? vals.reduce(function(t,v){ return t + v; }, 0) / vals.length : null,
             share: vals.length ? (pass / vals.length) * 100 : null };
  });
}

function chartActivity(d){
  const rows = actStats(d);
  if (!rows.length) return hollow('ยังไม่มีกิจกรรม');
  const rowH = 40, padL = 132, padR = 56, W = 640, H = rows.length * rowH + 26;
  const plotW = W - padL - padR;
  const x = function(v){ return padL + plotW * Math.max(0, Math.min(100, v)) / 100; };

  const ticks = [0,25,50,75,100].map(function(v){
    return '<line x1="' + x(v) + '" y1="12" x2="' + x(v) + '" y2="' + (H - 14) + '" stroke="' + CH.line + '"' +
      (v ? ' stroke-dasharray="2 4"' : '') + '/>' +
      '<text x="' + x(v) + '" y="' + (H - 2) + '" text-anchor="middle" font-size="10.5" fill="' + CH.dim + '">' + v + '%</text>';
  }).join('');

  const bars = rows.map(function(r, i){
    const y = 16 + i * rowH;
    const nm = r.a.name.length > 17 ? r.a.name.slice(0, 16) + '…' : r.a.name;
    const one = function(val, yy, col, lbl){
      if (val === null) return '<text x="' + (padL + 6) + '" y="' + (yy + 9) + '" font-size="11" fill="' + CH.dim +
        '">ยังไม่มีคะแนน</text>';
      return '<rect x="' + padL + '" y="' + yy + '" width="' + (x(val) - padL) + '" height="11" rx="2" fill="' + col + '">' +
        '<title>' + esc(r.a.name) + ' · ' + lbl + ' ' + n2(val) + '%</title></rect>' +
        '<text x="' + (W - padR + 8) + '" y="' + (yy + 9.5) + '" font-size="11.5" fill="' + CH.ink + '">' + n0(val) + '%</text>';
    };
    return '<text x="' + (padL - 9) + '" y="' + (y + 12) + '" text-anchor="end" font-size="12.5" fill="' + CH.ink + '">' +
        esc(nm) + '<title>' + esc(r.a.name) + ' · น้ำหนัก ' + r.a.weight + '% · เต็ม ' + r.a.maxScore +
        ' · เกณฑ์ผ่าน ' + n0(r.a.passMark) + '%</title></text>' +
      /* ขีดเกณฑ์ผ่านของกิจกรรมนี้ — แต่ละแถวมีเกณฑ์ของตัวเอง */
      '<line x1="' + x(r.a.passMark) + '" y1="' + (y - 3) + '" x2="' + x(r.a.passMark) + '" y2="' + (y + 28) +
        '" stroke="' + CH.ink + '" stroke-width="1.4" stroke-dasharray="3 2"><title>เกณฑ์ผ่าน ' + n0(r.a.passMark) + '%</title></line>' +
      one(r.avg, y, '#7E86AE', 'คะแนนเฉลี่ย') +
      one(r.share, y + 14, r.share === null ? CH.pend : (r.share >= 50 ? CH.ok : CH.risk), 'สัดส่วนผู้ถึงเกณฑ์');
  }).join('');


  return '<div class="p-4 pt-3">' +
    legend([['คะแนนเฉลี่ยของชั้น', '#7E86AE'],
            ['สัดส่วนผู้ถึงเกณฑ์', CH.ok],
            ['เกณฑ์ผ่านของกิจกรรม (เส้นประ)', CH.ink]]) +
    '<div class="scroll-x mt-3"><svg viewBox="0 0 ' + W + ' ' + H + '" class="h-auto" ' +
      'style="min-width:560px;width:100%" role="img" ' +
      'aria-label="คะแนนเฉลี่ยและสัดส่วนผู้ถึงเกณฑ์ของแต่ละกิจกรรม">' +
      ticks + bars + '</svg></div>' +
    '</div>';
}

/* Where the class actually sits, in ten-point bins, with the pass mark drawn
   on the same axis so "how many are just below" is answerable at a glance. */
function chartHistogram(d){
  const vals = d.rows.filter(function(r){ return r.total.pct !== null; })
    .map(function(r){ return r.total.pct; });
  if (!vals.length) return hollow('ยังไม่มีคะแนน');
  const bins = new Array(10).fill(0);
  vals.forEach(function(v){ bins[Math.min(9, Math.floor(v / 10))]++; });
  const peak = Math.max.apply(null, bins) || 1;

  const W = 560, H = 190, padL = 26, padB = 30, padT = 14;
  const plotW = W - padL - 14, plotH = H - padB - padT;
  const bw = plotW / 10;
  const passX = padL + plotW * d.course.passCriteria / 100;

  const bars = bins.map(function(cnt, i){
    const h = plotH * cnt / peak;
    const x = padL + i * bw, y = padT + plotH - h;
    const below = (i + 1) * 10 <= d.course.passCriteria;
    return '<rect x="' + (x + 3) + '" y="' + y + '" width="' + (bw - 6) + '" height="' + Math.max(h, cnt ? 2 : 0) +
      '" rx="3" fill="' + (below ? TONE.bad.bar : TONE.ok.bar) + '" opacity="' + (cnt ? 0.9 : 0) + '">' +
      '<title>' + (i * 10) + '–' + (i * 10 + 10) + '% · ' + cnt + ' คน</title></rect>' +
      (cnt ? '<text x="' + (x + bw / 2) + '" y="' + (y - 4) + '" text-anchor="middle" font-size="11" fill="' + CH.ink + '">' + cnt + '</text>' : '') +
      (i % 2 === 0 ? '<text x="' + x + '" y="' + (H - 10) + '" text-anchor="middle" font-size="10.5" fill="' + CH.dim + '">' + (i * 10) + '</text>' : '');
  }).join('');

  return '<div class="p-4 pt-3"><div class="scroll-x"><svg viewBox="0 0 ' + W + ' ' + H + '" class="h-auto" ' +
      'style="min-width:440px;width:100%" role="img" ' +
      'aria-label="การกระจายคะแนนรวมของนักศึกษา">' +
    '<line x1="' + padL + '" y1="' + (padT + plotH) + '" x2="' + (W - 14) + '" y2="' + (padT + plotH) +
      '" stroke="' + CH.line + '"/>' + bars +
    '<line x1="' + passX + '" y1="' + (padT - 4) + '" x2="' + passX + '" y2="' + (padT + plotH + 4) +
      '" stroke="' + CH.ink + '" stroke-width="1.5" stroke-dasharray="4 3"/>' +
    '<text x="' + (passX - 6) + '" y="' + (padT + 6) + '" text-anchor="end" font-size="11" fill="' + CH.ink + '">เกณฑ์ผ่าน ' +
      n0(d.course.passCriteria) + '%</text>' +
    '<text x="' + (W - 14) + '" y="' + (H - 10) + '" text-anchor="end" font-size="10.5" fill="' + CH.dim + '">คะแนนรวม (%)</text>' +
    '</svg></div></div>';
}

/* ── sortable / filterable table ──────────────────────────────────── */
function sortRows(key, arr, def){
  const st = S.sort[key] || def || null;
  if (!st) return arr;
  const dir = st.dir === 'desc' ? -1 : 1;
  return arr.slice().sort(function(a,b){
    const x = st.get(a), y = st.get(b);
    if (x === null || x === undefined) return 1;
    if (y === null || y === undefined) return -1;
    if (typeof x === 'string') return x.localeCompare(y, 'th') * dir;
    return (x - y) * dir;
  });
}
function sortableTh(key, col, label, extraClass, extraAttr){
  const st = S.sort[key];
  const on = st && st.col === col;
  const caret = on ? (st.dir === 'desc' ? '▼' : '▲') : '↕';
  return '<th class="sortable ' + (extraClass || '') + '" data-sort="' + key + '" data-col="' + col + '"' +
    (extraAttr || '') + '>' +
    label + '<span class="caret">' + caret + '</span></th>';
}
function filterBox(key, placeholder){
  return '<span class="relative inline-flex items-center">' +
    '<input class="inp !py-1.5 !pl-8 w-[210px] text-[14px]" data-filter="' + key + '" ' +
    'value="' + esc(S.filter[key] || '') + '" placeholder="' + placeholder + '">' +
    '<span class="absolute left-2.5 text-faint">' + icon('search','w-3.5 h-3.5') + '</span></span>';
}
function match(key, hay){
  const q = (S.filter[key] || '').trim().toLowerCase();
  if (!q) return true;
  return hay.toLowerCase().indexOf(q) >= 0;
}

/* ── overlays ─────────────────────────────────────────────────────── */
let lastFocus = null, OVL_GEN = 0;
function openOverlay(el, html){
  if (document.getElementById('modal').hidden && document.getElementById('drawer').hidden)
    lastFocus = document.activeElement;          /* only the first of a chain is worth returning to */
  OVL_GEN++;
  el.dataset.gen = OVL_GEN;
  el.innerHTML = html; el.hidden = false;
  const sc = document.getElementById('scrim'); sc.hidden = false;
  sc.dataset.gen = OVL_GEN;
  requestAnimationFrame(function(){ sc.classList.add('on'); el.classList.add('on'); });
  applyPermissions(el);
  const f = el.querySelector('input,button,select,textarea');
  if (f) setTimeout(function(){ f.focus(); }, 60);
}
function closeOverlays(){
  ['modal','drawer'].forEach(function(id){
    const el = document.getElementById(id);
    if (el.hidden) return;
    const gen = el.dataset.gen;
    el.classList.remove('on');
    /* If something reopened this element while the exit transition was running,
       the teardown belongs to content that is no longer on screen. Leave it. */
    setTimeout(function(){
      if (el.dataset.gen !== gen) return;
      el.hidden = true; el.innerHTML = '';
    }, 180);
  });
  const sc = document.getElementById('scrim');
  const sgen = sc.dataset.gen;
  sc.classList.remove('on');
  setTimeout(function(){ if (sc.dataset.gen === sgen) sc.hidden = true; }, 180);
  if (lastFocus && lastFocus.focus) lastFocus.focus();
}
const openModal  = function(html){ openOverlay(document.getElementById('modal'), html); };
const openDrawer = function(html){ openOverlay(document.getElementById('drawer'), html); };

/* The ? button. Prose the user reads once belongs here, not in the layout. */
function showHelp(anchor){
  const pop = document.getElementById('pop');
  if (!pop.hidden) { hideHelp(); return; }
  pop.innerHTML = '<div class="over">เกี่ยวกับหน้านี้</div>' + HELP;
  pop.hidden = false;
  const r = anchor.getBoundingClientRect();
  const w = Math.min(420, window.innerWidth - 32);
  pop.style.width = w + 'px';
  pop.style.top = (window.scrollY + r.bottom + 9) + 'px';
  pop.style.left = Math.max(12, Math.min(window.scrollX + r.left - 8, window.scrollX + window.innerWidth - w - 16)) + 'px';
  requestAnimationFrame(function(){ pop.classList.add('on'); });
}
function hideHelp(){
  const pop = document.getElementById('pop');
  if (pop.hidden) return;
  pop.classList.remove('on');
  setTimeout(function(){ pop.hidden = true; }, 150);
}

function toast(msg, kind){
  const host = document.getElementById('toasts');
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = '<span style="color:' + (kind === 'bad' ? '#DCBABA' : '#BCD3C6') + '">' +
    (kind === 'bad' ? '⚠' : '✓') + '</span><span>' + msg + '</span>';
  host.appendChild(el);
  /* Cap the stack. Switching course a few times should not bury the screen. */
  while (host.children.length > 3) host.removeChild(host.firstChild);
  requestAnimationFrame(function(){ el.classList.add('on'); });
  setTimeout(function(){ el.classList.remove('on');
    setTimeout(function(){ el.remove(); }, 200); }, 3200);
}

/* ── 01 · ภาพรวมรายวิชา ───────────────────────────────────────────── */
function viewOverview(){
  const d = D(), C = d.course;
  const metClos = d.attain.filter(function(a){ return a.met; }).length;
  const passing = d.complete.filter(function(r){ return r.passCourse === true; }).length;
  const pending = d.rows.filter(function(r){ return !r.total.complete; }).length;
  const avg = d.complete.length
    ? d.complete.reduce(function(t,r){ return t + r.total.pct; }, 0) / d.complete.length : null;

  /* A · เรดาร์อ่าน d.attain ชุดเดียวกับตาราง เมื่อวาดคู่กันได้ ตารางจะทิ้งคอลัมน์
     มิเตอร์ทิ้ง เพราะเรดาร์บอกเรื่องเดียวกันอยู่แล้ว — ตัวเลขเดียวสองภาพคือความ
     หนาแน่น ไม่ใช่ข้อมูลเพิ่ม · CLO น้อยกว่า 3 ข้อไม่เป็นรูปทรง จึงใช้กราฟแท่งแทน
     และวิชาที่ถูกล็อกไม่วาดอะไรเลย (ห้ามวาดกราฟจากตัวเลขที่อธิบายต่อไม่ได้) */
  const cloChart = chartRadar(d);        /* L1 — ทุกวิชา ทุกสถานะ */
  const paired = true;

  const attainBody = d.clos.length === 0
    ? '<div class="px-6 py-12 text-center text-[14px] text-dim">ยังไม่มี CLO ในรายวิชานี้ — ' +
      '<button data-act="goto" data-route="clos" class="text-ink underline underline-offset-2">เพิ่ม CLO</button></div>'
    : d.locked
    ? '<div class="px-6 py-10 text-center">' +
      '<div class="text-[15px] text-ink">ยังไม่แสดงผลการบรรลุ CLO</div>' +
      '<div class="text-[14px] text-ink2 mt-2 max-w-[52ch] mx-auto leading-relaxed">' +
        'ตัวเลขที่คำนวณจากการจับคู่ที่ยังไม่ครบจะอธิบายต่อกรรมการหลักสูตรไม่ได้ — แก้ข้อที่เป็น ✕ ด้านบนให้ครบก่อน</div>' +
      '<div class="mt-5">' + btn('ไปยังสิ่งที่ต้องแก้','','data-act="goto" data-route="' + d.blockers[0].route + '"') + '</div></div>'
    : '<table class="dt"><thead><tr>' +
        '<th style="width:74px">CLO</th><th>คำอธิบาย</th>' +
        '<th class="num mob-hide" style="width:112px" title="น้ำหนักของ CLO ในวิชาที่ผู้สอนกำหนด">น้ำหนักในวิชา</th>' +
        (paired ? '' : '<th class="mob-hide" style="width:220px">สัดส่วนผู้ผ่าน</th>') +
        '<th class="num" style="width:74px">ผ่าน</th><th style="width:104px">ผลตัดสิน</th>' +
      '</tr></thead><tbody>' + d.attain.map(function(a){
        return '<tr>' +
          '<td class="whitespace-nowrap"><span class="tnum text-[14px] font-medium">CLO ' + a.clo.number + '</span></td>' +
          '<td class="wrapcell"><div class="text-[14px] clip">' + esc(a.clo.description) + '</div>' +
            '<div class="mt-1.5 flex gap-2 flex-wrap">' + bloomChip(a.clo.bloomLevel) + soloChip(a.clo.soloLevel) +
            (a.measuredBy.length === 0 ? chip('ยังไม่มีกิจกรรมวัด','bad') : '') + '</div></td>' +
          '<td class="num tnum text-[14px] mob-hide" title="กำหนดที่หน้า CLO · คำนวณจากกิจกรรมได้ ' + n2(a.derivedWeight) + '%">' +
            n2(a.weight) + '%</td>' +
          (paired ? '' :
            '<td class="mob-hide">' + meter(a.share, null, a.met ? 'ok' : (a.share === null ? 'nil' : (a.share >= 90 ? 'warn' : 'bad'))) +
            '<div class="text-[13px] text-dim mt-1.5 tnum whitespace-nowrap">' +
              a.pass + '/' + a.n + ' คน</div></td>') +
          '<td class="num tnum text-[14px] font-medium">' + (a.share === null ? '—' : n2(a.share) + '%') +
            (paired ? '<div class="text-[12.5px] text-dim font-normal tnum whitespace-nowrap">' +
              a.pass + '/' + a.n + ' คน</div>' : '') + '</td>' +
          '<td>' + verdictChip(a) + '</td>' +
        '</tr>';
      }).join('') + '</tbody></table>';

  /* CR-05 · three tiers, because the action differs. Failing the course is a
     grade problem; failing a CLO while passing the course is a teaching signal;
     an incomplete record is neither until the missing scores arrive. */
  const risk = d.rows.map(function(r){
    const failCourse = r.passCourse === false;
    const lvl = failCourse ? 3 : (r.atRisk ? 2 : (!r.total.complete ? 1 : 0));
    return { r:r, lvl:lvl };
  }).filter(function(x){ return x.lvl > 0; })
    .sort(function(a, b){
      if (a.lvl !== b.lvl) return b.lvl - a.lvl;
      if (a.lvl === 1) return b.r.total.missing - a.r.total.missing;
      if (b.r.failingClos.length !== a.r.failingClos.length)
        return b.r.failingClos.length - a.r.failingClos.length;
      return (a.r.total.pct === null ? 999 : a.r.total.pct) - (b.r.total.pct === null ? 999 : b.r.total.pct);
    });
  const nFail = risk.filter(function(x){ return x.lvl === 3; }).length;
  const nClo  = risk.filter(function(x){ return x.lvl === 2; }).length;
  const nInc  = risk.filter(function(x){ return x.lvl === 1; }).length;

  const RISKLBL = { 3:['ไม่ผ่านรายวิชา','bad'], 2:['ต่ำกว่าเกณฑ์ CLO','warn'], 1:['ยังประเมินไม่ครบ','nil'] };
  const riskCard = '<div class="card overflow-hidden mb-4">' +
    band('นักศึกษาที่ต้องติดตาม',
      d.roster.length === 0 ? '' :
      '<span class="flex items-center gap-2">ไม่ผ่านรายวิชา ' + nFail + ' · ต่ำกว่าเกณฑ์ CLO ' + nClo + ' · ยังไม่ครบ ' + nInc +
        tip('เรียงตามความรุนแรง ไม่ใช่ตามคะแนน: ไม่ผ่านรายวิชา → ต่ำกว่าเกณฑ์ CLO → ยังประเมินไม่ครบ\n' +
            'คนที่ยังประเมินไม่ครบยังไม่ใช่คนที่ตก') + '</span>') +
    (d.roster.length === 0
      ? hollow('ยังไม่มีรายชื่อนักศึกษา')
      : risk.length === 0
      ? hollow('ไม่มีนักศึกษาที่ต่ำกว่าเกณฑ์ใด และทุกคนมีคะแนนครบ','ok')
      : '<div class="scroll-x"><table class="dt"><thead><tr>' +
          '<th>นักศึกษา</th><th style="width:150px">ระดับ</th>' +
          '<th class="mob-hide">เหตุผล</th>' +
          '<th class="num" style="width:96px">รวม (%)</th>' +
          '<th class="no-print" style="width:96px"></th></tr></thead><tbody>' +
        risk.slice(0, 12).map(function(x){
          const r = x.r, L = RISKLBL[x.lvl];
          const why = x.lvl === 1
            ? 'ขาดคะแนน ' + r.total.missing + ' จาก ' + d.acts.length + ' กิจกรรม'
            : (r.failingClos.length
                ? 'ต่ำกว่าเกณฑ์ ' + r.failingClos.map(function(c){ return 'CLO ' + c.number; }).join(', ')
                : 'คะแนนรวมต่ำกว่าเกณฑ์ผ่าน ' + n0(C.passCriteria) + '%');
          return '<tr' + (x.lvl === 3 ? ' style="box-shadow:inset 3px 0 0 #B96F6E"' : '') + '>' +
            '<td><div class="text-[14px]">' + esc(r.student.name) + '</div>' +
              '<div class="tnum text-[13px] text-dim">' + r.student.studentCode + '</div></td>' +
            '<td>' + chip(L[0], L[1]) + '</td>' +
            '<td class="text-[14px] text-ink2 mob-hide">' + why + '</td>' +
            '<td class="num tnum text-[14px]">' + (r.total.pct === null ? '—' : n2(r.total.pct)) + '</td>' +
            '<td class="no-print text-right">' +
              btn('ดูรายบุคคล','quiet','data-act="student" data-id="' + r.student.id + '"') + '</td></tr>';
        }).join('') + '</tbody></table></div>' +
        (risk.length > 12
          ? '<div class="px-5 py-3 hair-t text-[14px] text-dim flex items-center gap-3">' +
            'แสดง 12 จาก ' + risk.length + ' คน' +
            '<button class="ml-auto btn btn-quiet" data-act="goto" data-route="dashboard">ดูทั้งหมดในแดชบอร์ด</button></div>'
          : '')) + '</div>';

  /* G2 — การ์ดผู้สอนและการ์ดน้ำหนักกิจกรรมถูกตัดออกจากหน้านี้ — ผู้สอนดูได้ที่
     “ตั้งค่ารายวิชา” กับหน้ากิจกรรมอยู่แล้ว ค่าเฉลี่ยของชั้นย้ายมาอยู่กับกราฟแทน */
  const avgCard = '<div class="card overflow-hidden">' +
    chartHead('คะแนนเฉลี่ยของทั้งชั้น',
      avg === null ? 'ยังไม่มีนักศึกษาที่คะแนนครบ' : 'จาก ' + d.complete.length + ' คนที่คะแนนครบ',
      'ขีดเข้มบนแถบคือเกณฑ์ผ่านรายวิชา ' + n0(C.passCriteria) + '%\nนักศึกษาที่คะแนนยังไม่ครบไม่ถูกนับ เพราะคะแนนที่ขาดไม่ใช่ 0') +
    '<div class="p-4">' +
      '<div class="tnum text-[36px] font-light leading-none">' + (avg === null ? '—' : n2(avg)) +
        '<span class="text-[17px] text-dim">' + (avg === null ? '' : '%') + '</span></div>' +
      '<div class="mt-4">' + meter(avg, C.passCriteria) + '</div>' +
      (d.complete.length ? '<div class="hair-t mt-4 pt-3 text-[13px] text-dim leading-relaxed">' +
        'สูงสุด <b class="text-ink tnum">' + n2(Math.max.apply(null, d.complete.map(function(r){ return r.total.pct; }))) + '%</b>' +
        ' · ต่ำสุด <b class="text-ink tnum">' + n2(Math.min.apply(null, d.complete.map(function(r){ return r.total.pct; }))) + '%</b></div>' : '') +
    '</div></div>';

  const actCard = '<div class="card overflow-hidden">' +
    chartHead('แต่ละกิจกรรม ชั้นทำคะแนนได้เท่าไร',
      'เส้นประคือเกณฑ์ผ่านของแต่ละกิจกรรม',
      '“ถึงเกณฑ์” ของกิจกรรม = ได้ตั้งแต่เกณฑ์ผ่านที่ตั้งไว้ในกิจกรรมนั้น (% ของคะแนนเต็ม)\n' +
      'ใช้ดูภาพรวมเท่านั้น ไม่มีผลต่อการตัดสิน CLO ซึ่งใช้เกณฑ์ผ่าน CLO ของรายวิชา ' + n0(C.cloPassMark) + '%',
      d.acts.length ? '<span class="tnum ' + (d.actWeightSum === 100 ? '' : 'text-warn') +
        '">น้ำหนักรวม ' + d.actWeightSum + '%</span>' : '') +
    chartActivity(d) + '</div>';


  return sheet({
    title:'ภาพรวมรายวิชา',
    note:'หน้านี้ตอบสามคำถาม — “วิชานี้พร้อมคำนวณผลหรือยัง ถ้ายัง เหลืออะไร” · “CLO ข้อไหนยังไม่บรรลุ” · “ต้องตามใครก่อน” · เรดาร์กับตารางเป็นตัวเลขชุดเดียวกัน แกนหนึ่งแกนคือ CLO หนึ่งข้อ ระยะจากจุดศูนย์กลางคือสัดส่วนผู้ผ่านจริง และวงนอกสุดคือทุกคนผ่าน (เป้าหมายคือ 100% เสมอ จึงไม่มีช่องให้ตั้งค่า) · ตัวเลขทุกค่าคำนวณจากตาราง Score ที่มีอยู่จริง กิจกรรมที่ยังไม่มีแถวคะแนนจะถูกตัดออกจากตัวหาร ไม่ถูกนับเป็น 0 · รายชื่อที่ต้องติดตามเรียงตามความรุนแรง ไม่ใช่ตามคะแนน เพราะคนที่ยังประเมินไม่ครบยังไม่ใช่คนที่ตก',
    actions: btn('ส่งออกผลการเรียน','','data-act="export" data-what="results"') + btn('ตั้งค่ารายวิชา','primary','data-act="course-settings"'),
    body:
      '<div class="statbar mb-4">' +
        stat('นักศึกษาใน Sec', d.roster.length, d.roster.length ? 'รายชื่อใน Sec นี้' : 'ยังไม่มีรายชื่อ') +
        stat('CLO ที่บรรลุ', (d.locked || d.clos.length === 0) ? '—' : metClos + ' / ' + d.clos.length,
             d.locked ? 'ล็อกจนกว่าจะแก้ครบ' : 'บรรลุ = ผู้ที่ประเมินครบผ่านทุกคน',
             (d.locked || d.clos.length === 0) ? 'nil' : (metClos === d.clos.length ? 'ok' : (metClos ? 'warn' : 'bad'))) +
        stat('สัดส่วนผู้ผ่านรายวิชา', d.complete.length ? n2(passing / d.complete.length * 100) + '%' : '—',
             d.complete.length ? 'เกณฑ์ผ่าน ' + n0(C.passCriteria) + '% · ' + passing + '/' + d.complete.length + ' คน' : 'ยังไม่มีคะแนนครบ') +
        stat('นักศึกษาที่ต้องติดตาม', d.roster.length === 0 ? '—' : (nFail + nClo),
             d.roster.length === 0 ? '—' : (nFail + nClo
               ? 'ไม่ผ่านรายวิชา ' + nFail + ' · ต่ำกว่าเกณฑ์ CLO ' + nClo
               : 'ไม่มีใครต่ำกว่าเกณฑ์') + (nInc ? ' · ยังไม่ครบอีก ' + nInc : ''),
             d.roster.length === 0 ? 'nil' : (nFail ? 'bad' : (nClo ? 'warn' : 'ok'))) +
      '</div>' +
      /* K3 — เรดาร์คือกราฟหลักของหน้า: การ์ดแรกหลังตัวเลขสรุป ชื่อใหญ่ที่สุดในหน้า
         และบอกคำตัดสินรวมไว้ขวามือ คนที่อ่านแค่หัวการ์ดก็ได้คำตอบ */
      '<div class="card overflow-hidden mb-4">' +
        chartHead('นักศึกษาผ่าน CLO แต่ละข้อกี่เปอร์เซ็นต์',
          d.clos.length === 0 ? 'ยังไม่มี CLO'
            : d.locked ? 'ยังคำนวณไม่ได้ — ตั้งค่าให้ครบก่อน'
            : 'ขอบนอกสุดของกราฟ = ผ่านทุกคน · ข้อที่ยุบเข้าหาจุดกลางคือข้อที่ต้องดูก่อน',
          'แกนหนึ่งแกนคือ CLO หนึ่งข้อ · ระยะจากจุดกลางคือสัดส่วนนักศึกษาที่ผ่านจริง\n' +
          'CLO “บรรลุ” เมื่อผู้ที่ประเมินครบผ่านทุกคน (เป้าหมายชั้นเรียน 100%)\n' +
          'ตัวเลขชุดเดียวกับตารางข้างกราฟ',
          (d.locked || d.clos.length === 0) ? '' :
            chip('บรรลุ ' + metClos + ' / ' + d.clos.length + ' ข้อ',
                 metClos === d.clos.length ? 'ok' : (metClos ? 'warn' : 'bad')),
          true) +
        (paired
          ? '<div class="split2"><div class="min-w-0">' + cloChart + '</div>' +
            '<div class="min-w-0 scroll-x">' + attainBody + '</div></div>'
          : attainBody) + '</div>' +
      '<div class="grid grid-cols-1 xl:grid-cols-[minmax(0,1fr)_330px] gap-4 mb-4">' +
        actCard + avgCard + '</div>' +
      riskCard
  });
}

/* T8 — ช่องตัวเลขที่แก้ได้ในหน้า บันทึกเมื่อออกจากช่อง (change) ไม่ต้องเปิดฟอร์ม
   data-* บอกว่าเขียนลงอะไร ตัวจัดการ change ตรวจสิทธิ์และช่วงค่าอีกชั้น */
const inlineNum = function(attr, id, value, label, width){
  return '<input class="inp tnum !py-1 !px-2 text-[14px] text-right" style="width:' + (width || 64) + 'px" ' +
    attr + '="' + id + '" value="' + (value === null || value === undefined ? '' : value) + '" inputmode="decimal" ' +
    'aria-label="' + esc(label) + '" title="' + esc(label) + ' · กด Enter หรือออกจากช่องเพื่อบันทึก">';
};
const sumTone = function(v){ return Math.abs(v - 100) < 0.01 ? 'text-ok' : 'text-warn'; };
const levelSourceChip = function(clo){
  if (clo.levelSource !== 'AUTO') return '';
  return '<span class="text-[12px] text-faint" title="SOLO ได้จากระดับ Bloom ที่เลือก · เปลี่ยนเป็นกำหนดเองได้ในหน้าแก้ไข">' +
    LEVEL_SOURCE_TH.AUTO + '</span>';
};

/* ── 02 · CLO — น้ำหนักในวิชา และเกณฑ์ผ่าน CLO ของรายวิชา (T1, T7) ─────── */
function viewClos(){
  const d = D();
  const TITLE = 'ผลลัพธ์การเรียนรู้ระดับรายวิชา (CLO)';
  if (d.clos.length === 0) return sheet({
    title: TITLE,
    actions: btn('เพิ่ม CLO','primary','data-act="crud-new" data-kind="clo"'),
    body: empty('ยังไม่มี CLO ในรายวิชานี้',
      'CLO คือจุดเริ่มของทุกอย่างในระบบ — จุดประสงค์ กิจกรรม วิธีประเมิน และผลการประเมินทั้งหมดอ้างอิงกลับมาที่ CLO',
      btn('เพิ่ม CLO ข้อแรก','primary','data-act="crud-new" data-kind="clo"'))
  });

  const cards = d.attain.map(function(a){
    const clo = a.clo;
    const objs = a.objectives;
    const gap = Math.abs(a.weight - a.derivedWeight) >= 0.5;
    const objSum = d.objWeightSum(clo.id);
    return '<article class="card px-4 py-4 flex flex-wrap items-start gap-x-4 gap-y-3">' +
      '<div class="flex items-start gap-3 flex-1 basis-[300px] min-w-[220px]">' +
        '<span class="flex flex-col gap-0.5 no-print pt-0.5">' +
          '<button class="btn btn-quiet !px-1.5 !py-0" data-act="move" data-kind="clo" data-id="' + clo.id +
            '" data-dir="-1" title="เลื่อนขึ้น" aria-label="เลื่อน CLO ' + clo.number + ' ขึ้น">▲</button>' +
          '<button class="btn btn-quiet !px-1.5 !py-0" data-act="move" data-kind="clo" data-id="' + clo.id +
            '" data-dir="1" title="เลื่อนลง" aria-label="เลื่อน CLO ' + clo.number + ' ลง">▼</button></span>' +
        '<div class="min-w-0 flex-1">' +
          '<div class="flex items-center gap-2.5 flex-wrap">' +
            '<span class="tnum text-[15px] font-medium">CLO ' + clo.number + '</span>' +
          '</div>' +
          '<p class="text-[16px] mt-2 leading-relaxed">' + esc(clo.description) + '</p>' +
          '<div class="flex items-center gap-x-2 gap-y-1.5 flex-wrap mt-2.5 text-[13px] text-dim">' +
            bloomChip(clo.bloomLevel) + soloChip(clo.soloLevel) + levelSourceChip(clo) +
          '</div>' +
          /* T8 — ทางลัดไปหน้าจุดประสงค์ของ CLO ข้อนี้ บอกสถานะไว้ก่อนกด */
          '<div class="flex items-center gap-2 flex-wrap mt-3 text-[14px]">' +
            '<button class="underline underline-offset-2 text-ink2 hover:text-ink" data-act="goto-obj" data-clo="' + clo.id + '">' +
              'จุดประสงค์ ' + objs.length + ' ข้อ →</button>' +
            (objs.length === 0 ? chip('ยังไม่มีจุดประสงค์','bad')
              : Math.abs(objSum - 100) > 0.01 ? chip('น้ำหนักรวม ' + n2(objSum) + '%','bad')
              : '<span class="text-dim">· น้ำหนักครบ 100%</span>') +
            (objs.length && a.measuredBy.length === 0 ? chip('ยังไม่มีกิจกรรมวัด','bad') : '') +
          '</div>' +
        '</div></div>' +
      '<div class="shrink-0 no-print" style="width:150px">' +
        '<label class="text-[12.5px] text-dim block">น้ำหนักในวิชา (%)</label>' +
        '<div class="mt-1">' + inlineNum('data-cloweight', clo.id, clo.weight, 'น้ำหนักของ CLO ' + clo.number + ' ในวิชา (%)', 84) + '</div>' +
        /* P3 — บอกตรง ๆ ว่าอะไรไม่ตรงกับอะไร: ค่าที่กรอกไว้ข้างบน กับค่าที่คำนวณได้จากกิจกรรม
           ข้อความเดิม “กิจกรรมให้ 0.00% — ไม่ตรง” ผู้อ่านต้องเดาเองว่าไม่ตรงกับตัวไหน */
        (gap ? '<div class="text-[12.5px] mt-1.5 text-warn" title="คำนวณจากน้ำหนักกิจกรรม × % ที่กิจกรรมวัด CLO นี้">' +
          'ไม่ตรงกับที่คำนวณจากกิจกรรม (<span class="tnum">' + n2(a.derivedWeight) + '%</span>)</div>' : '') +
      '</div>' +
      '<div class="shrink-0 no-print flex gap-0.5 self-start">' +
        btn('แก้ไข','quiet','data-act="crud-edit" data-kind="clo" data-id="' + clo.id + '"') +
        '<button class="btn btn-quiet btn-danger" data-act="crud-delete" data-kind="clo" data-id="' + clo.id + '">ลบ</button>' +
      '</div>' +
    '</article>';
  }).join('');

  const sum = d.cloWeightSum;
  return sheet({
    title: TITLE,
    note:'น้ำหนักของ CLO กำหนดเองตั้งแต่แรก และต้องรวมได้ 100% ก่อนไปขั้นกิจกรรม · ระบบคำนวณน้ำหนักอีกทางจากกิจกรรมที่วัดจุดประสงค์ของแต่ละ CLO แล้วแสดงคู่กัน ถ้าต่างกันจะเตือน แต่ไม่ล็อกการคำนวณ · นักศึกษาผ่าน CLO เมื่อคะแนน CLO (รวมจากจุดประสงค์ตามน้ำหนัก) ถึงเกณฑ์ผ่าน CLO ของรายวิชา ซึ่งเป็นค่าเดียวทุกข้อ',
    actions: btn('เพิ่ม CLO','primary','data-act="crud-new" data-kind="clo"'),
    body:
      '<div class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-4">' +
        '<div class="card px-4 py-3 flex items-center justify-between gap-3 flex-wrap">' +
          '<span class="text-[14px] text-ink2">น้ำหนักรวมของทุก CLO</span>' +
          '<span class="tnum text-[14px] ' + sumTone(sum) + '">' + n2(sum) + '%' +
            (Math.abs(sum - 100) < 0.01 ? ' ✓' : ' — ต้องรวมได้ 100%') + '</span></div>' +
        '<div class="card px-4 py-3 flex items-center justify-between gap-3 flex-wrap">' +
          '<span class="text-[14px] text-ink2 flex items-center gap-2">เกณฑ์ผ่าน CLO ของรายวิชา (%)' +
            tip('นักศึกษา 1 คนผ่าน CLO ข้อหนึ่งเมื่อคะแนนของ CLO ข้อนั้นได้ตั้งแต่ค่านี้ขึ้นไป\n' +
                'คะแนน CLO = Σ (น้ำหนักจุดประสงค์ × คะแนนจุดประสงค์)\nใช้ค่าเดียวกันทุก CLO') + '</span>' +
          inlineNum('data-passmark', d.course.id, d.course.cloPassMark, 'เกณฑ์ผ่าน CLO ของรายวิชา (%)', 72) +
        '</div>' +
      '</div>' +
      '<div class="space-y-3">' + cards + '</div>'
  });
}

/* ── 03 · จุดประสงค์ — แท็บของตัวเอง (T2) น้ำหนักรวม 100 ต่อ CLO (T6) ─────── */
function viewObjectives(){
  const d = D();
  const TITLE = 'จุดประสงค์เชิงพฤติกรรม';
  if (d.clos.length === 0) return sheet({
    title: TITLE,
    body: empty('ยังไม่มี CLO ให้แตกเป็นจุดประสงค์',
      'จุดประสงค์เชิงพฤติกรรมอยู่ใต้ CLO เสมอ — เพิ่ม CLO ก่อน แล้วกลับมาที่หน้านี้',
      btn('ไปเพิ่ม CLO','primary','data-act="goto" data-route="clos"'))
  });

  const focus = S.tab.objFocus || null;
  const sections = d.clos.map(function(c){
    const objs = d.objsOf(c.id);
    const sum = d.objWeightSum(c.id);
    const rowsHtml = objs.length === 0
      ? '<tr><td colspan="4" class="text-[14px] text-dim py-4">ยังไม่มีจุดประสงค์ภายใต้ CLO นี้ — ' +
          '<button class="underline underline-offset-2 text-ink" data-act="crud-new" data-kind="objective" data-clo="' + c.id + '">เพิ่มข้อแรก</button></td></tr>'
      : objs.map(function(o){
          const links = d.crit.filter(function(x){ return x.objectiveId === o.id; });
          return '<tr>' +
            '<td class="tnum text-[13px] text-dim whitespace-nowrap">' + d.objLabel(o) + '</td>' +
            '<td class="wrapcell"><div class="text-[14px]">' + esc(o.description) + '</div>' +
              '<div class="flex flex-wrap items-center gap-1.5 mt-1.5">' +
                '<span class="text-[12.5px] text-faint">วัดด้วย</span>' +
                (links.length
                  ? links.map(function(x){ const a = byId(db.activity, x.activityId);
                      return pill(a.name + ' · ' + x.weight + '%'); }).join('')
                  : chip('ยังไม่มีกิจกรรมวัด','bad')) +
                /* T8 — ไปผูกได้ทันทีจากแถวนี้ */
                '<button class="text-[13px] underline underline-offset-2 text-dim hover:text-ink no-print" ' +
                  'data-act="step" data-route="activities" data-view="matrix">' + (links.length ? 'แก้การเชื่อม' : 'เชื่อมกิจกรรม') + '</button>' +
              '</div></td>' +
            '<td class="num">' + inlineNum('data-objweight', o.id, o.weight, 'น้ำหนักของจุดประสงค์ ' + d.objLabel(o) + ' ใน CLO ' + c.number + ' (%)') + '</td>' +
            '<td class="no-print"><div class="flex gap-0.5 justify-end">' +
              btn('แก้ไข','quiet','data-act="crud-edit" data-kind="objective" data-id="' + o.id + '"') +
              '<button class="btn btn-quiet btn-danger" data-act="crud-delete" data-kind="objective" data-id="' + o.id + '">ลบ</button>' +
            '</div></td></tr>';
        }).join('');

    return '<section class="card overflow-hidden' + (focus === c.id ? ' ring-2 ring-[#878CB4]' : '') + '" id="obj-' + c.id + '">' +
      '<div class="px-4 py-3 hair flex flex-wrap items-start gap-x-4 gap-y-2">' +
        '<div class="min-w-0 flex-1 basis-[280px]">' +
          '<div class="flex items-center gap-2 flex-wrap"><span class="tnum text-[15px] font-medium">CLO ' + c.number + '</span>' +
            '<span class="text-[13px] text-dim tnum">น้ำหนักในวิชา ' + n2(c.weight || 0) + '%</span></div>' +
          '<div class="text-[14px] text-ink2 mt-1">' + esc(c.description) + '</div>' +
        '</div>' +
        '<div class="flex items-center gap-2 flex-wrap no-print">' +
          '<span class="tnum text-[14px] ' + (objs.length ? sumTone(sum) : 'text-dim') + '">รวม ' + n2(sum) + '%' +
            (objs.length && Math.abs(sum - 100) < 0.01 ? ' ✓' : '') + '</span>' +
          (objs.length > 1 && Math.abs(sum - 100) > 0.01
            ? btn('แบ่งเท่ากัน','quiet','data-act="obj-even" data-clo="' + c.id + '"') : '') +
          btn('+ เพิ่มจุดประสงค์','','data-act="crud-new" data-kind="objective" data-clo="' + c.id + '"') +
        '</div>' +
      '</div>' +
      '<div class="scroll-x"><table class="dt"><thead><tr>' +
        '<th style="width:56px">ข้อ</th><th>จุดประสงค์ · กิจกรรมที่วัด</th>' +
        '<th class="num" style="width:96px">น้ำหนัก (%)</th>' +
        '<th class="no-print" style="width:104px"></th></tr></thead>' +
      '<tbody>' + rowsHtml + '</tbody></table></div>' +
    '</section>';
  }).join('');

  return sheet({
    title: TITLE,
    note:'จุดประสงค์คือพฤติกรรมที่สังเกตหรือวัดได้ ซึ่งแสดงว่านักศึกษาบรรลุ CLO ข้อนั้น · น้ำหนักของจุดประสงค์ใต้ CLO เดียวกันต้องรวมได้ 100% · คะแนน CLO ของนักศึกษา = Σ (น้ำหนักจุดประสงค์ × คะแนนจุดประสงค์) และคะแนนจุดประสงค์มาจากกิจกรรมที่ผูกไว้ในขั้นที่ 5 “เชื่อมกิจกรรมกับ CLO”',
    actions: btn('เพิ่มจุดประสงค์','primary','data-act="crud-new" data-kind="objective"'),
    body: '<div class="space-y-4">' + sections + '</div>'
  });
}

/* ── 04 · กิจกรรมและวิธีประเมิน (T3) + เชื่อมกับจุดประสงค์ (T4) ────────── */
function viewActivities(){
  const d = D();
  const tab = subOf('activities');
  const TITLE = 'กิจกรรมและวิธีประเมิน';

  const gb = actGroupBy();
  const byGroup = d.course.weightMode === 'GROUP';
  /* P2 (2569-09-21) — แถวร่างในตารางถูกตัดออก การสร้างกิจกรรมใช้ฟอร์มใน modal ตัวเดียวกับ
     “แก้ไข” (FORMS.activity) · ก่อนหน้านี้หน้าเดียวมีสองหน้าตาสำหรับงานเดียวกัน: แถวร่าง
     6 ช่องที่ย่อไว้ กับ modal 8 ช่องที่ครบ ต่างกันทั้งช่องที่มี ค่าตั้งต้น และวิธีกรอกเกณฑ์ผ่าน
     (แถวร่างเลือกเป็น % · modal กรอกเป็นคะแนน) คนที่สร้างแล้วแก้จึงเจอฟอร์มคนละตัวติดกัน
     modal ชนะเพราะเป็นตัวที่ครบและมี validate/save ชุดจริงอยู่แล้ว */

  if (d.acts.length === 0) return sheet({
    title: TITLE,
    actions: btn('เพิ่มกิจกรรม','primary','data-act="crud-new" data-kind="activity"'),
    body: empty('ยังไม่มีกิจกรรม',
      'กิจกรรมคือที่มาของคะแนนทั้งหมด แต่ละกิจกรรมมีประเภท วิธีประเมิน คะแนนเต็ม และคะแนนที่ถือว่าผ่านเป็นตัวเลขของตัวเอง น้ำหนักของทุกกิจกรรมรวมกันต้องได้ 100%',
      btn('เพิ่มกิจกรรมแรก','primary','data-act="crud-new" data-kind="activity"'))
  });

  const actRow = function(a){
    const links = d.crit.filter(function(c){ return c.activityId === a.id; });
    return '<tr>' +
      '<td><div class="flex items-center gap-1 no-print">' +
        '<span class="flex flex-col">' +
          '<button class="btn btn-quiet !px-1 !py-0" data-act="move" data-kind="activity" data-id="' + a.id +
            '" data-dir="-1" title="เลื่อนขึ้น" aria-label="เลื่อนขึ้น">▲</button>' +
          '<button class="btn btn-quiet !px-1 !py-0" data-act="move" data-kind="activity" data-id="' + a.id +
            '" data-dir="1" title="เลื่อนลง" aria-label="เลื่อนลง">▼</button></span>' +
        '<span class="tnum text-[13px] text-dim">' + String(a.order).padStart(2,'0') + '</span></div></td>' +
      '<td class="wrapcell"><div class="text-[14px] clip">' + esc(a.name) + '</div>' +
        /* M3 — บรรทัดเกณฑ์ถูกสร้างจากตัวเลข จึงตรงกับคอลัมน์ขวาเสมอ */
        '<div class="text-[13px] text-dim clip">' + esc(critText(a)) +
          (a.criteriaNote ? ' · ' + esc(a.criteriaNote) : '') + '</div></td>' +
      '<td><div class="text-[14px]">' + esc(ACT_TYPE_TH[a.type] || '—') + '</div>' +
        '<div class="text-[13px] text-dim">' + esc(ASSESS_TH[a.assessmentMethod] || '—') + '</div></td>' +
      '<td class="num tnum text-[14px]">' + n2x(a.maxScore) + '</td>' +
      '<td class="num tnum text-[14px]">' + n2x(passScoreOf(a)) +
        '<span class="block text-[12.5px] text-dim">' + n2x(a.passMark) + '%</span></td>' +
      '<td class="num tnum text-[14px]">' + a.weight + '%' +
        (byGroup ? '<span class="block text-[12.5px] text-dim">จากกลุ่ม</span>' : '') + '</td>' +
      '<td><div class="flex flex-wrap gap-1.5">' + (links.length
          ? links.map(function(c){ const o = byId(db.behavioralObjective, c.objectiveId);
              return pill(d.objLabel(o) + ' · ' + c.weight + '%'); }).join('') +
            (d.rowSum(a.id) !== 100 ? chip('รวม ' + d.rowSum(a.id) + '%','bad') : '')
          : '<button class="text-[13px] text-bad underline underline-offset-2" data-act="crud-edit" data-kind="activity" data-id="' + a.id + '">ยังไม่ผูกจุดประสงค์</button>') +
        '</div></td>' +
      '<td class="no-print"><div class="flex gap-0.5 justify-end">' +
        btn('แก้ไข','quiet','data-act="crud-edit" data-kind="activity" data-id="' + a.id + '"') +
        btn('ทำสำเนา','quiet','data-act="dup-activity" data-id="' + a.id + '"') +
        '<button class="btn btn-quiet btn-danger" data-act="crud-delete" data-kind="activity" data-id="' + a.id + '">ลบ</button></div></td>' +
    '</tr>';
  };

  /* M4 — จัดกลุ่มเป็นเรื่องของ "การมอง" ไม่ใช่ของข้อมูล: ลำดับกิจกรรม (a.order) ไม่ถูกแตะ
     กลุ่มจึงเปิด/ปิดได้อิสระ และปุ่มเลื่อนขึ้น-ลงยังหมายถึงลำดับจริงเสมอ */
  const ACT_COLS = 8;
  let listRows;
  if (gb.id === 'none') listRows = d.acts.map(actRow).join('');
  else {
    const bucket = [], seenG = {};
    d.acts.forEach(function(a){
      const k = gb.of(a, d);
      const kk = k === null || k === undefined || k === '' ? '\u0000none' : String(k);
      if (!seenG[kk]) { seenG[kk] = { key:kk, raw:k, items:[] }; bucket.push(seenG[kk]); }
      seenG[kk].items.push(a);
    });
    /* "ยังไม่จัดกลุ่ม" ลงท้ายเสมอ — มันคือรายการที่ต้องจัดการ ไม่ใช่กลุ่มหนึ่ง */
    bucket.sort(function(a, b){
      return (a.key === '\u0000none' ? 1 : 0) - (b.key === '\u0000none' ? 1 : 0); });
    listRows = bucket.map(function(bk){
      const w = bk.items.reduce(function(t, a){ return t + a.weight; }, 0);
      const pts = bk.items.reduce(function(t, a){ return t + (a.maxScore || 0); }, 0);
      /* N1 — โหมดตามกลุ่ม: น้ำหนักของกลุ่มกรอกที่หัวกลุ่มนี้ที่เดียว */
      const editable = byGroup && gb.id === 'type' && bk.key !== '\u0000none';
      return '<tr class="cgrouphead"><td colspan="' + ACT_COLS + '">' +
        '<div class="flex items-center gap-3 flex-wrap">' +
          '<span><span class="text-[14px] text-ink">' +
            (bk.key === '\u0000none' ? 'ยังไม่จัดกลุ่ม' : esc(gb.head(bk.raw))) + '</span>' +
          '<span class="text-[13px] text-dim"> · ' + bk.items.length + ' กิจกรรม · คะแนนเต็มรวม ' +
            n2x(pts) + (editable ? '' : ' · น้ำหนักรวม ' + n2x(w) + '%') + '</span></span>' +
          (editable
            ? '<label class="ml-auto flex items-center gap-2 text-[13px] text-dim">น้ำหนักกลุ่ม (%)' +
                inlineNum('data-groupweight', bk.raw, (d.course.groupWeight || {})[bk.raw] || 0,
                  'น้ำหนักของกลุ่ม' + gb.head(bk.raw) + 'ในวิชา (%)', 72) +
                '<span class="tnum">÷ ' + bk.items.length + ' กิจกรรมตามคะแนนเต็ม</span></label>'
            : '') +
        '</div></td></tr>' + bk.items.map(actRow).join('');
    }).join('');
  }

  const groupBar = '<div class="flex items-center gap-1.5 flex-wrap text-[13px]">' +
    '<span class="text-dim">จัดกลุ่มตาม</span>' +
    ACT_GROUPBY.map(function(g){
      return '<button class="chipbtn" data-act="act-group-by" data-val="' + g.id + '"' +
        (g.id === gb.id ? ' aria-current="true"' : '') + '>' + g.label + '</button>'; }).join('') + '</div>';

  const listBody =
    '<div class="mb-3 flex items-center justify-between gap-4 flex-wrap">' + groupBar +
      '<span class="text-[13px] text-dim">' + d.acts.length + ' กิจกรรม · คะแนนเต็มรวม ' +
        n2x(d.acts.reduce(function(t, a){ return t + (a.maxScore || 0); }, 0)) + ' คะแนน</span></div>' +
    /* N1 — ตารางกว้างคงที่ขั้นต่ำ แล้วเลื่อนแนวนอนแทนการบีบคอลัมน์ · เดิม overflow-hidden ของการ์ด
       ชนะ overflow-x:auto ของ .scroll-x ตารางจึงถูกบีบจนชิปจุดประสงค์ตกเป็นหลายบรรทัด */
    '<div class="card scroll-x" style="container-type:inline-size">' +
      '<table class="dt" style="min-width:1080px"><thead><tr>' +
        '<th style="width:56px"></th>' +
        '<th style="min-width:260px">กิจกรรม · เกณฑ์</th>' +
        '<th style="width:150px">ประเภท · วิธีประเมิน</th>' +
        '<th class="num" style="width:92px">คะแนนเต็ม</th>' +
        '<th class="num" style="width:104px" title="คะแนนที่ถือว่าผ่านกิจกรรมนี้ และค่าเดียวกันคิดเป็น % ของคะแนนเต็ม">ผ่านที่ (คะแนน)</th>' +
        '<th class="num" style="width:96px"' + (byGroup ? ' title="น้ำหนักกลุ่ม × คะแนนเต็มกิจกรรมนี้ ÷ คะแนนเต็มรวมของกลุ่ม"' : '') + '>น้ำหนักในวิชา</th>' +
        '<th style="min-width:300px">วัดจุดประสงค์</th><th style="width:200px" class="no-print"></th>' +
      '</tr></thead><tbody>' + listRows + '</tbody></table>' +
    '</div>' +
    '<div class="card mt-4 px-6 py-4 flex items-center justify-between gap-4 flex-wrap">' +
      '<span class="text-[14px] ' + (d.actWeightSum === 100 ? 'text-ok' : 'text-warn') + '">' +
        'น้ำหนักรวม <span class="tnum">' + d.actWeightSum + '%</span>' +
        (d.actWeightSum === 100 ? ' — ครบแล้ว' : ' — ต้องเท่ากับ 100% (บันทึกได้ แต่ยังคำนวณผลไม่ได้)') + '</span>' +
      /* N1 — สลับวิธีกรอกน้ำหนักกิจกรรมของทั้งวิชา · ค่าที่มีอยู่ถูกพาไปเป็นจุดตั้งต้นทั้งสองทาง */
      '<div class="flex items-center gap-1.5 flex-wrap text-[13px]">' +
        '<span class="text-dim">กรอกน้ำหนักกิจกรรม</span>' +
        '<button class="chipbtn" data-act="weight-mode" data-val="GROUP"' + (byGroup ? ' aria-current="true"' : '') +
          '>ต่อกลุ่มประเภท</button>' +
        '<button class="chipbtn" data-act="weight-mode" data-val="MANUAL"' + (byGroup ? '' : ' aria-current="true"') +
          '>ทีละกิจกรรม</button>' +
        tip('ต่อกลุ่มประเภท: กรอกน้ำหนักที่หัวกลุ่ม (เช่น ปฏิบัติการ 25%) ครั้งเดียว\n' +
            'ระบบแบ่งให้กิจกรรมในกลุ่มตามสัดส่วนคะแนนเต็ม — ทศนิยมได้ตามจริง เช่น 13.33%\n' +
            'ทีละกิจกรรม: กรอกน้ำหนักในฟอร์มของแต่ละกิจกรรม\n' +
            'น้ำหนัก CLO กรอกเองที่หน้า CLO เสมอ ไม่ขึ้นกับตัวเลือกนี้') +
      '</div>' +
    '</div>';

  /* แท็บ ข — เมทริกซ์ กิจกรรม × CLO (ข้อเสนอแนะ 2569-09-17: ไม่แสดงคอลัมน์รายจุดประสงค์)
     ช่อง = % ของกิจกรรมที่วัด CLO นั้น · เบื้องหลังยังเก็บเป็นรายจุดประสงค์ โดยแบ่งตามน้ำหนักจุดประสงค์ (setCloShare) */
  const cloGroups = d.clos.filter(function(c){ return d.objsOf(c.id).length; })
    .map(function(c){ return { c:c, objs:d.objsOf(c.id) }; });
  const stickyTh = 'class="sticky left-0 z-10" style="background:#F6F7FC"';
  const head = '<tr><th ' + stickyTh + '>กิจกรรม</th>' +
    cloGroups.map(function(g){
      return '<th class="num" title="' + esc(g.c.description) + '">CLO ' + g.c.number +
        '<div class="tnum font-normal normal-case tracking-normal text-faint">% ของกิจกรรม</div></th>'; }).join('') +
    '<th class="num" style="width:104px">รวมแถว</th></tr>';

  const matrixRow = function(a){
    const rs = d.rowSum(a.id);
    const cells = cloGroups.map(function(g){
      const cr = d.critOf(a.id, g.c.id);
      const w = cr ? Math.round(cr.weight * 100) / 100 : null;
      const bg = cr ? 'rgba(92,92,120,' + (0.05 + (w / 100) * 0.30).toFixed(3) + ')' : '';
      return '<td class="num" style="background:' + bg + '">' +
        '<input class="cellinp' + (cr ? '' : ' empty') + '" data-crit="' + a.id + '|' + g.c.id +
        '" value="' + (cr ? w : '') + '" placeholder="–" inputmode="numeric" ' +
        'title="' + esc(a.name) + ' → CLO ' + g.c.number + ' · กรอก % เพื่อผูก · ล้างช่องเพื่อเลิกผูก" ' +
        'aria-label="สัดส่วนของ ' + esc(a.name) + ' ที่วัด CLO ' + g.c.number + (cr ? '' : ' (ยังไม่ได้ผูก)') + '"></td>';
    }).join('');
    return '<tr>' +
      '<td class="who sticky left-0 bg-white z-10"><span class="nm block !max-w-[240px]">' + esc(a.name) + '</span>' +
        '<span class="code">' + esc(ASSESS_TH[a.assessmentMethod] || '') + ' · ' + a.weight + '% ของวิชา</span></td>' +
      cells +
      '<td class="num tnum text-[14px] ' + (rs === 100 ? 'text-dim' : 'text-bad font-medium') + '">' +
        rs + '%' + (rs === 100 ? ' ✓' : '') +
        (rs === 100 || rs === 0 ? '' :
          '<button class="block ml-auto mt-1 text-[12.5px] text-dim underline underline-offset-2 no-print" ' +
          'data-act="crit-even" data-id="' + a.id + '">แบ่งเท่ากัน</button>') +
      '</td></tr>';
  };
  /* N4 — แถวหัวกลุ่มประเภทคั่นกิจกรรม แบบเดียวกับแท็บรายการ */
  const body = actTypeGroups(d.acts).map(function(g){
    return '<tr class="cgrouphead"><td colspan="' + (cloGroups.length + 2) + '">' +
      '<span class="text-[14px] text-ink">' + esc(g.label) + '</span>' +
      '<span class="text-[13px] text-dim"> · ' + g.items.length + ' กิจกรรม · น้ำหนักรวม ' +
        n2x(g.items.reduce(function(t, a){ return t + a.weight; }, 0)) + '%</span></td></tr>' +
      g.items.map(matrixRow).join('');
  }).join('');

  /* แถวล่าง — ตรวจน้ำหนัก CLO สองทาง (E2): ที่กรอกในหน้า CLO เทียบกับที่คำนวณจากเมทริกซ์นี้ */
  const foot = '<tr style="background:#F6F7FC">' +
    '<td class="sticky left-0 z-10" style="background:#F6F7FC">' +
      '<div class="flex items-center gap-2"><span class="over">น้ำหนัก CLO ในวิชา</span>' +
        tip('คำนวณ = Σ (น้ำหนักกิจกรรม × % ในช่องของ CLO นั้น)\nเทียบกับค่าที่กรอกในหน้า CLO — ต่างกันเกิน 0.5% จะเตือน') + '</div>' +
      '<div class="text-[13px] mt-1 normal-case text-soft">คำนวณ / ที่กรอก</div></td>' +
    cloGroups.map(function(g){
      const calc = d.cloWeight(g.c.id), set = g.c.weight || 0, bad = Math.abs(calc - set) >= 0.5;
      return '<td class="num tnum">' +
        '<span class="text-[14px] font-medium' + (bad ? ' text-warn' : '') + '">' + n2(calc) + '%</span>' +
        '<span class="text-[13px] text-dim"> / ' + n2(set) + '%</span>' + (bad ? ' <span class="text-warn">≠</span>' : ' ✓') + '</td>';
    }).join('') +
    '<td class="num tnum text-[14px] font-medium">' + n2(d.clos.reduce(function(t,c){ return t + d.cloWeight(c.id); },0)) + '%</td></tr>';

  const problems = [];
  if (d.unlinkedActs.length) problems.push('ยังไม่ผูก CLO: ' + d.unlinkedActs.map(function(a){ return esc(a.name); }).join(' · '));
  const partial = d.badRows.filter(function(a){ return d.rowSum(a.id) !== 0; });
  if (partial.length) problems.push('สัดส่วนยังไม่ครบ 100%: ' + partial.map(function(a){ return esc(a.name) + ' รวมได้ ' + d.rowSum(a.id) + '%'; }).join(' · '));
  if (d.unmeasuredObjs.length) problems.push('จุดประสงค์ที่ยังไม่มีกิจกรรมวัด: ' + d.unmeasuredObjs.map(d.objLabel).join(', ') +
    ' — กรอกช่องของ CLO นั้นใหม่ ระบบจะแบ่งให้ทุกจุดประสงค์ตามน้ำหนัก');

  const matrixBody = cloGroups.length === 0
    ? empty('ยังไม่มีจุดประสงค์ให้เชื่อม',
        'CLO ต้องมีจุดประสงค์อย่างน้อย 1 ข้อจึงจะเชื่อมกิจกรรมได้ — กำหนดจุดประสงค์ก่อน',
        btn('ไปหน้าจุดประสงค์','primary','data-act="goto" data-route="objectives"'))
    : (problems.length
        ? '<div class="mb-5 px-5 py-4 rounded-lg flex gap-3 items-start" style="background:#F4E8E8">' +
          '<span class="text-bad">⚠</span><div class="text-[14px] text-bad">' + problems.join('<br>') + '</div></div>' : '') +
      '<div class="flex items-center gap-2 mb-2.5 text-[14px] text-ink2 flex-wrap">' +
        '<span>กรอก % ของกิจกรรมที่ใช้วัด CLO นั้น · แต่ละแถวรวมให้ได้ 100% · ' +
          '<b class="font-medium">กรอกค่า = ผูก · ล้างช่อง = เลิกผูก</b></span>' +
        tip('ทุกกิจกรรมต้องวัด CLO อย่างน้อย 1 ข้อ\n' +
            'วัด CLO เดียว กรอก 100 · สองข้อ 50/50 · สัดส่วน 2:1 กรอก 67/33\n' +
            'ค่าที่กรอกถูกแบ่งให้จุดประสงค์ใต้ CLO นั้นตามน้ำหนักจุดประสงค์\n' +
            'ปุ่ม “แบ่งเท่ากัน” ท้ายแถวเกลี่ยค่าให้เอง\nEnter = ลงแถวถัดไป · Tab = ไปช่องขวา') + '</div>' +
      '<div class="card scroll-x">' +
        '<table class="dt"><thead>' + head + '</thead><tbody>' + body + foot + '</tbody></table></div>';

  return sheet({
    title: TITLE,
    note:'กิจกรรมแต่ละรายการมีประเภท (นำเสนอ · ปฏิบัติการ · สอบ · โครงงาน) และวิธีประเมิน (แบบทดสอบ · ข้อสอบ · รูบริก · ตรวจชิ้นงาน · สังเกต) · เกณฑ์การประเมินเป็นตัวเลขทั้งหมด: จำนวนหน่วย × คะแนนต่อหน่วย = คะแนนเต็ม และคะแนนที่ถือว่าผ่าน — ไม่ต้องบรรยายเป็นประโยคอีก · คะแนนเต็มมีค่าตั้งต้นตามประเภทกิจกรรม และลดลงได้ (ถ้ามีคะแนนที่กรอกไว้เกินค่าใหม่ ระบบจะถามก่อนปรับ) · จัดกลุ่มกิจกรรมตามประเภทกิจกรรมเป็นค่าตั้งต้น และเปลี่ยนเป็นตามวิธีประเมินหรือ CLO ที่วัดได้ · น้ำหนักในวิชากรอกได้สองแบบ: ต่อกลุ่มประเภท (ระบบแบ่งให้กิจกรรมในกลุ่มตามคะแนนเต็ม ทศนิยมได้ตามจริง) หรือทีละกิจกรรม · น้ำหนัก CLO กรอกเองที่หน้า CLO เสมอ · ช่องในขั้นที่ 5 “เชื่อมกิจกรรมกับ CLO” คือสัดส่วนของกิจกรรมที่ใช้วัด CLO นั้น แต่ละแถวต้องรวมได้ 100% มิฉะนั้นการคำนวณผลจะถูกล็อก',
    actions: btn('ดาวน์โหลดเทมเพลตคะแนน','','data-act="template"') +
             btn('เพิ่มกิจกรรม','primary','data-act="crud-new" data-kind="activity"'),
    body: tab === 'list' ? listBody : matrixBody
  });
}

/* ── 05 · นักศึกษาและคะแนน — ตารางเดียว (T5) ──────────────────────────── */
function viewRoster(){
  const d = D();
  const TITLE = 'นักศึกษาและคะแนน';
  const draftStu = !S.newStu ? '' :
    '<tr style="background:var(--tint)">' +
      '<td class="who sticky left-0 z-10 p-2" style="background:var(--tint)">' +
        '<input class="inp tnum !py-1.5 text-[14px]" id="ns-code" placeholder="รหัสนักศึกษา" aria-label="รหัสนักศึกษา">' +
        '<input class="inp !py-1.5 text-[14px] mt-1.5" id="ns-name" placeholder="ชื่อ-สกุล" aria-label="ชื่อ-สกุล"></td>' +
      '<td colspan="' + (d.acts.length + 2) + '" class="text-[13px] text-soft">' +
        '<span class="inline-flex items-center gap-1.5">กด Enter เพื่อบันทึก แล้วกรอกคะแนนในแถวนั้นได้ทันที' +
        tip('แถวว่างแถวใหม่จะขึ้นหลังบันทึก — เพิ่มต่อได้เลย · Esc ปิดแถวนี้') + '</span></td>' +
      '<td class="no-print"><div class="flex gap-0.5 justify-end">' +
        btn('บันทึก','primary','data-act="stu-row-save"') + btn('ปิด','quiet','data-act="stu-row-cancel"') + '</div></td></tr>';

  const importBtns = btn('ดาวน์โหลดเทมเพลตรายชื่อ','','data-act="template" data-what="roster"') +
    btn('นำเข้ารายชื่อจาก Excel','','data-act="import" data-what="roster"');

  if (d.roster.length === 0 && !S.newStu) return sheet({
    title: TITLE,
    actions: importBtns + btn('เพิ่มนักศึกษา','primary','data-act="stu-new-row"'),
    body: empty('ยังไม่มีรายชื่อนักศึกษา',
      'เพิ่มทีละคนในตาราง หรือนำเข้าจากไฟล์ Excel ทั้งชั้น — ระบบตรวจรูปแบบและรายการซ้ำก่อนบันทึก เมื่อมีรายชื่อแล้วกรอกคะแนนในตารางเดียวกันได้ทันที',
      btn('นำเข้ารายชื่อจาก Excel','','data-act="import" data-what="roster"') +
      btn('เพิ่มนักศึกษา','primary','data-act="stu-new-row"'))
  });

  const key = 'roster';
  const shown = sortRows(key, d.rows.filter(function(r){
    return match(key, r.student.studentCode + ' ' + r.student.name); }));

  /* N4 — หัวตารางสองชั้น: ชื่อกลุ่มประเภทคร่อมคอลัมน์กิจกรรมของกลุ่มนั้น
     คอลัมน์จึงเรียงตามกลุ่ม (colspan ต้องติดกัน) ภายในกลุ่มยังเรียงตามลำดับกิจกรรมเดิม */
  const groups = actTypeGroups(d.acts);
  const cols = [], gstart = {};
  groups.forEach(function(g){ gstart[g.items[0].id] = true; g.items.forEach(function(a){ cols.push(a); }); });
  const gcls = function(a, base){ return ' class="' + base + (gstart[a.id] ? ' gstart' : '') + '"'; };
  const head = '<tr class="ghead">' +
      '<th class="who sticky left-0 z-10" rowspan="2" style="background:#F6F7FC">รหัส · ชื่อ-สกุล</th>' +
      groups.map(function(g){
        return '<th colspan="' + g.items.length + '">' + esc(g.label) +
          '<span class="font-normal normal-case tracking-normal text-faint"> · ' +
            n2x(g.items.reduce(function(t, a){ return t + a.weight; }, 0)) + '%</span></th>'; }).join('') +
      sortableTh(key,'total','รวม (%)','num',' rowspan="2"') +
      '<th rowspan="2" style="width:150px">สถานะ</th>' +
      '<th rowspan="2" class="no-print" style="width:112px"></th></tr>' +
    '<tr>' + cols.map(function(a){
      /* P3 (2569-09-23) — ปฏิบัติการให้คะแนนแบบ "เต็มแล้วหักตามที่ทำไม่ได้" ช่องว่างจึงโชว์คะแนนเต็มเป็นค่าเริ่ม
         และมีปุ่มเติมคะแนนเต็มให้ทุกช่องที่ยังว่างในคอลัมน์ · ช่องว่างยังหมายถึง "ยังไม่ประเมิน" จนกว่าจะกดเติม (FR-62) */
      const blanks = a.type === 'LAB' ? d.roster.filter(function(st){ return d.scoreOf(st.id, a.id) === null; }).length : 0;
      return '<th' + gcls(a, 'num') + '><div>' + esc(a.name) + '</div>' +
        '<div class="tnum font-normal normal-case tracking-normal text-faint">เต็ม ' + n2x(a.maxScore) +
          ' · ผ่านที่ ' + n2x(passScoreOf(a)) + ' · ' + a.weight + '% ของวิชา</div>' +
        (blanks ? '<button class="mt-1 text-[12.5px] font-normal normal-case tracking-normal underline underline-offset-2 text-ink2 hover:text-ink no-print" ' +
            'data-act="fill-max" data-id="' + a.id + '" title="ใส่คะแนนเต็ม ' + n2x(a.maxScore) + ' ให้ ' + blanks +
            ' คนที่ยังไม่มีคะแนน แล้วหักลงรายคน">เริ่มจากคะแนนเต็ม (' + blanks + ')</button>' : '') + '</th>';
    }).join('') + '</tr>';

  const body = shown.map(function(r){
    const cells = cols.map(function(a){
      const sc = d.scoreOf(r.student.id, a.id);
      const none = sc === null;
      const below = !none && (sc / a.maxScore) * 100 < a.passMark;
      return '<td' + gcls(a, 'num scorecell') + (none ? ' style="background:#F9F3E6"' : '') + '>' +
        '<input class="cellinp' + (none ? ' empty' : '') + (below ? ' text-bad' : '') + '" data-score="' + r.student.id + '|' + a.id +
        '" value="' + (none ? '' : sc) + '" placeholder="' + (a.type === 'LAB' ? n2x(a.maxScore) : '–') + '" inputmode="numeric" ' +
        'aria-label="คะแนน ' + esc(r.student.name) + ' · ' + esc(a.name) +
        (none ? ' — ยังไม่ประเมิน' : (below ? ' — ต่ำกว่าเกณฑ์ผ่านกิจกรรม' : '')) + '" title="' + (none ? 'ยังไม่ประเมิน — พิมพ์คะแนนเพื่อบันทึก' :
          (below ? 'ต่ำกว่าเกณฑ์ผ่านกิจกรรม ' + n2x(passScoreOf(a)) + ' คะแนน · ' : '') + 'ลบค่าออกเพื่อกลับเป็นยังไม่ประเมิน') + '">' +
        '<span class="text-dim text-[12.5px]">/' + a.maxScore + '</span></td>';
    }).join('');
    const t = r.total.complete ? tone(r.total.pct, d.course.passCriteria) : 'nil';
    return '<tr>' +
      '<td class="who sticky left-0 bg-white z-10 p-0">' +
        '<button class="w-full text-left px-3 py-2 hover:bg-wash transition-colors" ' +
          'data-act="student" data-id="' + r.student.id + '" title="ดูผลการเรียนรายบุคคล">' +
        '<span class="code">' + r.student.studentCode +
          (r.alsoEnrolled.length ? ' <span title="รหัสนี้ลงทะเบียนอีก ' + r.alsoEnrolled.length + ' รายวิชา">+' + r.alsoEnrolled.length + '</span>' : '') + '</span>' +
        '<span class="nm block">' + esc(r.student.name) + '</span></button></td>' +
      cells +
      '<td class="num tnum text-[14px] font-medium" style="color:' + TONE[t].tx + '">' + n2(r.total.pct) +
        (r.total.complete ? '' : '<div class="text-[12.5px] font-normal text-dim">จาก ' + n0(r.total.covered) + '%</div>') + '</td>' +
      '<td>' + (d.acts.length === 0 ? chip('รอกิจกรรม','nil') : r.total.complete
        ? chip(r.passCourse ? 'ผ่านรายวิชา' : 'ไม่ผ่าน', r.passCourse ? 'ok' : 'bad')
        : chip('ขาด ' + r.total.missing + ' กิจกรรม', 'warn')) + '</td>' +
      '<td class="no-print"><div class="flex gap-0.5 justify-end">' +
        btn('แก้ไข','quiet','data-act="crud-edit" data-kind="student" data-id="' + r.student.id + '"') +
        '<button class="btn btn-quiet btn-danger" data-act="crud-delete" data-kind="student" data-id="' + r.student.id + '">ลบ</button></div></td></tr>';
  }).join('');

  /* T5 — ประวัติการนำเข้าไม่ใช่แท็บแยกอีกต่อไป เป็นแผงพับท้ายตาราง */
  const logOpen = !!S.tab.uploadLog;
  const logs = d.logs.map(function(l){
    const u = byId(db.user, l.uploadedBy);
    return '<tr><td class="tnum text-[13px]">' + l.createdAt + '</td>' +
      '<td class="text-[14px]">' + esc(l.fileName) + '</td>' +
      '<td class="text-[13px] text-ink2">' + esc(u.name) + '</td>' +
      '<td class="num tnum text-ok">' + l.recordsOk + '</td>' +
      '<td class="num tnum ' + (l.recordsFail ? 'text-bad font-medium' : 'text-dim') + '">' + l.recordsFail + '</td>' +
      '<td class="no-print">' + (l.recordsFail
        ? '<button data-act="errreport" data-id="' + l.id + '" class="text-[13px] underline underline-offset-2 hover:text-bad">ดูรายงานข้อผิดพลาด</button>'
        : '<span class="text-[13px] text-dim">—</span>') + '</td></tr>';
  }).join('');
  const logPanel = '<div class="card overflow-hidden mt-4">' +
    '<button class="w-full px-4 py-3 flex items-center gap-2 text-left" data-act="fold" data-key="uploadLog" data-open="' + (logOpen ? '1' : '0') +
      '" aria-expanded="' + (logOpen ? 'true' : 'false') + '">' +
      '<span class="text-faint text-[12.5px] w-3">' + (logOpen ? '▾' : '▸') + '</span>' +
      '<span class="text-[14px]">ประวัติการนำเข้าไฟล์</span>' +
      '<span class="text-[13px] text-dim tnum">(' + d.logs.length + ')</span>' +
      '<span class="ml-auto text-[13px] text-dim">บันทึกเพื่อสอบทาน ไม่อยู่ในเส้นทางคำนวณ</span></button>' +
    (!logOpen ? '' : d.logs.length === 0 ? hollow('ยังไม่มีประวัติการนำเข้าไฟล์')
      : '<div class="scroll-x hair-t"><table class="dt"><thead><tr><th>เวลา</th><th>ไฟล์</th><th>ผู้อัปโหลด</th>' +
        '<th class="num">สำเร็จ</th><th class="num">ล้มเหลว</th><th></th></tr></thead><tbody>' + logs + '</tbody></table></div>') +
    '</div>';

  return sheet({
    title: TITLE,
    note:'รายชื่อและคะแนนอยู่ในตารางเดียว — เพิ่มนักศึกษาเป็นแถวใหม่แล้วกรอกคะแนนต่อได้ทันที · ช่องสีเหลืองคือ “ยังไม่ประเมิน” ซึ่งต่างจากคะแนน 0 ที่นักศึกษาได้จริง · ตัวเลขสีแดงคือต่ำกว่าเกณฑ์ผ่านของกิจกรรมนั้น · กดชื่อเพื่อดูผลรายบุคคล',
    actions: filterBox(key,'ค้นหารหัสหรือชื่อ') +
             btn('+ นักศึกษา','','data-act="stu-new-row"') +
             btn('นำเข้ารายชื่อ','','data-act="import" data-what="roster"') +
             btn('เทมเพลตคะแนน','','data-act="template"') +
             btn('ส่งออกคะแนน','','data-act="export"') +
             btn('นำเข้าคะแนน','primary','data-act="import"'),
    body:
      (shown.length === 0 && !S.newStu
        ? empty('ไม่พบรายชื่อที่ตรงกับคำค้น', 'ลองพิมพ์รหัสนักศึกษาหรือชื่อบางส่วน', btn('ล้างคำค้น','','data-act="clear-filter" data-key="' + key + '"'))
        : '<div class="card scroll-x"><table class="dt"><thead>' + head + '</thead><tbody>' + body + draftStu + '</tbody></table></div>') +
      '<div class="mt-3 flex items-center gap-3 flex-wrap text-[13px] text-dim">' +
        '<span>แสดง ' + shown.length + ' จาก ' + d.rows.length + ' คน</span>' +
        '<span>· พิมพ์ได้เลย · <b>Enter</b> ลงแถวถัดไป · <b>Tab</b> ไปช่องขวา · <b>Esc</b> ยกเลิก</span>' +
        '<span>· ช่องพื้นเหลืองคือยังไม่ประเมิน</span></div>' +
      logPanel
  });
}

/* ── 05 · แดชบอร์ดผลสัมฤทธิ์ CLO ──────────────────────────────────── */
function viewDashboard(){
  const d = D();

  /* §7.1 — three reasons a result page can be unusable, and none of them may
     be rendered as 0%. A zero means "nobody passed", which is a different and
     much more alarming fact than "cannot compute yet" (FR-84). */
  if (!d.locked && d.noScores) return sheet({
    title:'ผลการประเมิน',
    body: empty('ยังไม่มีคะแนนในรายวิชานี้',
      'ตั้งค่าครบแล้ว เหลือเพียงนำเข้าหรือกรอกคะแนน เมื่อมีคะแนนอย่างน้อยหนึ่งกิจกรรม หน้านี้จะคำนวณผลให้ทันที',
      btn('ไปหน้ากรอกคะแนน','primary','data-act="goto" data-route="roster"'))
  });

  if (d.locked) return sheet({
    title:'ผลการประเมิน',
    body: '<div class="card overflow-hidden">' +
      band('ยังคำนวณไม่ได้','<span style="color:#A2504F">คำนวณผลไม่ได้</span>') +
      '<div class="px-4 py-5">' +
        '<p class="text-[16px] text-ink2 leading-relaxed max-w-[62ch]">การคำนวณผลสัมฤทธิ์ถูกล็อกไว้จนกว่าจะแก้ข้อที่เป็น ✕ ให้ครบ — ระบบไม่แสดงตัวเลขที่คำนวณจากข้อมูลไม่สมบูรณ์ เพราะตัวเลขนั้นจะอธิบายต่อกรรมการหลักสูตรไม่ได้</p>' +
        '<div class="mt-6 space-y-2.5">' + d.blockers.map(function(b){
          return '<button data-act="goto" data-route="' + b.route + '" class="w-full text-left px-5 py-3.5 rounded-lg flex items-center gap-4 hover:opacity-80 transition-opacity" style="background:#F4E8E8">' +
            '<span class="text-bad">✕</span>' +
            '<span class="min-w-0 flex-1"><span class="block text-[14px] text-ink">' + b.label + '</span>' +
            '<span class="block text-[14px] text-bad mt-0.5">' + esc(b.detail) + '</span></span>' +
            '<span class="text-bad text-[14px]">แก้ไข ›</span></button>';
        }).join('') + '</div></div></div>'
  });


  const metClos = d.attain.filter(function(a){ return a.met; }).length;
  const passing = d.complete.filter(function(r){ return r.passCourse === true; }).length;
  const avg = d.complete.length
    ? d.complete.reduce(function(t, r){ return t + r.total.pct; }, 0) / d.complete.length : null;

  /* ── ส่วนหัวของกราฟ — สามชั้นเสมอ (2569-09-17)
       ชื่อ   = วัดอะไร + หน่วย          เช่น "ผลการประเมินราย CLO (จำนวนนักศึกษา)"
       คำอ่าน = อ่านกราฟอย่างไร 1 บรรทัด  เช่น "ตัวเลขท้ายแถบ = % ผู้ผ่าน"
       ชิปขวา = คำตอบ ตัวเลขที่ต้องรู้     เช่น "ต่ำสุด CLO 3 · 66.67%"
     คนที่อ่านแค่ชิปก็ได้คำตอบ คนที่อ่านชื่อก็รู้ว่าตัวเลขนั้นมาจากไหน */
  const PM = d.passMark, PC = d.course.passCriteria;
  const scoredAttain = d.attain.filter(function(a){ return a.share !== null; });
  const weakest = scoredAttain.slice().sort(function(a, b){ return a.share - b.share; })[0] || null;
  const section = function(title, sub){
    return '<div class="mt-6 mb-3 first:mt-0"><h2 class="text-[17px] text-ink">' + title + '</h2>' +
      '<div class="text-[13px] text-dim mt-0.5">' + sub + '</div></div>';
  };

  const threeState = '<div class="card overflow-hidden">' +
    chartHead('จำนวนนักศึกษาราย CLO แยกตามสถานะ (คน)',
      'ผ่าน + ต่ำกว่าเกณฑ์ + ยังประเมินไม่ครบ = นักศึกษาทั้งหมด ' + d.roster.length + ' คน ทุกแถว',
      'ใช้ตรวจว่าไม่มีนักศึกษาตกหล่นจากการคำนวณ — ถ้าแถวใดรวมไม่เท่าจำนวนนักศึกษา แปลว่าระบบคำนวณผิด',
      chip(d.attain.every(function(a){ return a.checksum; }) ? 'ครบทุกแถว' : 'มีแถวไม่ครบ',
