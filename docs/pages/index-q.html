           d.attain.every(function(a){ return a.checksum; }) ? 'ok' : 'bad')) +
    '<div class="scroll-x"><table class="dt"><thead><tr><th>CLO</th>' +
      '<th class="num">ผ่าน</th><th class="num">ต่ำกว่าเกณฑ์</th><th class="num">ยังประเมินไม่ครบ</th>' +
      '<th class="num">รวม</th></tr></thead><tbody>' +
    d.attain.map(function(a){
      const sum = a.pass + a.risk + a.pending;
      return '<tr><td class="text-[14px] whitespace-nowrap">CLO ' + a.clo.number + '</td>' +
        '<td class="num tnum" style="color:#4F7C68">' + a.pass + '</td>' +
        '<td class="num tnum" style="color:#A2504F">' + a.risk + '</td>' +
        '<td class="num tnum" style="color:#96793D">' + a.pending + '</td>' +
        '<td class="num tnum' + (a.checksum ? '' : ' text-bad') + '">' + sum + (a.checksum ? ' ✓' : ' ✕') + '</td></tr>';
    }).join('') + '</tbody></table></div></div>';

  /* CR-05 — at-risk is "at least one CLO below the course CLO pass mark", not a rank. */
  const atRisk = d.rows.filter(function(r){ return r.atRisk; })
    .sort(function(a,b){ return b.failingClos.length - a.failingClos.length; });
  const riskList = atRisk.length === 0
    ? hollow('ไม่มีนักศึกษาที่ต่ำกว่าเกณฑ์ CLO ใด','ok')
    : '<div class="px-4">' + atRisk.map(function(r){
        return '<button data-act="student" data-id="' + r.student.id + '" class="w-full text-left py-3 hair last:border-0 hover:opacity-75 transition-opacity">' +
          '<div class="flex items-baseline justify-between gap-3">' +
            '<span class="text-[14px]">' + esc(r.student.name) + '</span>' +
            '<span class="tnum text-[13px] text-dim">' + r.student.studentCode + '</span></div>' +
          '<div class="text-[13px] text-bad mt-1">ไม่ผ่าน ' + r.failingClos.length + ' ข้อ: ' +
            r.failingClos.map(function(c){ return 'CLO ' + c.number; }).join(', ') + '</div></button>';
      }).join('') + '</div>';

  const key = 'heat';
  const shown = sortRows(key, d.rows.filter(function(r){
    return match(key, r.student.studentCode + ' ' + r.student.name); }),
    { col:'passed', dir:'asc', get:function(r){ return r.passedClos; } });

  const heatHead = '<tr><th class="who sticky left-0 z-10" style="background:#F6F7FC">นักศึกษา</th>' +
    d.clos.map(function(c){ return '<th class="num">CLO ' + c.number + '</th>'; }).join('') +
    sortableTh(key,'passed','CLO ที่ผ่าน','num') + sortableTh(key,'total','คะแนนรวม (%)','num') + '</tr>';

  const heatBody = shown.map(function(r){
    const cells = d.clos.map(function(c){
      const v = r.clo[c.id];
      if (v.pct === null) return '<td class="num text-dim">—</td>';
      const t = tone(v.pct, PM);
      const fill = t === 'ok' ? '' :
        t === 'warn' ? 'background:rgba(199,168,96,.18);color:#96793D' :
                       'background:rgba(185,111,110,.16);color:#A2504F;font-weight:500';
      return '<td class="num tnum" style="' + fill + '">' + n2(v.pct) +
        (v.complete ? '' : '<span class="text-warn" title="คะแนนยังไม่ครบ"> *</span>') + '</td>';
    }).join('');
    return '<tr class="rowlink" data-act="student" data-id="' + r.student.id + '"' +
      (r.atRisk ? ' style="box-shadow:inset 3px 0 0 #B96F6E"' : '') + '>' +
      '<td class="who sticky left-0 bg-white z-10"><span class="code">' + r.student.studentCode + '</span>' +
        '<span class="nm block">' + esc(r.student.name) + '</span></td>' + cells +
      '<td class="num tnum font-medium">' + r.passedClos + ' / ' + r.scoredClos + '</td>' +
      '<td class="num tnum">' + n2(r.total.pct) + '</td></tr>';
  }).join('');

  /* M5 · คะแนนดิบราย CLO — ตารางเดียวกับแผนที่ความร้อน แต่หน่วยเป็น "คะแนน"
     ไม่ใช่ "%" · คนที่ถูกถามว่า “CLO 2 เต็มเท่าไร ได้เท่าไร” ตอบจากหน้านี้ได้ตรง ๆ
     โดยไม่ต้องย้อนคิดจากสัดส่วน */
  const rawKey = 'rawclo';
  const rawShown = sortRows(rawKey, d.rows.filter(function(r){
    return match(rawKey, r.student.studentCode + ' ' + r.student.name); }),
    { col:'code', dir:'asc', get:function(r){ return r.student.studentCode; } });

  const rawHead = '<tr><th class="who sticky left-0 z-10" style="background:#F6F7FC">นักศึกษา</th>' +
    d.clos.map(function(c){
      return '<th class="num" title="' + esc(c.description) + '">CLO ' + c.number +
        '<div class="tnum font-normal normal-case tracking-normal text-faint">เต็ม ' +
        n2x(d.cloRawMax(c.id)) + '</div></th>'; }).join('') +
    '<th class="num" style="width:120px">รวมคะแนนดิบ</th></tr>';

  const rawBody = rawShown.map(function(r){
    let tot = 0, totMax = 0;
    const cells = d.clos.map(function(c){
      const v = r.cloRaw[c.id];
      if (v.linked === 0) return '<td class="num text-dim" title="ยังไม่มีกิจกรรมวัด CLO ข้อนี้">—</td>';
      tot += v.earned; totMax += v.maxScored;
      const pct = r.clo[c.id].pct;
      const t = pct === null ? 'nil' : tone(pct, PM);
      const fill = (t === 'ok' || t === 'nil') ? '' :
        t === 'warn' ? 'background:rgba(199,168,96,.18);color:#96793D' :
                       'background:rgba(185,111,110,.16);color:#A2504F;font-weight:500';
      return '<td class="num tnum" style="' + fill + '" title="' +
          esc('คะแนนดิบที่เข้า CLO ' + c.number + ' = Σ (คะแนนที่ได้ × สัดส่วนที่กิจกรรมนั้นวัด CLO นี้)') + '">' +
        (v.maxScored === 0 ? '<span class="text-dim">ยังไม่ประเมิน</span>'
          : n2x(Math.round(v.earned * 100) / 100) +
            '<span class="text-dim"> / ' + n2x(Math.round(v.maxScored * 100) / 100) + '</span>' +
            (v.complete ? '' : '<span class="text-warn" title="ยังขาด ' + v.missing +
              ' กิจกรรม — ตัวหารจึงเป็นเฉพาะส่วนที่ประเมินแล้ว"> *</span>')) + '</td>';
    }).join('');
    return '<tr class="rowlink" data-act="student" data-id="' + r.student.id + '">' +
      '<td class="who sticky left-0 bg-white z-10"><span class="code">' + r.student.studentCode + '</span>' +
        '<span class="nm block">' + esc(r.student.name) + '</span></td>' + cells +
      '<td class="num tnum font-medium">' + n2x(Math.round(tot * 100) / 100) +
        '<span class="text-dim"> / ' + n2x(Math.round(totMax * 100) / 100) + '</span></td></tr>';
  }).join('');

  /* แถวล่าง — ค่าเฉลี่ยของชั้น คิดเฉพาะคนที่มีคะแนนใน CLO ข้อนั้นแล้ว */
  const rawFoot = '<tr style="background:#F6F7FC">' +
    '<td class="sticky left-0 z-10" style="background:#F6F7FC"><span class="over">เฉลี่ยทั้งชั้น</span>' +
      '<div class="text-[13px] mt-1 normal-case text-soft">เฉพาะผู้ที่มีคะแนนแล้ว</div></td>' +
    d.clos.map(function(c){
      const got = d.rows.filter(function(r){ return r.cloRaw[c.id].maxScored > 0; });
      const avg = got.length
        ? got.reduce(function(t, r){ return t + r.cloRaw[c.id].earned; }, 0) / got.length : null;
      return '<td class="num tnum text-[14px]">' + (avg === null ? '—' : n2(avg)) +
        '<span class="block text-[12.5px] text-dim">' + got.length + ' คน</span></td>'; }).join('') +
    '<td class="num tnum text-[14px]">' + n2x(Math.round(
      d.clos.reduce(function(t, c){ return t + d.cloRawMax(c.id); }, 0) * 100) / 100) +
      '<span class="block text-[12.5px] text-dim">คะแนนเต็มรวม</span></td></tr>';

  const rawTab = '<div class="card overflow-hidden">' +
      chartHead('คะแนนดิบราย CLO (คะแนน)',
        'ช่อง = คะแนนที่ได้ / คะแนนเต็มของ CLO ข้อนั้น · <span class="text-warn">*</span> = ยังประเมินไม่ครบ ตัวหารจึงเป็นเฉพาะส่วนที่ประเมินแล้ว',
        'คะแนนเต็มของ CLO = Σ (คะแนนเต็มกิจกรรม × สัดส่วนที่กิจกรรมนั้นวัด CLO ข้อนี้) — ไม่ใช่ผลรวมคะแนนเต็มของทุกกิจกรรม',
        chip('คะแนนเต็มรวมทุก CLO ' + n2x(Math.round(
          d.clos.reduce(function(t, c){ return t + d.cloRawMax(c.id); }, 0) * 100) / 100), 'info'), true) +
      (rawShown.length === 0
        ? hollow('ไม่พบนักศึกษาที่ตรงกับคำค้น')
        : '<div class="scroll-x"><table class="dt"><thead>' + rawHead + '</thead><tbody>' +
          rawBody + rawFoot + '</tbody></table></div>') +
    '</div>' +
    '<div class="card mt-4 px-6 py-4 text-[14px] text-ink2 leading-relaxed">' +
      'คะแนนดิบกับ % ของ CLO ไม่จำเป็นต้องเรียงลำดับตรงกัน — % ถ่วงด้วยน้ำหนักจุดประสงค์ ส่วนคะแนนดิบถ่วงด้วยคะแนนเต็มของกิจกรรม ' +
      'การตัดสินว่า “ผ่าน CLO” ยังใช้ % เทียบเกณฑ์ ' + n0(PM) + '% เหมือนเดิม คะแนนดิบมีไว้เพื่ออธิบายที่มา ไม่ใช่เพื่อตัดสิน' +
    '</div>';

  return sheet({
    title:'ผลการประเมิน',
    note:'ผลการบรรลุ CLO เป็นการอิงเกณฑ์เสมอ แม้รายวิชาจะตัดเกรดแบบอิงกลุ่ม — สถิติของกลุ่มไม่เข้ามาในตัวเลขหน้านี้เด็ดขาด',
    actions: filterBox(subOf('dashboard') === 'raw' ? rawKey : key,'ค้นหานักศึกษา') +
             btn('ส่งออกผลการเรียน','','data-act="export" data-what="results"'),
    body: subOf('dashboard') === 'raw' ? rawTab : subOf('dashboard') === 'students' ? (
      '<div class="card overflow-hidden">' +
        chartHead('คะแนน CLO ของนักศึกษารายคน (%)',
          'ช่องสีแดง = ต่ำกว่าเกณฑ์ผ่าน CLO ' + n0(PM) + '% · <span class="text-warn">*</span> = คะแนนยังไม่ครบ · กดแถวเพื่อดูรายละเอียด',
          'เรียงจากนักศึกษาที่ผ่าน CLO น้อยที่สุดขึ้นก่อน · กดหัวคอลัมน์เพื่อเรียงใหม่',
          chip('ต่ำกว่าเกณฑ์ ' + atRisk.length + ' คน', atRisk.length ? 'bad' : 'ok'), true) +
        (shown.length === 0
          ? hollow('ไม่พบนักศึกษาที่ตรงกับคำค้น')
          : '<div class="scroll-x"><table class="dt"><thead>' + heatHead + '</thead><tbody>' + heatBody + '</tbody></table></div>') +
      '</div>'
    ) : (
      (d.warns.length
        ? '<div class="mb-4 px-4 py-3 rounded-lg flex gap-3 items-start" style="background:#F4EEE1">' +
          '<span class="text-warn">!</span><div class="text-[14px] text-warn flex-1">' +
          d.warns.map(function(w){ return esc(w.detail); }).join(' · ') + '</div>' +
          btn('ไปแก้','quiet','data-act="goto" data-route="activities"') + '</div>'
        : '') +
      statbar(
        stat('นักศึกษาทั้งหมด', d.roster.length + ' คน', 'Sec ' + d.course.section) +
        stat('CLO ที่บรรลุเป้าหมาย', metClos + ' / ' + d.clos.length + ' ข้อ', 'เป้าหมาย: นักศึกษาที่ประเมินครบผ่านทุกคน',
             metClos === d.clos.length ? 'ok' : (metClos ? 'warn' : 'bad')) +
        stat('ผ่านรายวิชา', d.complete.length ? n0(passing / d.complete.length * 100) + '%' : '—',
             passing + ' จาก ' + d.complete.length + ' คนที่คะแนนครบ') +
        stat('คะแนนรวมเฉลี่ย', avg === null ? '—' : n2(avg) + '%', 'เกณฑ์ผ่านรายวิชา ' + n0(PC) + '%')
      ) +

      section('1 · ผลลัพธ์ราย CLO', 'CLO ข้อไหนที่นักศึกษายังทำไม่ได้') +
      '<div class="grid grid-cols-1 xl:grid-cols-2 gap-4">' +
        '<div class="card overflow-hidden">' +
          chartHead('ผลการประเมินราย CLO (จำนวนนักศึกษา)',
            'แถบยาวเท่ากับนักศึกษาทั้งชั้น · ตัวเลขท้ายแถบ = % ผู้ผ่านจากคนที่ประเมินครบ · เกณฑ์ผ่าน CLO ' + n0(PM) + '%',
            'เขียว = ผ่าน · แดง = ต่ำกว่าเกณฑ์ · เทา = ยังประเมินไม่ครบ',
            weakest ? chip('ต่ำสุด CLO ' + weakest.clo.number + ' · ' + n2(weakest.share) + '%', weakest.met ? 'ok' : 'bad') : '') +
          chartAttainment(d) + '</div>' +
        '<div class="card overflow-hidden">' +
          chartHead('ร้อยละผู้ผ่านราย CLO (%)',
            'หนึ่งแกนคือ CLO หนึ่งข้อ · ขอบนอกสุด = ผ่านทุกคน (เป้าหมาย) · ยุบเข้ากลาง = ต้องแก้',
            'ตัวเลขชุดเดียวกับกราฟแท่งข้าง ๆ แสดงเป็นรูปทรงเพื่อเห็นข้อที่อ่อนในครั้งเดียว',
            chip('บรรลุ ' + metClos + ' / ' + d.clos.length + ' ข้อ', metClos === d.clos.length ? 'ok' : (metClos ? 'warn' : 'bad'))) +
          chartRadar(d) + '</div>' +
      '</div>' +

      section('2 · ผลลัพธ์รายวิชา', 'นักศึกษาผ่านรายวิชากี่คน และคะแนนรวมกระจายอยู่ตรงไหน') +
      '<div class="grid grid-cols-1 xl:grid-cols-[minmax(0,1fr)_380px] gap-4">' +
        '<div class="card overflow-hidden">' +
          chartHead('การกระจายคะแนนรวมของชั้นเรียน (จำนวนนักศึกษา)',
            'ช่วงละ 10% · เส้นประ = เกณฑ์ผ่านรายวิชา ' + n0(PC) + '% · นับ ' + d.complete.length + ' คนที่คะแนนครบ',
            'นักศึกษาที่ยังมีคะแนนขาดไม่ถูกนับ เพราะคะแนนที่ขาดไม่ใช่ 0',
            avg === null ? '' : chip('เฉลี่ย ' + n2(avg) + '%', avg >= PC ? 'ok' : 'bad')) +
          chartHistogram(d) + '</div>' +
        '<div class="card overflow-hidden">' +
          chartHead('สถานะการผ่านรายวิชา (คน)',
            'ตัดสินจากคะแนนรวมเทียบเกณฑ์ผ่าน ' + n0(PC) + '%',
            'รอประเมิน = ยังมีคะแนนกิจกรรมที่ขาด จึงยังตัดสินไม่ได้',
            d.complete.length ? chip('ผ่าน ' + passing + ' / ' + d.complete.length + ' คน',
              passing === d.complete.length ? 'ok' : 'warn') : '') +
          chartStatus(d) + '</div>' +
      '</div>' +

      section('3 · นักศึกษาที่ต้องติดตาม', 'ใครต้องได้รับการช่วยเหลือ และตัวเลขทั้งหมดครบถ้วนหรือไม่') +
      '<div class="grid grid-cols-1 xl:grid-cols-[380px_minmax(0,1fr)] gap-4 mb-4">' +
        '<div class="card overflow-hidden">' +
          chartHead('นักศึกษาที่ต่ำกว่าเกณฑ์ CLO',
            'เรียงจากจำนวน CLO ที่ไม่ผ่านมากไปน้อย · กดชื่อเพื่อดูรายละเอียด',
            'ต่ำกว่าเกณฑ์ = คะแนน CLO ต่ำกว่า ' + n0(PM) + '% อย่างน้อย 1 ข้อ',
            chip(atRisk.length + ' คน', atRisk.length ? 'bad' : 'ok')) +
          riskList + '</div>' +
        threeState +
      '</div>')
  });
}

/* ── 06 · การตัดเกรด ──────────────────────────────────────────────── */
function viewGrading(){
  const d = D(), C = d.course;
  const isPF   = C.gradeScale === 'PASS_FAIL';
  const isNorm = C.gradeMethod === 'NORM_REFERENCED';

  const dist = {};
  d.bands.forEach(function(b){ dist[b.grade] = 0; });
  d.grades.forEach(function(g){ if (g.grade) dist[g.grade] = (dist[g.grade] || 0) + 1; });
  const maxCount = Math.max.apply(null, Object.keys(dist).map(function(k){ return dist[k]; }).concat([1]));
  const unit = isNorm ? 'T-score' : 'ร้อยละ';

  /* H4 — ขอบบนเคยเป็นขอบล่างของขั้นที่สูงกว่าตรง ๆ จึงแสดง A 80 – 100 และ B+ 75 – 80
     ตัวเลข 80 อยู่สองขั้น ทั้งที่ระบบตัดสิน 80 เป็น A เสมอ (`>= minValue`) — ข้อมูลไม่ทับ
     แต่หน้าจอบอกว่าทับ · ขอบบนจึงเป็น ขอบล่างขั้นถัดไป − 0.01 ซึ่งเป็นความละเอียดเดียวกับที่
     คะแนนรวมถูกปัดตอนคำนวณ (n2) ช่วงที่ต่อกันจึงไม่มีทั้งรอยทับและรู
     อิงกลุ่ม: T-score ไม่มีเพดาน 100 ขั้นบนสุดจึงเขียนเป็น “ตั้งแต่” */
  const ladder = d.bands.map(function(b, i){
    const range = i === 0
      ? (isNorm ? 'ตั้งแต่ ' + n2(b.minValue) : n2(b.minValue) + ' – 100.00')
      : n2(b.minValue) + ' – ' + n2(Math.max(b.minValue, d.bands[i-1].minValue - 0.01));
    return '<tr><td><span class="tnum text-[15px] font-medium">' + b.grade + '</span></td>' +
      '<td class="tnum text-[14px]">' + range + '</td>' +
      '<td style="width:220px"><div class="h-4 bg-wash rounded-sm overflow-hidden">' +
        '<div class="h-full bg-haze" style="width:' + (dist[b.grade]/maxCount*100) + '%"></div></div></td>' +
      '<td class="num tnum">' + dist[b.grade] + '</td>' +
      '<td class="no-print"><div class="flex gap-0.5 justify-end">' +
        btn('แก้ไข','quiet','data-act="crud-edit" data-kind="band" data-id="' + b.id + '"') +
        (b.minValue === 0 ? '' :
          '<button class="btn btn-quiet btn-danger" data-act="crud-delete" data-kind="band" data-id="' + b.id +
            '">ลบ</button>') + '</div></td></tr>';
  }).join('');

  const methodCard = '<div class="card overflow-hidden">' +
    band('วิธีตัดเกรด', btn(withIcon('edit', 'แก้ไข'),'','data-act="grading-settings" aria-label="แก้ไขวิธีตัดเกรด"')) +
    '<div class="p-4">' +
      /* K2 — ย่อหน้าที่เจ้าของงานไฮไลต์ว่ารก ย้ายเข้า ⓘ ข้างชื่อวิธีตัดเกรด */
      '<div class="text-[19px] flex items-center gap-2">' + METHOD_TH[C.gradeMethod] +
        tip(isPF ? 'รายวิชานี้รายงานผลเป็น ผ่าน (S) / ไม่ผ่าน (U) เท่านั้น — ไม่แสดงเกรด A–F'
          : isNorm ? 'ขอบเขตของเกรดอ่านเป็น T-score เพราะตัดเกรดแบบอิงกลุ่ม\nถ้าเปลี่ยนเป็นอิงเกณฑ์ ค่าเดียวกันจะถูกอ่านเป็นร้อยละ'
          : 'ขอบเขตของเกรดอ่านเป็นร้อยละ เพราะตัดเกรดแบบอิงเกณฑ์\nไม่มีคอลัมน์หน่วยแยก หน่วยตามมาจากวิธีตัดเกรด\n\n' +
            GRADE_HELP[C.gradeMethod]) + '</div>' +
      '<div class="hair-t mt-5 pt-4 grid grid-cols-2 gap-4">' +
        '<div><div class="over flex items-center gap-1.5">รูปแบบเกรด' + tip(GRADE_HELP[C.gradeScale]) + '</div>' +
          '<div class="text-[14px] mt-1">' + SCALE_TH[C.gradeScale] + '</div></div>' +
        '<div><div class="over">เกณฑ์ผ่านรายวิชา</div><div class="tnum text-[14px] mt-1">' + n0(C.passCriteria) + '%</div></div>' +
      '</div>' +
      (isNorm ? '<div class="hair-t mt-4 pt-4">' +
        '<div class="over mb-2 flex items-center gap-1.5">สถิติของกลุ่ม' +
          tip('mean / SD / T ไม่ถูกเก็บลงฐานข้อมูล — คำนวณตอนกดตัดเกรด แล้วเขียนเฉพาะ totalPercent กับ grade') + '</div>' +
        (d.reject
          ? '<div class="text-[14px] text-bad">' + esc(d.reject) + '</div>'
          : '<div class="grid grid-cols-3 gap-3 text-center">' +
              '<div><div class="tnum text-[22px] font-light">' + d.stats.n + '</div><div class="text-[12.5px] text-dim">n</div></div>' +
              '<div><div class="tnum text-[22px] font-light">' + n2(d.stats.mean) + '</div><div class="text-[12.5px] text-dim">mean</div></div>' +
              '<div><div class="tnum text-[22px] font-light">' + n2(d.stats.sd) + '</div><div class="text-[12.5px] text-dim">SD</div></div></div>' +
            (d.stats.small ? '<div class="text-[13px] text-warn mt-3">n น้อยกว่า 15 — อิงกลุ่มมีความหมายทางสถิติจำกัด (เตือน ไม่บล็อก)</div>' : '') +
            '')
      + '</div>' : '') +
    '</div></div>';

  const gradeRows = sortRows('grade', d.grades.slice(), { col:'value', dir:'desc', get:function(g){ return g.value; } })
    .map(function(g){
      const r = g.row;
      return '<tr class="rowlink" data-act="student" data-id="' + r.student.id + '">' +
        '<td class="who"><span class="code">' + r.student.studentCode + '</span>' +
          '<span class="nm block">' + esc(r.student.name) + '</span></td>' +
        '<td class="num tnum">' + n2(r.total.pct) + '</td>' +
        (isNorm ? '<td class="num tnum">' + (g.t === null ? '—' : n2(g.t)) + '</td>' : '') +
        '<td class="num tnum">' + r.passedClos + '/' + r.scoredClos + '</td>' +
        '<td>' + (r.total.complete
          ? chip(r.passCourse ? 'ผ่าน' : 'ไม่ผ่าน', r.passCourse ? 'ok' : 'bad')
          : chip('รอประเมิน','warn')) + '</td>' +
        '<td class="tnum text-[14px]">' + (g.derived ? g.derived : (g.grade || '<span class="text-dim">—</span>')) + '</td>' +
        '<td class="tnum text-[15px] font-medium">' + (g.grade || '<span class="text-dim">—</span>') +
          (g.overrideReason ? ' <span class="text-[12.5px] font-normal text-warn">ปรับแล้ว</span>' : '') + '</td>' +
        '<td class="text-[13px] text-ink2 max-w-[260px]">' +
          (g.overrideReason ? esc(g.overrideReason) : '<span class="text-dim">—</span>') + '</td>' +
        '<td class="no-print">' + (g.grade
          ? btn('ปรับเกรด','quiet','data-act="override" data-id="' + r.student.id + '"')
          : '<span class="text-[13px] text-dim">—</span>') + '</td></tr>';
    }).join('');

  const ungraded = d.rows.filter(function(r){ return !r.total.complete; }).length;

  return sheet({
    title:'การตัดเกรด',
    note:'เกรดถูกตรึงไว้ตอนตัดเกรด ไม่ได้อ่านทะลุไปที่คะแนนดิบ — แก้คะแนนภายหลังจะไม่ทำให้เกรดที่ออกไปแล้วเปลี่ยนเงียบ ๆ และการปรับเกรดต้องมีเหตุผลกำกับเสมอ',
    actions: btn(withIcon('tune', 'ตั้งค่าการตัดเกรด'),'','data-act="grading-settings"') +
             btn('ส่งออกใบส่งเกรด','','data-act="export" data-what="results"') +
             btn('ประมวลผลเกรด','primary','data-act="run-grading"'),
    body:
      '<div class="grid grid-cols-1 xl:grid-cols-[330px_minmax(0,1fr)] gap-4 mb-4">' +
        methodCard +
        '<div class="card overflow-hidden">' +
          band('ขั้นบันไดเกรด','<span>อ่านเป็น ' + unit + '</span>' +
            btn('+ ระดับเกรด','quiet','data-act="crud-new" data-kind="band"')) +
          '<div class="scroll-x"><table class="dt"><thead><tr><th>เกรด</th><th>ช่วง (' + unit + ')</th>' +
            '<th>การกระจาย</th><th class="num">จำนวน</th><th class="no-print" style="width:130px"></th>' +
            '</tr></thead><tbody>' + ladder + '</tbody></table></div></div>' +
      '</div>' +
      (ungraded ? '<div class="mb-6 px-5 py-4 rounded-lg flex gap-3 items-start" style="background:#F4EEE1">' +
        '<span class="text-warn">⚠</span><div class="text-[14px] text-warn">มี ' + ungraded +
        ' คนที่คะแนนยังไม่ครบ — ระบบไม่ออกเกรดให้ และจะไม่แทนด้วย ' + (isPF ? 'U' : 'F') + '</div></div>' : '') +
      '<div class="card overflow-hidden scroll-x">' +
        band('เกรดรายบุคคล', isPF ? '<span>แสดง S/U เท่านั้น</span>' : '') +
        '<table class="dt"><thead><tr>' +
          '<th>นักศึกษา</th>' + sortableTh('grade','value','รวม (%)','num') +
          (isNorm ? '<th class="num">T-score</th>' : '') +
          '<th class="num">CLO ผ่าน</th><th>ผ่านรายวิชา</th>' +
          '<th>ตามขอบเขต</th><th>ที่ออกจริง</th><th>เหตุผลการปรับ</th>' +
          '<th class="no-print" style="width:96px"></th>' +
        '</tr></thead><tbody>' + gradeRows + '</tbody></table></div>'
  });
}

/* ── 07 · รายวิชาทั้งหมด ──────────────────────────────────────────── */
/* ── การจัดหมวดของหน้าจัดการรายวิชา ────────────────────────────────
   คีย์ของรายวิชาคือ (รหัส, ภาค, ปี, Sec) — สามในสี่ตัวนั้นคือหมวดที่ผู้ใช้
   มองหาจริง จึงให้เลือกจัดกลุ่มได้ตามตัวใดตัวหนึ่ง ไม่ใช่รายการเรียงยาวตัวเดียว */
const COURSE_GROUPBY = [
  { id:'year',    label:'ปีการศึกษา',
    of:function(c){ return 'y' + c.year; },        head:function(c){ return 'ปีการศึกษา ' + c.year; } },
  { id:'term',    label:'ภาคเรียน',
    of:function(c){ return c.year + '/' + c.semester; },
    head:function(c){ return 'ภาค ' + c.semester + '/' + c.year; } },
  { id:'section', label:'หมู่เรียน (Sec)',
    of:function(c){ return 'sec' + c.section; },   head:function(c){ return 'หมู่เรียน ' + c.section; } },
  { id:'code',    label:'รหัสวิชา',
    of:function(c){ return c.code; },              head:function(c){ return c.code + ' · ' + c.name; } },
  { id:'none',    label:'ไม่จัดกลุ่ม', of:function(){ return '*'; }, head:function(){ return ''; } }
];
const courseGroupBy = function(){
  const want = S.tab.courseGroup || 'term';
  return COURSE_GROUPBY.find(function(g){ return g.id === want; }) || COURSE_GROUPBY[1];
};

function viewCourses(){
  const key = 'courses';
  const scoped = myCourses();
  const gb = courseGroupBy();
  const list = sortRows(key, scoped.filter(function(c){
    return match(key, c.code + ' ' + c.name + ' ' + c.section + ' ' + c.year + ' ' + c.semester); }),
    { col:'code', dir:'asc', get:function(c){ return c.code + c.section; } });

  const row = function(c){
    const d = derive(c.id);
    const staffU = d.staff.map(function(x){ return byId(db.user, x.userId); }).filter(Boolean);
    const active = c.id === S.course;
    return '<tr class="rowlink" data-act="pick-course" data-id="' + c.id + '"' +
      (active ? ' style="box-shadow:inset 3px 0 0 #1E233C"' : '') + '>' +
      '<td class="tnum text-[14px] whitespace-nowrap">' + c.code + '</td>' +
      '<td><div class="text-[14px]">' + esc(c.name) + '</div>' +
        '<div class="text-[13px] text-dim whitespace-nowrap">Sec ' + c.section + ' · ภาค ' + c.semester + '/' + c.year + '</div></td>' +
      '<td class="tnum text-[13px]">' + c.credits + ' (' + c.lectureHours + '-' + c.practiceHours + '-' + c.selfStudyHours + ')</td>' +
      '<td>' + pill(SCALE_TH[c.gradeScale]) + '</td>' +
      '<td>' + pill(METHOD_TH[c.gradeMethod]) + '</td>' +
      '<td class="text-[14px]">' + (staffU.length
        ? esc(staffU[0].name) + (staffU[0].isActive ? '' : ' <span class="text-[12.5px] text-bad">(ระงับ)</span>') +
          (staffU.length > 1 ? ' <span class="text-[13px] text-dim">+' + (staffU.length - 1) + '</span>' : '')
        : '<span class="text-bad text-[13px]">ยังไม่มีผู้สอน</span>') + '</td>' +
      '<td class="num tnum">' + d.roster.length + '</td>' +
      '<td>' + (d.locked ? chip(d.blockers.length + ' ข้อค้าง','bad') : chip('พร้อม','ok')) + '</td>' +
      '<td class="no-print text-[13px] whitespace-nowrap ' + (active ? 'text-ink' : 'text-dim') + '">' +
        /* A real <a href>, so the course has a URL: click opens it, middle-click
           or ctrl-click opens a new tab, right-click → copy link works too. */
        '<a class="deeplink underline decoration-transparent hover:decoration-inherit underline-offset-2" href="' +
          hashFor('overview', c.id) + '" title="' + esc(courseUrl(c.id)) + '">' +
          (active ? 'กำลังเปิดอยู่ ›' : 'เปิดรายวิชา ›') + '</a>' +
        ' <button class="btn btn-quiet !py-0.5 !px-2 ml-1" data-act="copy-link" data-id="' + c.id +
          '" title="คัดลอกลิงก์ ' + esc(hashFor('overview', c.id)) + '">คัดลอกลิงก์</button>' +
        /* P16 — ADMIN on every row, an instructor only on courses they teach. applyPermissions
           checks data-course, not the course on screen. Before this, the only delete
           button sat inside the edit modal, which an ADMIN cannot open — so no ADMIN
           could reach "ลบรายวิชา" at all. */
        ' <button class="btn btn-quiet !py-0.5 !px-2 ml-1" data-act="course-edit" data-course="' + c.id +
          '" title="แก้ไขรายวิชานี้">แก้ไข</button>' +
        ' <button class="btn btn-quiet !py-0.5 !px-2 ml-1" data-act="dup-course" data-course="' + c.id +
          '" title="ทำสำเนาเป็น Sec ใหม่ พร้อม CLO จุดประสงค์ และกิจกรรม">ทำสำเนา</button>' +
        ' <button class="btn btn-quiet btn-danger !py-0.5 !px-2 ml-2" data-act="del-course" data-course="' +
        c.id + '">ลบ</button></td></tr>';
  };

  /* มุมมองการ์ด — แบบเดียวกับกระดาน Teams: รูปประจำวิชาทำหน้าที่ให้จำได้
     ชื่อและภาคเรียนอยู่ถัดมา และการกระทำเป็นแถวไอคอนตามขอบล่างของการ์ด
     ปุ่มทุกปุ่มพก data-course ของตัวเอง — applyPermissions() ตรวจกับวิชานั้น ไม่ใช่วิชาบนจอ (SEC-3) */
  const card = function(c){
    const d = derive(c.id);
    const staffU = d.staff.map(function(x){ return byId(db.user, x.userId); }).filter(Boolean);
    const active = c.id === S.course;
    const act = function(a, ic, label, extra){
      return '<button class="cact' + (extra || '') + '" data-act="' + a + '" data-course="' + c.id +
        '" title="' + esc(label) + '" aria-label="' + esc(label + ' · ' + c.code + ' Sec ' + c.section) + '">' +
        icon(ic, '') + '</button>'; };
    return '<div class="ccard"' + (active ? ' data-open="1"' : '') + '>' +
      '<button class="ccard-main" data-act="pick-course" data-id="' + c.id + '">' +
        '<span class="tavatar">' + c.code.slice(-3) + '</span>' +
        '<span class="min-w-0 flex-1">' +
          '<span class="ccard-name">' + esc(c.name) + '</span>' +
          '<span class="ccard-meta">' + c.code + ' · Sec ' + c.section + ' · ภาค ' + c.semester + '/' + c.year + '</span>' +
        '</span>' +
        '<span class="tdot mt-1.5" style="background:' +
          (d.locked ? TONE.bad.bar : (d.warns.length ? TONE.warn.bar : TONE.ok.bar)) + '" title="' +
          (d.locked ? 'ยังตั้งค่าไม่ครบ' : (d.warns.length ? 'มีข้อควรตรวจสอบ' : 'พร้อมใช้งาน')) + '"></span>' +
      '</button>' +
      '<div class="ccard-facts">' +
        pill(c.credits + ' (' + c.lectureHours + '-' + c.practiceHours + '-' + c.selfStudyHours + ')') +
        pill(SCALE_TH[c.gradeScale]) + pill(METHOD_TH[c.gradeMethod]) +
        pill(d.roster.length + ' นศ.') +
        (d.locked ? chip(d.blockers.length + ' ข้อค้าง','bad') : chip('พร้อม','ok')) +
      '</div>' +
      '<div class="px-[14px] pb-2.5 text-[12.5px] text-dim truncate">' + (staffU.length
        ? esc(staffU[0].name) + (staffU[0].isActive ? '' : ' (ระงับ)') +
          (staffU.length > 1 ? ' +' + (staffU.length - 1) : '')
        : '<span class="text-bad">ยังไม่มีผู้สอน</span>') + '</div>' +
      '<div class="ccard-foot no-print">' +
        /* A real <a href>, so the course has a URL: middle-click and
           right-click → copy link keep working the way they do in a browser. */
        '<a class="cact deeplink" href="' + hashFor('overview', c.id) + '" title="' +
          (active ? 'กำลังเปิดอยู่' : 'เปิดรายวิชา') + '" aria-label="เปิด ' + esc(c.name) + '">' +
          icon('ext','') + '</a>' +
        '<button class="cact" data-act="copy-link" data-id="' + c.id + '" title="คัดลอกลิงก์ ' +
          esc(hashFor('overview', c.id)) + '" aria-label="คัดลอกลิงก์">' + icon('link','') + '</button>' +
        act('course-edit','edit','แก้ไขรายวิชานี้') +
        act('dup-course','copy','ทำสำเนาเป็น Sec ใหม่ พร้อม CLO จุดประสงค์ และกิจกรรม') +
        '<span class="flex-1"></span>' +
        act('del-course','trash','ลบรายวิชานี้',' is-danger') +
      '</div></div>';
  };

  /* กลุ่มถูกจัดตามลำดับที่ผู้ใช้เลือก แล้วเรียงหัวกลุ่มจากใหม่ไปเก่า — ภาคเรียน
     ปัจจุบันคือสิ่งที่คนเปิดหน้านี้มองหาเกือบทุกครั้ง */
  const buckets = [];
  const seen = {};
  list.forEach(function(c){
    const k = gb.of(c);
    if (!seen[k]) { seen[k] = { key:k, head:gb.head(c), sample:c, items:[] }; buckets.push(seen[k]); }
    seen[k].items.push(c);
  });
  buckets.sort(function(a, b){
    return (b.sample.year - a.sample.year) || (b.sample.semester - a.sample.semester) ||
           String(a.head).localeCompare(String(b.head)); });

  const bkNote = function(bk){
    const nStu = bk.items.reduce(function(t, c){ return t + derive(c.id).roster.length; }, 0);
    const nReady = bk.items.filter(function(c){ return !derive(c.id).locked; }).length;
    return bk.items.length + ' รายวิชา · ' + nStu + ' นักศึกษา · พร้อมใช้งาน ' +
      nReady + '/' + bk.items.length; };

  const COLS = 10;
  const rows = gb.id === 'none'
    ? list.map(row).join('')
    : buckets.map(function(bk){
        return '<tr class="cgrouphead"><td colspan="' + COLS + '">' +
            '<span class="text-[14px] text-ink">' + esc(bk.head) + '</span>' +
            '<span class="text-[13px] text-dim"> · ' + bkNote(bk) + '</span>' +
          '</td></tr>' + bk.items.map(row).join('');
      }).join('');

  const cards = gb.id === 'none'
    ? '<div class="cgrid">' + list.map(card).join('') + '</div>'
    : buckets.map(function(bk){
        return '<div class="cgrouptitle">' +
            '<span class="text-[16px] text-ink">' + esc(bk.head) + '</span>' +
            '<span class="text-[13px] text-dim">' + bkNote(bk) + '</span></div>' +
          '<div class="cgrid">' + bk.items.map(card).join('') + '</div>';
      }).join('');

  /* Principle 2 — การ์ดอ่านง่ายเวลาหาวิชา ตารางอ่านง่ายเวลาเทียบวิชา
     ทั้งสองอ่านข้อมูลชุดเดียวกัน ผู้ใช้จึงเลือกได้โดยไม่เสียอะไร */
  const view = S.tab.courseView === 'table' ? 'table' : 'card';
  /* สองชุดนี้ตอบคนละคำถาม จึงห่อแยกกัน — เวลาแถบแคบลงมันจะขึ้นบรรทัดใหม่
     ทั้งชุด ไม่ใช่แตกกลางชุดจนคำว่า "แสดงเป็น" ลอยไปคนละบรรทัดกับตัวเลือก */
  const chipSet = function(label, opts, cur, actName){
    return '<span class="flex items-center gap-1.5 flex-wrap">' +
      '<span class="text-dim">' + label + '</span>' +
      opts.map(function(o){
        return '<button class="chipbtn" data-act="' + actName + '" data-val="' + o[0] + '"' +
          (o[0] === cur ? ' aria-current="true"' : '') + '>' + o[1] + '</button>'; }).join('') + '</span>'; };

  const groupBar = '<div class="flex items-center gap-x-5 gap-y-2 flex-wrap text-[13px]">' +
    chipSet('จัดกลุ่มตาม', COURSE_GROUPBY.map(function(g){ return [g.id, g.label]; }), gb.id, 'course-group') +
    chipSet('แสดงเป็น', [['card','การ์ด'],['table','ตาราง']], view, 'course-view') + '</div>';

function coverageWitnesses(){
  const all = db.course.map(function(c){ return derive(c.id); });
  const dup = function(arr, keyfn){
    const seen = {}; let n = 0;
    arr.forEach(function(x){ const k = keyfn(x); if (seen[k]) n++; seen[k] = 1; });
    return n; };
  const critCross = db.assessmentCriteria.filter(function(cr){
    const a = byId(db.activity, cr.activityId), o = byId(db.behavioralObjective, cr.objectiveId);
    const c = o ? byId(db.clo, o.cloId) : null;
    return !a || !c || a.courseId !== c.courseId; }).length;
  const scoreCross = db.score.filter(function(sc){
    const s = byId(db.student, sc.studentId), a = byId(db.activity, sc.activityId);
    return !s || !a || s.courseId !== a.courseId; }).length;
  const overMax = db.score.filter(function(sc){
    const a = byId(db.activity, sc.activityId); return a && sc.score > a.maxScore; }).length;
  const neg = db.score.filter(function(sc){ return sc.score < 0; }).length;
  const zeros = db.score.filter(function(sc){ return sc.score === 0; }).length;
  const missing = all.reduce(function(t,d){ return t + (d.scoredCells - d.filledCells); }, 0);
  const pfBands = where(db.gradeBand, 'courseId', 'c2').map(function(b){ return b.grade; }).sort().join('/');
  const shared = db.student.filter(function(s){ return s.studentCode === '6604101003'; }).length;

  return [
    ['CHECK score >= 0','ไม่มีคะแนนติดลบในฐาน และแถวที่ติดลบถูกปฏิเสธตอนนำเข้า',
      neg === 0 && db.uploadReject.some(function(r){ return r.value === '-3'; }), 'คะแนนติดลบ ' + neg + ' แถว · ปฏิเสธไว้ 1 แถวในไฟล์ lab-uml-week7.xlsx'],

      'ตรวจ ' + db.activity.length + ' กิจกรรม'],

      db.course.every(function(c){ return c.cloPassMark >= 0 && c.cloPassMark <= 100; }) &&

      'เกณฑ์ผ่าน CLO ที่ใช้จริง ' + Math.min.apply(null, db.course.map(function(c){ return c.cloPassMark; })) + '–' +

function viewCoverage(){
  const routeIds = ROUTES.map(function(r){ return r.id; });
  const ucCovered = USE_CASES.filter(function(u){ return u[5] && routeIds.indexOf(u[5]) >= 0; });
  const wit = coverageWitnesses();
  const witOk = wit.filter(function(w){ return w[2]; }).length;

  let pkg = '';
  const ucRows = USE_CASES.map(function(u){
    const covered = u[5] && routeIds.indexOf(u[5]) >= 0;
    const head = u[0] !== pkg;
    pkg = u[0];
    const route = covered ? byId(ROUTES, u[5]) : null;
    return (head ? '<tr style="background:#F6F7FC"><td colspan="5" class="over" style="padding-top:14px">' +
        'แพ็กเกจ ' + u[0] + ' · ' + esc(u[1]) + '</td></tr>' : '') +
      '<tr' + (covered ? ' class="rowlink" data-act="goto" data-route="' + u[5] + '"' : '') + '>' +
      '<td class="tnum text-[14px] text-dim" style="width:56px">' + u[2] + '</td>' +
      '<td class="wrapcell"><span class="text-[14px] clip">' + esc(u[3]) + '</span></td>' +
      '<td style="width:120px">' + pill(u[4]) + '</td>' +
      '<td class="text-[14px]" style="width:230px">' + (route
        ? '<span class="text-ink">' + esc(route.label) + ' ›</span>'
        : '<span class="text-warn">ไม่มีหน้ารองรับ</span>') + '</td>' +
      '<td style="width:120px">' + chip(covered ? 'ครอบคลุม' : 'ช่องว่าง', covered ? 'ok' : 'warn') + '</td></tr>';
  }).join('');

  const erRows = ER_MODELS.map(function(m){
    const count = m[2]();
    return '<tr class="rowlink" data-act="goto" data-route="' + m[4] + '">' +
      '<td class="text-[14px] whitespace-nowrap">' + m[0] + '</td>' +
      '<td class="wrapcell"><span class="text-[14px] text-ink2 clip">' + esc(m[1]) + '</span></td>' +
      '<td class="num tnum text-[14px]">' + count + '</td>' +
      '<td class="wrapcell"><span class="text-[13px] text-dim clip">' + esc(m[3]) + '</span></td>' +
      '<td style="width:110px">' + chip(count > 0 ? 'มีข้อมูลจริง' : 'ยังไม่มีแถว', count > 0 ? 'ok' : 'warn') + '</td></tr>';
  }).join('');

  const witRows = wit.map(function(w){
    return '<tr><td class="text-[14px] whitespace-nowrap">' + esc(w[0]) + '</td>' +
      '<td class="wrapcell"><span class="text-[14px] text-ink2 clip">' + esc(w[1]) + '</span></td>' +
      '<td class="wrapcell"><span class="text-[13px] text-dim clip">' + esc(w[3]) + '</span></td>' +
      '<td style="width:104px">' + chip(w[2] ? 'ยืนยันแล้ว' : 'ไม่ผ่าน', w[2] ? 'ok' : 'bad') + '</td></tr>';
  }).join('');

  const gapRows = GAPS.map(function(g){
    return '<div class="px-4 py-4 hair last:border-0">' +
      '<div class="text-[15px] text-ink">' + esc(g[0]) + '</div>' +
      '<div class="text-[14px] text-ink2 mt-1.5 leading-relaxed max-w-[80ch]">' + esc(g[1]) + '</div>' +
      '<div class="text-[14px] text-cool mt-2 leading-relaxed max-w-[80ch]">ทางแก้: ' + esc(g[2]) + '</div></div>';
  }).join('');

  return sheet({
    title:'ความครอบคลุมของแบบจำลอง',
    note:'หน้านี้ไม่ได้ประกาศว่าครอบคลุม แต่คำนวณจากข้อมูลจริงในหน้าจออื่น — use case จะขึ้นว่า “ครอบคลุม” ก็ต่อเมื่อ route ที่อ้างถึงมีอยู่จริงในระบบ และข้อบังคับแต่ละข้อจะขึ้นว่า “ยืนยันแล้ว” ก็ต่อเมื่อมีแถวข้อมูลที่พิสูจน์ได้',
    actions: btn('ส่งออกตารางสอบทาน','','data-act="export" data-what="results"'),
    body:
      '<div class="statbar mb-4">' +
        stat('Use case ที่รองรับ', ucCovered.length + ' / ' + USE_CASES.length, 'จาก UML Layer 0',
             ucCovered.length === USE_CASES.length ? 'ok' : 'warn') +
        stat('ตารางที่มีข้อมูลจริง', ER_MODELS.filter(function(m){ return m[2]() > 0; }).length + ' / ' + ER_MODELS.length,
             'มีแถวข้อมูลจริงรองรับ') +
        stat('ข้อบังคับที่พิสูจน์แล้ว', witOk + ' / ' + wit.length, 'ตรวจสอบจากข้อมูลสด',
             witOk === wit.length ? 'ok' : 'bad') +
        stat('สิ่งที่ยังไม่รองรับ', GAPS.length, 'ระบุไว้อย่างชัดเจนด้านล่าง', 'warn') +
      '</div>' +

      (function(){ const sec = S.sub.coverage || 'uml'; return '' +
      (sec !== 'uml' ? '' :
      '<div class="card overflow-hidden mb-8 scroll-x">' +
        band('Use case ตาม UML','<span>คลิกแถวเพื่อไปยังหน้าที่รองรับ</span>') +
        '<table class="dt"><thead><tr><th>ลำดับ</th><th>Use case</th><th>Actor</th>' +
        '<th>หน้าที่รองรับ</th><th>สถานะ</th></tr></thead><tbody>' + ucRows + '</tbody></table></div>') +
      (sec !== 'er' ? '' :
      '<div class="card overflow-hidden mb-8 scroll-x">' +
        band('ตารางข้อมูลตาม ER','<span>จำนวนแถวนับสดจากข้อมูลทั้ง ' + db.course.length + ' รายวิชา</span>') +
        '<table class="dt"><thead><tr><th>Model</th><th>บทบาทในระบบ</th>' +
        '<th class="num">แถว</th><th>ความสัมพันธ์</th><th>สถานะ</th></tr></thead><tbody>' + erRows + '</tbody></table></div>') +
      (sec !== 'rules' ? '' :
      '<div class="card overflow-hidden mb-8 scroll-x">' +
        band('ข้อบังคับและทริกเกอร์','<span>ตรวจสอบสดทุกครั้งที่เปิดหน้านี้</span>') +
        '<table class="dt"><thead><tr><th>ข้อบังคับ</th><th>ความหมาย</th>' +
        '<th>หลักฐานจากข้อมูล</th><th>ผล</th></tr></thead><tbody>' + witRows + '</tbody></table></div>') +
      (sec !== 'gaps' ? '' :
      '<div class="card overflow-hidden">' +
        band('สิ่งที่ยังไม่รองรับ','<span>กรณีที่เอกสารต้องการแต่ ER ปัจจุบันยังไม่รองรับ</span>') + gapRows + '</div>'); })()
  });
}

function saveProfile(){
  const u = me();
  const name  = document.getElementById('pf-name').value.trim();
  const email = document.getElementById('pf-email').value.trim();
  if (!name) { toast('กรอกชื่อ-สกุลก่อน','bad'); return; }
  const emailErr = EMAIL_POLICY.check(email);
  if (emailErr) { toast(emailErr,'bad'); return; }
  if (db.user.some(function(x){ return x.id !== u.id && x.email.toLowerCase() === email.toLowerCase(); })) {
    toast('อีเมลนี้ถูกใช้แล้ว','bad'); return; }
  const changed = [];
  if (u.name  !== name)  changed.push('ชื่อ');
  if (u.email !== email) changed.push('อีเมล');
  u.name = name; u.email = email;
  if (changed.length) authLog(u.id, 'EDIT', 'เจ้าของบัญชีแก้ไข' + changed.join('และ') + 'ด้วยตนเอง');
  closeOverlays(); invalidate(); render();
  toast(changed.length ? 'บันทึก' + changed.join('และ') + 'แล้ว' : 'ไม่มีอะไรเปลี่ยน');
}

function savePwChange(){
  const u = me();
  const old  = document.getElementById('pw-old').value;
  const nw   = document.getElementById('pw-new').value;
  const nw2  = document.getElementById('pw-new2').value;
  if (!old)                    { toast('กรอกรหัสผ่านปัจจุบันก่อน','bad'); return; }
  if (nw.length < 8)           { toast('รหัสผ่านใหม่ต้องยาวอย่างน้อย 8 ตัวอักษร','bad'); return; }
  if (!/[A-Za-z]/.test(nw) || !/[0-9]/.test(nw)) { toast('รหัสผ่านใหม่ต้องมีทั้งตัวอักษรและตัวเลข','bad'); return; }
  if (nw === old)              { toast('รหัสผ่านใหม่ต้องไม่ซ้ำกับรหัสผ่านปัจจุบัน','bad'); return; }
  if (nw !== nw2)              { toast('ยืนยันรหัสผ่านไม่ตรงกัน','bad'); return; }
  /* Nothing about the typed value survives this line. */
  u.mustChangePassword = false;
  u.pwChangedAt = '2568-09-07 09:00';
  authLog(u.id, 'PW_CHANGE', 'เจ้าของบัญชีเปลี่ยนรหัสผ่านด้วยตนเอง');
  closeOverlays(); invalidate(); render();
  toast('เปลี่ยนรหัสผ่านแล้ว — ครั้งถัดไปเข้าสู่ระบบด้วยรหัสใหม่');
}

      '<div class="px-7 py-5"><div class="over mb-2">ผลราย CLO และจุดประสงค์</div>' + cloRows + '</div>' +
      '<div class="px-7 py-5 hair-t"><div class="over mb-2">คะแนนรายกิจกรรม</div>' + actRows + '</div>' +
      (other ? '<div class="px-7 py-5 hair-t"><div class="over mb-1">การลงทะเบียนอื่นของรหัสนี้</div>' +
        '<div class="text-[13px] text-dim mb-2">รหัสเดียวกันในอีกรายวิชาคือคนละแถว Student และเป็นเรื่องถูกต้อง</div>' + other + '</div>' : '') +
      '<div class="px-7 py-5 hair-t flex gap-2.5">' + btn('ส่งออกผลการเรียน','','data-act="export" data-what="results"') + '</div>' +
    '</div>');
}

/* ══════════════════════════════════════════════════════════════════
   6 · MODALS
   ══════════════════════════════════════════════════════════════════ */
/* ══ CRUD engine ═══════════════════════════════════════════════════
   Every editable entity is described once — its fields, its rules, what a
   delete destroys — and the form, the validation and the confirmation are
   generated from that. Adding an entity is a descriptor, not another modal. */

const FIELD = function(f, v){
  const w = 'col-span-' + (f.col || 4);
  const lab = '<label class="text-[14px] text-ink2 block mb-1.5" for="ff-' + f.id + '">' + f.label +
    (f.req ? ' <span style="color:#A2504F">*</span>' : '') + '</label>';
  const hint = f.hint ? '<div class="text-[12.5px] text-dim mt-1">' + f.hint + '</div>' : '';
  /* หัวข้อย่อยในฟอร์ม — ไม่ใช่ช่องกรอก จึงไม่มี id ให้ readForm อ่าน
     มีไว้เพราะกลุ่มช่อง “เกณฑ์การประเมิน” เป็นสี่ช่องที่อ่านรวมกันเป็นประโยคเดียว */
  if (f.type === 'head')
    return '<div class="' + w + ' hair-t pt-4 mt-1">' +
      '<div class="over !text-ink2">' + f.label + '</div>' +
      (f.hint ? '<div class="text-[12.5px] text-dim mt-1">' + f.hint + '</div>' : '') + '</div>';
  /* N1 — ค่าที่ระบบคำนวณ แสดงในตำแหน่งเดียวกับช่องกรอก แต่ไม่มี id ให้ readForm อ่าน */
  if (f.type === 'info')
    return '<div class="' + w + '"><div class="text-[14px] text-ink2 mb-1.5">' + f.label + '</div>' +
      '<div class="inp tnum text-dim" style="background:transparent">' + esc(f.value) + '</div>' + hint + '</div>';
  if (f.type === 'bool')
    return '<div class="' + w + '"><label class="flex items-start gap-2 text-[14px] cursor-pointer">' +
      '<input type="checkbox" id="ff-' + f.id + '" class="mt-1"' + (v ? ' checked' : '') + '>' +
      '<span>' + f.label + (f.hint ? '<span class="block text-[12.5px] text-dim">' + f.hint + '</span>' : '') +
      '</span></label></div>';
  let ctl;
  if (f.type === 'select') {
    ctl = '<select class="inp" id="ff-' + f.id + '"' + (f.disabled ? ' disabled' : '') + '>' + f.options.map(function(o){
      return '<option value="' + esc(o[0]) + '"' + (String(o[0]) === String(v) ? ' selected' : '') +
        '>' + esc(o[1]) + '</option>'; }).join('') + '</select>';
  } else if (f.type === 'checks') {
    /* T4/T8 — ติ๊กจุดประสงค์ได้ในฟอร์มเลย ไม่ต้องไปอีกแท็บ · จัดกลุ่มตาม CLO
       P2 (2569-09-23) — f.weighted: ข้างจุดประสงค์ที่ติ๊กมีช่อง % ให้ผู้สอนแบ่งน้ำหนักเอง (รวม 100)
       ติ๊กหรือเอาออก = แบ่งเท่ากันใหม่เป็นจุดตั้งต้น แล้วแก้ทีละช่องได้ */
    const on = Array.isArray(v) ? v : [];
    const wts = f.weights || {};
    const sum0 = on.reduce(function(t, id){ return t + (wts[id] || 0); }, 0);
    ctl = '<div class="rounded-md hair-t hair-b scroll-y" id="ff-' + f.id + '" data-checks="1"' +
        (f.weighted ? ' data-weighted="1"' : '') + ' style="max-height:260px">' +
      (f.groups.length === 0 ? '<div class="text-[14px] text-dim py-2">ยังไม่มีจุดประสงค์ในรายวิชานี้ — บันทึกได้ แล้วค่อยเชื่อมภายหลัง</div>' :
      f.groups.map(function(g){
        return '<div class="py-1.5"><div class="text-[12.5px] text-dim mb-1">' + esc(g.label) + '</div>' +
          g.items.map(function(it){
            const checked = on.indexOf(it[0]) >= 0;
            return '<div class="flex items-center gap-2 py-1">' +
              '<label class="flex items-start gap-2 text-[14px] cursor-pointer flex-1 min-w-0">' +
                '<input type="checkbox" value="' + esc(it[0]) + '"' + (checked ? ' checked' : '') + ' class="mt-0.5">' +
                '<span>' + esc(it[1]) + '</span></label>' +
              (f.weighted
                ? '<span class="flex items-center gap-1 shrink-0 text-[13px] text-dim">' +
                    '<input class="inp tnum !py-0.5 !px-1.5 text-right text-[13px]" style="width:64px" data-ow="' + esc(it[0]) +
                      '" inputmode="decimal" aria-label="% ของกิจกรรมที่วัด ' + esc(it[1]) + '" value="' +
                      (checked ? n2x(wts[it[0]] || 0) : '') + '"' + (checked ? '' : ' disabled') + '>%</span>'
                : '') +
            '</div>';
          }).join('') + '</div>';
      }).join('')) + '</div>' +
      (f.weighted && f.groups.length
        ? '<div class="text-[13px] mt-1.5 text-right" id="ff-' + f.id + '-sum">' + owSumHtml(sum0, on.length) + '</div>' : '');
  } else if (f.type === 'area') {
    ctl = '<textarea class="inp" id="ff-' + f.id + '" rows="' + (f.rows || 3) + '" placeholder="' +
      esc(f.ph || '') + '">' + esc(v == null ? '' : v) + '</textarea>';
  } else {
    ctl = '<input class="inp' + (f.type === 'num' ? ' tnum' : '') + '" id="ff-' + f.id + '" value="' +
      esc(v == null ? '' : v) + '"' + (f.type === 'num' ? ' inputmode="decimal"' : '') +
      ' placeholder="' + esc(f.ph || '') + '">';
  }
  return '<div class="' + w + '">' + lab + ctl + hint + '</div>';
};

/* P2 — บรรทัดผลรวมใต้รายการจุดประสงค์ในฟอร์มกิจกรรม */
function owSumHtml(sum, n){
  if (!n) return '<span class="text-dim">ยังไม่ได้เลือกจุดประสงค์</span>';
  const ok = Math.abs(sum - 100) < 0.01;
  return '<span class="' + (ok ? 'text-ok' : 'text-warn') + '">รวม <span class="tnum">' + n2x(sum) + '%</span>' +
    (ok ? ' ✓' : ' — ต้องรวมได้ 100%') + '</span>';
}
/* P2 — แบ่ง 100 ให้ n ข้อเท่า ๆ กัน ทศนิยม 2 ตำแหน่ง ข้อสุดท้ายรับเศษ (33.33 / 33.33 / 33.34) */
function evenShares(n){
  if (!n) return [];
  const base = Math.floor(10000 / n) / 100;
  const out = []; for (let i = 0; i < n; i++) out.push(base);
  out[n - 1] = Math.round((100 - base * (n - 1)) * 100) / 100;
  return out;
}
function owRepaint(box, redistribute){
  const on = [].slice.call(box.querySelectorAll('input[type=checkbox]'));
  const checked = on.filter(function(x){ return x.checked; });
  const shares = evenShares(checked.length);
  on.forEach(function(cb){
    const w = box.querySelector('[data-ow="' + cb.value + '"]');
    if (!w) return;
    w.disabled = !cb.checked;
    if (!cb.checked) w.value = '';
    else if (redistribute) w.value = n2x(shares[checked.indexOf(cb)]);
  });
  let sum = 0;
  checked.forEach(function(cb){
    const w = box.querySelector('[data-ow="' + cb.value + '"]');
    const n = w ? parseFloat(w.value) : NaN;
    if (!isNaN(n)) sum += n;
  });
  const out = document.getElementById(box.id + '-sum');
  if (out) out.innerHTML = owSumHtml(sum, checked.length);
}

/* True when r is the only ADMIN still active. */
function lastAdmin(r){
  return r.role === 'ADMIN' && r.isActive &&
    !db.user.some(function(x){ return x.id !== r.id && x.role === 'ADMIN' && x.isActive; });
}

let FORM_KIND = null, FORM_ID = null;

function readForm(fields){
  const v = {};
  fields.forEach(function(f){
    const el = document.getElementById('ff-' + f.id);
    if (!el) return;
    if (f.type === 'checks') {
      v[f.id] = [].slice.call(el.querySelectorAll('input[type=checkbox]:checked')).map(function(x){ return x.value; });
      if (f.weighted) {
        const w = {};
        v[f.id].forEach(function(id){
          const inp = el.querySelector('[data-ow="' + id + '"]');
          const n = inp ? parseFloat(inp.value) : NaN;
          w[id] = isNaN(n) ? null : n;
        });
        v[f.id + 'Weights'] = w;
      }
      return;
    }
    if (f.type === 'head') return;
    if (f.type === 'bool') { v[f.id] = !!el.checked; return; }
    const raw = el.value.trim();
    if (f.type === 'num') {
      const n = raw === '' ? null : parseFloat(raw);
      v[f.id] = (n === null || isNaN(n)) ? null : n;
      return;
    }
    v[f.id] = raw;
  });
  return v;
}

function openForm(kind, id){
  const capF = KIND_CAP[kind] || 'course.settings';
  if (!can(capF)) return deny(capF);
  const F = FORMS[kind];
  const rec = id ? F.read(id) : null;
  FORM_KIND = kind; FORM_ID = id || null;
  const fields = F.fields(rec);
  openModal(modalFrame(F.title(rec),
    '<div class="grid grid-cols-4 gap-x-3 gap-y-4">' +
      fields.map(function(f){ return FIELD(f, rec ? F.valueOf(rec, f.id) : f.def); }).join('') +
    '</div>' +
    (F.note ? '<div class="text-[13px] text-dim mt-4 leading-relaxed">' + F.note + '</div>' : ''),
    btn('ยกเลิก','','data-act="close"') +
    (rec && F.impact ? btn('ลบ','','data-act="crud-del" class="btn btn-danger"') : '') +
    /* Sequential creation is the norm for these four — a course is defined by
       listing its CLOs, not by adding one. */
    (!rec && ['clo','objective','activity','student'].indexOf(kind) >= 0
      ? btn('บันทึกแล้วเพิ่มต่อ','','data-act="crud-save" data-more="1"') : '') +
    btn(rec ? 'บันทึก' : 'เพิ่ม','primary','data-act="crud-save"')));
}

function crudSave(more){
  const F = FORMS[FORM_KIND];
  const kind = FORM_KIND;
  const capS = KIND_CAP[kind] || 'course.settings';
  if (!can(capS)) return deny(capS);
  const rec = FORM_ID ? F.read(FORM_ID) : null;
  const v = readForm(F.fields(rec));
  const err = F.validate(v, rec);
  if (err) { toast(err, 'bad'); return; }
  F.save(v, rec);
  invalidate();
  if (more && !rec) {
    /* The list behind the dialog has to be right before the next form reads it
       for its default number, so render first and reopen after. */
    render();
    openForm(kind, null);
    toast('เพิ่ม' + F.label + 'แล้ว — ฟอร์มพร้อมสำหรับข้อถัดไป');
    return;
  }
  closeOverlays(); render();
  toast(rec ? 'บันทึกการแก้ไขแล้ว' : 'เพิ่ม' + F.label + 'แล้ว');
}

/* P6 / FR-26 / FR-36 / FR-53 — a delete confirmation states what it destroys
   in numbers, because "are you sure?" is not information. */
/* J3 — ลบรายวิชาต้องพิมพ์ข้อความยืนยัน แบบ GitHub ลบ repository การลบรายวิชาพา CLO
   กิจกรรม คะแนน และประวัตินำเข้าไปทั้งหมด ปุ่มเดียวจึงถูกกดพลาดได้ง่ายเกินไป
   ข้อความต้องมีภาคและปี: รหัสวิชา + Sec เดียวกันเปิดซ้ำได้ทุกภาคเรียน ไม่งั้นข้อความเดียวลบได้หลายวิชา
   นี่คือกันพลาด ไม่ใช่การควบคุมสิทธิ์ — สิทธิ์ตรวจแยกทั้งตอนเปิดและตอนลบ */
const deletePhrase = function(c){
  return c.code + '-sec' + c.section + '-' + c.semester + '-' + c.year + '-delete';
};

function confirmDelete(kind, id){
  const F = FORMS[kind];
  const rec = F.read(id);
  if (!rec) return;
  /* ประตูชั้นที่สอง · dispatcher จับทางเข้าจากปุ่ม ส่วนตรงนี้จับการเรียกฟังก์ชัน
     ตรง ๆ ซึ่งเป็นสิ่งที่เกิดขึ้นจริงในโค้ดหลายจุด (palette, drawer, ปุ่มในฟอร์ม) */
  const cap = delCapOf(kind);
  /* SEC-3 — a course is checked against ITSELF, not the course on screen */
  const cid = kind === 'course' ? id : undefined;
  if (!can(cap, cid)) return deny(cap, cid);
  const block = F.blocked && F.blocked(rec);
  if (block) { toast(block, 'bad'); return; }
  const rows = F.impact(rec);
  const any = rows.some(function(r){ return r[1] > 0; });
  FORM_KIND = kind; FORM_ID = id;
  openModal(modalFrame('ลบ' + F.label + ' — ' + F.name(rec),
    '<div class="px-4 py-3 rounded-lg mb-4 text-[14px]" style="background:#F4E8E8;color:#A2504F">' +
      (any ? 'การลบนี้ย้อนกลับไม่ได้ และข้อมูลที่ผูกอยู่จะถูกลบตามไปด้วย'
           : 'การลบนี้ย้อนกลับไม่ได้ — ยังไม่มีข้อมูลอื่นผูกอยู่') + '</div>' +
    (rows.length ? '<table class="dt"><tbody>' + rows.map(function(r){
      return '<tr><td class="text-[14px]">' + r[0] + '</td>' +
        '<td class="num tnum text-[14px]' + (r[1] ? ' text-bad' : ' text-dim') + '">' + r[1] + '</td></tr>';
    }).join('') + '</tbody></table>' : '') +
    (F.delNote ? '<div class="text-[14px] text-dim mt-4">' + F.delNote + '</div>' : '') +
    (kind === 'course'
      ? '<div class="hair-t mt-5 pt-4">' +
          '<label class="text-[14px] text-ink2 block mb-1.5" for="del-phrase">พิมพ์ ' +
            '<code class="tnum px-1.5 py-0.5 rounded-xs text-ink select-all" style="background:var(--tint)">' +
            esc(deletePhrase(rec)) + '</code> เพื่อยืนยัน</label>' +
          '<input class="inp tnum" id="del-phrase" autocomplete="off" spellcheck="false" autocapitalize="off">' +
        '</div>' : ''),
    btn('ยกเลิก','','data-act="close"') +
    '<button class="btn btn-solid-danger" data-act="crud-del-confirm"' + (kind === 'course' ? ' disabled' : '') + '>ลบ' +
      F.label + '</button>'));
  if (kind === 'course') { const ip = document.getElementById('del-phrase'); if (ip) ip.focus(); }
}

function crudDelete(){
  const F = FORMS[FORM_KIND];
  const capD = delCapOf(FORM_KIND);
  const cidD = FORM_KIND === 'course' ? FORM_ID : undefined;
  if (!can(capD, cidD)) return deny(capD, cidD);
  const rec = F.read(FORM_ID);
  if (!rec) return;
  /* J3 — ตรวจข้อความตรงนี้อีกชั้น ไม่พึ่ง `disabled` ของปุ่ม: Enter ในช่อง, palette
     หรือการเรียกฟังก์ชันตรงไปไม่ผ่านปุ่มเลย */
  if (FORM_KIND === 'course') {
    const ip = document.getElementById('del-phrase');
    if (!ip || ip.value.trim() !== deletePhrase(rec)) {
      toast('ข้อความยืนยันไม่ตรง — พิมพ์ ' + deletePhrase(rec), 'bad');
      if (ip) ip.focus();
      return;
    }
  }
  F.remove(rec);
  closeOverlays(); invalidate();
  if (F.after) F.after(); else render();
  toast('ลบ' + F.label + 'แล้ว');
}

/* J6 · ทำสำเนารายวิชา — “เปิดวิชาเดิมในภาคใหม่” คือสิ่งที่ผู้สอนทำทุกต้นภาค
   และเดิมต้องพิมพ์ CLO จุดประสงค์ กิจกรรม และการเชื่อมใหม่ทั้งหมดด้วยมือ

   สิ่งที่ไปกับสำเนา = โครงของรายวิชา · สิ่งที่ไม่ไป = คน และคะแนนของคน
   นักศึกษาและคะแนนเป็นของภาคเรียนที่เรียนจริง การลอกไปด้วยคือการสร้างข้อมูลปลอม */
function dupCourse(cid){
  if (!can('course.create')) return deny('course.create');
  const src = byId(db.course, cid);
  if (!src) return;

  /* Sec ที่ยังว่างในภาคเดียวกัน — คีย์ (รหัส, ภาค, ปี, Sec) ต้องไม่ชน (FR-21) */
  let sec = null;
  for (let i = 1; i <= 99 && sec === null; i++) {
    const cand = String(i).padStart(2, '0');
    if (!db.course.some(function(x){
      return x.code === src.code && x.semester === src.semester && x.year === src.year && x.section === cand; }))
      sec = cand;
  }
  if (sec === null) { toast('รหัสวิชานี้มีครบ 99 Sec ในภาคนี้แล้ว — ทำสำเนาไม่ได้','bad'); return; }

  const nid = 'c_' + Date.now();
  const copy = {};
  Object.keys(src).forEach(function(k){ copy[k] = src[k]; });
  copy.id = nid; copy.section = sec;
  if (src.groupWeight) copy.groupWeight = Object.assign({}, src.groupWeight);
  db.course.push(copy);

  /* ผู้สอนเดิมตามไปด้วย · ถ้าเป็นผู้สอนที่กดเอง ต้องมีชื่ออยู่ในนั้นแน่นอน
     ไม่อย่างนั้นสำเนาจะหลุดจาก “รายวิชาของฉัน” ทันทีที่สร้าง (P17) */
  const staff = where(db.courseInstructor, 'courseId', cid).map(function(x){ return x.userId; });
  if (S.role !== 'ADMIN' && staff.indexOf(me().id) < 0) staff.push(me().id);
  staff.forEach(function(uid, i){
    db.courseInstructor.push({ id:'ci_' + nid + '_' + i, courseId:nid, userId:uid,
      role:'INSTRUCTOR', assignedAt:'2568-09-21' }); });

  where(db.gradeBand, 'courseId', cid).forEach(function(b, i){
    db.gradeBand.push({ id:'gb_' + nid + '_' + i, courseId:nid, grade:b.grade, minValue:b.minValue }); });

  const cloMap = {}, objMap = {};
  where(db.clo, 'courseId', cid).forEach(function(c, i){
    const id = 'clo_' + nid + '_' + i;
    cloMap[c.id] = id;
    db.clo.push({ id:id, courseId:nid, number:c.number, weight:c.weight, levelSource:c.levelSource,
      bloomLevel:c.bloomLevel, soloLevel:c.soloLevel, classTarget:c.classTarget, description:c.description }); });
  db.behavioralObjective.filter(function(o){ return !!cloMap[o.cloId]; }).forEach(function(o, i){
    const id = 'bo_' + nid + '_' + i;
    objMap[o.id] = id;
    db.behavioralObjective.push({ id:id, cloId:cloMap[o.cloId], number:o.number,
      weight:o.weight, description:o.description }); });

  const actMap = {};
  where(db.activity, 'courseId', cid).forEach(function(a, i){
    const id = 'a_' + nid + '_' + i;
    actMap[a.id] = id;
    const t = { id:id, courseId:nid };
    Object.keys(a).forEach(function(k){ if (k !== 'id' && k !== 'courseId') t[k] = a[k]; });
    db.activity.push(t); });
  db.assessmentCriteria.filter(function(c){ return !!actMap[c.activityId] && !!objMap[c.objectiveId]; })
    .forEach(function(c, i){
      db.assessmentCriteria.push({ id:'ac_' + nid + '_' + i, activityId:actMap[c.activityId],
        objectiveId:objMap[c.objectiveId], weight:c.weight }); });

  invalidate();
  S.course = nid; S.expanded[nid] = true;
  saveLayout(); render();
  toast('ทำสำเนา ' + src.code + ' เป็น Sec ' + sec + ' แล้ว — ' +
    Object.keys(cloMap).length + ' CLO · ' + Object.keys(actMap).length +
    ' กิจกรรม · ยังไม่มีรายชื่อและคะแนน');
}

/* Move a row within its ordered siblings (FR-31 for CLO, FR-42 for Activity). */
function reorder(kind, id, dir){
  const F = FORMS[kind];
  const sibs = F.siblings();
  const i = sibs.findIndex(function(x){ return x.id === id; });
  const j = i + dir;
  if (i < 0 || j < 0 || j >= sibs.length) return;
  const a = sibs[i], b = sibs[j], key = F.orderKey;
  const t = a[key]; a[key] = b[key]; b[key] = t;
  invalidate(); render();
}

  return arr.some(function(x){ return x.id !== selfId && test(x); }); };

    save: function(v, r){
      const t = r || { id:'a_' + Date.now(), courseId:S.course };
      if (!r) db.activity.push(t);
      t.name = v.name; t.type = v.type || 'TEST'; t.assessmentMethod = v.assessmentMethod || 'EXAM';
      t.criteriaNote = v.criteriaNote || '';
      t.maxScore = v.maxScore;
      /* passScore คือสิ่งที่ผู้สอนกรอก · passMark เป็นค่าที่คำนวณ — ไม่มีใครกรอกสองที่ */
      t.passScore = (v.passScore === undefined || v.passScore === null)
        ? Math.round(t.maxScore * 0.5 * 100) / 100 : v.passScore;
      t.passMark = pctOfScore(t.passScore, t.maxScore);
      /* N1 — โหมดตามกลุ่มไม่มีช่องน้ำหนัก (v.weight ไม่ถูกส่งมา) syncGroupWeights เติมให้ตอน derive */
      if (v.weight !== undefined) t.weight = v.weight; else if (!r) t.weight = 0;
      t.order = v.order;
      /* คะแนนที่เกินคะแนนเต็มใหม่ — validate ยอมให้มาถึงตรงนี้ได้ต่อเมื่อผู้ใช้ติ๊กยืนยันแล้ว */
      if (v.clampScores) {
        let nClamp = 0;
        db.score.forEach(function(x){
          if (x.activityId === t.id && x.score > t.maxScore) { x.score = t.maxScore; nClamp++; } });
        if (nClamp) toast('ปรับคะแนนที่เกินลงมา ' + nClamp + ' รายการ ให้เท่ากับคะแนนเต็มใหม่','warn');
      }
      if (!Array.isArray(v.objectives)) return;
      /* P2 — ฟอร์มส่งสัดส่วนรายจุดประสงค์มา = ใช้ตามนั้นทั้งชุด */
      if (v.objectivesWeights) {
        db.assessmentCriteria = db.assessmentCriteria.filter(function(c){ return c.activityId !== t.id; });
        v.objectives.forEach(function(oid){
          db.assessmentCriteria.push({ id:'ac_' + t.id + '_' + oid, activityId:t.id, objectiveId:oid,
            weight: v.objectivesWeights[oid] });
        });
        return;
      }
      /* ชุดที่ติ๊กเหมือนเดิม = เก็บสัดส่วนที่ปรับไว้ · ชุดเปลี่ยน = แบ่งเท่ากันใหม่ (ผลรวม 100 พอดี) */
      const cur = db.assessmentCriteria.filter(function(c){ return c.activityId === t.id; });
      const same = cur.length === v.objectives.length &&
        cur.every(function(c){ return v.objectives.indexOf(c.objectiveId) >= 0; });
      if (same) return;
      db.assessmentCriteria = db.assessmentCriteria.filter(function(c){ return c.activityId !== t.id; });
      const n = v.objectives.length, base = n ? Math.floor(100 / n) : 0;
      v.objectives.forEach(function(oid, i){
        db.assessmentCriteria.push({ id:'ac_' + t.id + '_' + oid, activityId:t.id, objectiveId:oid,
          weight: i === n - 1 ? 100 - base * (n - 1) : base });
      });
    },
    impact: function(r){
      return [['การเชื่อมกับจุดประสงค์', db.assessmentCriteria.filter(function(c){ return c.activityId === r.id; }).length],
              ['แถวคะแนนของนักศึกษา', db.score.filter(function(x){ return x.activityId === r.id; }).length]];

    remove: function(r){

         ฟังก์ชันเดียวที่อยู่เบื้องหลัง UC 1.1/1.2/1.4 (เพิ่ม/แก้ไข/กำหนดบทบาท) และ

         เป็นคนละ action จาก EDIT เพราะเป็นการเปลี่ยนสิทธิ์ ไม่ใช่แก้ข้อมูลทั่วไป —
         คนละเรื่องกับ SEC-4 แต่หลักการเดียวกัน: การเปลี่ยนสิทธิ์ต้องสาวรอยได้เสมอ
         (ยืนยันด้วย scripts/check-auth-events.js) */
      const roleChanged   = !isNew && t.role !== v.role;
      const activeChanged = !isNew && t.isActive !== (v.isActive === '1');
      const changed = [];
      if (!isNew) {
        if (t.name  !== v.name)  changed.push('ชื่อ');
        if (t.email !== v.email) changed.push('อีเมล');
      }
      t.name = v.name; t.email = v.email; t.role = v.role; t.isActive = v.isActive === '1';
      if (isNew) {
        authLog(t.id, 'CREATE', 'สร้างบัญชีผู้ใช้ · บทบาท ' +
          (t.role === 'ADMIN' ? 'ผู้ดูแลระบบ' : 'ผู้สอน'));
      } else {
        if (roleChanged) authLog(t.id, 'ROLE_SET', 'เปลี่ยนบทบาทเป็น ' +
          (t.role === 'ADMIN' ? 'ผู้ดูแลระบบ' : 'ผู้สอน'));

        if (changed.length) authLog(t.id, 'EDIT', 'ผู้ดูแลระบบแก้ไข' + changed.join('และ'));
      }
      if (t.id === S.meId) { clampMe(); clampCourse(); }

let OBJ_CLO = null;   /* which CLO a new objective is being added under */

/* เมทริกซ์แสดงระดับ CLO แต่ AssessmentCriteria เก็บระดับจุดประสงค์ (T4) — ค่าที่กรอกให้ CLO จึงถูกแบ่ง
   ให้จุดประสงค์ทุกข้อใต้ CLO นั้นตามน้ำหนักจุดประสงค์ (ทุกข้อจึงมีกิจกรรมวัดเสมอ) · ปัดทศนิยม 2 ตำแหน่ง
   ข้อสุดท้ายรับเศษ ผลรวมจึงเท่าค่าที่กรอกพอดี · v = 0 หรือว่าง = เลิกผูกทั้ง CLO */
function setCloShare(aid, cloId, v){
  const objs = where(db.behavioralObjective, 'cloId', cloId).sort(function(a, b){ return a.number - b.number; });
  const ids = objs.map(function(o){ return o.id; });
  db.assessmentCriteria = db.assessmentCriteria.filter(function(c){
    return !(c.activityId === aid && ids.indexOf(c.objectiveId) >= 0); });
  if (!v || !objs.length) return;
  const wsum = objs.reduce(function(t, o){ return t + (o.weight || 0); }, 0);
  let used = 0;
  objs.forEach(function(o, i){
    const share = wsum > 0 ? (o.weight || 0) / wsum : 1 / objs.length;
    const w = i === objs.length - 1 ? Math.round((v - used) * 100) / 100 : Math.round(v * share * 100) / 100;
    used += w;
    if (w > 0) db.assessmentCriteria.push({ id:'ac_' + aid + '_' + o.id, activityId:aid, objectiveId:o.id, weight:w });
  });
}

  CRITERION_REFERENCED: 'เทียบกับขอบเขตคงที่ที่ตั้งไว้ล่วงหน้า — ทุกคนที่ถึงเกณฑ์ได้เกรดนั้น ไม่ขึ้นกับคะแนนของเพื่อน',
  NORM_REFERENCED: 'เทียบกับคะแนนของเพื่อนในกลุ่ม (T-score) — ใช้ได้กับเกรดแบบ A–F เท่านั้น'
};

function modalGrading(){
  if (!can('band.write')) return deny('band.write');
  const c = D().course;
  /* P1 (2569-09-23) — ผ่าน/ไม่ผ่าน ตัดอิงกลุ่มไม่ได้ (CR-10) · เดิมเลือกคู่นี้ได้แล้วค่อยถูกปฏิเสธตอนกดบันทึก
     ตอนนี้ตัวเลือก "อิงกลุ่ม" ถูกปิดทันทีที่เลือกผ่าน/ไม่ผ่าน (gradingSync) */
  const normOff = c.gradeScale === 'PASS_FAIL';
  const opt = function(name, id, keys, labels, cur){
    return '<fieldset><legend class="text-[14px] text-ink2 mb-1.5">' + name + '</legend>' +
      '<div class="space-y-2">' + keys.map(function(k){
        const off = k === 'NORM_REFERENCED' && normOff;
        return '<label class="flex gap-3 items-start p-3 rounded-lg hair cursor-pointer' + (off ? ' opacity-50' : '') + '">' +
          '<input type="radio" name="' + id + '" value="' + k + '"' +
            (k === cur && !off ? ' checked' : '') + (off ? ' disabled' : '') + ' class="mt-1">' +
          '<span><span class="block text-[14px] text-ink">' + labels[k] + '</span>' +
          '<span class="block text-[13px] text-dim leading-relaxed mt-0.5">' + GRADE_HELP[k] + '</span></span></label>';
      }).join('') + '</div></fieldset>';
  };
  openModal(modalFrame('ตั้งค่าการตัดเกรด',
    '<div class="space-y-5">' +
      opt('รูปแบบเกรด', 'g-scale', ['LETTER','PASS_FAIL'], SCALE_TH, c.gradeScale) +
      opt('วิธีตัดเกรด', 'g-method', ['CRITERION_REFERENCED','NORM_REFERENCED'], METHOD_TH,
          normOff ? 'CRITERION_REFERENCED' : c.gradeMethod) +
      '<div><label class="text-[14px] text-ink2 block mb-1.5" for="g-pass">เกณฑ์ผ่านรายวิชา (% ของคะแนนรวม)</label>' +
        '<input class="inp tnum" id="g-pass" value="' + c.passCriteria + '" inputmode="decimal">' +
        '<div class="text-[12.5px] text-dim mt-1">คะแนนรวมขั้นต่ำเพื่อผ่านรายวิชา — คนละตัวกับเกณฑ์ผ่านของ CLO ซึ่งวัดทีละข้อ</div></div>' +
      '<div class="text-[13px] text-warn">เปลี่ยนรูปแบบเกรดแล้ว ขั้นบันไดเกรดจะถูกตั้งใหม่เป็นค่าเริ่มต้น</div>' +
    '</div>',
    btn('ยกเลิก','','data-act="close"') + btn('บันทึก','primary','data-act="save-grading"')));
}

/* ── Course editor ───────────────────────────────────────────────────
   One form for both creating and editing, because the fields and the rules
   are identical and two forms drift apart. */
let CSTAFF = [];      /* instructor rows being edited, before they are saved */

/* SEC-4 · ตัวแก้รายชื่อผู้สอนเป็นทางยกระดับสิทธิ์ที่ตรงที่สุดในระบบ — ใครแก้ได้
   ก็ใส่หรือเอาใครออกจากรายวิชาได้ · กติกา ก. เดิม (กันแถว LEAD/CO) ยกเลิกตาม D1
     เพราะไม่มีบทบาทที่สูงกว่าให้ยกระดับไปถึงแล้ว เหลือกติกาเดียว:
     ข. ไม่มีใครแก้แถวของตัวเองได้ แม้แต่ ADMIN ก็แก้แถวตัวเองในหน้านี้ไม่ได้ */
const staffLocked = function(x){
  if (S.role === 'ADMIN') return x.userId === me().id ? 'แถวของตัวเอง' : null;
  if (x.userId === me().id) return 'แถวของตัวเอง';
  return null;
};

function staffRows(){
  return CSTAFF.map(function(x, i){
    const lock = staffLocked(x);
    const u = byId(db.user, x.userId) || { name:'—', email:'' };
    return '<div class="flex items-center gap-2 py-1.5 hair last:border-0">' +
      '<span class="min-w-0 flex-1"><span class="block text-[14px] truncate">' + esc(u.name) +
        (u.isActive === false ? ' <span class="text-dim">(ระงับ)</span>' : '') + '</span>' +
        '<span class="block text-[13px] text-dim truncate">' + esc(u.email) + '</span></span>' +
      (lock
        ? '<span class="text-[12.5px] text-dim w-[76px] text-center shrink-0" title="แก้ไม่ได้: ' + lock + '">🔒</span>'
        : '<button class="btn btn-quiet btn-danger w-[76px] shrink-0" data-act="staff-del" data-i="' + i + '" ' +
          'title="เอาออก">✕</button>') + '</div>';
  }).join('') || '<div class="text-[14px] text-warn py-2">ยังไม่มีผู้สอน — ต้องมีอย่างน้อย 1 คนจึงจะเริ่มงานได้</div>';
}
function repaintStaff(){
  const host = document.getElementById('f-staff');
  if (host) host.innerHTML = staffRows();
  paintStaffHits();
}
/* ค้นหาผู้สอนที่ยังไม่อยู่ในรายวิชา · ว่าง = ไม่แสดงรายการ (ไม่เทรายชื่อทั้งคณะลงฟอร์ม) */
function paintStaffHits(){
  const host = document.getElementById('f-staff-hits');
  const q = ((document.getElementById('f-staff-q') || {}).value || '').trim().toLowerCase();
  if (!host) return;
  if (!q) { host.innerHTML = ''; return; }
  const hits = db.user.filter(function(u){
    return u.role === 'INSTRUCTOR' && !CSTAFF.some(function(x){ return x.userId === u.id; }) &&
      (u.name.toLowerCase().indexOf(q) >= 0 || u.email.toLowerCase().indexOf(q) >= 0);
  }).slice(0, 6);
  host.innerHTML = hits.length === 0
    ? '<div class="text-[14px] text-dim px-1 py-2">ไม่พบผู้สอนที่ตรงกับ “' + esc(q) + '”</div>'
    : '<div class="card overflow-hidden">' + hits.map(function(u){
        return '<button class="w-full text-left px-3 py-2 hover:bg-wash flex items-center gap-3 hair last:border-0" ' +
          'data-act="staff-pick" data-id="' + u.id + '">' +
          '<span class="min-w-0 flex-1"><span class="block text-[14px] truncate">' + esc(u.name) + '</span>' +
          '<span class="block text-[13px] text-dim truncate">' + esc(u.email) + '</span></span>' +
          '<span class="text-[14px] text-ink2 shrink-0">+ เพิ่ม</span></button>';
      }).join('') + '</div>';
}

/* หน้าจัดการรายวิชาแก้ไขวิชาที่ไม่ได้เปิดอยู่ได้ จึงต้องรับ id มาตรง ๆ
   ไม่ใช่อ่านจาก S.course — และสิทธิ์ก็ต้องตรวจกับวิชานั้น ไม่ใช่วิชาบนจอ (SEC-3) */
let COURSE_EDIT_ID = null;
function modalCourse(mode, courseId){
  const editing = mode !== 'create';
  const cid = editing ? (courseId || S.course) : null;
  COURSE_EDIT_ID = cid;
  const capC = editing ? 'course.settings' : 'course.create';
  if (!can(capC, cid || undefined)) return deny(capC, cid || undefined);
  const c = editing ? byId(db.course, cid) : { code:'', name:'', nameEn:'', semester:1, year:2568, section:'01',
    credits:3, lectureHours:0, practiceHours:0, selfStudyHours:0,
    gradeScale:'LETTER', gradeMethod:'CRITERION_REFERENCED', passCriteria:60, cloPassMark:60, classTarget:100 };   /* D2 — เป้าหมายคือทุกคนผ่าน */
  CSTAFF = editing
    ? where(db.courseInstructor, 'courseId', c.id).map(function(x){ return { userId:x.userId, role:x.role }; })
    /* An instructor creating a course is creating their own course. Starting
       them off the staff list would hide it from them the moment it saves —
       and every course needs at least one instructor anyway (FR-23). */
    : (S.role === 'INSTRUCTOR' ? [{ userId:me().id, role:'INSTRUCTOR' }] : []);

  const num = function(id, label, val, hint){
    return '<div><label class="text-[14px] text-ink2 block mb-1.5">' + label + '</label>' +
      '<input class="inp tnum" id="' + id + '" value="' + val + '" inputmode="decimal">' +
      (hint ? '<div class="text-[12.5px] text-dim mt-1">' + hint + '</div>' : '') + '</div>';
  };

  if (editing && !c) return;
  openModal(modalFrame(editing ? 'ตั้งค่ารายวิชา — ' + c.code + ' Sec ' + c.section : 'สร้างรายวิชา',
    '<div class="space-y-5">' +
      '<div class="grid grid-cols-[130px_minmax(0,1fr)] gap-3">' +
        '<div><label class="text-[14px] text-ink2 block mb-1.5">รหัสวิชา</label>' +
          '<input class="inp tnum" id="f-code" value="' + esc(c.code) + '"></div>' +
        '<div><label class="text-[14px] text-ink2 block mb-1.5">ชื่อรายวิชา (ไทย)</label>' +
          '<input class="inp" id="f-cname" value="' + esc(c.name) + '"></div>' +
      '</div>' +
      '<div><label class="text-[14px] text-ink2 block mb-1.5">ชื่อรายวิชา (อังกฤษ)</label>' +
        '<input class="inp" id="f-cnameen" value="' + esc(c.nameEn || '') + '"></div>' +

      '<div class="grid grid-cols-3 gap-3">' +
        '<div><label class="text-[14px] text-ink2 block mb-1.5">ภาคการศึกษา</label>' +
          '<select class="inp" id="f-sem">' + [1,2,3].map(function(n){
            return '<option value="' + n + '"' + (n === c.semester ? ' selected' : '') + '>' + n + '</option>';
          }).join('') + '</select></div>' +
        num('f-year', 'ปีการศึกษา (พ.ศ.)', c.year) +
        '<div><label class="text-[14px] text-ink2 block mb-1.5">Sec</label>' +
          '<input class="inp tnum" id="f-sec" value="' + esc(c.section) + '"></div>' +
      '</div>' +
      '<div id="f-dup" class="text-[14px] text-bad" hidden></div>' +

      /* หน่วยเคยอยู่ในป้ายของทุกช่อง — “ศึกษาเอง (ชม./สัปดาห์)” ยาวจนตกบรรทัด
         ทำให้ช่องที่สี่ต่ำกว่าอีกสามช่อง · หน่วยเดียวกันทั้งสามช่องจึงบอกครั้งเดียวที่หัวข้อ */
      '<div class="hair-t pt-4">' +
        '<div class="over mb-2.5">หน่วยกิตและชั่วโมง <span class="normal-case tracking-normal text-faint">· ชั่วโมงต่อสัปดาห์</span></div>' +
        '<div class="grid grid-cols-4 gap-3 items-start">' +
          num('f-cr', 'หน่วยกิต', c.credits) +
          num('f-lec', 'บรรยาย (ชั่วโมง)', c.lectureHours) +
          num('f-prac', 'ปฏิบัติ (ชั่วโมง)', c.practiceHours) +
          num('f-self', 'ศึกษาเอง (ชั่วโมง)', c.selfStudyHours) +
        '</div>' +
      '</div>' +

      /* ข้อเสนอแนะ mockup F2 — เกณฑ์เกรดตัดสินได้ก็ต่อเมื่อรู้ว่าวัด CLO อะไรด้วยกิจกรรมอะไร
         จึงย้ายไปแท็บการตัดเกรด (modalGrading) · ตอนสร้างใช้ค่าตั้งต้น อิงเกณฑ์ / ตัวอักษร / 60% */
      /* G1 — ช่อง เป้าหมายชั้นเรียน ถูกตัดออก: ค่าคือ 100 เสมอ เก็บใน DB
         ไม่ใช่สิ่งที่อาจารย์ต้องตัดสิน สิ่งที่รายงานต้องการคือสัดส่วนผู้ผ่านจริง ไม่ใช่เป้าที่ตั้งไว้ */
      '<div class="hair-t pt-4">' +
        '<div class="over mb-1.5">ผู้สอนประจำรายวิชา</div>' +
        '<div id="f-staff">' + staffRows() + '</div>' +
        '<div class="relative mt-2">' +
          '<span class="absolute left-3 top-1/2 -translate-y-1/2 text-dim pointer-events-none">' + icon('search', 'w-4 h-4') + '</span>' +
          '<input class="inp !pl-9" id="f-staff-q" autocomplete="off" placeholder="ค้นหาผู้สอนด้วยชื่อหรืออีเมล เพื่อเพิ่ม" ' +
            'aria-label="ค้นหาผู้สอน" aria-controls="f-staff-hits">' +
        '</div>' +
        '<div id="f-staff-hits" class="mt-1.5"></div>' +
      '</div>' +

      (editing ? '<div class="hair-t pt-4">' +
        '<button class="btn" data-act="del-course" style="color:#A2504F;border-color:#DCBABA">ลบรายวิชานี้</button>' +
        '</div>' : '') +
    '</div>',
    btn('ยกเลิก','','data-act="close"') +
      btn(editing ? 'บันทึกการแก้ไข' : 'สร้างรายวิชา','primary','data-act="save-course" data-mode="' +
        (editing ? 'edit' : 'create') + '"')));
}
